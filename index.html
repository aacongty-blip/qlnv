<script>
  // Khởi tạo Firebase ngay sau khi SDK load xong
  // Dùng defer-pattern: nếu SDK chưa có (hiếm) thì đánh dấu chờ
  function _initFirebase(){
    try{
      const _app = firebase.initializeApp({
        databaseURL: "https://qlnv-app-default-rtdb.asia-southeast1.firebasedatabase.app/"
      });
      const _db = firebase.database();
      window._fbSet = (path, val) => _db.ref(path).set(val);
      window._fbGet = (path) => _db.ref(path).get().then(s => s.val());
      window._fbOn  = (path, cb) => { const r = _db.ref(path); r.on('value', s => cb(s.val())); return r; };
      window._fbOff = (r) => r.off();
      window._firebaseReady = true;
    }catch(e){
      console.error('Firebase init error:', e);
      window._firebaseReady = false;
    }
  }
  if(typeof firebase !== 'undefined'){
    _initFirebase();
  } else {
    // SDK chưa load xong — chờ
    window.addEventListener('load', _initFirebase);
  }
</script>

<script>
  // Tải lazy để không làm chậm khởi động phần mềm
  window._loadPdfJs = function(){
    if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
      s.onload=()=>{ if(window.pdfjsLib){ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; resolve(window.pdfjsLib);} else reject(new Error('pdf.js load fail')); };
      s.onerror=reject; document.head.appendChild(s);
    });
  };
  window._loadTesseract = function(){
    if(window.Tesseract) return Promise.resolve(window.Tesseract);
    return new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js';
      s.onload=()=>resolve(window.Tesseract);
      s.onerror=reject; document.head.appendChild(s);
    });
  };
</script>

const DB_KEY='HRM_EMC_DB_v1';

/* ---------- Firebase trạng thái kết nối ---------- */
let _fbSyncHandle = null;   // ref đang lắng nghe realtime
let _fbConnected  = false;
let _fbPendingSave = null;  // debounce write

/* Chờ Firebase SDK khởi tạo xong (polling mỗi 50ms, tối đa 10 giây) */
function _waitFirebase(){
  return new Promise((resolve, reject) => {
    if(window._firebaseReady){ resolve(); return; }
    const start = Date.now();
    const check = setInterval(()=>{
      if(window._firebaseReady){
        clearInterval(check); resolve();
      } else if(Date.now() - start > 10000){
        clearInterval(check); reject(new Error('Firebase SDK timeout'));
      }
    }, 50);
  });
}

/* ---------- Đọc DB: ưu tiên cache localStorage, sau đó pull Firebase ---------- */
function getDB(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(!raw) return initDB();
    const db = JSON.parse(raw);
    return migrateDB(db);
  }catch(e){ return initDB(); }
}
/* ---------- Di trú dữ liệu: hỗ trợ NV đa nhiệm (assignments) ---------- */
function migrateDB(db){
  if(!db) return initDB();
  let changed=false;
  (db.users||[]).forEach(u=>{
    if(u.role==='admin') return;
    if(!Array.isArray(u.assignments)){
      u.assignments=[];
      if(u.area){
        u.assignments.push({
          area: u.area,
          salaryRankCode: u.salaryRankCode||'',
          kpiPct: Number(u.kpiPct)||0,
          kpiBase: Number(u.baseSalary)||0
        });
      }
      changed=true;
    }
    if(u.baseSalary===undefined){ u.baseSalary=0; changed=true; }
    if(u.allowance===undefined){ u.allowance=0; changed=true; }
  });
  // Đảm bảo các collection mới của module Hợp đồng
  if(!Array.isArray(db.contracts)){ db.contracts=[]; changed=true; }
  if(!Array.isArray(db.importSlips)){ db.importSlips=[]; changed=true; }
  if(!Array.isArray(db.suppliers)){ db.suppliers=[]; changed=true; }
  if(changed) saveDB(db);
  return db;
}
function saveDB(db){
  localStorage.setItem(DB_KEY, JSON.stringify(db));
  // Ghi lên Firebase — debounce 400ms để không flood khi nhiều field thay đổi liên tiếp
  if(window._firebaseReady){
    clearTimeout(_fbPendingSave);
    _fbPendingSave = setTimeout(()=>{
      window._fbSet(FB_PATH, db).catch(e=>console.error('Firebase write err', e));
    }, 400);
  }
}

/* ============================================================
   FIREBASE SYNC — Khởi tạo kết nối & realtime listener
   ============================================================ */

/* Pull dữ liệu từ Firebase một lần (khi khởi động) */
async function fbPullOnce(){
  try{
    const data = await window._fbGet(FB_PATH);
    if(data && data.users){
      const migrated = migrateDB(data);
      localStorage.setItem(DB_KEY, JSON.stringify(migrated));
      _fbConnected = true;
      return migrated;
    }
  }catch(e){ console.warn('Firebase pull err:', e); }
  return null;
}

/* Bật realtime listener — cập nhật localStorage khi có thay đổi từ thiết bị khác */
function fbStartRealtime(){
  if(_fbSyncHandle) return; // đã bật
  if(!window._firebaseReady) return;
  _fbSyncHandle = window._fbOn(FB_PATH, (data)=>{
    if(!data || !data.users) return;
    const cur = JSON.stringify(getDB());
    const nxt = JSON.stringify(data);
    if(cur !== nxt){
      localStorage.setItem(DB_KEY, JSON.stringify(data));
      _fbConnected = true;
      // Popup window (có ?openContract) → re-render nội dung popup
      if(_popupCid){
        renderFileStatusBar();
        renderPopupBody();
      // Trang chính → re-render view hiện tại
      } else if(currentUser()){
        renderFileStatusBar();
        routeTo(currentView);
      }
    }
  });
}

/* Ngắt realtime */
function fbStopRealtime(){
  if(_fbSyncHandle){ window._fbOff(_fbSyncHandle); _fbSyncHandle=null; }
  _fbConnected = false;
}

/* ---------- Hash mật khẩu (SHA-256) ---------- */
async function hashPassword(plain){
  const buf=new TextEncoder().encode(plain);
  const h=await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function loginAttempt(role, username, password){
  const db=getDB();
  // Lần đầu admin
  if(role==='admin'){
    const adminExists=db.users.some(u=>u.role==='admin');
    if(!adminExists){
      // Khởi tạo admin
      if(!password || password.length<4) throw new Error('Mật khẩu phải ≥4 ký tự');
      const hashed=await hashPassword(password);
      const admin={
        id:uid('u'), username:'admin', name:'Quản trị viên',
        role:'admin', companyId:'emc',
        passwordHash:hashed, mustChangePass:false,
        email:'nguyentuananh.emc@gmail.com',
        createdAt: Date.now()
      };
      db.users.push(admin);
      saveDB(db);
      Session.set({id:admin.id, role:'admin', name:admin.name});
      return admin;
    }
  }
  const user=db.users.find(u=>u.username.toLowerCase()===username.toLowerCase() && u.role===role);
  if(!user) throw new Error('Tài khoản không tồn tại với vai trò đã chọn');
  const h=await hashPassword(password);
  if(h!==user.passwordHash) throw new Error('Sai mật khẩu');
  Session.set({id:user.id, role:user.role, name:user.name});
  return user;
}

/* ============================================================
   KPI COMPUTATION
   ============================================================ */
function pctAchieve(target, actual, lowerIsBetter=false){
  if(target===''||target===null||target===undefined) return 0;
  const t=Number(target), a=Number(actual);
  if(isNaN(t)||isNaN(a)) return 0;
  if(lowerIsBetter){
    // Càng thấp càng tốt: nếu actual<=target → 100%; nếu actual>target → giảm theo tỉ lệ
    if(t===0){ return a===0 ? 1 : Math.max(0, 1 - a*0.2); }
    if(a<=t) return 1;
    return Math.max(0, 1 - (a-t)/(t*2));
  }else{
    if(t===0) return a>0 ? 1 : 0;
    const r=a/t;
    return Math.max(0, Math.min(1.2, r));
  }
}
function computeKPISection(items, values){
  // items: template; values: {idx:{target,actual}}
  let total=0;
  const detail=[];
  items.forEach((it,i)=>{
    const v=values[i]||{};
    const target = (v.target!==undefined && v.target!=='') ? v.target : it.target;
    const actual = (v.actual!==undefined && v.actual!=='') ? v.actual : '';
    const lower = it.unit==='lần' || it.unit==='vụ';
    const pct = pctAchieve(target, actual, lower);
    const pts = it.weight * pct * 100;
    total += pts;
    detail.push({name:it.name, unit:it.unit, weight:it.weight, target, actual, pct, points:pts});
  });
  return {total, detail};
}
function computeFullKPI(evalRow){
  const db=getDB();
  const wPro=db.settings.kpiWeightPro, wDisc=db.settings.kpiWeightDisc;
  const proItems = (db.kpiTemplates[evalRow.area]||[]);
  const discItems = (db.disciplineTemplate||[]);
  const pro = computeKPISection(proItems, evalRow.pro||{});
  const disc = computeKPISection(discItems, evalRow.disc||{});
  const total = pro.total*wPro + disc.total*wDisc;
  const rt = ratingOf(total);
  return {pro, disc, total, rating:rt, wPro, wDisc};
}
function computeSalary(user, evalRow){
  // Phiên bản đơn mảng (giữ lại để tương thích ngược, ưu tiên dùng computeSalaryMulti)
  const rank = user.salaryRankCode ? getRank(user.area, user.salaryRankCode) : null;
  if(!rank) return {base:0, allowance:0, kpiMax:0, kpiActual:0, total:0, rating:null};
  const kpi = computeFullKPI(evalRow);
  const base = Number(user.baseSalary||rank.applied||0);
  const allowance = Number(user.allowance!==undefined ? user.allowance : (rank.allowance||0));
  const kpiPct = Number(user.kpiPct!==undefined ? user.kpiPct : (rank.kpiPct||0));
  const kpiMax = base*kpiPct;
  const kpiActual = kpiMax * kpi.rating.coef * (kpi.total/100);
  const total = base + allowance + kpiActual;
  return {base, allowance, kpiMax, kpiActual, total, rating:kpi.rating, kpiScore:kpi.total};
}

/* ---------- Tính lương đa nhiệm: base + allowance + Σ KPI bonus theo từng mảng ---------- */
function computeSalaryMulti(user, period){
  const db = getDB();
  const assignments = getUserAssignments(user);
  const base = Number(user.baseSalary||0);
  const allowance = Number(user.allowance||0);
  const bonuses = [];
  let totalKpiActual = 0;
  let totalKpiMax = 0;
  let avgScore = 0, scoreCnt=0;

  assignments.forEach(asg=>{
    const ev = db.kpiEvals.find(e=>e.userId===user.id && e.period===period && e.area===asg.area);
    let kpiScore=0, rating=null, proTotal=0, discTotal=0;
    if(ev){
      const f = computeFullKPI(ev);
      kpiScore = f.total;
      rating = f.rating;
      proTotal = f.pro.total;
      discTotal = f.disc.total;
      avgScore += kpiScore; scoreCnt++;
    }
    const rank = asg.salaryRankCode ? getRank(asg.area, asg.salaryRankCode) : null;
    const kpiBase = Number(asg.kpiBase || (rank?rank.applied:0) || base || 0);
    const kpiPct = Number(asg.kpiPct || (rank?rank.kpiPct:0) || 0);
    const kpiMax = kpiBase * kpiPct;
    const kpiActual = (rating && kpiScore>0) ? kpiMax * rating.coef * (kpiScore/100) : 0;
    totalKpiMax += kpiMax;
    totalKpiActual += kpiActual;
    bonuses.push({
      area: asg.area,
      areaName: (getArea(asg.area)||{}).name || asg.area,
      rankCode: asg.salaryRankCode||'',
      kpiBase, kpiPct, kpiMax, kpiActual,
      kpiScore, rating,
      hasEval: !!ev,
      proTotal, discTotal
    });
  });

  const total = base + allowance + totalKpiActual;
  const avg = scoreCnt ? avgScore/scoreCnt : 0;
  return {
    base, allowance, totalKpiMax, totalKpiActual,
    total, bonuses,
    assignmentsCount: assignments.length,
    avgKpiScore: avg,
    avgRating: scoreCnt ? ratingOf(avg) : null
  };
}

  const root=document.getElementById('root');

  root.innerHTML=`
    <div class="login-wrap">
      <div class="login-box">
        <h1>EMC · AA · TẢN VIÊN</h1>

            <input type="text" id="login-user" autocomplete="off" placeholder="VD: nguyenvanA hoặc Nguyễn Văn A">
            <div id="login-suggest" style="display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #cbd5e1;border-radius:8px;max-height:260px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,.15);z-index:100;margin-top:2px"></div>
          </div>
          <div class="field" style="position:relative">
            <label>Mật khẩu</label>
            <input type="password" id="login-pass" autocomplete="current-password" style="padding-right:42px">
            <button type="button" id="pw-toggle" title="Hiện/Ẩn mật khẩu" style="position:absolute;right:8px;top:32px;background:none;border:none;cursor:pointer;font-size:18px;padding:0 6px">👁</button>
            <div class="hint" id="login-hint"></div>
          </div>

          ${adminExists ? 'Hệ thống đã được khởi tạo' : '⚠️ Lần đầu sử dụng: đăng nhập vai trò Admin để đặt mật khẩu mặc định'}

  const pick=document.getElementById('role-pick');
  function setRole(r){

    const hint=document.getElementById('login-hint');

    const errBox=document.getElementById('login-err');
    errBox.textContent='';
    const u = role==='admin' ? 'admin' : document.getElementById('login-user').value.trim();
    const p = document.getElementById('login-pass').value;
    if(!p){ errBox.textContent='Vui lòng nhập mật khẩu'; return; }
    if(role!=='admin' && !u){ errBox.textContent='Vui lòng nhập tên đăng nhập'; return; }

      await loginAttempt(role, u, p);
      toast('Đăng nhập thành công');
      render();

      setTimeout(checkDeadlineWarning, 600);
    }catch(err){
      errBox.textContent=err.message;
    }
  }
  document.getElementById('login-form').addEventListener('submit', (e)=>{ e.preventDefault(); doLogin(); });
  document.getElementById('login-btn').addEventListener('click', (e)=>{ e.preventDefault(); doLogin(); });
  document.getElementById('login-pass').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); doLogin(); }});

  // 👁 Toggle show password
  document.getElementById('pw-toggle').addEventListener('click', ()=>{
    const inp=document.getElementById('login-pass');
    inp.type = inp.type==='password' ? 'text' : 'password';
    document.getElementById('pw-toggle').textContent = inp.type==='password' ? '👁' : '🙈';
  });

  // 🔎 Autocomplete tên NV
  const userInput = document.getElementById('login-user');
  const sugBox = document.getElementById('login-suggest');
  let _loginSugList=[], _loginSugIdx=-1;
  function renderLoginSuggest(q){
    if(role==='admin'){ sugBox.style.display='none'; return; }
    const qLow = (q||'').toLowerCase().trim();
    let list = db.users.filter(u=>u.role===role);
    if(qLow) list = list.filter(u=>
      (u.username||'').toLowerCase().includes(qLow) ||
      (u.name||'').toLowerCase().includes(qLow) ||
      (u.code||'').toLowerCase().includes(qLow)
    );
    list = list.slice(0,15);
    _loginSugList = list; _loginSugIdx = list.length?0:-1;
    if(!list.length){ sugBox.style.display='none'; return; }
    sugBox.innerHTML = list.map((u,i)=>{
      const co = getCompany(u.companyId);
      return `<div class="login-sug-item" data-idx="${i}" data-username="${escapeHtml(u.username)}"

        ondblclick="window._loginSugPick(${i})"
        onclick="window._loginSugPick(${i})">
        <span><b>${escapeHtml(u.name)}</b> <span class="muted" style="font-size:11px">(${escapeHtml(u.username)})</span></span>
        <span class="badge co" style="font-size:10px">${escapeHtml(co.code)}</span>
      </div>`;
    }).join('');
    sugBox.style.display='block';
    window._loginSugHL(0);
  }
  window._loginSugHL = function(i){
    _loginSugIdx = i;
    sugBox.querySelectorAll('.login-sug-item').forEach(el=>{
      if(Number(el.dataset.idx)===i){ el.style.background='#1e3a8a'; el.style.color='#fff'; el.scrollIntoView({block:'nearest'}); }
      else { el.style.background=''; el.style.color=''; }
    });
  };
  window._loginSugPick = function(i){
    const u = _loginSugList[i]; if(!u) return;
    userInput.value = u.username;
    sugBox.style.display='none';
    document.getElementById('login-pass').focus();
  };
  userInput.addEventListener('focus', ()=>renderLoginSuggest(userInput.value));
  userInput.addEventListener('input', ()=>renderLoginSuggest(userInput.value));
  userInput.addEventListener('keydown', (e)=>{
    if(sugBox.style.display==='none'){ if(e.key==='Enter'){ e.preventDefault(); doLogin(); } return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); _loginSugIdx=Math.min(_loginSugList.length-1, _loginSugIdx+1); window._loginSugHL(_loginSugIdx); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); _loginSugIdx=Math.max(0, _loginSugIdx-1); window._loginSugHL(_loginSugIdx); }
    else if(e.key==='Enter'){
      e.preventDefault();
      if(_loginSugIdx>=0 && _loginSugList[_loginSugIdx]){ window._loginSugPick(_loginSugIdx); }
      else doLogin();
    }
    else if(e.key==='Escape'){ sugBox.style.display='none'; }
  });
  document.addEventListener('click', (ev)=>{ if(!userInput.contains(ev.target) && !sugBox.contains(ev.target)) sugBox.style.display='none'; });
}

function viewDashboard(main, u){
  const db=getDB();
  const period=thisPeriod();
  // Lọc dữ liệu hiển thị (admin xem tất, manager xem cùng công ty, employee xem mình)
  let users = db.users.filter(x=>x.role==='employee'||x.role==='manager');
  if(u.role==='manager') users = users.filter(x=>x.companyId===u.companyId);
  if(u.role==='employee') users = users.filter(x=>x.id===u.id);

  const rowsHtml = users.map(emp=>{
    const sal = computeSalaryMulti(emp, period);
    const asgs = getUserAssignments(emp);
    const c=getCompany(emp.companyId);
    const areasHtml = asgs.length ? asgs.map(a=>{
      const ar=getArea(a.area); return ar?`<span class="badge area-${ar.id}">${escapeHtml(ar.short)}</span>`:'';
    }).join(' ') : '<span class="muted">—</span>';
    const scoresHtml = sal.bonuses.length ? sal.bonuses.map(b=>{
      const ar=getArea(b.area);
      if(!b.hasEval) return `<span class="muted" style="font-size:11px" title="${ar.name}: chưa chấm">${ar.short}:—</span>`;
      return `<span class="badge ${b.rating.css}" style="font-size:11px" title="${ar.name}: ${b.kpiScore.toFixed(1)} - ${b.rating.label}">${ar.short}:${b.kpiScore.toFixed(0)}</span>`;
    }).join(' ') : '<span class="muted">Chưa chấm</span>';
    const avgHtml = sal.avgRating ? `<span class="badge ${sal.avgRating.css}">${sal.avgRating.label} (TB ${sal.avgKpiScore.toFixed(1)})</span>` : '<span class="muted">—</span>';
    return `<tr class="clickable" ondblclick="showEmployeeDetail('${emp.id}')">
      <td>${escapeHtml(emp.code||emp.username)}</td>
      <td><b>${escapeHtml(emp.name)}</b>${asgs.length>1?`<div class="hint muted">Đa nhiệm ${asgs.length} mảng</div>`:''}</td>
      <td>${roleBadge(emp.role)}</td>
      <td><span class="badge co">${escapeHtml(c.code)}</span></td>
      <td>${areasHtml}</td>
      <td>${escapeHtml(emp.position||'')}</td>
      <td>${scoresHtml}</td>
      <td>${avgHtml}</td>
      <td class="muted">${escapeHtml(emp.email||'')}</td>
    </tr>`;
  }).join('');

  // Thống kê
  const totalEmps = users.length;
  const evaluatedThisMonth = db.kpiEvals.filter(e=>e.period===period && users.some(u=>u.id===e.userId)).length;
  const activeTasks = db.tasks.filter(t=>t.status!=='done' && users.some(u=>u.id===t.assigneeId)).length;
  const overdueTasks = db.tasks.filter(t=>t.status!=='done' && t.dueDate && t.dueDate < Date.now() && users.some(u=>u.id===t.assigneeId)).length;

  // ====== CHẤM CÔNG ======
  // db.attendance = {userId: {period: {day: 'P'|'V'|'O'|'H' ...}}}
  // P = đi làm đủ ngày, V = vắng, O = nghỉ phép, H = nửa ngày
  const db2 = db;
  if(!db2.attendance) { db2.attendance = {}; saveDB(db2); }
  const [yy, mm] = period.split('-').map(Number);
  const daysInMonth = new Date(yy, mm, 0).getDate();
  const workingDays = countWorkingDays(yy, mm); // ngày thường (T2–T7)

  // Tính lương từ chấm công + KPI (đã hỗ trợ tăng ca)
  function attCountFor(empId){
    const rec = (db2.attendance[empId]||{})[period] || {};
    let full=0, half=0, leave=0, otHours=0;
    Object.values(rec).forEach(v=>{
      // Cấu trúc mới: {code, ot}; cấu trúc cũ: chỉ là string code
      let code, ot;
      if(typeof v==='object' && v!==null){ code = v.code; ot = Number(v.ot)||0; }
      else { code = v; ot = 0; }
      if(code==='P') full++; else if(code==='H') half++; else if(code==='O') leave++;
      otHours += ot;
    });
    return {full, half, leave, otHours, totalDays: full + 0.5*half + 0*leave};
  }
  function computeSalaryWithAttendance(emp){
    const sal = computeSalaryMulti(emp, period);
    const att = attCountFor(emp.id);
    const ratio = workingDays>0 ? att.totalDays/workingDays : 1;
    // Lương theo công = (Lương cứng + Hỗ trợ) × tỷ lệ công đi làm
    const cdRatio = Math.min(1, ratio);
    const baseAdjusted = Math.round((sal.base + sal.allowance) * cdRatio);
    const finalTotal = baseAdjusted + sal.totalKpiActual;
    return {...sal, attendance: att, workingDays, attendanceRatio: cdRatio, baseAdjusted, finalTotal};
  }

  const attRowsHtml = users.map(emp=>{
    const sal = computeSalaryWithAttendance(emp);
    const c=getCompany(emp.companyId);
    return `<tr class="clickable" ondblclick="showEmployeeDetail('${emp.id}')">
      <td>${escapeHtml(emp.code||emp.username)}</td>
      <td><b>${escapeHtml(emp.name)}</b></td>
      <td><span class="badge co">${escapeHtml(c.code)}</span></td>
      <td class="center">${sal.attendance.full}</td>
      <td class="center">${sal.attendance.half}</td>
      <td class="center">${sal.attendance.leave}</td>
      <td class="center" style="background:#fef3c7;font-weight:600">${sal.attendance.otHours||0}</td>
      <td class="center"><b>${sal.attendance.totalDays}/${workingDays}</b></td>
      <td class="center">${(sal.attendanceRatio*100).toFixed(0)}%</td>
      ${u.role==='admin' ? `
        <td class="right">${fmtVND(sal.base + sal.allowance)}</td>
        <td class="right">${fmtVND(sal.baseAdjusted)}</td>
        <td class="right">${fmtVND(Math.round(sal.totalKpiActual))}</td>
        <td class="right"><b style="color:#1e3a8a">${fmtVND(Math.round(sal.finalTotal))}</b></td>` : ''}
      <td>${u.role==='employee'
          ? `<button class="btn sm outline" onclick="event.stopPropagation();openAttendanceGrid('${emp.id}','${period}')">👁 Xem</button>`
          : `<button class="btn sm" onclick="event.stopPropagation();openAttendanceGrid('${emp.id}','${period}')">📅 Chấm</button>`}</td>
    </tr>`;
  }).join('');

  main.innerHTML=`
    <div class="page-head">
      <h1>🕐 Chấm công · ${fmtPeriod(period)}</h1>
      <div class="actions">
        <input type="month" id="att-period" value="${period}" onchange="navTo('dashboard')" style="width:auto">
        <button class="btn" onclick="exportAttendanceExcel()">📊 Xuất Excel lương + chấm công</button>
        <button class="btn outline" onclick="navTo('reports')">📑 Báo cáo lương</button>
      </div>
    </div>
    <div class="help-text">📅 <b>Chấm công tháng:</b> bấm "📅 Chấm" để mở lưới chấm công cho từng NV. Quy ước: <b>P</b> = công đủ ngày · <b>H</b> = nửa ngày · <b>O</b> = nghỉ phép có lương · <b>(trống)</b> = vắng/CN/ngày nghỉ. <b>Lương cuối tháng</b> = (Lương cứng + Hỗ trợ) × Tỷ lệ công + Σ Thưởng KPI từng mảng.</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Tổng nhân sự</div><div class="value">${totalEmps}</div></div>
      <div class="stat-card green"><div class="label">Số ngày làm/tháng</div><div class="value">${workingDays}</div></div>
      <div class="stat-card amber"><div class="label">Đã chấm KPI</div><div class="value">${evaluatedThisMonth}/${totalEmps}</div></div>
      <div class="stat-card red"><div class="label">Nhiệm vụ trễ hạn</div><div class="value">${overdueTasks}</div></div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Mã NV</th><th>Họ và tên</th><th>Công ty</th>
          <th>Công đủ (P)</th><th>Nửa ngày (H)</th><th>Phép (O)</th>
          <th style="background:#f59e0b">Tăng ca (giờ)</th>
          <th>Tổng công</th><th>Tỷ lệ</th>
          ${u.role==='admin' ? '<th class="right">Lương + Hỗ trợ</th><th class="right">Lương theo công</th><th class="right">Σ KPI</th><th class="right">TỔNG LƯƠNG</th>' : ''}
          <th></th>
        </tr></thead>
        <tbody>${attRowsHtml || '<tr><td colspan="13" class="empty">Chưa có dữ liệu</td></tr>'}</tbody>
      </table>
    </div>
  `;
}
function countWorkingDays(year, month){
  // Đếm T2-T7 trong tháng (CN nghỉ). Không tính ngày lễ.
  const dim = new Date(year, month, 0).getDate();
  let cnt=0;
  for(let d=1;d<=dim;d++){
    const dow = new Date(year, month-1, d).getDay(); // 0=CN, 6=T7
    if(dow!==0) cnt++;
  }
  return cnt;
}

    : `<div class="help-text"><b>Click</b> vào ô để chuyển trạng thái: trống → P (công đủ) → H (nửa ngày) → O (phép có lương) → trống.</div>`;

    <div style="margin-top:10px;background:#f1f5f9;padding:10px;border-radius:8px;font-size:13px" id="att-summary"></div>`;

    onShown:()=>renderAttGrid(empId, period, isReadOnly)
  });
};
function renderAttGrid(empId, period, isReadOnly){
  const db = getDB();
  const [yy,mm] = period.split('-').map(Number);
  const dim = new Date(yy, mm, 0).getDate();
  const firstDow = new Date(yy, mm-1, 1).getDay(); // 0=CN
  const rec = (db.attendance[empId] && db.attendance[empId][period]) || {};
  const wrap = document.getElementById('att-grid'); if(!wrap) return;
  if(isReadOnly===undefined) isReadOnly = currentUser()?.role==='employee';
  let cells = '';
  function _getCellInfo(v){
    if(typeof v==='object' && v!==null) return {code:v.code||'', ot:Number(v.ot)||0};
    return {code:v||'', ot:0};
  }
  // Pad start
  for(let i=0;i<firstDow;i++) cells += '<div></div>';
  for(let d=1;d<=dim;d++){
    const dow = new Date(yy, mm-1, d).getDay();
    const isSun = dow===0;
    const info = _getCellInfo(rec[d]);
    const v = info.code, ot = info.ot;
    const colors = {'P':'#16a34a', 'H':'#f59e0b', 'O':'#3b82f6', '':'#f1f5f9'};
    const bg = colors[v];
    const clickHandler = isReadOnly ? '' : `onclick="cycleAttDay('${empId}','${period}',${d})"`;
    const cursor = isReadOnly ? 'default' : 'pointer';
    cells += `<div style="padding:6px 4px;border:1px solid #cbd5e1;border-radius:6px;background:${bg};color:${v?'#fff':'#0f172a'};font-weight:${v?700:400};${isSun?'opacity:.5':''}${isReadOnly?';opacity:.85':''};text-align:center">
      <button ${clickHandler} ${isReadOnly?'disabled':''} style="background:none;border:none;color:inherit;cursor:${cursor};width:100%;font-weight:inherit">
        <div style="font-size:14px">${d}</div>
        <div style="font-size:11px">${v||'—'}</div>
      </button>
      ${isReadOnly?`<div style="font-size:10px;margin-top:2px;background:rgba(255,255,255,.3);border-radius:4px;padding:1px 2px">OT: <b>${ot||0}h</b></div>`:`<input type="number" min="0" max="12" step="0.5" value="${ot||''}" onchange="updateAttOT('${empId}','${period}',${d},this.value)" placeholder="OT" title="Giờ tăng ca" style="width:100%;font-size:10px;padding:1px 2px;margin-top:2px;border:1px solid rgba(255,255,255,.4);border-radius:4px;background:rgba(255,255,255,.3);color:inherit;text-align:center" onclick="event.stopPropagation()">`}
    </div>`;
  }
  wrap.innerHTML = cells;
  // Summary
  let p=0,h=0,o=0,totalOT=0;
  Object.values(rec).forEach(v=>{
    const info = _getCellInfo(v);
    if(info.code==='P')p++; else if(info.code==='H')h++; else if(info.code==='O')o++;
    totalOT += info.ot;
  });
  const total = p + 0.5*h;
  const wd = countWorkingDays(yy, mm);
  const ratio = wd>0 ? (total/wd*100) : 0;
  document.getElementById('att-summary').innerHTML = `
    <b>Tổng công:</b> P=${p} ngày · H=${h} nửa ngày · O=${o} phép ·
    <b style="color:#f59e0b">Tăng ca: ${totalOT}h</b> ·
    <b>Quy đổi: ${total} công</b> / ${wd} ngày làm việc → <b>${ratio.toFixed(1)}%</b>
  `;
}
window.updateAttOT = function(empId, period, d, value){
  if(!canApprove()){ toast('NV không có quyền nhập tăng ca','error'); return; }
  const db=getDB();
  if(!db.attendance[empId]) db.attendance[empId]={};
  if(!db.attendance[empId][period]) db.attendance[empId][period]={};
  const cur = db.attendance[empId][period][d];
  let code='';
  if(typeof cur==='object' && cur!==null) code = cur.code||'';
  else code = cur||'';
  const ot = Math.max(0, Number(value)||0);
  if(code || ot){
    db.attendance[empId][period][d] = {code, ot};
  } else {
    delete db.attendance[empId][period][d];
  }
  saveDB(db);
  renderAttGrid(empId, period);
};
window.cycleAttDay = function(empId, period, d){
  if(!canApprove()){ toast('NV không có quyền chấm công','error'); return; }
  const db=getDB();
  if(!db.attendance[empId]) db.attendance[empId]={};
  if(!db.attendance[empId][period]) db.attendance[empId][period]={};
  const cur = db.attendance[empId][period][d];
  let curCode = '';
  let curOT = 0;
  if(typeof cur==='object' && cur!==null){ curCode = cur.code||''; curOT = Number(cur.ot)||0; }
  else { curCode = cur||''; }
  const next = {'':'P','P':'H','H':'O','O':''}[curCode];
  if(next || curOT>0){
    db.attendance[empId][period][d] = {code: next||'', ot: curOT};
    // Nếu không có code lẫn OT thì xóa hoàn toàn
    if(!next && !curOT) delete db.attendance[empId][period][d];
  } else {
    delete db.attendance[empId][period][d];
  }
  saveDB(db);
  renderAttGrid(empId, period);
};
window.markAllWeekdays = function(empId, period, code){
  if(!canApprove()){ toast('NV không có quyền chấm công','error'); return; }
  const db=getDB();
  const [yy,mm] = period.split('-').map(Number);
  const dim = new Date(yy, mm, 0).getDate();
  if(!db.attendance[empId]) db.attendance[empId]={};
  db.attendance[empId][period] = {};
  for(let d=1;d<=dim;d++){
    if(new Date(yy, mm-1, d).getDay()!==0) db.attendance[empId][period][d] = code;
  }
  saveDB(db); renderAttGrid(empId, period);
  toast(`Đã đánh dấu "${code}" cho tất cả ngày làm việc`);
};
window.clearAttendance = function(empId, period){
  if(!canApprove()){ toast('NV không có quyền chấm công','error'); return; }
  if(!confirm('Xóa toàn bộ chấm công tháng này?')) return;
  const db=getDB();
  if(db.attendance[empId]) delete db.attendance[empId][period];
  saveDB(db); renderAttGrid(empId, period);
};
window.exportAttendanceExcel = function(){
  const db=getDB();
  const period = document.getElementById('att-period')?.value || thisPeriod();
  const [yy,mm] = period.split('-').map(Number);
  const wd = countWorkingDays(yy, mm);
  const u = currentUser();
  let users = db.users.filter(x=>x.role!=='admin');
  if(u.role==='manager') users = users.filter(x=>x.companyId===u.companyId);
  const rows = [
    ['BẢNG TỔNG HỢP CHẤM CÔNG & LƯƠNG · '+fmtPeriod(period)],
    ['Số ngày làm việc trong tháng:', wd],
    [],
    ['STT','Mã NV','Họ và tên','Công ty','P (công đủ)','H (nửa ngày)','O (phép)','Tổng công','Tỷ lệ %','Lương cứng + Hỗ trợ','Lương theo công','Σ Thưởng KPI','TỔNG LƯƠNG']
  ];
  users.forEach((emp,i)=>{
    const sal = computeSalaryMulti(emp, period);
    const rec = (db.attendance[emp.id]||{})[period]||{};
    let p=0,h=0,o=0;
    Object.values(rec).forEach(v=>{ if(v==='P')p++; else if(v==='H')h++; else if(v==='O')o++; });
    const totalDays = p + 0.5*h;
    const ratio = wd>0 ? totalDays/wd : 1;
    const baseAdj = Math.round((sal.base + sal.allowance) * Math.min(1, ratio));
    const total = baseAdj + sal.totalKpiActual;
    rows.push([i+1, emp.code||emp.username, emp.name, getCompany(emp.companyId).code, p, h, o, totalDays, (ratio*100).toFixed(1)+'%', sal.base+sal.allowance, baseAdj, Math.round(sal.totalKpiActual), Math.round(total)]);
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Chấm công + Lương');
  XLSX.writeFile(wb, `ChamCong_${period}.xlsx`);
  toast('Đã xuất Excel chấm công + lương');
};

function taskStatusBadge(s){
  if(s==='done') return '<span class="badge kpi-xs">Hoàn thành</span>';
  if(s==='inprogress') return '<span class="badge kpi-t">Đang làm</span>';
  if(s==='overdue') return '<span class="badge kpi-kem">Trễ hạn</span>';
  return '<span class="badge co">Mới giao</span>';
}

window.saveUserForm = async function(id){
  const db=getDB();
  const v = q=>document.getElementById(q).value.trim();
  const code=v('f-code'), username=v('f-username'), name=v('f-name');
  if(!code||!username||!name){
    document.getElementById('f-err').textContent='Vui lòng nhập đủ Mã NV, Username, Họ tên';
    return;
  }
  // Trùng username (kể cả khi sửa, trừ chính NV đang sửa)
  if(db.users.some(u=>u.username.toLowerCase()===username.toLowerCase() && u.id!==id)){
    document.getElementById('f-err').textContent='Username đã tồn tại'; return;
  }
  // Lấy assignments từ form checkbox (mỗi mảng tối đa 1 lần, đã tự đảm bảo không trùng)
  const rawAsg = collectAssignmentsFromForm();

  let user;
  if(id){ user = db.users.find(u=>u.id===id); }
  else { user = {id:uid('u'), createdAt:Date.now()}; db.users.push(user); }
  user.code=code; user.username=username; user.name=name;
  user.role=v('f-role'); user.companyId=v('f-company');
  user.position=v('f-position'); user.department=v('f-department');
  user.email=v('f-email'); user.phone=v('f-phone'); user.dob=v('f-dob');
  user.cccd=v('f-cccd'); user.mst=v('f-mst'); user.bhxh=v('f-bhxh'); user.address=v('f-address');
  user.assignments = rawAsg.map(a=>({
    area: a.area,
    salaryRankCode: a.salaryRankCode||'',
    kpiPct: Number(a.kpiPct)||0,
    kpiBase: Number(a.kpiBase)||0
  }));
  // Giữ tương thích: area = mảng đầu tiên
  user.area = user.assignments[0]?.area || '';
  user.salaryRankCode = user.assignments[0]?.salaryRankCode || '';
  user.kpiPct = user.assignments[0]?.kpiPct || 0;
  user.baseSalary = Number(v('f-base'))||0;
  user.allowance = Number(v('f-allow'))||0;
  if(!id){
    const pass = v('f-pass')||'123456';
    user.passwordHash = await hashPassword(pass);
    user.mustChangePass=true;
  }
  saveDB(db);
  closeModal();
  render();
  toast(id?'Đã cập nhật':'Đã thêm nhân sự');
};

window.resetUserPass = async function(id){
  const newPass = prompt('Nhập mật khẩu mới (≥4 ký tự):', '123456');
  if(!newPass || newPass.length<4) return;
  const db=getDB();
  const u=db.users.find(x=>x.id===id); if(!u) return;
  u.passwordHash = await hashPassword(newPass);
  u.mustChangePass=true;
  saveDB(db);
  toast('Đã reset mật khẩu thành: '+newPass, 'info');
};

/* ============================================================
   Gom tất cả nội dung CHỜ PHÊ DUYỆT của các dự án mà người dùng
   phụ trách (Quản lý / Trưởng phòng / Admin) — hiển thị ở đầu
   mục "Theo dõi công việc". (Yêu cầu 2)
   ============================================================ */
function collectAllPendingApprovals(u){
  const db=getDB();
  const FOUR_HRS = 4*3600*1000;
  const now = Date.now();
  const items = [];
  (db.contracts||[]).forEach(c=>{
    if(!canApproveProject(c.id)) return;
    const projName = escapeHtml(c.code || c.name || '');
    // 1) Tiến độ công việc chờ xác nhận
    (db.tasks||[]).filter(t=>t.projectId===c.id && t.pendingProgress!=null).forEach(t=>{
      const emp=db.users.find(x=>x.id===t.assigneeId);
      const since=t.pendingAt||now;
      items.push({type:'progress', proj:projName, projId:c.id,
        title:`${escapeHtml(t.title)}: ${(t.progress||0).toFixed(0)}% → ${Number(t.pendingProgress).toFixed(0)}%`,
        sub:`👤 ${escapeHtml(emp?.name||'')}`, since, elapsed:now-since, overTime:(now-since)>FOUR_HRS,
        actionConfirm:`confirmTaskProgress('${t.id}');render()`,
        actionReject:`rejectTaskProgress('${t.id}');render()`});
    });
    // 2) Phiếu nhập chờ xác nhận
    (db.importSlips||[]).filter(s=>s.contractId===c.id && !s.confirmed).forEach(s=>{
      const since=s.submittedAt||s.createdAt||now;
      items.push({type:'slip', proj:projName, projId:c.id,
        title:`Phiếu nhập ${escapeHtml(s.slipNo||'')} · ${(s.items||[]).length} dòng · ${fmtVND(s.totalValue||0)}`,
        sub:`👤 ${escapeHtml(s.requesterName||'')} · NCC: ${escapeHtml(s.supplierName||'')}`, since, elapsed:now-since, overTime:(now-since)>FOUR_HRS,
        actionConfirm:`confirmImportSlip('${s.id}','${c.id}');render()`,
        actionView:`viewSlipDetail('${s.id}')`});
    });
    // 3) Hồ sơ kỹ thuật & biên bản chờ xác nhận hoàn thiện + chờ duyệt xóa
    [['doc', c.pcccDocList], ['rec', c.pcccRecList]].forEach(([scope, list])=>{
      (list||[]).forEach(it=>{
        if(it.pendingCompleted && !it.confirmedCompleted){
          const emp=db.users.find(x=>x.id===it.pendingBy);
          const since=it.pendingAt||now;
          items.push({type:scope==='doc'?'doc':'rec', proj:projName, projId:c.id,
            title:`${scope==='doc'?'📐':'📋'} ${escapeHtml(it.name||'')}`,
            sub:`👤 ${escapeHtml(emp?.name||'')} đề nghị duyệt hoàn thiện`, since, elapsed:now-since, overTime:(now-since)>FOUR_HRS,
            actionConfirm:`confirmPcccCompleted('${c.id}','${scope}','${it.id}');render()`});
        }
        if(it.pendingDelete){
          const emp=db.users.find(x=>x.id===it.pendingDeleteBy);
          const since=it.pendingDeleteAt||now;
          items.push({type:'del', proj:projName, projId:c.id,
            title:`🗑 Yêu cầu XÓA: ${escapeHtml(it.name||'(chưa đặt tên)')}`,
            sub:`👤 ${escapeHtml(emp?.name||'')} đề nghị xóa hồ sơ`, since, elapsed:now-since, overTime:(now-since)>FOUR_HRS,
            actionConfirm:`confirmPcccDelete('${c.id}','${scope}','${it.id}');render()`,
            actionReject:`rejectPcccDelete('${c.id}','${scope}','${it.id}');render()`});
        }
      });
    });
  });
  return items;
}

  </div>`;

/* ---------- Bảng công việc (theo người lọc nếu có) ---------- */
function renderTasksTable(){
  const db=getDB();
  const u=currentUser();
  const filterId = window._taskFilterEmpId;
  let tasks=db.tasks.slice();
  if(u.role==='manager'){
    const ids = db.users.filter(x=>x.companyId===u.companyId).map(x=>x.id);

  }
  if(filterId) tasks = tasks.filter(t=>t.assigneeId===filterId);
  // Sắp xếp theo Hạn hoàn thành (sớm trước)
  tasks.sort((a,b)=>{
    if(!a.dueDate && !b.dueDate) return 0;
    if(!a.dueDate) return 1;
    if(!b.dueDate) return -1;
    return a.dueDate - b.dueDate;
  });
  const host=document.getElementById('tasks-table-wrap');

        </tr></thead>
        <tbody>${tasks.map(t=>{
          const emp=db.users.find(x=>x.id===t.assigneeId);
          const proj=t.projectId?db.contracts.find(x=>x.id===t.projectId):null;

          else if(stat==='soon'){ dueStyle='color:#b45309;font-weight:600;'; dueExtra='<span class="badge kpi-dat" style="margin-left:6px;font-size:10px">SẮP HẾT HẠN</span>'; }

            <td>${escapeHtml(t.title)}${proj?`<div class="hint muted">🏗 Dự án: ${escapeHtml(proj.name||proj.code)}</div>`:''}</td>
            <td>${t.area?`<span class="badge area-${t.area}">${getArea(t.area).name}</span>`:'—'}</td>
            <td>${fmtDate(t.createdAt)}</td>

              <button class="btn sm danger" onclick="delTask('${t.id}')">Xóa</button>

        }).join('') || `<tr><td colspan="8" class="empty">${filterId?'Nhân viên này chưa có nhiệm vụ nào':'Chưa có nhiệm vụ'}</td></tr>`}</tbody>
      </table>
    </div>
  `;

/* ---------- Trạng thái deadline: 'done' | 'overdue' | 'soon' | 'ok' ---------- */
function deadlineStatus(t){
  if(!t.dueDate) return 'ok';
  if(t.status==='done') return 'done';
  const now = Date.now();
  if(t.dueDate < now) return 'overdue';
  const days = Math.ceil((t.dueDate - now) / 86400000);
  if(days <= 3) return 'soon';
  return 'ok';
}

/* ---------- Cảnh báo deadline khi đăng nhập / mỗi phiên ---------- */
function checkDeadlineWarning(){
  const u = currentUser(); if(!u) return;
  const db = getDB();
  let myTasks = [];
  if(u.role==='employee'){
    myTasks = db.tasks.filter(t=>t.assigneeId===u.id);
  } else if(u.role==='manager'){
    const ids = db.users.filter(x=>x.companyId===u.companyId).map(x=>x.id);
    myTasks = db.tasks.filter(t=>ids.includes(t.assigneeId));
  } else { // admin
    myTasks = db.tasks;
  }
  const soonTasks = myTasks.filter(t=>deadlineStatus(t)==='soon');
  const overdueTasks = myTasks.filter(t=>deadlineStatus(t)==='overdue');
  if(!soonTasks.length && !overdueTasks.length) return;
  // Hiển thị banner cố định góc phải trên
  const wrap = document.createElement('div');
  wrap.id = 'deadline-warn-popup';
  wrap.style.cssText = 'position:fixed;top:80px;right:20px;width:380px;background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);z-index:300;overflow:hidden;border:2px solid #f59e0b';
  let html = `<div style="background:#f59e0b;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center">
    <b>⚠ Cảnh báo công việc sắp hết hạn</b>
    <button onclick="this.closest('#deadline-warn-popup').remove()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer">×</button>
  </div>
  <div style="padding:12px 14px;max-height:320px;overflow-y:auto;font-size:13px">`;
  if(overdueTasks.length){
    html += `<div style="color:#dc2626;font-weight:600;margin-bottom:4px">🚨 ${overdueTasks.length} công việc QUÁ HẠN:</div>`;
    html += '<ul style="margin:0 0 8px 0;padding-left:20px">' +
      overdueTasks.slice(0,5).map(t=>{
        const emp = u.role==='employee' ? '' : ' — '+escapeHtml((db.users.find(x=>x.id===t.assigneeId)||{}).name||'');
        return `<li><b>${escapeHtml(t.title)}</b>${emp}<br><span class="muted">hết hạn ${fmtDate(t.dueDate)}</span></li>`;
      }).join('') + '</ul>';
    if(overdueTasks.length>5) html += `<div class="muted" style="font-size:11px">… và ${overdueTasks.length-5} công việc khác</div>`;
  }
  if(soonTasks.length){
    html += `<div style="color:#b45309;font-weight:600;margin-bottom:4px">⏰ ${soonTasks.length} công việc sắp hết hạn (≤ 3 ngày):</div>`;
    html += '<ul style="margin:0 0 8px 0;padding-left:20px">' +
      soonTasks.slice(0,5).map(t=>{
        const days = Math.ceil((t.dueDate-Date.now())/86400000);
        const emp = u.role==='employee' ? '' : ' — '+escapeHtml((db.users.find(x=>x.id===t.assigneeId)||{}).name||'');
        return `<li><b>${escapeHtml(t.title)}</b>${emp}<br><span class="muted">còn ${days} ngày (hạn ${fmtDate(t.dueDate)})</span></li>`;
      }).join('') + '</ul>';
    if(soonTasks.length>5) html += `<div class="muted" style="font-size:11px">… và ${soonTasks.length-5} công việc khác</div>`;
  }
  html += `<div style="margin-top:10px;text-align:right"><button class="btn sm" onclick="navTo('${u.role==='employee'?'my-tasks':'tasks'}');document.getElementById('deadline-warn-popup')?.remove()">Mở bảng công việc</button></div>`;
  html += '</div>';
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
  // Tự đóng sau 30 giây nếu không thao tác
  setTimeout(()=>{ const x=document.getElementById('deadline-warn-popup'); if(x) x.remove(); }, 30000);
}

function empFilterSuggest(q){
  const box = document.getElementById('emp-suggest');
  if(!box) return;
  const qLow = (q||'').toLowerCase().trim();
  const pool = getEmpPool();
  let list = pool;
  if(qLow){
    list = pool.filter(e=>{
      return (e.name||'').toLowerCase().includes(qLow)
          || (e.code||'').toLowerCase().includes(qLow)
          || (e.username||'').toLowerCase().includes(qLow)
          || (e.email||'').toLowerCase().includes(qLow);
    });
  }
  list = list.slice(0, 30);
  window._taskSuggestList = list;
  window._taskSuggestIdx = list.length ? 0 : -1;
  if(!list.length){
    box.innerHTML = '<div style="padding:10px;color:#94a3b8">Không tìm thấy nhân viên phù hợp</div>';
    box.style.display='block';
    return;
  }
  box.innerHTML = list.map((e,i)=>{
    const areas = getUserAreas(e).map(a=>{ const ar=getArea(a); return ar?`<span class="badge area-${ar.id}" style="font-size:10px">${ar.short}</span>`:'';}).join(' ');
    return `<div class="emp-sug-item" data-idx="${i}" data-id="${e.id}"
      style="padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9"
      onmouseenter="empSuggestHighlight(${i})"
      ondblclick="empSearchPick('${e.id}')"

      <span>${areas}</span>
    </div>`;
  }).join('');
  box.style.display='block';
  empSuggestHighlight(0);
}
window.empSuggestHighlight = function(i){
  window._taskSuggestIdx = i;
  document.querySelectorAll('.emp-sug-item').forEach(el=>{
    if(Number(el.dataset.idx)===i){
      el.style.background = '#1e3a8a';
      el.style.color = '#fff';
      el.scrollIntoView({block:'nearest'});
    } else {
      el.style.background = '';
      el.style.color = '';
    }
  });
};
window.empSearchKey = function(e){
  const list = window._taskSuggestList || [];
  let idx = window._taskSuggestIdx;
  if(e.key==='ArrowDown'){
    e.preventDefault();
    idx = Math.min(list.length-1, idx+1);
    empSuggestHighlight(idx);
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    idx = Math.max(0, idx-1);
    empSuggestHighlight(idx);
  } else if(e.key==='Enter'){
    e.preventDefault();
    if(idx>=0 && list[idx]) empSearchPick(list[idx].id);
  } else if(e.key==='Escape'){
    document.getElementById('emp-suggest').style.display='none';
  }
};

window.saveTask = function(id){
  const db=getDB();
  const v=q=>document.getElementById(q).value;
  let t;
  if(id) t = db.tasks.find(x=>x.id===id);
  else { t={id:uid('t'), createdAt:Date.now(), createdBy:currentUser().id}; db.tasks.push(t); }
  t.title=v('t-title').trim();
  t.assigneeId=v('t-assignee');
  t.area=v('t-area');
  const due=v('t-due'); t.dueDate=due?new Date(due).getTime():null;
  t.status=v('t-status');
  t.note=v('t-note').trim();
  if(!t.title){ toast('Nhập tên nhiệm vụ','error'); return; }

};
window.delTask = function(id){

  const db=getDB(); db.tasks=db.tasks.filter(t=>t.id!==id); saveDB(db); render(); toast('Đã xóa');
};

window.saveBulkTasks = function(){
  const db=getDB();

  empIds.forEach(eid=>{

      let pro='—',disc='—',total='—',rt='';
      if(ev){

window.switchKPITab=function(e,t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  e.currentTarget.classList.add('active');
  ['pro','disc','sum'].forEach(k=>{
    const x=document.getElementById('kpi-tab-'+k);
    if(x) x.style.display = k===t?'':'none';
  });
};
window.recalcKPILive = function(){
  const db=getDB();
  const u=currentUser();
  // Determine area from items count - we need to traverse the visible inputs
  // We'll just scan IDs
  function calcSection(prefix, items){
    let total=0;
    items.forEach((it,i)=>{
      const tEl=document.getElementById(`${prefix}-t-${i}`);
      const aEl=document.getElementById(`${prefix}-a-${i}`);
      if(!tEl||!aEl) return;
      const t=Number(tEl.value), a=Number(aEl.value);
      const lower = it.unit==='lần'||it.unit==='vụ';
      const pct = pctAchieve(t,a,lower);
      const pts = it.weight*pct*100;
      total+=pts;
      const pctEl=document.getElementById(`${prefix}-pct-${i}`);
      const ptsEl=document.getElementById(`${prefix}-pts-${i}`);
      if(pctEl) pctEl.textContent = (aEl.value==='') ? '—' : (pct*100).toFixed(0)+'%';
      if(ptsEl) ptsEl.innerHTML = (aEl.value==='') ? '<b>—</b>' : `<b>${pts.toFixed(1)}</b>`;
    });
    return total;
  }
  // detect area from the open modal title (or fetch from data) – easier: try both templates
  // We must know which template applies. Workaround: find pro section by item count match.
  let proItems=null;
  for(const a of Object.keys(db.kpiTemplates)){
    const tpl=db.kpiTemplates[a];
    if(document.getElementById('pro-t-'+(tpl.length-1))){ proItems=tpl; break; }
  }
  const discItems=db.disciplineTemplate;
  if(!proItems) return;
  const proTotal = calcSection('pro', proItems);
  const discTotal = calcSection('disc', discItems);
  const wP=db.settings.kpiWeightPro, wD=db.settings.kpiWeightDisc;
  const total = proTotal*wP + discTotal*wD;
  const rt = ratingOf(total);
  const set=(id,v)=>{ const x=document.getElementById(id); if(x) x.textContent=v; };
  set('sum-pro', proTotal.toFixed(1));
  set('sum-prow', (proTotal*wP).toFixed(1));
  set('sum-disc', discTotal.toFixed(1));
  set('sum-discw', (discTotal*wD).toFixed(1));
  set('sum-total', total.toFixed(1));
  const rtEl=document.getElementById('sum-rt');
  if(rtEl) rtEl.innerHTML = `<span class="badge ${rt.css}" style="font-size:14px">${rt.label}</span>`;
};
window.saveKPIForm = function(userId, period, evId, area){
  const db=getDB();
  const user=db.users.find(x=>x.id===userId);
  if(!user) return;
  // Fallback nếu area không truyền (tương thích cũ)
  if(!area){
    const asgs = getUserAssignments(user);
    area = asgs[0]?.area || user.area;
  }
  const proItems = db.kpiTemplates[area]||[];
  const discItems = db.disciplineTemplate;
  const grab = (prefix, items)=>{
    const obj={};
    items.forEach((it,i)=>{
      const t=document.getElementById(`${prefix}-t-${i}`)?.value;
      const a=document.getElementById(`${prefix}-a-${i}`)?.value;
      obj[i]={target: t===''?'':Number(t), actual: a===''?'':Number(a)};
    });
    return obj;
  };
  let ev = db.kpiEvals.find(e=>e.id===evId);
  if(!ev){
    ev={id:evId||uid('ev'), userId, area, period, evaluatorId:currentUser().id, createdAt:Date.now()};
    db.kpiEvals.push(ev);
  }
  // Đảm bảo area được set chính xác
  ev.area = area;
  ev.pro = grab('pro', proItems);
  ev.disc = grab('disc', discItems);
  ev.note = document.getElementById('kpi-note')?.value || '';
  ev.updatedAt = Date.now();
  saveDB(db); closeModal(); render(); toast('Đã lưu KPI cho mảng: '+getArea(area).name);
};

      ${u.role==='admin'?`<button class="btn warn" onclick="emailAllEmployees()">📧 Gửi email cho NV</button>`:''}
    </div>
    <div id="report-preview"></div>
  `;
  previewReport();
}

function filterUsers(){
  const db=getDB();
  const co=document.getElementById('r-company')?.value;
  const ar=document.getElementById('r-area')?.value;
  let list = db.users.filter(x=>x.role!=='admin');
  const me=currentUser();
  if(me.role==='manager') list=list.filter(x=>x.companyId===me.companyId);
  if(co) list=list.filter(x=>x.companyId===co);
  if(ar) list=list.filter(x=>x.area===ar);
  return list;
}

window.previewReport = function(){
  const db=getDB();
  const period=document.getElementById('r-period').value;
  const kind=document.getElementById('r-kind').value;
  const list=filterUsers();
  const me=currentUser();
  const isAdmin = me.role==='admin';
  const box=document.getElementById('report-preview');
  if(kind==='month'){
    box.innerHTML=`
      <div class="card">
        <h3>Bảng lương tháng · ${fmtPeriod(period)} · ${list.length} nhân sự</h3>
        <div class="warn-text"><b>Công thức:</b> TỔNG LƯƠNG = Lương cứng cơ bản + Hỗ trợ + Σ Thưởng KPI từng mảng (đa nhiệm = nhiều thưởng KPI cộng dồn). 💡 <i>Click vào dòng nhân viên để xem bảng tính chi tiết lương tháng đó.</i></div>
        <div class="tbl-wrap"><table>
          <thead><tr>
            <th>Mã NV</th><th>Họ tên</th><th>Công ty</th><th>Các mảng</th><th>Chức danh</th>
            <th>Điểm KPI từng mảng</th><th>TB</th>
            ${isAdmin?'<th>Lương cứng</th><th>Hỗ trợ</th><th>Σ KPI</th><th>TỔNG</th>':''}
            <th></th>
          </tr></thead>
          <tbody>${list.map(e=>{
            const s = computeSalaryMulti(e, period);
            const asgs=getUserAssignments(e);
            const areasH = asgs.map(a=>{ const ar=getArea(a.area); return ar?`<span class="badge area-${ar.id}" style="font-size:10px">${ar.short}</span>`:''; }).join(' ');
            const scoresH = s.bonuses.map(b=>{
              if(!b.hasEval) return `<span class="muted" style="font-size:11px">${(getArea(b.area)||{}).short}:—</span>`;
              return `<span class="badge ${b.rating.css}" style="font-size:11px">${(getArea(b.area)||{}).short}:${b.kpiScore.toFixed(0)}</span>`;
            }).join(' ');
            return `<tr class="clickable" onclick="showSalaryDetail('${e.id}','${period}')" title="Click để xem chi tiết bảng tính lương">
              <td>${escapeHtml(e.code||e.username)}</td>
              <td><b>${escapeHtml(e.name)}</b>${asgs.length>1?` <span class="muted" style="font-size:10px">(×${asgs.length})</span>`:''}</td>
              <td><span class="badge co">${getCompany(e.companyId).code}</span></td>
              <td>${areasH||'—'}</td>
              <td>${escapeHtml(e.position||'')}</td>
              <td>${scoresH||'—'}</td>
              <td>${s.avgKpiScore?`<b>${s.avgKpiScore.toFixed(1)}</b>`:'—'}</td>
              ${isAdmin?`<td class="right">${fmtVND(s.base)}</td>
                <td class="right">${fmtVND(s.allowance)}</td>
                <td class="right">${fmtVND(Math.round(s.totalKpiActual))}</td>
                <td class="right"><b style="color:#1e3a8a">${fmtVND(Math.round(s.total))}</b></td>`:''}
              <td><button class="btn sm" onclick="event.stopPropagation();showSalaryDetail('${e.id}','${period}')">📋 Chi tiết</button></td>
            </tr>`;
          }).join('') || '<tr><td colspan="12" class="empty">Không có dữ liệu</td></tr>'}</tbody>
        </table></div>
      </div>
    `;
  }else{
    // Year report
    const y = period.split('-')[0];
    box.innerHTML=`
      <div class="card">
        <h3>Tổng hợp KPI năm ${y} · ${list.length} nhân sự</h3>
        <div class="tbl-wrap"><table>
          <thead><tr>
            <th>Mã NV</th><th>Họ tên</th><th>Công ty</th>
            ${Array.from({length:12},(_,i)=>`<th>T${i+1}</th>`).join('')}
            <th>TB năm</th><th>Xếp loại năm</th>
          </tr></thead>
          <tbody>${list.map(e=>{
            const months=[]; let sum=0, cnt=0;
            for(let m=1;m<=12;m++){
              const p=`${y}-${String(m).padStart(2,'0')}`;
              // Trung bình KPI tháng đó qua các mảng đảm nhiệm
              const evs = db.kpiEvals.filter(x=>x.userId===e.id && x.period===p);
              if(evs.length){
                let ssum=0; evs.forEach(ev=>{ ssum+=computeFullKPI(ev).total; });
                const avgM = ssum/evs.length;
                months.push(avgM); sum+=avgM; cnt++;
              } else months.push(null);
            }
            const avg = cnt?sum/cnt:0;
            const rt = ratingOf(avg);
            return `<tr>
              <td>${escapeHtml(e.code||e.username)}</td>
              <td><b>${escapeHtml(e.name)}</b></td>
              <td><span class="badge co">${getCompany(e.companyId).code}</span></td>
              ${months.map(m=>`<td class="center">${m!==null?m.toFixed(0):'—'}</td>`).join('')}
              <td class="center"><b>${cnt?avg.toFixed(1):'—'}</b></td>
              <td>${cnt?`<span class="badge ${rt.css}">${rt.label}</span>`:'—'}</td>
            </tr>`;
          }).join('') || '<tr><td colspan="16" class="empty">Không có dữ liệu</td></tr>'}</tbody>
        </table></div>
      </div>
    `;
  }
};

window.showSalaryDetail = function(userId, period){

  // Bảng KPI chi tiết theo từng mảng
  const kpiBlocksHtml = asgs.length ? asgs.map((asg,asgIdx)=>{
    const ar=getArea(asg.area);
    const ev = db.kpiEvals.find(e=>e.userId===u.id && e.period===period && e.area===asg.area);

      return `<div class="card" style="border-left:4px solid #f59e0b">

    </div>`;
  }).join('') : '<div class="empty">Nhân viên chưa được gán mảng nào</div>';

  // Tổng hợp cuối

    const ar=getArea(b.area);
    return `<tr><td>+ Thưởng KPI mảng <b>${escapeHtml(ar?ar.name:b.area)}</b></td>

  openModal({

/* Xuất Excel bảng tính lương 1 NV / tháng */
window.exportSalaryDetailExcel = function(userId, period){
  const db=getDB();
  const u=db.users.find(x=>x.id===userId); if(!u) return;
  const s = computeSalaryMulti(u, period);
  const asgs = getUserAssignments(u);
  const wb = XLSX.utils.book_new();
  const rows = [
    [`BẢNG TÍNH CHI TIẾT LƯƠNG — ${u.name}`],
    ['Mã NV', u.code||u.username],
    ['Công ty', getCompany(u.companyId).name],
    ['Chức danh', u.position||''],
    ['Tháng tính', fmtPeriod(period)],
    ['Số mảng đảm nhiệm', asgs.length],
    []
  ];
  asgs.forEach((asg,asgIdx)=>{
    const ar=getArea(asg.area);
    const ev = db.kpiEvals.find(e=>e.userId===u.id && e.period===period && e.area===asg.area);
    const bonus = s.bonuses[asgIdx];
    rows.push([`══════ MẢNG ${asgIdx+1}: ${ar?ar.name:asg.area} ══════`]);
    rows.push(['Bậc lương', asg.salaryRankCode||'(chưa gán)']);
    rows.push(['Lương cơ sở KPI', asg.kpiBase||0]);
    rows.push(['% KPI', ((asg.kpiPct||0)*100).toFixed(0)+'%']);
    rows.push(['Thưởng KPI tối đa', bonus?.kpiMax||0]);
    if(ev){
      const f = computeFullKPI(ev);
      rows.push([]);
      rows.push(['—— KPI CHUYÊN MÔN ——']);
      rows.push(['#','Chỉ tiêu','ĐVT','Trọng số','Mục tiêu','Thực tế','% Đạt','Điểm']);
      f.pro.detail.forEach((d,i)=>rows.push([i+1, d.name, d.unit, d.weight, d.target, d.actual, Math.round(d.pct*100)+'%', Math.round(d.points*100)/100]));
      rows.push(['','','','','','','Tổng CM', Math.round(f.pro.total*100)/100]);
      rows.push(['—— KPI Ý THỨC ——']);
      rows.push(['#','Tiêu chí','ĐVT','Trọng số','Mục tiêu','Thực tế','% Đạt','Điểm']);
      f.disc.detail.forEach((d,i)=>rows.push([i+1, d.name, d.unit, d.weight, d.target, d.actual, Math.round(d.pct*100)+'%', Math.round(d.points*100)/100]));
      rows.push(['','','','','','','Tổng YT', Math.round(f.disc.total*100)/100]);
      rows.push(['TỔNG KPI mảng', '','','','','','', Math.round(f.total*100)/100]);
      rows.push(['Xếp loại', f.rating.label]);
      rows.push(['Hệ số nhân', f.rating.coef]);
      rows.push(['Thưởng KPI thực nhận mảng này', Math.round(bonus?.kpiActual||0)]);
    } else {
      rows.push(['(Chưa chấm KPI mảng này → thưởng = 0)']);
    }
    rows.push([]);
  });
  rows.push(['═══ TỔNG HỢP LƯƠNG ═══']);
  rows.push(['1. Lương cứng cơ bản', s.base]);
  rows.push(['2. Hỗ trợ / Phụ cấp', s.allowance]);
  s.bonuses.forEach(b=>{
    const ar=getArea(b.area);
    rows.push([`3. Thưởng KPI mảng ${ar?ar.name:b.area}`, Math.round(b.kpiActual)]);
  });
  rows.push(['Σ Thưởng KPI', Math.round(s.totalKpiActual)]);
  rows.push(['TỔNG LƯƠNG THÁNG', Math.round(s.total)]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Bảng tính lương');
  XLSX.writeFile(wb, `BangLuongChiTiet_${u.code||u.username}_${period}.xlsx`);
  toast('Đã xuất Excel bảng tính chi tiết');
};

        const ar=getArea(asg.area);
        const ev = db.kpiEvals.find(x=>x.userId===e.id && x.period===period && x.area===asg.area);
        rows.push([`══════ MẢNG #${asgIdx+1}: ${ar?ar.name:asg.area} ══════`]);
        rows.push(['Bậc lương', asg.salaryRankCode||'']);
        rows.push(['Lương cơ sở KPI', asg.kpiBase]);
        rows.push(['% KPI', (Number(asg.kpiPct)*100).toFixed(0)+'%']);
        rows.push([]);
        if(ev){
          const f=computeFullKPI(ev);
          rows.push(['—— KPI CHUYÊN MÔN ——']);
          rows.push(['#','Chỉ tiêu','ĐVT','Trọng số','Mục tiêu','Thực tế','% Đạt','Điểm']);
          f.pro.detail.forEach((d,i)=>rows.push([i+1, d.name, d.unit, d.weight, d.target, d.actual, Math.round(d.pct*100)+'%', Math.round(d.points*10)/10]));
          rows.push(['','','','','','','Tổng CM', Math.round(f.pro.total*10)/10]);
          rows.push([],['—— KPI Ý THỨC ——']);
          rows.push(['#','Tiêu chí','ĐVT','Trọng số','Mục tiêu','Thực tế','% Đạt','Điểm']);
          f.disc.detail.forEach((d,i)=>rows.push([i+1, d.name, d.unit, d.weight, d.target, d.actual, Math.round(d.pct*100)+'%', Math.round(d.points*10)/10]));
          rows.push(['','','','','','','Tổng YT', Math.round(f.disc.total*10)/10]);
          rows.push([]);
          rows.push(['TỔNG KPI mảng này', '','','','','','', Math.round(f.total*10)/10]);
          rows.push(['Xếp loại', f.rating.label]);
          rows.push(['Hệ số nhân KPI', f.rating.coef]);
        }else{
          rows.push(['(Chưa chấm KPI cho mảng này)']);
        }
        const bonus = s.bonuses[asgIdx];
        rows.push(['Thưởng KPI tối đa mảng này', bonus?bonus.kpiMax:0]);
        rows.push(['Thưởng KPI thực nhận mảng này', bonus?Math.round(bonus.kpiActual):0]);
        rows.push([]);
      });
      // Tổng hợp lương
      rows.push(['══════ TỔNG HỢP LƯƠNG ══════']);
      rows.push(['Lương cứng cơ bản', s.base]);
      rows.push(['Hỗ trợ / Phụ cấp', s.allowance]);
      s.bonuses.forEach((b,i)=>{
        const ar=getArea(b.area);
        rows.push([`Thưởng KPI mảng "${ar?ar.name:b.area}"`, Math.round(b.kpiActual)]);
      });
      rows.push(['Σ Thưởng KPI', Math.round(s.totalKpiActual)]);
      rows.push(['TỔNG LƯƠNG (= cứng + hỗ trợ + Σ thưởng KPI)', Math.round(s.total)]);

      const sheetName = (e.code||e.username).slice(0,28);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sheetName);
    });
    const fileName=`BangLuong_${period}.xlsx`;
    XLSX.writeFile(wb, fileName);
    toast('Đã xuất: '+fileName);
  }else{
    const y = period.split('-')[0];
    const rows=[['TỔNG HỢP KPI NĂM '+y],[]];
    rows.push(['STT','Mã NV','Họ tên','Công ty', ...Array.from({length:12},(_,i)=>`T${i+1}`), 'TB năm','Xếp loại năm']);
    list.forEach((e,idx)=>{
      const months=[]; let sum=0, cnt=0;
      for(let m=1;m<=12;m++){
        const p=`${y}-${String(m).padStart(2,'0')}`;
        const ev=db.kpiEvals.find(x=>x.userId===e.id && x.period===p);
        if(ev){ const f=computeFullKPI(ev); months.push(Math.round(f.total*10)/10); sum+=f.total; cnt++; }
        else months.push('');
      }
      const avg = cnt?sum/cnt:0; const rt=ratingOf(avg);
      rows.push([idx+1, e.code||e.username, e.name, getCompany(e.companyId).code, ...months, cnt?Math.round(avg*10)/10:'', cnt?rt.label:'']);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), `Năm ${y}`);
    const fn=`KPI_Nam_${y}.xlsx`;
    XLSX.writeFile(wb, fn);
    toast('Đã xuất: '+fn);
  }
};

function emailJSInit(){
  const db=getDB();
  const k=db.settings.emailjs;
  if(!k.publicKey) return false;
  try{ emailjs.init({publicKey:k.publicKey}); return true; }catch(e){ return false; }
}
async function sendEmail(toEmail, subject, body, attachmentBase64, attachmentName){
  const db=getDB();
  const k=db.settings.emailjs;
  if(!k.publicKey||!k.serviceId||!k.templateId) throw new Error('EmailJS chưa được cấu hình');
  if(!emailJSInit()) throw new Error('EmailJS init thất bại');
  const params={
    to_email: toEmail,
    to_name: toEmail.split('@')[0],
    subject, message: body,
    admin_email: db.settings.adminEmail||'',
    attachment: attachmentBase64||'',
    attachment_name: attachmentName||''
  };
  return emailjs.send(k.serviceId, k.templateId, params);
}

window.emailAllEmployees = async function(){

      });
      rows.push([]);
      rows.push(['Σ Thưởng KPI', Math.round(s.totalKpiActual)]);
      rows.push(['TỔNG LƯƠNG', Math.round(s.total)]);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Bảng lương');

      const subj = `Bảng lương & KPI tháng ${fmtPeriod(period)} - ${e.name}`;
      const bonusLines = s.bonuses.map(b=>{
        const ar=getArea(b.area);
        return `  • ${ar?ar.name:b.area}: KPI ${b.hasEval?b.kpiScore.toFixed(1):'—'} (${b.rating?b.rating.label:'—'}) → thưởng ${fmtVND(Math.round(b.kpiActual))}`;
      }).join('\n');
      const body = `Kính gửi ${e.name},\n\nBảng lương tháng ${fmtPeriod(period)}:\n• Lương cứng cơ bản: ${fmtVND(s.base)}\n• Hỗ trợ: ${fmtVND(s.allowance)}\n• Thưởng KPI từng mảng (đa nhiệm):\n${bonusLines||'  (không có)'}\n• Σ Thưởng KPI: ${fmtVND(Math.round(s.totalKpiActual))}\n• TỔNG LƯƠNG: ${fmtVND(Math.round(s.total))}\n\nVui lòng xem file đính kèm để biết chi tiết.\n\nTrân trọng,\nPhòng Hành chính - Nhân sự`;
      await sendEmail(e.email, subj, body, b64, `Luong_${e.code||e.username}_${period}.xlsx`);

    }catch(err){ fail++; console.error(err); }
  }

};

window.manualBackupDownload = function(){
  const db=getDB();
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download=`HRM_Backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url);
  db.settings.lastBackup=Date.now(); saveDB(db);
  toast('Đã tạo file sao lưu');
  render();
};

window.restoreFromFile = function(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      if(!obj.users||!obj.settings) throw new Error('File không hợp lệ');
      if(!confirm(`Phục hồi dữ liệu từ ${f.name}? Mọi dữ liệu hiện tại sẽ bị thay thế.`)) return;
      saveDB(obj); toast('Đã phục hồi'); render();
    }catch(e){ toast('Lỗi: '+e.message,'error'); }
  };
  r.readAsText(f);
};

  // Dừng realtime listener trước để tránh Firebase kéo dữ liệu cũ xuống lại ngay sau khi xóa

window.doImportExcel = function(){
  const f=document.getElementById('imp-file').files[0];
  const area=document.getElementById('imp-area').value;
  if(!f){ toast('Chọn file','error'); return; }
  const r=new FileReader();
  r.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const db=getDB();
      // Tìm sheet "Cấu hình"
      const cfgSheetName = wb.SheetNames.find(n=>n.includes('Cấu hình')||n.toLowerCase().includes('cau hinh'));
      if(cfgSheetName){
        const ws=wb.Sheets[cfgSheetName];
        const aoa = XLSX.utils.sheet_to_json(ws,{header:1});
        const ranks=[];
        aoa.forEach(row=>{
          // Tìm dòng có Bậc dạng B4, B5, B6 hoặc TK-/TM-
          for(let i=0;i<row.length;i++){
            const c = String(row[i]||'').trim();
            if(/^(B\d|TK-\d|TM-\d)/.test(c)){
              const code=c;
              const name=String(row[i+1]||'').trim();
              const min=Number(row[i+2])||0;
              const max=Number(row[i+3])||0;
              const applied=Number(row[i+4])||0;
              const kpiPct=Number(row[i+5])||0;
              const allowance=Number(row[i+7])||0;
              if(name) ranks.push({code,name,min,max,applied,kpiPct,allowance});
              break;
            }
          }
        });
        if(ranks.length){
          db.salaryRanks[area]=ranks;
          toast(`Đã nạp ${ranks.length} bậc lương cho mảng ${getArea(area).name}`);
        }
      }
      saveDB(db); closeModal(); render();
    }catch(err){ toast('Lỗi đọc file: '+err.message,'error'); }
  };
  r.readAsArrayBuffer(f);
};

function autoBackupCheck(){
  const db=getDB();
  if(!db.settings.lastBackup) return false;
  const elapsed = Date.now() - db.settings.lastBackup;
  const limit = db.settings.backupIntervalDays * 86400000;
  if(elapsed > limit){
    // Tự động sao lưu nếu đã quá hạn
    if(db.settings.emailjs.publicKey){
      // Gửi mail âm thầm
      manualBackupEmail().catch(()=>{});
    }else{
      // Tạo file local
      manualBackupDownload();
    }
    return true;
  }
  return false;
}

function viewMyTasks(main, u){
  const db=getDB();
  const tasks=db.tasks.filter(t=>t.assigneeId===u.id).sort((a,b)=>(a.dueDate||0)-(b.dueDate||0));
  // Cảnh báo deadline sắp hết hạn / quá hạn / chậm tiến độ
  const soonTasks = tasks.filter(t=>deadlineStatus(t)==='soon');
  const overdueTasks = tasks.filter(t=>deadlineStatus(t)==='overdue');
  const behindTasks = tasks.filter(taskIsBehind);
  let warnHtml = '';
  if(overdueTasks.length){
    warnHtml += `<div class="card" style="background:#fee2e2;border-left:5px solid #dc2626">
      <h3 style="color:#991b1b;border:none;padding:0;margin-bottom:6px">🚨 ${overdueTasks.length} công việc QUÁ HẠN — cần hoàn thành gấp!</h3>
      <ul style="margin:0;padding-left:20px;font-size:13px">
        ${overdueTasks.map(t=>`<li><b>${escapeHtml(t.title)}</b> ${t.area?'('+getArea(t.area).name+')':''} — hết hạn <b>${fmtDate(t.dueDate)}</b></li>`).join('')}
      </ul>
    </div>`;
  }
  if(behindTasks.length){
    warnHtml += `<div class="card" style="background:#fee2e2;border-left:5px solid #dc2626">
      <h3 style="color:#991b1b;border:none;padding:0;margin-bottom:6px">⚠ ${behindTasks.length} công việc bị CHẬM TIẾN ĐỘ — vui lòng đẩy nhanh!</h3>
      <ul style="margin:0;padding-left:20px;font-size:13px">
        ${behindTasks.map(t=>{
          const exp=taskExpectedProgress(t); const act=Number(t.progress)||0;
          return `<li><b>${escapeHtml(t.title)}</b> — tiến độ thực tế <b>${act.toFixed(0)}%</b> / dự kiến <b>${exp?exp.toFixed(0):'—'}%</b></li>`;
        }).join('')}
      </ul>
    </div>`;
  }
  if(soonTasks.length){
    warnHtml += `<div class="card" style="background:#fef3c7;border-left:5px solid #f59e0b">
      <h3 style="color:#92400e;border:none;padding:0;margin-bottom:6px">⏰ ${soonTasks.length} công việc sắp hết hạn (≤ 3 ngày)</h3>
      <ul style="margin:0;padding-left:20px;font-size:13px">
        ${soonTasks.map(t=>{
          const days = Math.ceil((t.dueDate - Date.now())/86400000);
          return `<li><b>${escapeHtml(t.title)}</b> ${t.area?'('+getArea(t.area).name+')':''} — còn <b>${days} ngày</b> (hạn ${fmtDate(t.dueDate)})</li>`;
        }).join('')}
      </ul>
    </div>`;
  }

  main.innerHTML=`
    <div class="page-head"><h1>📋 Theo dõi công việc của tôi</h1></div>
    <div class="help-text">💡 Bạn có thể cập nhật <b>% tiến độ</b> trực tiếp ở cột "Tiến độ" — kéo thanh trượt hoặc nhập số rồi bấm <b>💾</b> Lưu. Khi đạt 100%, công việc tự chuyển sang "Hoàn thành".</div>
    ${warnHtml}
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th>Nhiệm vụ</th>
        <th>Mảng / Dự án</th>
        <th>Ngày giao</th>
        <th>Hạn hoàn thành</th>
        <th>Trạng thái</th>
        <th style="min-width:220px">Tiến độ %</th>
        <th>Ghi chú</th>
      </tr></thead>
      <tbody>${tasks.map(t=>{
        const stat = deadlineStatus(t);
        const behind = taskIsBehind(t);
        let dueStyle='', dueExtra='';
        if(stat==='overdue'){ dueStyle='color:#dc2626;font-weight:700;'; dueExtra='<span class="badge kpi-kem" style="margin-left:6px;font-size:10px">QUÁ HẠN</span>'; }
        else if(stat==='soon'){ dueStyle='color:#b45309;font-weight:600;'; dueExtra='<span class="badge kpi-dat" style="margin-left:6px;font-size:10px">SẮP HẾT HẠN</span>'; }
        if(behind) dueExtra += '<span class="badge kpi-kem" style="margin-left:6px;font-size:10px">⚠ CHẬM</span>';
        const prog = Math.max(0, Math.min(100, Number(t.progress)||0));
        const proj = t.projectId ? db.contracts.find(c=>c.id===t.projectId) : null;

          <td>${areaLabel}</td>

          <td style="${dueStyle}">${fmtDate(t.dueDate)}${dueExtra}</td>
          <td>${taskStatusBadge(t.status)}</td>
          <td>
            <div style="display:flex;gap:6px;align-items:center">
              <input type="range" min="0" max="100" value="${prog}" id="mt-prog-${t.id}" oninput="document.getElementById('mt-prog-val-${t.id}').textContent=this.value+'%'" style="flex:1;min-width:80px">
              <span id="mt-prog-val-${t.id}" style="font-weight:600;width:42px;text-align:right;font-size:12px">${prog}%</span>
              <button class="btn sm success" style="padding:3px 8px" onclick="saveMyTaskProgress('${t.id}')" title="Lưu tiến độ">💾</button>

        </tr>`;
      }).join('') || '<tr><td colspan="7" class="empty">Không có nhiệm vụ</td></tr>'}</tbody>
    </table></div>
  `;
}
window.saveMyTaskProgress = function(taskId){
  const db=getDB();
  const t = db.tasks.find(x=>x.id===taskId); if(!t) return;
  const inp = document.getElementById('mt-prog-'+taskId);
  if(!inp) return;
  const val = Math.max(0, Math.min(100, Number(inp.value)||0));
  // NV ghi vào field "pendingProgress" — tiến độ chính thức chỉ đổi sau khi trưởng nhóm xác nhận
  t.pendingProgress = val;
  t.pendingAt = Date.now();
  t.pendingBy = currentUser()?.id;
  saveDB(db);
  toast(`Đã gửi cập nhật tiến độ ${val}% — chờ cấp quản lý xác nhận`,'info');
  render();
};
/* Trưởng nhóm xác nhận tiến độ */
window.confirmTaskProgress = function(taskId){
  const db=getDB();
  const t = db.tasks.find(x=>x.id===taskId); if(!t) return;
  if(t.pendingProgress==null){ toast('Không có cập nhật chờ xác nhận','warn'); return; }
  t.progress = t.pendingProgress;
  if(t.progress>=100) t.status='done';
  else if(t.status==='done' && t.progress<100) t.status='inprogress';
  else if(t.status==='new' && t.progress>0) t.status='inprogress';
  t.pendingProgress = null;
  t.confirmedAt = Date.now();
  t.confirmedBy = currentUser()?.id;
  saveDB(db);
  renderPopupBody?.();
  toast(`Đã xác nhận tiến độ ${t.progress}%`);
};
window.rejectTaskProgress = function(taskId){
  const db=getDB();
  const t = db.tasks.find(x=>x.id===taskId); if(!t) return;
  t.pendingProgress = null;
  saveDB(db);
  renderPopupBody?.();
  toast('Đã từ chối cập nhật tiến độ','warn');
};

function viewMyKPI(main, u){
  const db=getDB();
  const period=thisPeriod();
  const asgs = getUserAssignments(u);
  // Lấy tất cả KPI của tôi trong tháng này (1 bản ghi/mảng)
  const myEvs = db.kpiEvals.filter(e=>e.userId===u.id && e.period===period);

  let blocksHtml='';
  if(asgs.length){
    blocksHtml = asgs.map(asg=>{
      const ev = myEvs.find(e=>e.area===asg.area);
      const ar=getArea(asg.area);
      if(!ev) return `<div class="card"><h3>${ar?ar.name:asg.area}</h3><div class="muted">Chưa có đánh giá KPI tháng này cho mảng "${ar?ar.name:asg.area}"</div></div>`;
      return `<div class="card"><h3>📌 ${ar?ar.name:asg.area}</h3>${renderMyKPI(ev, db, true)}</div>`;
    }).join('');
  } else if(myEvs.length){
    // Trường hợp chưa migrate: hiển thị các bản ghi đã có
    blocksHtml = myEvs.map(ev=>`<div class="card"><h3>📌 ${getArea(ev.area)?getArea(ev.area).name:ev.area}</h3>${renderMyKPI(ev, db, true)}</div>`).join('');
  } else {
    blocksHtml = '<div class="empty">Chưa có đánh giá KPI tháng này</div>';
  }

  main.innerHTML=`
    <div class="page-head"><h1>🎯 KPI của tôi · ${fmtPeriod(period)}</h1></div>
    <div class="help-text">${asgs.length>1?`Bạn đang đảm nhiệm <b>${asgs.length} mảng</b> — mỗi mảng có 1 bản đánh giá KPI riêng, tổng lương = lương cứng + hỗ trợ + Σ thưởng KPI các mảng.`:'Đánh giá KPI tháng này.'}</div>
    ${blocksHtml}
    <div class="card">
      <h3>Lịch sử KPI 12 tháng gần nhất (trung bình các mảng)</h3>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Tháng</th><th>Số mảng chấm</th><th>TB Điểm CM</th><th>TB Điểm YT</th><th>TB TỔNG</th><th>Xếp loại</th></tr></thead>
        <tbody>${(function(){
          const rows=[]; const now=new Date();
          for(let i=0;i<12;i++){
            const d=new Date(now); d.setMonth(d.getMonth()-i);
            const p=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
            const evs=db.kpiEvals.filter(x=>x.userId===u.id && x.period===p);
            if(evs.length){
              let proSum=0, discSum=0, totSum=0;
              evs.forEach(e=>{ const f=computeFullKPI(e); proSum+=f.pro.total; discSum+=f.disc.total; totSum+=f.total; });
              const cnt=evs.length;
              const avgTot = totSum/cnt;
              const rt = ratingOf(avgTot);
              rows.push(`<tr><td>${fmtPeriod(p)}</td><td class="center">${cnt}</td><td>${(proSum/cnt).toFixed(1)}</td><td>${(discSum/cnt).toFixed(1)}</td><td><b>${avgTot.toFixed(1)}</b></td><td><span class="badge ${rt.css}">${rt.label}</span></td></tr>`);
            }
          }
          return rows.join('') || '<tr><td colspan="6" class="empty">Chưa có lịch sử</td></tr>';
        })()}</tbody>
      </table></div>
    </div>
  `;
}

window.doChangePass = async function(){
  const u=currentUser();
  const oldP=document.getElementById('cp-old').value;
  const newP=document.getElementById('cp-new').value;
  const newP2=document.getElementById('cp-new2').value;
  if(!oldP){ toast('Nhập mật khẩu cũ','error'); return; }
  if(newP.length<4){ toast('Mật khẩu mới phải ≥4 ký tự','error'); return; }
  if(newP!==newP2){ toast('Hai mật khẩu mới không khớp','error'); return; }
  const h=await hashPassword(oldP);
  if(h!==u.passwordHash){ toast('Sai mật khẩu cũ','error'); return; }
  const db=getDB();
  const me=db.users.find(x=>x.id===u.id);
  me.passwordHash=await hashPassword(newP); me.mustChangePass=false;
  saveDB(db); toast('Đã đổi mật khẩu');
};

function pcccDocStatusBadge(v){ const x=PCCC_DOC_STATUS.find(s=>s.v===v)||PCCC_DOC_STATUS[0]; return `<span class="badge ${x.css}">${x.label}</span>`; }
function settlementBadge(v){
  const x=SETTLEMENT_STATUS.find(s=>s.v===v)||SETTLEMENT_STATUS[0];
  return `<span class="badge ${x.css}">${x.label}</span>`;
}
function completionBadge(v){

/* ---------- Tính toán cho 1 HĐ — bao gồm Phụ lục HĐ ---------- */
function contractCalc(c){
  const baseValue = Number(c.value)||0;
  const addenSum = (c.addendums||[]).reduce((s,a)=>s+(Number(a.valueChange)||0), 0);
  const totalExtensionDays = (c.addendums||[]).reduce((s,a)=>s+(Number(a.extensionDays)||0), 0);
  const value = baseValue + addenSum; // Tổng giá trị HĐ thực tế (gốc + phụ lục)
  const paid = Number(c.paidValue)||0;
  const settlement = Number(c.settlementValue)||0;
  const remainingPay = value - paid; // Còn phải thu = Tổng HĐ (gồm phụ lục) − đã thanh toán
  const settledRemaining = (c.settlementStatus==='done' && settlement>0)
    ? (settlement - paid)
    : null;
  return {baseValue, addenSum, totalExtensionDays, value, paid, remainingPay, settlement, settledRemaining};
}

/* ---------- Tính tổng SL đã nhập của 1 vật tư trong HĐ
            CHỈ tính các phiếu nhập đã được trưởng nhóm/admin xác nhận ---------- */
function getImportedQty(contractId, materialId){
  const db=getDB();
  let total=0;
  db.importSlips.filter(s=>s.contractId===contractId && s.confirmed).forEach(s=>{
    (s.items||[]).forEach(it=>{
      if(it.materialId===materialId) total += Number(it.qty)||0;
    });
  });
  return total;
}
/* ---------- Phân quyền: admin/manager/pm có quyền duyệt (toàn cục) ---------- */
function canApprove(){
  const u=currentUser();
  return u && (u.role==='admin' || u.role==='manager' || u.role==='pm');
}
/* Phân quyền theo dự án: được duyệt nếu là admin/manager/pm toàn cục
   HOẶC được gán làm Quản lý dự án (c.projectManagers) cho DA đó */
function canApproveProject(projectId){
  const u=currentUser(); if(!u) return false;
  if(u.role==='admin'||u.role==='manager'||u.role==='pm') return true;
  const db=getDB();
  const c = db.contracts.find(x=>x.id===projectId);
  if(!c) return false;
  return Array.isArray(c.projectManagers) && c.projectManagers.includes(u.id);
}
/* Kiểm tra user có là PM của DA (project-level) */
function isProjectManagerOf(userId, projectId){
  const db=getDB();
  const c = db.contracts.find(x=>x.id===projectId);
  return c && Array.isArray(c.projectManagers) && c.projectManagers.includes(userId);
}
/* Lấy danh sách người có quyền duyệt DA này (để NV chọn "Trình lên QL")
   - Admin / manager / pm toàn cục
   - PM của DA này (c.projectManagers) */
function getProjectApprovers(c){
  const db=getDB();
  const set = new Map();
  db.users.forEach(u=>{
    if(u.role==='admin' || u.role==='manager' || u.role==='pm') set.set(u.id, u);
  });
  (c?.projectManagers||[]).forEach(uid=>{
    const u=db.users.find(x=>x.id===uid); if(u) set.set(u.id, u);
  });
  return Array.from(set.values());
}

/* ---------- Cảnh báo deadline HĐ ---------- */
function contractDeadlineStatus(c){
  if(!c.completeDate) return 'ok';
  if(c.completionStatus==='completed' || c.completionStatus==='cancelled') return 'done';
  const now = Date.now();
  if(c.completeDate < now) return 'overdue';
  const days = Math.ceil((c.completeDate - now)/86400000);
  if(days <= 15) return 'soon'; // HĐ cảnh báo trước 15 ngày
  return 'ok';
}

function ctFilterSuggest(q){
  const box=document.getElementById('ct-suggest'); if(!box) return;

    (c.name||'').toLowerCase().includes(qLow) ||
    (c.code||'').toLowerCase().includes(qLow) ||
