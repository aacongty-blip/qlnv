window.toggleAreaCheckbox = function(areaId){
  const chk = document.getElementById('chk-area-'+areaId);
  const panel = document.getElementById('asg-detail-'+areaId);
  if(!chk||!panel) return;
  panel.style.display = chk.checked ? 'block' : 'none';
};
window.onAsgRankPick = function(areaId){
  const db=getDB();
  const code = document.getElementById('asg-rank-'+areaId).value;
  const r = (db.salaryRanks[areaId]||[]).find(x=>x.code===code);
  if(r){
    document.getElementById('asg-base-'+areaId).value = r.applied;
    document.getElementById('asg-pct-'+areaId).value = r.kpiPct;
  }
};
/* Thu thập assignments từ form checkbox */
function collectAssignmentsFromForm(){
  const out=[];
  WORK_AREAS.forEach(a=>{
    const chk = document.getElementById('chk-area-'+a.id);
    if(!chk||!chk.checked) return;
    out.push({
      area: a.id,
      salaryRankCode: document.getElementById('asg-rank-'+a.id)?.value || '',
      kpiBase: Number(document.getElementById('asg-base-'+a.id)?.value)||0,
      kpiPct: Number(document.getElementById('asg-pct-'+a.id)?.value)||0
    });
  });
  return out;
}

window.saveUserForm = async function(id){
  const db=getDB();
  const v = q=>document.getElementById(q).value.trim();
  const code=v('f-code'), username=v('f-username'), name=v('f-name');
  if(!code||!username||!name){
    document.getElementById('f-err').textContent='Vui lòng nhập đủ Mã NV, Username, Họ tên';
    return;
  }
  // Trùng username (kể cả khi sửa, trừ chính NV đang sửa)
  if(db.users.some(u=>u.username.toLowerCase()===username.toLowerCase() && u.id!==id)){
    document.getElementById('f-err').textContent='Username đã tồn tại'; return;
  }
  // Lấy assignments từ form checkbox (mỗi mảng tối đa 1 lần, đã tự đảm bảo không trùng)
  const rawAsg = collectAssignmentsFromForm();

  let user;
  if(id){ user = db.users.find(u=>u.id===id); }
  else { user = {id:uid('u'), createdAt:Date.now()}; db.users.push(user); }
  user.code=code; user.username=username; user.name=name;
  user.role=v('f-role'); user.companyId=v('f-company');
  user.position=v('f-position'); user.department=v('f-department');
  user.email=v('f-email'); user.phone=v('f-phone'); user.dob=v('f-dob');
  user.cccd=v('f-cccd'); user.mst=v('f-mst'); user.bhxh=v('f-bhxh'); user.address=VNAddr.value('f-addr');
  user.assignments = rawAsg.map(a=>({
    area: a.area,
    salaryRankCode: a.salaryRankCode||'',
    kpiPct: Number(a.kpiPct)||0,
    kpiBase: Number(a.kpiBase)||0
  }));
  // Giữ tương thích: area = mảng đầu tiên
  user.area = user.assignments[0]?.area || '';
  user.salaryRankCode = user.assignments[0]?.salaryRankCode || '';
  user.kpiPct = user.assignments[0]?.kpiPct || 0;
  user.baseSalary = Number(v('f-base'))||0;
  user.allowance = Number(v('f-allow'))||0;
  if(!id){
    const pass = v('f-pass')||'123456';
    user.passwordHash = await hashPassword(pass);
    user.mustChangePass=true;
  }
  saveDB(db);
  closeModal();
  render();
  toast(id?'Đã cập nhật':'Đã thêm nhân sự');
};

window.resetUserPass = async function(id){
  const newPass = prompt('Nhập mật khẩu mới (≥4 ký tự):', '123456');
  if(!newPass || newPass.length<4) return;
  const db=getDB();
  const u=db.users.find(x=>x.id===id); if(!u) return;
  u.passwordHash = await hashPassword(newPass);
  u.mustChangePass=true;
  saveDB(db);
  toast('Đã reset mật khẩu thành: '+newPass, 'info');
};

window.deleteUser = function(id){
  if(!confirm('Xóa nhân sự này? Mọi dữ liệu liên quan (KPI, nhiệm vụ) sẽ bị xóa.')) return;
  const db=getDB();
  db.users=db.users.filter(u=>u.id!==id);
  db.tasks=db.tasks.filter(t=>t.assigneeId!==id);
  db.kpiEvals=db.kpiEvals.filter(e=>e.userId!==id);
  saveDB(db); render();
  toast('Đã xóa');
};

    name:document.getElementById('r-name').value.trim(),
    min:Number(document.getElementById('r-min').value)||0,

window.saveKPIWeights = function(){
  const db=getDB();
  const p = Number(document.getElementById('w-pro').value)/100;
  const d = Number(document.getElementById('w-disc').value)/100;
  if(Math.abs(p+d-1) > 0.01){ toast('Tổng phải = 100%','error'); return; }

  saveDB(db); toast('Đã lưu trọng số KPI');
};
window.saveTiers = function(){

};

/* ============================================================
   TASKS — Theo dõi công việc
   ============================================================ */
/* ============================================================
   Gom tất cả nội dung CHỜ PHÊ DUYỆT của các dự án mà người dùng
   phụ trách (Quản lý / Trưởng phòng / Admin) — hiển thị ở đầu
   mục "Theo dõi công việc". (Yêu cầu 2)
   ============================================================ */
function collectAllPendingApprovals(u){
  const db=getDB();
  const FOUR_HRS = 4*3600*1000;
  const now = Date.now();
  const items = [];
  (db.contracts||[]).forEach(c=>{
    if(!canApproveProject(c.id)) return;
    const projName = escapeHtml(c.name || c.code || '');
    // 1) Tiến độ công việc chờ xác nhận
    (db.tasks||[]).filter(t=>t.projectId===c.id && t.pendingProgress!=null).forEach(t=>{
      const emp=db.users.find(x=>x.id===t.assigneeId);
      const since=t.pendingAt||now;
      items.push({type:'progress', proj:projName, projId:c.id,
        title:`${escapeHtml(t.title)}: ${(t.progress||0).toFixed(0)}% → ${Number(t.pendingProgress).toFixed(0)}%`,
        sub:`👤 ${escapeHtml(emp?.name||'')}`, since, elapsed:now-since, overTime:(now-since)>FOUR_HRS,
        actionConfirm:`confirmTaskProgress('${t.id}');render()`,
        actionReject:`rejectTaskProgress('${t.id}');render()`});
    });
    // [PATCH REQ4] Đề xuất HOÀN THÀNH công việc trong dự án — chờ duyệt
    (db.tasks||[]).filter(t=>t.projectId===c.id && t.pendingComplete).forEach(t=>{
      const emp=db.users.find(x=>x.id===t.assigneeId);
      const since=t.pendingCompleteAt||now;
      items.push({type:'done', proj:projName, projId:c.id,
        title:`✅ Đề xuất HOÀN THÀNH: ${escapeHtml(t.title)}`,
        sub:`👤 ${escapeHtml(emp?.name||'')}`, since, elapsed:now-since, overTime:(now-since)>FOUR_HRS,
        actionConfirm:`confirmTaskComplete('${t.id}');render()`,
        actionReject:`rejectTaskComplete('${t.id}');render()`});
    });
    // 2) Phiếu nhập chờ xác nhận
    (db.importSlips||[]).filter(s=>s.contractId===c.id && !s.confirmed).forEach(s=>{
      const since=s.submittedAt||s.createdAt||now;
      items.push({type:'slip', proj:projName, projId:c.id,
        title:`Phiếu nhập ${escapeHtml(s.slipNo||'')} · ${(s.items||[]).length} dòng · ${fmtVND(s.totalValue||0)}`,
        sub:`👤 ${escapeHtml(s.requesterName||'')} · NCC: ${escapeHtml(s.supplierName||'')}`, since, elapsed:now-since, overTime:(now-since)>FOUR_HRS,
        actionConfirm:`confirmImportSlip('${s.id}','${c.id}');render()`,
        actionView:`viewSlipDetail('${s.id}')`});
    });
    // 3) Hồ sơ kỹ thuật & biên bản chờ xác nhận hoàn thiện + chờ duyệt xóa
    [['doc', c.pcccDocList], ['rec', c.pcccRecList]].forEach(([scope, list])=>{
      (list||[]).forEach(it=>{
        if(it.pendingCompleted && !it.confirmedCompleted){
          const emp=db.users.find(x=>x.id===it.pendingBy);
          const since=it.pendingAt||now;
          items.push({type:scope==='doc'?'doc':'rec', proj:projName, projId:c.id,
            title:`${scope==='doc'?'📐':'📋'} ${escapeHtml(it.name||'')}`,
            sub:`👤 ${escapeHtml(emp?.name||'')} đề nghị duyệt hoàn thiện`, since, elapsed:now-since, overTime:(now-since)>FOUR_HRS,
            actionConfirm:`confirmPcccCompleted('${c.id}','${scope}','${it.id}');render()`});
        }
        if(it.pendingDelete){
          const emp=db.users.find(x=>x.id===it.pendingDeleteBy);
          const since=it.pendingDeleteAt||now;
          items.push({type:'del', proj:projName, projId:c.id,
            title:`🗑 Yêu cầu XÓA: ${escapeHtml(it.name||'(chưa đặt tên)')}`,
            sub:`👤 ${escapeHtml(emp?.name||'')} đề nghị xóa hồ sơ`, since, elapsed:now-since, overTime:(now-since)>FOUR_HRS,
            actionConfirm:`confirmPcccDelete('${c.id}','${scope}','${it.id}');render()`,
            actionReject:`rejectPcccDelete('${c.id}','${scope}','${it.id}');render()`});
        }
      });
    });
  });
  // [PATCH REQ4] Công việc CHUNG (ngoài dự án) — admin / pm / manager duyệt
  (function(){
    const u2 = currentUser(); if(!u2) return;
    if(!(u2.role==='admin' || u2.role==='pm' || u2.role==='manager')) return;
    let gtasks = (db.tasks||[]).filter(t=>!t.projectId);
    // [REQ2] Không lọc theo công ty — công việc chung toàn hệ thống 3 công ty
    gtasks.forEach(t=>{
      const emp=db.users.find(x=>x.id===t.assigneeId);
      if(t.pendingProgress!=null){
        const since=t.pendingAt||now;
        items.push({type:'progress', proj:'Việc chung', projId:'',
          title:`${escapeHtml(t.title)}: ${(t.progress||0).toFixed(0)}% → ${Number(t.pendingProgress).toFixed(0)}%`,
          sub:`👤 ${escapeHtml(emp?.name||'')}`, since, elapsed:now-since, overTime:(now-since)>FOUR_HRS,
          actionConfirm:`confirmTaskProgress('${t.id}');render()`,
          actionReject:`rejectTaskProgress('${t.id}');render()`});
      }
      if(t.pendingComplete){
        const since=t.pendingCompleteAt||now;
        items.push({type:'done', proj:'Việc chung', projId:'',
          title:`✅ Đề xuất HOÀN THÀNH: ${escapeHtml(t.title)}`,
          sub:`👤 ${escapeHtml(emp?.name||'')}`, since, elapsed:now-since, overTime:(now-since)>FOUR_HRS,
          actionConfirm:`confirmTaskComplete('${t.id}');render()`,
          actionReject:`rejectTaskComplete('${t.id}');render()`});
      }
    });
  })();
  // [REQ2] Đề nghị GIA HẠN deadline — trình lên NGƯỜI GIAO VIỆC (createdBy) hoặc admin
  (function(){
    const u2 = currentUser(); if(!u2) return;
    (db.tasks||[]).forEach(t=>{
      if(!(t.extReq && t.extReq.status==='pending')) return;
      // chỉ người giao việc của task này hoặc admin mới thấy & duyệt
      if(!(u2.role==='admin' || t.createdBy===u2.id)) return;
      const emp=db.users.find(x=>x.id===t.assigneeId);
      const c = t.projectId ? db.contracts.find(x=>x.id===t.projectId) : null;
      const projName = c ? escapeHtml(c.name || c.code || '') : 'Việc chung';
      const since=t.extReq.requestedAt||now;
      items.push({type:'ext', proj:projName, projId:t.projectId||'',
        title:`⏰ Xin GIA HẠN: ${escapeHtml(t.title)} → ${fmtDate(t.extReq.newDue)}`,
        sub:`👤 ${escapeHtml(emp?.name||'')} · Lý do: ${escapeHtml(t.extReq.reason||'')}`,

        actionConfirm:`approveExtensionRequest('${t.id}')`,
        actionReject:`rejectExtensionRequest('${t.id}')`});
    });
  })();
  return items;
}

async function toggleTaskDone(id, checked){
  const db=getDB();
  const t=db.tasks.find(x=>x.id===id);
  if(!t) return;
  const me=currentUser();
  const isEmp = me && me.role==='employee';
  if(checked){
    if(isEmp){
      // [PATCH REQ4] NV chỉ ĐỀ XUẤT hoàn thành — chờ quản lý/trưởng nhóm/QLDA phê duyệt
      t.pendingComplete=true;
      t.pendingCompleteAt=Date.now();
      t.pendingCompleteBy=me.id;
      await saveDB(db);
      toast('Đã gửi ĐỀ XUẤT HOÀN THÀNH — chờ cấp quản lý phê duyệt','info');
    }else{
      t.status='done';
      t.progress=100;
      t.confirmedAt=Date.now();
      t.confirmedBy=me.id;
      t.pendingComplete=false;
      await saveDB(db);
      toast('Đã đánh dấu hoàn thành');
    }
  }else{
    if(isEmp && t.pendingComplete){
      t.pendingComplete=false; t.pendingCompleteBy=null;
      await saveDB(db);
      toast('Đã hủy đề xuất hoàn thành','warn');
    }else{
      t.status='inprogress';
      if(t.progress>=100) t.progress=80;
      t.pendingComplete=false;
      await saveDB(db);
      toast('Đã chuyển về Đang thực hiện');
    }
  }
  if(document.getElementById('tasks-table-wrap')) renderTasksTable();
  if(document.getElementById('my-tasks-table-wrap')) renderMyTasksTable();
}

/* ---------- Trạng thái deadline: 'done' | 'overdue' | 'due' | 'soon' | 'ok' ----------
   [PATCH] Tính theo NGÀY LỊCH: còn 0 ngày = 'due' (HẾT HẠN hôm nay);
   quá hạn từ 1 ngày trở lên = 'overdue' (QUÁ HẠN). */
function deadlineStatus(t){
  if(!t.dueDate) return 'ok';
  if(t.status==='done') return 'done';
  const d0 = new Date(); d0.setHours(0,0,0,0);
  const dd = new Date(t.dueDate); dd.setHours(0,0,0,0);
  const days = Math.round((dd - d0) / 86400000);
  if(days < 0) return 'overdue';
  if(days === 0) return 'due';
  if(days <= 3) return 'soon';
  return 'ok';
}

function autoKpiScores(user, period){
  const db=getDB();
  const p = period || thisPeriod();
  const parts = p.split('-').map(Number);
  const yy=parts[0], mm=parts[1];
  const mStart = new Date(yy, mm-1, 1).getTime();
  const mEnd   = new Date(yy, mm, 0, 23,59,59).getTime();
  const tasks = (db.tasks||[]).filter(t=>{
    if(t.assigneeId!==user.id) return false;
    const due=t.dueDate||0, done=t.confirmedAt||0;
    return (due>=mStart && due<=mEnd) || (done>=mStart && done<=mEnd) || (due && due<=mEnd && t.status!=='done');
  });
  const areaKey = t => t.area ? t.area : (t.projectId ? 'project' : null);
  const groups = {design:[], project:[], commercial:[]};
  tasks.forEach(t=>{ const k=areaKey(t); if(groups[k]) groups[k].push(t); });
  const taskPoints = t=>{
    if(t.status==='done'){
      const onTime = !t.dueDate || ((t.confirmedAt||t.dueDate) <= (t.dueDate + 86400000));
      return onTime ? 100 : 70;
    }
    const overdue = t.dueDate && (t.dueDate < Date.now());
    return overdue ? 0 : 50;
  };
  const scoreArea = arr => arr.length ? Math.round(arr.reduce((s,t)=>s+taskPoints(t),0)/arr.length) : null;
  let onTime=0, lateMiss=0;
  tasks.forEach(t=>{
    if(t.status==='done'){
      const ot = !t.dueDate || ((t.confirmedAt||t.dueDate) <= (t.dueDate + 86400000));
      ot ? onTime++ : lateMiss++;
    } else if(t.dueDate && t.dueDate < Date.now()) lateMiss++;
  });
  const rated = onTime + lateMiss;
  const discipline = rated ? Math.round(onTime/rated*100) : null;
  return {
    design: scoreArea(groups.design),
    project: scoreArea(groups.project),
    commercial: scoreArea(groups.commercial),
    discipline,
    counts:{design:groups.design.length, project:groups.project.length, commercial:groups.commercial.length, total:tasks.length}
  };
}

  return `<div class="card" style="border-left:5px solid #6366f1;background:#eef2ff">
    <h3 style="margin:0 0 4px 0;color:#3730a3">🤖 KPI tự động từ công việc · ${fmtPeriod(period)}</h3>

function renderAutoKpiSummary(emps, period){
  if(!emps || !emps.length) return '';
  // Hiển thị TOÀN BỘ nhân viên của cả 3 công ty (kể cả NV chưa có công việc trong kỳ).
  // Sắp xếp theo công ty rồi theo tên cho dễ quan sát.
  const list = emps.slice().sort((a,b)=>{

/* ============================================================
   [YC-QL] KPI TRƯỞNG PHÒNG / QUẢN LÝ — TRÁCH NHIỆM LIÊN ĐỚI
   ------------------------------------------------------------
   Nguyên tắc: lỗi của nhân viên trong các dự án/công việc mà người
   quản lý phụ trách (quá hạn, hoàn thành trễ) được tính là lỗi
   GIÁM SÁT của chính người quản lý đó (buông lỏng quản lý).
   Phạm vi trách nhiệm của 1 quản lý/trưởng phòng gồm:
   - Công việc thuộc DỰ ÁN mà họ được gán làm Quản lý dự án (projectManagers)
   - Công việc do chính họ GIAO cho nhân viên khác (createdBy)
   Công thức: Điểm = 60×(tỷ lệ hoàn thành) + 40×(tỷ lệ đúng hạn) − 3đ/lỗi quá hạn − 1đ/lỗi trễ (chặn 0–100)
   ============================================================ */
function computeLeaderKpi(leader, period){
  const db=getDB();
  const p = period||thisPeriod();
  const parts=p.split('-').map(Number);
  const yy=parts[0], mm=parts[1];
  const mStart=new Date(yy,mm-1,1).getTime();
  const mEnd  =new Date(yy,mm,0,23,59,59).getTime();
  const now=Date.now();
  // Dự án leader phụ trách
  const projIds = new Set((db.contracts||[]).filter(c=>Array.isArray(c.projectManagers)&&c.projectManagers.includes(leader.id)).map(c=>c.id));
  const inScope = t=>{
    if(t.assigneeId===leader.id) return false; // việc của chính leader không tính vào trách nhiệm giám sát
    return (t.projectId && projIds.has(t.projectId)) || t.createdBy===leader.id;
  };
  let total=0, done=0, onTime=0, overdue=0, lateDone=0;
  const errList=[];
  (db.tasks||[]).forEach(t=>{
    if(!inScope(t)) return;
    const due=t.dueDate||0, fin=t.confirmedAt||t.completedAt||0;
    const inPeriod=(due>=mStart&&due<=mEnd)||(fin>=mStart&&fin<=mEnd)||(due&&due<=mEnd&&t.status!=='done');
    if(!inPeriod) return;
    total++;
    if(t.status==='done'){
      done++;
      const ot=!t.dueDate || ((t.confirmedAt||t.completedAt||t.dueDate) <= (t.dueDate+86400000));
      if(ot) onTime++; else { lateDone++; errList.push({t, type:'Hoàn thành TRỄ hạn'}); }
    } else if(t.dueDate && t.dueDate<now){ overdue++; errList.push({t, type:'QUÁ HẠN chưa xong'}); }
  });
  let score=null;
  if(total>0){
    const compRate=done/total, onTimeRate=onTime/total;
    score = 60*compRate + 40*onTimeRate;
    score -= overdue*3 + lateDone*1; // [YC-QL] trừ điểm trách nhiệm giám sát
    score = Math.max(0, Math.min(100, Math.round(score)));
  }
  return {total, done, onTime, overdue, lateDone, errCount:overdue+lateDone, score,
          projCount:projIds.size, errList,
          rating: score!=null ? ratingOf(score) : null};
}

    Công thức: Điểm = 60×(% hoàn thành) + 40×(% đúng hạn) − <b>3đ/việc quá hạn</b> − <b>1đ/việc trễ</b>. Dùng cột này làm căn cứ khi chấm KPI chính thức cho quản lý (nút "Chấm KPI").</div>
    <div class="tbl-wrap"><table style="font-size:12px">

   - Mỗi chỉ tiêu tự động được đánh dấu {auto:true, autoKey} để hiển
     thị badge 🤖 và để quản lý biết đâu là số máy chấm.

/* Bộ khóa nguồn dữ liệu tự động (autoKey) và nhãn hiển thị */
const AUTO_KPI_SOURCES = {
  ontime_rate:        {label:'% công việc hoàn thành ĐÚNG HẠN', scope:'area'},
  completion_rate:    {label:'% công việc HOÀN THÀNH',          scope:'area'},

  late_count:         {label:'SỐ lần đi làm muộn (chấm công)',   scope:'disc'},

  absent_count:       {label:'SỐ lần nghỉ KHÔNG PHÉP (chấm công, mã K)', scope:'disc'}, // [CC3]
  work_hours:         {label:'Tổng GIỜ LÀM VIỆC thực tế trong tháng (chấm vào–ra)', scope:'disc'}, // [CO]
  attitude_score:     {label:'Điểm thái độ: 100 − 1đ/lần quên chấm giờ về', scope:'disc'}, // [CO]

/* [YC-HM] Danh sách công việc của 1 NV thuộc 1 mảng trong 1 kỳ (dùng chung) */
function _tasksOfUserAreaPeriod(user, period, area){
  const db=getDB();
  const parts=(period||thisPeriod()).split('-').map(Number);
  const yy=parts[0], mm=parts[1];
  const mStart=new Date(yy,mm-1,1).getTime();
  const mEnd  =new Date(yy,mm,0,23,59,59).getTime();
  const areaKey=t=> t.area ? t.area : (t.projectId ? 'project' : null);
  return (db.tasks||[]).filter(t=>{
    if(t.assigneeId!==user.id) return false;
    if(areaKey(t)!==area) return false;
    const due=t.dueDate||0, fin=t.confirmedAt||t.completedAt||0;
    return (due>=mStart&&due<=mEnd)||(fin>=mStart&&fin<=mEnd)||(due&&due<=mEnd&&t.status!=='done');
  });
}
/* [YC-HM] Tính "Thực tế" cho 1 chỉ tiêu từ các việc GẮN ĐÚNG hạng mục đó.
   - Chỉ tiêu dạng LỖI (lần/vụ hoặc cách tính "càng thấp càng tốt"): đếm việc quá hạn/trễ.
   - Chỉ tiêu dạng %: tỷ lệ hoàn thành đúng hạn của các việc gắn hạng mục.
   - Chỉ tiêu dạng SỐ LƯỢNG (bộ, SL, việc, HĐ...): đếm việc đã hoàn thành. */
function computeItemActualFromTasks(it, linkedTasks){
  const now=Date.now();
  let total=0, done=0, onTime=0, errs=0;
  linkedTasks.forEach(t=>{
    total++;
    if(t.status==='done'){
      done++;
      const ot=!t.dueDate || ((t.confirmedAt||t.completedAt||t.dueDate) <= (t.dueDate+86400000));
      if(ot) onTime++; else errs++;
    } else if(t.dueDate && t.dueDate<now){ errs++; }
  });
  if(!total) return null;
  const ct=it.calcType||'auto';
  const u=String(it.unit||'').toLowerCase(); // [FIX] không phân biệt hoa/thường
  const lowerLike = u==='lần'||u==='vụ'||ct==='inverse'||ct==='threshold_low'||ct==='steps_down';
  if(lowerLike) return errs;                       // số lỗi (quá hạn/trễ)
  if(u==='%') return Math.round(onTime/total*100); // % đúng hạn
  return done;                                     // số lượng hoàn thành
}

/* Xác định autoKey của 1 chỉ tiêu:
   ưu tiên item.autoKey do Admin đặt (chuỗi '' = tắt tự động),
   nếu chưa đặt thì suy ra theo tên/đơn vị chỉ tiêu. */
function resolveAutoKey(area, item){
  if(item && item.autoKey!==undefined && item.autoKey!==null) return item.autoKey;
  const n=((item&&item.name)||'').toLowerCase();
  if(/báo cáo/.test(n))                                  return 'report_ontime_rate';
  if(/nghỉ không.{0,4}phép|nghỉ ko phép/.test(n))        return 'absent_count'; // [CC3]
  if(/giờ làm việc/.test(n))                             return 'work_hours'; // [CO]
  if(/phối hợp.{0,20}(đồng nghiệp|thái độ)|thái độ làm việc/.test(n)) return 'attitude_score'; // [CO]
  if(/đi làm|đi trễ|đi muộn|đúng giờ/.test(n))           return 'late_count';
  if(/tăng ca/.test(n))                                  return 'ot_hours';
  if(/đúng tiến độ|hoàn thành.*tiến độ|đúng hạn/.test(n))return 'ontime_rate';
  if(/khối lượng/.test(n))                               return 'done_count';
  return ''; // '' = chấm tay
}

/* Gom thống kê công việc theo 1 MẢNG cho 1 NV trong 1 kỳ (tháng) */
function autoAreaTaskStats(user, period){
  return function(area){
    const db=getDB();
    const parts=(period||thisPeriod()).split('-').map(Number);
    const yy=parts[0], mm=parts[1];
    const mStart=new Date(yy,mm-1,1).getTime();
    const mEnd  =new Date(yy,mm,0,23,59,59).getTime();
    const areaKey=t=> t.area ? t.area : (t.projectId ? 'project' : null);
    const now=Date.now();
    let total=0, done=0, onTime=0, overdue=0;
    (db.tasks||[]).forEach(t=>{
      if(t.assigneeId!==user.id) return;
      if(areaKey(t)!==area) return;
      const due=t.dueDate||0, fin=t.confirmedAt||t.completedAt||0;
      const inPeriod=(due>=mStart&&due<=mEnd)||(fin>=mStart&&fin<=mEnd)||(due&&due<=mEnd&&t.status!=='done');
      if(!inPeriod) return;
      total++;
      if(t.status==='done'){
        done++;
        const ot = !t.dueDate || ((t.confirmedAt||t.completedAt||t.dueDate) <= (t.dueDate+86400000));
        if(ot) onTime++;
      } else if(t.dueDate && t.dueDate<now){ overdue++; }
    });
    return {
      total, done, onTime, overdue,
      onTimeRate:  total? Math.round(onTime/total*100):null,
      completionRate: total? Math.round(done/total*100):null,
      doneCount: total? done : null
    };
  };
}

/* Thống kê Ý THỨC (dùng chung mọi mảng): đi muộn, tăng ca (chấm công) + báo cáo đúng hạn (task) */
function autoDisciplineStats(user, period){
  const db=getDB();
  const p=period||thisPeriod();
  const rec=((db.attendance||{})[user.id]||{})[p]||{};
  let lateCount=0, otHours=0, absentNoPermit=0, hasAttendance=false;
  let workedHours=0, forgotCheckout=0; // [CO]
  const [pyy,pmm]=p.split('-').map(Number);
  Object.keys(rec).forEach(dayKey=>{
    const v=rec[dayKey];
    if(v==null) return;
    hasAttendance=true;
    if(typeof v==='object'){
      // [CC2] Muộn có lý do được duyệt (lateExcused) KHÔNG tính vào KPI
      if(v.late===true && !v.lateExcused) lateCount++;
      otHours += Number(v.ot)||0;
      if(v.code==='K') absentNoPermit++; // [CC3] nghỉ KHÔNG phép
      // [CO] Giờ làm việc thực tế (giờ về đã được duyệt)
      if(v.checkOut && !v.pendingCheckOut) workedHours += Number(v.workedHours)||0;
      // [CO] Quên chấm giờ về: có giờ vào, không giờ về, đã qua 0h00 hôm sau → -1 điểm thái độ/ngày
      if(v.checkIn && !v.checkOut && new Date(pyy, pmm-1, Number(dayKey)+1).getTime() <= Date.now()) forgotCheckout++;
    } else if(v==='K'){ absentNoPermit++; }
  });
  workedHours=Math.round(workedHours*10)/10;
  const rep = autoKpiScores(user, p).discipline; // % task đúng hạn trên toàn bộ việc được giao
  return {
    lateCount, otHours, absentNoPermit, hasAttendance,
    workedHours, forgotCheckout, // [CO]
    reportRate: rep
  };
}

/* Tính giá trị "Thực tế" cho 1 chỉ tiêu theo autoKey. Trả null nếu không đủ dữ liệu. */
function computeAutoActual(autoKey, areaStats, discStats){
  switch(autoKey){
    case 'ontime_rate':        return areaStats ? areaStats.onTimeRate : null;
    case 'completion_rate':    return areaStats ? areaStats.completionRate : null;
    case 'done_count':         return areaStats ? areaStats.doneCount : null;
    case 'report_ontime_rate': return discStats ? discStats.reportRate : null;
    case 'late_count':         return discStats && discStats.hasAttendance ? discStats.lateCount : null;
    case 'ot_hours':           return discStats && discStats.hasAttendance ? discStats.otHours : null;
    case 'absent_count':       return discStats && discStats.hasAttendance ? discStats.absentNoPermit : null; // [CC3]
    case 'work_hours':         return discStats && discStats.workedHours>0 ? discStats.workedHours : null; // [CO] chỉ tự chấm khi có dữ liệu vào–ra
    case 'attitude_score':     return discStats && discStats.forgotCheckout>0 ? Math.max(0, 100 - discStats.forgotCheckout) : null; // [CO] chỉ tự trừ khi có vi phạm; không vi phạm → QL chấm tay
    default: return null;
  }
}

/* Dựng "bản vá" tự động cho 1 NV · 1 kỳ · 1 mảng: {pro:{i:{...}}, disc:{i:{...}}, filled} */
function buildAutoEvalPatch(user, period, area){
  const db=getDB();
  const proItems = db.kpiTemplates[area]||[];
  const discItems = db.disciplineTemplate||[];
  const areaStats = autoAreaTaskStats(user, period)(area);
  const discStats = autoDisciplineStats(user, period);
  const pro={}, disc={};
  let filled=0;
  // [YC-HM] Ưu tiên 1: các việc GẮN ĐÚNG HẠNG MỤC → tính riêng cho từng chỉ tiêu
  const areaTasks = _tasksOfUserAreaPeriod(user, period, area);
  proItems.forEach((it,i)=>{
    const linked = areaTasks.filter(t=>(t.kpiItemName||'')===it.name);
    if(linked.length){
      const val = computeItemActualFromTasks(it, linked);
      if(val!==null && val!==undefined){
        pro[i]={target: it.target, actual: val, auto:true, autoKey:'item_tasks', taskCount:linked.length};
        filled++;
      }
      return;
    }
    // Ưu tiên 2 (như cũ): nguồn tự động theo mảng nếu chỉ tiêu có autoKey phù hợp
    const key=resolveAutoKey(area, it);
    if(!key || key==='item_tasks' || AUTO_KPI_SOURCES[key]?.scope==='disc') return;
    const val=computeAutoActual(key, areaStats, null);
    if(val!==null && val!==undefined){ pro[i]={target: it.target, actual: val, auto:true, autoKey:key}; filled++; }
  });
  discItems.forEach((it,i)=>{
    const key=resolveAutoKey('_disc', it);
    if(!key) return;
    const val=computeAutoActual(key, null, discStats);
    if(val!==null && val!==undefined){ disc[i]={target: it.target, actual: val, auto:true, autoKey:key}; filled++; }
  });
  return {pro, disc, filled, areaStats, discStats};
}

/* Ghi bản vá tự động vào kpiEvals (giữ nguyên các chỉ tiêu chấm tay đã có) */
function applyAutoToEval(db, userId, period, area){
  const patch=buildAutoEvalPatch(getDB().users.find(u=>u.id===userId)||{id:userId}, period, area);
  let ev=db.kpiEvals.find(e=>e.userId===userId && e.period===period && e.area===area);
  if(!ev){
    ev={id:uid('ev'), userId, area, period, pro:{}, disc:{}, note:'',
        evaluatorId:(currentUser()||{}).id, createdAt:Date.now()};
    db.kpiEvals.push(ev);
  }
  ev.pro = ev.pro||{}; ev.disc = ev.disc||{};
  Object.keys(patch.pro).forEach(i=>{ ev.pro[i]=patch.pro[i]; });
  Object.keys(patch.disc).forEach(i=>{ ev.disc[i]=patch.disc[i]; });
  ev._autoAppliedAt=Date.now();
  ev._autoAppliedBy=(currentUser()||{}).id;
  ev.updatedAt=Date.now();
  return patch.filled;
}

  const u = currentUser(); if(!u) return;
  const db = getDB();

    <button onclick="this.closest('#deadline-warn-popup').remove()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer">×</button>
  </div>
  <div style="padding:12px 14px;max-height:320px;overflow-y:auto;font-size:13px">`;
  if(overdueTasks.length){
    html += `<div style="color:#dc2626;font-weight:600;margin-bottom:4px">🚨 ${overdueTasks.length} công việc QUÁ HẠN:</div>`;

      overdueTasks.slice(0,5).map(t=>{

        return `<li><b>${escapeHtml(t.title)}</b>${emp}<br><span class="muted">hết hạn ${fmtDate(t.dueDate)}</span></li>`;
      }).join('') + '</ul>';
    if(overdueTasks.length>5) html += `<div class="muted" style="font-size:11px">… và ${overdueTasks.length-5} công việc khác</div>`;
  }
  if(dueTasks.length){
    html += `<div style="color:#9a3412;font-weight:600;margin-bottom:4px">⏰ ${dueTasks.length} công việc HẾT HẠN HÔM NAY (còn 0 ngày):</div>`;
    html += '<ul style="margin:0 0 8px 0;padding-left:20px">' +
      dueTasks.slice(0,5).map(t=>{
        const emp = u.role==='employee' ? '' : ' — '+escapeHtml((db.users.find(x=>x.id===t.assigneeId)||{}).name||'');
        return `<li><b>${escapeHtml(t.title)}</b>${emp}<br><span class="muted">hạn hôm nay ${fmtDate(t.dueDate)}</span></li>`;
      }).join('') + '</ul>';
    if(dueTasks.length>5) html += `<div class="muted" style="font-size:11px">… và ${dueTasks.length-5} công việc khác</div>`;
  }
  if(soonTasks.length){
    html += `<div style="color:#b45309;font-weight:600;margin-bottom:4px">⏰ ${soonTasks.length} công việc sắp hết hạn (≤ 3 ngày):</div>`;
    html += '<ul style="margin:0 0 8px 0;padding-left:20px">' +
      soonTasks.slice(0,5).map(t=>{
        const days = Math.ceil((t.dueDate-Date.now())/86400000);
        const emp = u.role==='employee' ? '' : ' — '+escapeHtml((db.users.find(x=>x.id===t.assigneeId)||{}).name||'');
        return `<li><b>${escapeHtml(t.title)}</b>${emp}<br><span class="muted">còn ${days} ngày (hạn ${fmtDate(t.dueDate)})</span></li>`;
      }).join('') + '</ul>';
    if(soonTasks.length>5) html += `<div class="muted" style="font-size:11px">… và ${soonTasks.length-5} công việc khác</div>`;
  }
  html += `<div style="margin-top:10px;text-align:right"><button class="btn sm" onclick="navTo('${u.role==='employee'?'my-tasks':'tasks'}');document.getElementById('deadline-warn-popup')?.remove()">Mở bảng công việc</button></div>`;
  html += '</div>';
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
  // Tự đóng sau 30 giây nếu không thao tác
  setTimeout(()=>{ const x=document.getElementById('deadline-warn-popup'); if(x) x.remove(); }, 30000);
}

function empFilterSuggest(q){

window.empSuggestHighlight = function(i){
  window._taskSuggestIdx = i;
  document.querySelectorAll('.emp-sug-item').forEach(el=>{
    if(Number(el.dataset.idx)===i){
      el.style.background = '#1e3a8a';
      el.style.color = '#fff';

      el.style.background = '';
      el.style.color = '';

  });
};
window.empSearchKey = function(e){
  const list = window._taskSuggestList || [];
  let idx = window._taskSuggestIdx;
  if(e.key==='ArrowDown'){
    e.preventDefault();
    idx = Math.min(list.length-1, idx+1);
    empSuggestHighlight(idx);
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    idx = Math.max(0, idx-1);
    empSuggestHighlight(idx);
  } else if(e.key==='Enter'){
    e.preventDefault();
    if(idx>=0 && list[idx]) empSearchPick(list[idx].id);
  } else if(e.key==='Escape'){
    document.getElementById('emp-suggest').style.display='none';
  }
};

/* [YC-HM] Nạp danh sách HẠNG MỤC KPI theo mảng đã chọn (dùng chung cho form giao việc & tự giao việc) */
window.refreshTaskKpiItems = function(areaSelId, itemSelId, selectedName){
  const areaSel=document.getElementById(areaSelId);
  const itemSel=document.getElementById(itemSelId);
  if(!areaSel||!itemSel) return;
  const db=getDB();
  const area=areaSel.value;
  const items=(area && db.kpiTemplates[area])||[];
  if(!area || !items.length){
    itemSel.innerHTML='<option value="">— '+(area?'Mảng này chưa có chỉ tiêu KPI':'Chọn mảng trước')+' —</option>';
    return;
  }
  const cur = selectedName!==undefined ? selectedName : itemSel.value;
  itemSel.innerHTML='<option value="">— Không gắn hạng mục cụ thể (tính chung theo mảng) —</option>'+
    items.map(it=>`<option value="${escapeHtml(it.name)}" ${cur===it.name?'selected':''}>${escapeHtml(it.name)} (${(it.weight*100).toFixed(0)}%)</option>`).join('');
};
/* [YC4] Gợi ý người thực hiện khi gõ tên tự do (so khớp không dấu theo tên/mã/username) */
window.renderAssigneeSuggest = function(q){
  const box=document.getElementById('t-assignee-sug'); if(!box) return;
  const sel=document.getElementById('t-assignee');
  const db=getDB();
  const emps=db.users.filter(x=>x.role!=='admin');
  const nq=_normVN(q);
  if(!nq){ box.style.display='none'; return; }
  const matches=emps.filter(e=>
    _normVN(e.name).includes(nq) ||
    _normVN(e.code||'').includes(nq) ||
    _normVN(e.username||'').includes(nq)
  ).slice(0,8);
  if(!matches.length){
    box.innerHTML='<div style="padding:8px 10px;color:#94a3b8;font-size:12px">Không tìm thấy nhân viên phù hợp — kiểm tra lại tên hoặc chọn trực tiếp trong danh sách.</div>';
    box.style.display='block'; return;
  }
  box.innerHTML=matches.map(e=>{
    const co=getCompany(e.companyId);
    const areas=getUserAreas(e).map(a=>(getArea(a)||{}).short).filter(Boolean).join(',');
    return `<div class="asg-sug-item" onclick="pickAssignee('${e.id}')" style="padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #f1f5f9"
      onmouseover="this.style.background='#eef2ff'" onmouseout="this.style.background=''">
      <span><b>${escapeHtml(e.name)}</b> <span class="muted" style="font-size:11px">(${escapeHtml(e.code||e.username)})</span></span>
      <span style="font-size:11px"><span class="badge co">${escapeHtml(co.code)}</span>${areas?' '+areas:''}</span>
    </div>`;
  }).join('');
  box.style.display='block';
};
window.pickAssignee = function(empId){
  const sel=document.getElementById('t-assignee');
  const box=document.getElementById('t-assignee-sug');
  const inp=document.getElementById('t-assignee-search');
  if(sel) sel.value=empId;
  const db=getDB(); const e=db.users.find(x=>x.id===empId);
  if(inp && e) inp.value=e.name;
  if(box) box.style.display='none';
  toast('Đã chọn người thực hiện: '+(e?e.name:''),'info');
};
window.saveTask = function(id){
  const db=getDB();
  const v=q=>document.getElementById(q).value;
  let t;
  if(id) t = db.tasks.find(x=>x.id===id);
  else { t={id:uid('t'), createdAt:Date.now(), createdBy:currentUser().id}; db.tasks.push(t); }
  t.title=v('t-title').trim();
  t.assigneeId=v('t-assignee');
  t.area=v('t-area');
  t.kpiItemName=document.getElementById('t-kpiitem')?.value||''; // [YC-HM] hạng mục KPI gắn với việc
  const due=v('t-due'); t.dueDate=due?new Date(due).getTime():null;
  t.status=v('t-status');
  t.note=v('t-note').trim();
  if(!t.title){ toast('Nhập tên nhiệm vụ','error'); return; }
  saveDB(db); closeModal(); render(); toast('Đã lưu');
};
window.delTask = function(id){
  // [YC5] Khi việc đã được giao, CHỈ cấp Quản lý (admin/pm/manager) mới có quyền xóa
  if(!canApprove()){ toast('⛔ Chỉ cấp Quản lý mới có quyền xóa công việc đã giao','error'); return; }
  if(!confirm('Xóa nhiệm vụ?')) return;
  const db=getDB(); db.tasks=db.tasks.filter(t=>t.id!==id); saveDB(db); render(); toast('Đã xóa');
};

window.bulkSelectAllEmps = function(checked){

};
window.addBulkTaskRow = function(){
  if(!window._bulkTaskRows) window._bulkTaskRows=[];

};
window.removeBulkTaskRow = function(i){

window.updateBulkTaskRow = function(i, field, value){
  if(!window._bulkTaskRows[i]) return;

};
function renderBulkTaskRows(){
  const host=document.getElementById('bulk-tasks');
  if(!host) return;
  const rows=window._bulkTaskRows||[];
  host.innerHTML = rows.map((r,i)=>{
    return `<div class="card" style="padding:10px;margin-bottom:6px;border:1px solid #e2e8f0">

window.saveBulkTasks = function(){
  const db=getDB();
  const me=currentUser();
  const empIds = Array.from(document.querySelectorAll('#bulk-emps input[type=checkbox]:checked')).map(c=>c.value);
  const tasks = (window._bulkTaskRows||[]).filter(t=>t.title.trim());
  const errBox = document.getElementById('bulk-err');
  if(!empIds.length){ errBox.textContent='Chọn ít nhất 1 nhân viên'; return; }
  if(!tasks.length){ errBox.textContent='Nhập ít nhất 1 nhiệm vụ có tiêu đề'; return; }
  let createdCount=0;
  empIds.forEach(eid=>{
    tasks.forEach(t=>{
      const tk={
        id:uid('t'),
        title:t.title.trim(),
        assigneeId:eid,
        area:t.area||'',
        dueDate: t.dueDate?new Date(t.dueDate).getTime():null,
        status:'new',
        note:t.note.trim(),
        createdAt:Date.now(),
        createdBy:me.id
      };
      db.tasks.push(tk);
      createdCount++;
    });
  });
  saveDB(db); closeModal(); render();
  toast(`Đã giao ${createdCount} nhiệm vụ cho ${empIds.length} nhân viên`);
};

  const db=getDB();

          <th>Mã NV</th><th>Họ tên</th><th>Mảng</th><th>Công ty</th>
          <th>Điểm CM (×${(getDB().settings.kpiWeightPro*100).toFixed(0)}%)</th>
          <th>Điểm YT (×${(getDB().settings.kpiWeightDisc*100).toFixed(0)}%)</th>
          <th>TỔNG KPI</th><th>Xếp loại</th><th></th>
        </tr></thead>
        <tbody id="kpi-tbody"></tbody>
      </table>
    </div>
  `;

function renderKPIRows(){
  const period=document.getElementById('kpi-period').value||thisPeriod();
  const db=getDB(); const u=currentUser();
  // [REQ3a] Liệt kê toàn bộ nhân viên của cả 3 công ty (không lọc theo công ty)
  let emps = db.users.filter(x=>x.role!=='admin');
  const tbody=document.getElementById('kpi-tbody');
  if(!emps.length){ tbody.innerHTML='<tr><td colspan="9" class="empty">Chưa có nhân sự</td></tr>'; return; }
  // [REQ3b] Nhóm theo NHÂN VIÊN: tên + mã + công ty hiển thị 1 lần (rowspan),
  //         mỗi mảng công việc là 1 dòng phía sau cho dễ quan sát.
  const rows=[];
  // Sắp xếp: theo công ty rồi theo tên cho gọn
  emps.sort((a,b)=>{
    const ca=getCompany(a.companyId).code||'', cb=getCompany(b.companyId).code||'';
    if(ca!==cb) return ca.localeCompare(cb);
    return (a.name||'').localeCompare(b.name||'', 'vi');
  });
  emps.forEach(e=>{
    const asgs = getUserAssignments(e);
    const nameCell = `<b>${escapeHtml(e.name)}</b>`;
    const codeCell = escapeHtml(e.code||e.username);
    const coCell = `<span class="badge co">${getCompany(e.companyId).code}</span>`;
    if(!asgs.length){
      rows.push(`<tr>
        <td>${codeCell}</td>
        <td>${nameCell}</td>
        <td><span class="muted">Chưa gán mảng</span></td>
        <td>${coCell}</td>
        <td colspan="4" class="muted">— Cần gán ít nhất 1 mảng công việc trong hồ sơ NV —</td>
        <td></td>
      </tr>`);
      return;
    }
    const span = asgs.length;
    asgs.forEach((asg, idx)=>{
      const ev=db.kpiEvals.find(x=>x.userId===e.id && x.period===period && x.area===asg.area);
      let pro='—',disc='—',total='—',rt='';
      if(ev){
        const f=computeFullKPI(ev);
        pro=(f.pro.total*f.wPro).toFixed(1);
        disc=(f.disc.total*f.wDisc).toFixed(1);
        total=`<b>${f.total.toFixed(1)}</b>`;
        rt=`<span class="badge ${f.rating.css}">${f.rating.label}</span>`;
        if(ev._autoAppliedAt) total+=' <span class="badge" style="background:#e0e7ff;color:#3730a3" title="Đã áp dụng KPI tự động lúc '+fmtDateTime(ev._autoAppliedAt)+'">🤖</span>';
      }
      const ar=getArea(asg.area);
      // Dòng ĐẦU của mỗi NV: in Mã NV, Họ tên, Công ty với rowspan = số mảng
      const firstCols = (idx===0)
        ? `<td rowspan="${span}" style="vertical-align:top">${codeCell}</td>
           <td rowspan="${span}" style="vertical-align:top">${nameCell}${span>1?`<div class="hint muted">Đa nhiệm ${span} mảng</div>`:''}</td>`
        : '';
      const coColCell = (idx===0) ? `<td rowspan="${span}" style="vertical-align:top">${coCell}</td>` : '';
      // Để cột Công ty đứng sau cột Mảng (giữ đúng thứ tự header: Mã·Tên·Mảng·Công ty)
      rows.push(`<tr${idx===0?' style="border-top:2px solid #cbd5e1"':''}>
        ${firstCols}
        <td>${ar?`<span class="badge area-${ar.id}">${escapeHtml(ar.name)}</span>`:'—'}</td>
        ${coColCell}
        <td>${pro}</td>
        <td>${disc}</td>
        <td>${total}</td>
        <td>${rt}</td>
        <td>
          <button class="btn sm success" onclick="openKPIForm('${e.id}','${period}','${asg.area}')">${ev?'Sửa KPI':'Chấm KPI'}</button>
          <button class="btn sm" style="background:#6366f1" title="Áp dụng số liệu tự động (tiến độ/đúng hạn/khối lượng + ý thức) cho riêng dòng này" onclick="applyAutoKPIOne('${e.id}','${period}','${asg.area}')">🔗 TĐ</button>
        </td>
      </tr>`);
    });
  });
  tbody.innerHTML = rows.join('');
}
window.reloadKPIPeriod = function(){ renderKPIRows(); };

window.openKPIForm = function(userId, period, area){
  const db=getDB();
  const u=db.users.find(x=>x.id===userId);
  if(!u){ toast('Không tìm thấy nhân viên','error'); return; }
  // Nếu không truyền area: dùng mảng đầu tiên trong assignments
  if(!area){
    const asgs = getUserAssignments(u);
    if(!asgs.length){ toast('Nhân viên chưa được gán mảng công việc','error'); return; }
    area = asgs[0].area;
  }
  if(!userHasArea(u, area)){ toast('Nhân viên chưa đảm nhiệm mảng này','error'); return; }
  // [FIX-ĐB] Ghi nhớ mảng đang chấm để recalcKPILive dùng ĐÚNG template (không đoán nữa)
  window._kpiFormArea = area;
  let ev=db.kpiEvals.find(e=>e.userId===userId && e.period===period && e.area===area);
  if(!ev){ ev={id:uid('ev'), userId, area, period, pro:{}, disc:{}, note:'', evaluatorId:currentUser().id, createdAt:Date.now()}; }
  // [YC-YT] Điểm Ý THỨC chỉ chấm 1 LẦN/tháng, dùng chung cho mọi mảng:
  //         nếu phiếu này chưa có điểm Ý thức, tự lấy từ phiếu mảng khác cùng tháng.
  if(!ev.disc || !Object.keys(ev.disc).length){
    const otherEv = db.kpiEvals.find(e=>e.userId===userId && e.period===period && e.id!==ev.id && e.disc && Object.keys(e.disc).length);
    if(otherEv) ev.disc = JSON.parse(JSON.stringify(otherEv.disc));

  const buildSection = (items, src, prefix, areaArg)=> items.map((it,i)=>{

    const aKey = resolveAutoKey(areaArg, it);

    const autoBadge = scopeOk ? ` <span class="badge" style="background:#e0e7ff;color:#3730a3" title="Chỉ tiêu này có thể chấm TỰ ĐỘNG từ ${escapeHtml(AUTO_KPI_SOURCES[aKey]?.label||'dữ liệu công việc')}">🤖 tự động</span>` : '';
    const autoMark = (v.auto ? ' <span class="badge" style="background:#dcfce7;color:#166534" title="Số liệu do phần mềm tự chấm">✓ máy chấm</span>' : '');
    return `<tr>

        </table></div>

        <div class="help-text" style="background:#fefce8;border-color:#fde047">👥 <b>Điểm Ý thức chấm 1 LẦN mỗi tháng và DÙNG CHUNG cho mọi mảng.</b> Khi lưu, điểm Ý thức ở đây sẽ tự đồng bộ sang các phiếu KPI mảng khác của nhân viên trong cùng tháng.</div>

window.syncTargetsFromConfig = function(area){
  const db=getDB();
  const proItems=db.kpiTemplates[area]||[];
  const discItems=db.disciplineTemplate||[];
  proItems.forEach((it,i)=>{ const el=document.getElementById('pro-t-'+i); if(el) el.value=it.target; });
  discItems.forEach((it,i)=>{ const el=document.getElementById('disc-t-'+i); if(el) el.value=it.target; });
  recalcKPILive();
  toast('Đã cập nhật Mục tiêu theo Cấu hình KPI mới nhất — kiểm tra rồi bấm 💾 Lưu');
};
window.switchKPITab=function(e,t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  e.currentTarget.classList.add('active');
  ['pro','disc','sum'].forEach(k=>{
    const x=document.getElementById('kpi-tab-'+k);
    if(x) x.style.display = k===t?'':'none';
  });
};
window.recalcKPILive = function(){
  const db=getDB();
  const u=currentUser();
  // Determine area from items count - we need to traverse the visible inputs
  // We'll just scan IDs
  function calcSection(prefix, items){
    let total=0;
    items.forEach((it,i)=>{
      const tEl=document.getElementById(`${prefix}-t-${i}`);
      const aEl=document.getElementById(`${prefix}-a-${i}`);
      if(!tEl||!aEl) return;
      const t=Number(tEl.value), a=Number(aEl.value);
      const pct = pctAchieveItem(it, tEl.value, aEl.value); // [YC-CT] theo cách tính đã cấu hình
      const pts = it.weight*pct*100;
      total+=pts;
      const pctEl=document.getElementById(`${prefix}-pct-${i}`);
      const ptsEl=document.getElementById(`${prefix}-pts-${i}`);
      if(pctEl) pctEl.textContent = (aEl.value==='') ? '—' : (pct*100).toFixed(0)+'%';
      if(ptsEl) ptsEl.innerHTML = (aEl.value==='') ? '<b>—</b>' : `<b>${pts.toFixed(1)}</b>`;
    });
    return total;
  }
  // [FIX-ĐB] KHÔNG đoán mảng theo số dòng nữa (sai khi Firebase đảo thứ tự key:
  // commercial 4 chỉ tiêu đứng trước design 6 chỉ tiêu → khớp nhầm template, tính sai
  // trọng số & cách tính). Dùng thẳng mảng đã ghi nhớ khi mở form (_kpiFormArea).
  let proItems = (window._kpiFormArea && db.kpiTemplates[window._kpiFormArea]) || null;
  if(!proItems){
    // Dự phòng (form cũ chưa set _kpiFormArea): tìm template khớp CHÍNH XÁC số dòng —
    // phần tử cuối tồn tại VÀ phần tử ngay sau KHÔNG tồn tại
    for(const a of Object.keys(db.kpiTemplates)){
      const tpl=db.kpiTemplates[a];
      if(document.getElementById('pro-t-'+(tpl.length-1)) && !document.getElementById('pro-t-'+tpl.length)){ proItems=tpl; break; }
    }
  }
  const discItems=db.disciplineTemplate;
  if(!proItems) return;
  const proTotal = calcSection('pro', proItems);
  const discTotal = calcSection('disc', discItems);
  const wP=db.settings.kpiWeightPro, wD=db.settings.kpiWeightDisc;
  const total = proTotal*wP + discTotal*wD;
  const rt = ratingOf(total);
  const set=(id,v)=>{ const x=document.getElementById(id); if(x) x.textContent=v; };
  set('sum-pro', proTotal.toFixed(1));
  set('sum-prow', (proTotal*wP).toFixed(1));
  set('sum-disc', discTotal.toFixed(1));
  set('sum-discw', (discTotal*wD).toFixed(1));
  set('sum-total', total.toFixed(1));
  const rtEl=document.getElementById('sum-rt');
  if(rtEl) rtEl.innerHTML = `<span class="badge ${rt.css}" style="font-size:14px">${rt.label}</span>`;
};
window.saveKPIForm = function(userId, period, evId, area){
  const db=getDB();
  const user=db.users.find(x=>x.id===userId);
  if(!user) return;
  // Fallback nếu area không truyền (tương thích cũ)
  if(!area){
    const asgs = getUserAssignments(user);
    area = asgs[0]?.area || user.area;
  }
  const proItems = db.kpiTemplates[area]||[];
  const discItems = db.disciplineTemplate;
  const grab = (prefix, items)=>{
    const obj={};
    items.forEach((it,i)=>{
      const t=document.getElementById(`${prefix}-t-${i}`)?.value;
      const a=document.getElementById(`${prefix}-a-${i}`)?.value;
      obj[i]={target: t===''?'':Number(t), actual: a===''?'':Number(a)};
    });
    return obj;
  };
  let ev = db.kpiEvals.find(e=>e.id===evId);
  if(!ev){
    ev={id:evId||uid('ev'), userId, area, period, evaluatorId:currentUser().id, createdAt:Date.now()};
    db.kpiEvals.push(ev);
  }
  // Đảm bảo area được set chính xác
  ev.area = area;
  ev.pro = grab('pro', proItems);
  ev.disc = grab('disc', discItems);
  ev.note = document.getElementById('kpi-note')?.value || '';
  ev.updatedAt = Date.now();
  // [YC-YT] Đồng bộ điểm Ý THỨC (chấm 1 lần) sang TẤT CẢ phiếu KPI mảng khác cùng tháng
  let synced=0;
  db.kpiEvals.forEach(e=>{
    if(e.userId===userId && e.period===period && e.id!==ev.id){
      e.disc = JSON.parse(JSON.stringify(ev.disc));
      e.updatedAt = Date.now();
      synced++;
    }
  });
  saveDB(db); closeModal(); render();
  toast('Đã lưu KPI mảng '+getArea(area).name + (synced?` — điểm Ý thức đã đồng bộ sang ${synced} mảng khác`:''));
};

window.renderKpiStepsTable = function(){
  const tbody=document.getElementById('k-steps-tbody'); if(!tbody) return;
  const ct=document.getElementById('k-calctype')?.value||'steps_down';
  const up = ct==='steps_up';
  const cmp = up ? '≥' : '≤';
  const head=document.getElementById('k-steps-cmp-head');
  if(head) head.textContent = up ? 'Nếu Thực tế ≥ ngưỡng (bậc TĂNG)' : 'Nếu Thực tế ≤ ngưỡng (bậc GIẢM)';
  tbody.innerHTML=_kpiSteps.map((s,i)=>`<tr>
    <td class="center"><b>${i+1}</b></td>
    <td style="color:#475569">Thực tế <b style="color:#1e3a8a">${cmp} ${s.lim}</b> → nhận <b style="color:#16a34a">${s.pct}%</b></td>
    <td><input type="number" step="any" value="${s.lim}" onchange="updKpiStep(${i},'lim',this.value)" style="width:95px;text-align:center"></td>
    <td><input type="number" step="any" min="0" max="120" value="${s.pct}" onchange="updKpiStep(${i},'pct',this.value)" style="width:90px;text-align:center"></td>
    <td><button type="button" class="btn sm danger" onclick="delKpiStep(${i})" title="Xóa bậc này">✗</button></td>
  </tr>`).join('');
  const elseEl=document.getElementById('k-steps-else');
  if(elseEl && document.activeElement!==elseEl) elseEl.value=_kpiStepsElse;
  const pv=document.getElementById('k-steps-preview');
  if(pv){
    const sorted=_kpiSteps.slice().sort((a,b)=> up ? b.lim-a.lim : a.lim-b.lim);
    pv.textContent='✔ Công thức đang áp: '+sorted.map(s=>`${cmp}${s.lim} → ${s.pct}%`).join('  ·  ')+`  ·  còn lại → ${_kpiStepsElse}%`;
  }
};
window.updKpiStep = function(i, field, val){
  if(_kpiSteps[i]) _kpiSteps[i][field]=Number(String(val).replace(',','.'))||0;
  renderKpiStepsTable();
};
window.delKpiStep = function(i){
  _kpiSteps.splice(i,1);
  if(!_kpiSteps.length) _kpiSteps=[{lim:0,pct:100}];
  renderKpiStepsTable();
};
window.addKpiStep = function(){
  const last=_kpiSteps[_kpiSteps.length-1]||{lim:0,pct:100};
  const ct=document.getElementById('k-calctype')?.value||'steps_down';
  const nextLim = ct==='steps_up' ? Math.max(0,(Number(last.lim)||0)-1) : (Number(last.lim)||0)+1;
  const nextPct = Math.max(0,(Number(last.pct)||0)-20);
  _kpiSteps.push({lim:nextLim, pct:nextPct});
  renderKpiStepsTable();
};
window.updKpiStepsElse = function(v){
  _kpiStepsElse=Number(String(v).replace(',','.'))||0;
  renderKpiStepsTable();
};
window.onKpiCalcTypeChange = function(sel){
  const v=sel.value;
  const wrap=document.getElementById('k-steps-wrap');
  if(wrap) wrap.style.display = v.indexOf('steps')===0 ? 'block' : 'none';
  const hint=document.getElementById('k-calc-hint');
  if(hint) hint.textContent=(KPI_CALC_TYPES[v]||{}).desc||'';
  renderKpiStepsTable();
};
window.saveKPIItem = function(area, type, idx){
  const db=getDB();
  const obj={
    name:document.getElementById('k-name').value.trim(),
    unit:document.getElementById('k-unit').value.trim(),
    weight:Number(document.getElementById('k-weight').value)||0,
    target:Number(document.getElementById('k-target').value)||0,
    desc:document.getElementById('k-desc').value.trim()
  };
  if(!obj.name){ toast('Nhập tên','error'); return; }
  // [YC-CT] Cách tính do người dùng định nghĩa
  const ct=document.getElementById('k-calctype')?.value||'auto';
  obj.calcType=ct;
  if(ct.startsWith('steps')){
    // [YC-BT] Đọc từ BẢNG bậc thang (thêm/xóa dòng), không còn ô gõ chuỗi
    const validSteps=_kpiSteps.filter(s=>!isNaN(Number(s.lim)));
    if(!validSteps.length){ toast('Thêm ít nhất 1 bậc vào bảng bậc thang (nút "+ Thêm bậc")','error'); return; }
    obj.steps = validSteps.map(s=>`${s.lim}:${s.pct}`).join(', ') + `, else:${_kpiStepsElse}`;
  }
  const akRaw=document.getElementById('k-autokey')?.value;
  if(akRaw!=='__auto__') obj.autoKey=akRaw; // '' = tắt tự động; tên nguồn = ép nguồn; bỏ qua = mặc định tự suy
  const list = type==='pro' ? db.kpiTemplates[area] : db.disciplineTemplate;
  if(idx<0) list.push(obj); else list[idx]=obj;
  saveDB(db); closeModal(); render(); toast('Đã lưu chỉ tiêu — cách tính: '+(KPI_CALC_TYPES[ct]||{}).label);
};

window.exportSalaryDetailExcel = function(userId, period){
  const db=getDB();
  const u=db.users.find(x=>x.id===userId); if(!u) return;
  const s = computeSalaryMulti(u, period);
  const asgs = getUserAssignments(u);
  const wb = XLSX.utils.book_new();
  const rows = [
    [`BẢNG TÍNH CHI TIẾT LƯƠNG — ${u.name}`],
    ['Mã NV', u.code||u.username],
    ['Công ty', getCompany(u.companyId).name],
    ['Chức danh', u.position||''],
    ['Tháng tính', fmtPeriod(period)],
    ['Số mảng đảm nhiệm', asgs.length],
    []
  ];
  asgs.forEach((asg,asgIdx)=>{
    const ar=getArea(asg.area);
    const ev = db.kpiEvals.find(e=>e.userId===u.id && e.period===period && e.area===asg.area);
    const bonus = s.bonuses[asgIdx];
    rows.push([`══════ MẢNG ${asgIdx+1}: ${ar?ar.name:asg.area} ══════`]);
    rows.push(['Bậc lương', asg.salaryRankCode||'(chưa gán)']);
    rows.push(['Lương cơ sở KPI', asg.kpiBase||0]);
    rows.push(['% KPI', ((asg.kpiPct||0)*100).toFixed(0)+'%']);
    rows.push(['Thưởng KPI tối đa', bonus?.kpiMax||0]);
    if(ev){
      const f = computeFullKPI(ev);
      rows.push([]);
      rows.push(['—— KPI CHUYÊN MÔN ——']);
      rows.push(['#','Chỉ tiêu','ĐVT','Trọng số','Mục tiêu','Thực tế','% Đạt','Điểm']);
      f.pro.detail.forEach((d,i)=>rows.push([i+1, d.name, d.unit, d.weight, d.target, d.actual, Math.round(d.pct*100)+'%', Math.round(d.points*100)/100]));
      rows.push(['','','','','','','Tổng CM', Math.round(f.pro.total*100)/100]);
      rows.push(['—— KPI Ý THỨC ——']);
      rows.push(['#','Tiêu chí','ĐVT','Trọng số','Mục tiêu','Thực tế','% Đạt','Điểm']);
      f.disc.detail.forEach((d,i)=>rows.push([i+1, d.name, d.unit, d.weight, d.target, d.actual, Math.round(d.pct*100)+'%', Math.round(d.points*100)/100]));
      rows.push(['','','','','','','Tổng YT', Math.round(f.disc.total*100)/100]);
      rows.push(['TỔNG KPI mảng', '','','','','','', Math.round(f.total*100)/100]);
      rows.push(['Xếp loại', f.rating.label]);
      rows.push(['Hệ số nhân', f.rating.coef]);
      rows.push(['Thưởng KPI thực nhận mảng này', Math.round(bonus?.kpiActual||0)]);
    } else {
      rows.push(['(Chưa chấm KPI mảng này → thưởng = 0)']);
    }
    rows.push([]);
  });
  rows.push(['═══ TỔNG HỢP LƯƠNG ═══']);
  rows.push(['1. Lương cứng cơ bản', s.base]);
  rows.push(['2. Hỗ trợ / Phụ cấp', s.allowance]);
  s.bonuses.forEach(b=>{
    const ar=getArea(b.area);
    rows.push([`3. Thưởng KPI mảng ${ar?ar.name:b.area}`, Math.round(b.kpiActual)]);
  });
  rows.push(['Σ Thưởng KPI', Math.round(s.totalKpiActual)]);
  rows.push(['TỔNG LƯƠNG THÁNG', Math.round(s.total)]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Bảng tính lương');
  XLSX.writeFile(wb, `BangLuongChiTiet_${u.code||u.username}_${period}.xlsx`);
  toast('Đã xuất Excel bảng tính chi tiết');
};

window.exportExcel = function(){

        ['Công ty', getCompany(e.companyId).name],
        ['Số mảng đảm nhiệm', asgs.length],

        const ar=getArea(asg.area);

        rows.push([`══════ MẢNG #${asgIdx+1}: ${ar?ar.name:asg.area} ══════`]);
        rows.push(['Bậc lương', asg.salaryRankCode||'']);
        rows.push(['Lương cơ sở KPI', asg.kpiBase]);
        rows.push(['% KPI', (Number(asg.kpiPct)*100).toFixed(0)+'%']);
        rows.push([]);
        if(ev){
          const f=computeFullKPI(ev);
          rows.push(['—— KPI CHUYÊN MÔN ——']);
          rows.push(['#','Chỉ tiêu','ĐVT','Trọng số','Mục tiêu','Thực tế','% Đạt','Điểm']);
          f.pro.detail.forEach((d,i)=>rows.push([i+1, d.name, d.unit, d.weight, d.target, d.actual, Math.round(d.pct*100)+'%', Math.round(d.points*10)/10]));
          rows.push(['','','','','','','Tổng CM', Math.round(f.pro.total*10)/10]);
          rows.push([],['—— KPI Ý THỨC ——']);
          rows.push(['#','Tiêu chí','ĐVT','Trọng số','Mục tiêu','Thực tế','% Đạt','Điểm']);
          f.disc.detail.forEach((d,i)=>rows.push([i+1, d.name, d.unit, d.weight, d.target, d.actual, Math.round(d.pct*100)+'%', Math.round(d.points*10)/10]));
          rows.push(['','','','','','','Tổng YT', Math.round(f.disc.total*10)/10]);
          rows.push([]);
          rows.push(['TỔNG KPI mảng này', '','','','','','', Math.round(f.total*10)/10]);
          rows.push(['Xếp loại', f.rating.label]);
          rows.push(['Hệ số nhân KPI', f.rating.coef]);
        }else{
          rows.push(['(Chưa chấm KPI cho mảng này)']);
        }
        const bonus = s.bonuses[asgIdx];
        rows.push(['Thưởng KPI tối đa mảng này', bonus?bonus.kpiMax:0]);
        rows.push(['Thưởng KPI thực nhận mảng này', bonus?Math.round(bonus.kpiActual):0]);
        rows.push([]);
      });
      // Tổng hợp lương
      rows.push(['══════ TỔNG HỢP LƯƠNG ══════']);
      rows.push(['Lương cứng cơ bản', s.base]);
      rows.push(['Hỗ trợ / Phụ cấp', s.allowance]);
      s.bonuses.forEach((b,i)=>{
        const ar=getArea(b.area);
        rows.push([`Thưởng KPI mảng "${ar?ar.name:b.area}"`, Math.round(b.kpiActual)]);
      });
      rows.push(['Σ Thưởng KPI', Math.round(s.totalKpiActual)]);
      rows.push(['TỔNG LƯƠNG (= cứng + hỗ trợ + Σ thưởng KPI)', Math.round(s.total)]);

      const sheetName = (e.code||e.username).slice(0,28);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sheetName);
    });
    const fileName=`BangLuong_${period}.xlsx`;
    XLSX.writeFile(wb, fileName);

    const y = period.split('-')[0];
    const rows=[['TỔNG HỢP KPI NĂM '+y],[]];
    rows.push(['STT','Mã NV','Họ tên','Công ty', ...Array.from({length:12},(_,i)=>`T${i+1}`), 'TB năm','Xếp loại năm']);
    list.forEach((e,idx)=>{
      const months=[]; let sum=0, cnt=0;
      for(let m=1;m<=12;m++){
        const p=`${y}-${String(m).padStart(2,'0')}`;
        const ev=db.kpiEvals.find(x=>x.userId===e.id && x.period===p);
        if(ev){ const f=computeFullKPI(ev); months.push(Math.round(f.total*10)/10); sum+=f.total; cnt++; }
        else months.push('');
      }
      const avg = cnt?sum/cnt:0; const rt=ratingOf(avg);
      rows.push([idx+1, e.code||e.username, e.name, getCompany(e.companyId).code, ...months, cnt?Math.round(avg*10)/10:'', cnt?rt.label:'']);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), `Năm ${y}`);
    const fn=`KPI_Nam_${y}.xlsx`;
    XLSX.writeFile(wb, fn);
    toast('Đã xuất: '+fn);
  }
};

function emailJSInit(){
  const db=getDB();
  const k=db.settings.emailjs;
  if(!k.publicKey) return false;
  try{ emailjs.init({publicKey:k.publicKey}); return true; }catch(e){ return false; }
}
async function sendEmail(toEmail, subject, body, attachmentBase64, attachmentName){
  const db=getDB();
  const k=db.settings.emailjs;
  if(!k.publicKey||!k.serviceId||!k.templateId) throw new Error('EmailJS chưa được cấu hình');
  if(!emailJSInit()) throw new Error('EmailJS init thất bại');
  const params={
    to_email: toEmail,
    to_name: toEmail.split('@')[0],
    subject, message: body,
    admin_email: db.settings.adminEmail||'',
    attachment: attachmentBase64||'',
    attachment_name: attachmentName||''
  };
  return emailjs.send(k.serviceId, k.templateId, params);
}

window.emailAllEmployees = async function(){
  const db=getDB();
  const period=document.getElementById('r-period').value;
  const list=filterUsers().filter(e=>e.email);
  if(!list.length){ toast('Không có nhân sự có email','warn'); return; }
  if(!db.settings.emailjs.publicKey){
    toast('Hãy cấu hình EmailJS trong "Cài đặt hệ thống" trước','error');
    return;
  }
  if(!confirm(`Sẽ gửi email tới ${list.length} nhân viên kèm bảng lương cá nhân tháng ${fmtPeriod(period)}. Tiếp tục?`)) return;
  let ok=0, fail=0;
  for(const e of list){
    try{
      // Tạo file Excel cá nhân — hỗ trợ đa nhiệm
      const s = computeSalaryMulti(e, period);
      const wb=XLSX.utils.book_new();
      const rows=[
        [`BẢNG LƯƠNG & KPI — ${e.name}`],
        ['Tháng', fmtPeriod(period)],
        ['Mã NV', e.code||e.username],
        ['Công ty', getCompany(e.companyId).name],
        ['Số mảng đảm nhiệm', s.bonuses.length],[],
        ['Lương cứng cơ bản', s.base],
        ['Hỗ trợ / Phụ cấp', s.allowance],[],
        ['—— Thưởng KPI từng mảng ——']
      ];
      s.bonuses.forEach(b=>{
        const ar=getArea(b.area);
        rows.push([`Mảng: ${ar?ar.name:b.area}`,
          `Điểm KPI: ${b.hasEval?b.kpiScore.toFixed(1):'(chưa chấm)'}`,
          `Xếp loại: ${b.rating?b.rating.label:'—'}`,
          `Thưởng: ${Math.round(b.kpiActual)}`]);
      });
      rows.push([]);
      rows.push(['Σ Thưởng KPI', Math.round(s.totalKpiActual)]);
      rows.push(['TỔNG LƯƠNG', Math.round(s.total)]);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Bảng lương');
      const b64 = XLSX.write(wb,{type:'base64', bookType:'xlsx'});
      const subj = `Bảng lương & KPI tháng ${fmtPeriod(period)} - ${e.name}`;
      const bonusLines = s.bonuses.map(b=>{
        const ar=getArea(b.area);
        return `  • ${ar?ar.name:b.area}: KPI ${b.hasEval?b.kpiScore.toFixed(1):'—'} (${b.rating?b.rating.label:'—'}) → thưởng ${fmtVND(Math.round(b.kpiActual))}`;
      }).join('\n');
      const body = `Kính gửi ${e.name},\n\nBảng lương tháng ${fmtPeriod(period)}:\n• Lương cứng cơ bản: ${fmtVND(s.base)}\n• Hỗ trợ: ${fmtVND(s.allowance)}\n• Thưởng KPI từng mảng (đa nhiệm):\n${bonusLines||'  (không có)'}\n• Σ Thưởng KPI: ${fmtVND(Math.round(s.totalKpiActual))}\n• TỔNG LƯƠNG: ${fmtVND(Math.round(s.total))}\n\nVui lòng xem file đính kèm để biết chi tiết.\n\nTrân trọng,\nPhòng Hành chính - Nhân sự`;
      await sendEmail(e.email, subj, body, b64, `Luong_${e.code||e.username}_${period}.xlsx`);
      ok++;
    }catch(err){ fail++; console.error(err); }
  }
  toast(`Gửi xong: ${ok} thành công, ${fail} lỗi`, fail?'warn':'success');
};

window.manualBackupDownload = function(){
  const db=getDB();
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download=`HRM_Backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url);
  db.settings.lastBackup=Date.now(); saveDB(db);
  toast('Đã tạo file sao lưu');
  render();
};
window.manualBackupEmail = async function(){
  const db=getDB();
  if(!db.settings.emailjs.publicKey){
    toast('Vui lòng cấu hình EmailJS trong Cài đặt hệ thống','error'); return;
  }
  try{
    const json = JSON.stringify(db);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    await sendEmail(db.settings.adminEmail||'nguyentuananh.emc@gmail.com',
      'Sao lưu HRM-EMC '+new Date().toLocaleDateString('vi-VN'),
      `File sao lưu dữ liệu hệ thống HRM-EMC ngày ${new Date().toLocaleString('vi-VN')}. Tổng nhân sự: ${db.users.length}. Vui lòng lưu file đính kèm cẩn thận.`,
      b64, `HRM_Backup_${new Date().toISOString().slice(0,10)}.json`);
    db.settings.lastBackup=Date.now(); saveDB(db);
    toast('Đã gửi sao lưu qua email','success');
    render();
  }catch(e){ toast('Lỗi gửi email: '+e.message, 'error'); }
};
window.restoreFromFile = function(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      if(!obj.users||!obj.settings) throw new Error('File không hợp lệ');
      if(!confirm(`Phục hồi dữ liệu từ ${f.name}? Mọi dữ liệu hiện tại sẽ bị thay thế.`)) return;
      saveDB(obj); toast('Đã phục hồi'); render();
    }catch(e){ toast('Lỗi: '+e.message,'error'); }
  };
  r.readAsText(f);
};
window.saveBackupCfg = function(){
  const db=getDB();
  db.settings.backupIntervalDays=Math.max(1, Number(document.getElementById('bk-int').value)||7);
  db.settings.adminEmail=document.getElementById('bk-email').value.trim();
  saveDB(db); toast('Đã lưu cấu hình');
};
window.resetAllData = async function(){
  if(!confirm('XÓA TOÀN BỘ dữ liệu? Bắt buộc phải khởi tạo lại từ đầu!')) return;
  if(!confirm('Xác nhận lần cuối — không thể hoàn tác!')) return;
  fbStopRealtime();
  _db = null;
  Session.clear();
  if(window._firebaseReady){
    try{ await window._fbSet(FB_PATH, null); }catch(e){ console.error('Firebase reset err',e); }
  }
  toast('Đã xóa toàn bộ dữ liệu','warn');
  setTimeout(()=>location.reload(), 1200);
};

window.doImportExcel = function(){
  const f=document.getElementById('imp-file').files[0];
  const area=document.getElementById('imp-area').value;
  if(!f){ toast('Chọn file','error'); return; }
  const r=new FileReader();
  r.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const db=getDB();
      // Tìm sheet "Cấu hình"
      const cfgSheetName = wb.SheetNames.find(n=>n.includes('Cấu hình')||n.toLowerCase().includes('cau hinh'));
      if(cfgSheetName){
        const ws=wb.Sheets[cfgSheetName];
        const aoa = XLSX.utils.sheet_to_json(ws,{header:1});
        const ranks=[];
        aoa.forEach(row=>{
          // Tìm dòng có Bậc dạng B4, B5, B6 hoặc TK-/TM-
          for(let i=0;i<row.length;i++){
            const c = String(row[i]||'').trim();
            if(/^(B\d|TK-\d|TM-\d)/.test(c)){
              const code=c;
              const name=String(row[i+1]||'').trim();
              const min=Number(row[i+2])||0;
              const max=Number(row[i+3])||0;
              const applied=Number(row[i+4])||0;
              const kpiPct=Number(row[i+5])||0;
              const allowance=Number(row[i+7])||0;
              if(name) ranks.push({code,name,min,max,applied,kpiPct,allowance});
              break;
            }
          }
        });
        if(ranks.length){
          db.salaryRanks[area]=ranks;
          toast(`Đã nạp ${ranks.length} bậc lương cho mảng ${getArea(area).name}`);
        }
      }
      saveDB(db); closeModal(); render();
    }catch(err){ toast('Lỗi đọc file: '+err.message,'error'); }
  };
  r.readAsArrayBuffer(f);
};

function autoBackupCheck(){
  const db=getDB();
  if(!db.settings.lastBackup) return false;
  const elapsed = Date.now() - db.settings.lastBackup;
  const limit = db.settings.backupIntervalDays * 86400000;
  if(elapsed > limit){
    // Tự động sao lưu nếu đã quá hạn
    if(db.settings.emailjs.publicKey){
      // Gửi mail âm thầm
      manualBackupEmail().catch(()=>{});
    }else{
      // Tạo file local
      manualBackupDownload();
    }
    return true;
  }
  return false;
}

// [PATCH] Chuẩn hóa chuỗi giờ về dạng HH:MM (24h). Trả về '' nếu không hợp lệ.
function _normalizeTimeStr(s){
  if(!s) return '';
  s = String(s).trim();
  // Loại bỏ ký tự không phải số/dấu hai chấm
  if(!/^[0-9:]+$/.test(s)) return '';
  // Nếu chỉ gõ số (vd "830", "0830") → tự chèn dấu :
  if(!s.includes(':')){
    if(s.length===3) s = s[0]+':'+s.slice(1);
    else if(s.length===4) s = s.slice(0,2)+':'+s.slice(2);
    else return '';
  }
  const m = s.match(/^(\d{1,2}):(\d{1,2})$/);
  if(!m) return '';
  let h = Number(m[1]), mi = Number(m[2]);
  if(isNaN(h)||isNaN(mi)) return '';
  if(h<0||h>23||mi<0||mi>59) return '';
  return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
}
window.saveWorkTime = function(){
  const db=getDB();
  const st = _normalizeTimeStr(document.getElementById('set-work-start').value);
  const en = _normalizeTimeStr(document.getElementById('set-work-end').value);
  if(!st || !en){ toast('Giờ phải có định dạng HH:MM (VD: 08:00)','error'); return; }
  db.settings.workStartTime = st;
  db.settings.workEndTime   = en;
  db.settings.lateGraceMins = Math.max(0, Number(document.getElementById('set-grace').value)||0);
  saveDB(db); toast('Đã lưu cấu hình chung: '+st+' → '+en);
};
// [PATCH] Lưu cấu hình giờ làm việc theo từng công ty
window.saveCompanyWorkTime = function(){
  const db=getDB();
  if(!db.settings.companyWorkHours) db.settings.companyWorkHours={};
  let invalid = null;
  COMPANIES.forEach(co=>{
    const stRaw = document.getElementById('co-start-'+co.id).value || '';
    const enRaw = document.getElementById('co-end-'+co.id).value || '';
    const gr = document.getElementById('co-grace-'+co.id).value;
    // Bỏ trống cả 3 → xóa cấu hình riêng
    if(!stRaw && !enRaw && (gr===''||gr==null)){
      delete db.settings.companyWorkHours[co.id];
      return;
    }
    const st = stRaw ? _normalizeTimeStr(stRaw) : '';
    const en = enRaw ? _normalizeTimeStr(enRaw) : '';
    if((stRaw && !st) || (enRaw && !en)){ invalid = co.code; return; }
    db.settings.companyWorkHours[co.id] = {
      workStartTime: st || undefined,
      workEndTime:   en || undefined,
      lateGraceMins: gr===''||gr==null ? undefined : Math.max(0, Number(gr)||0)
    };
  });
  if(invalid){ toast(`Giờ của công ty ${invalid} không hợp lệ (cần HH:MM)`,'error'); return; }
  saveDB(db); toast('Đã lưu cấu hình giờ làm việc theo công ty');
};

window.saveSelfAssignTask = function(){
  const db=getDB(); const me=currentUser(); if(!me) return;
  const v=q=>document.getElementById(q)?.value||'';
  const title=v('sa-title').trim();
  if(!title){ toast('Nhập tên công việc','error'); return; }
  const projectId=v('sa-project');
  if(!projectId){ toast('Chọn dự án','error'); return; }
  const due=v('sa-due');
  db.tasks.push({
    id:uid('t'), createdAt:Date.now(), createdBy:me.id,
    projectId,
    title,
    assigneeId:me.id,
    area:v('sa-area')||'',
    kpiItemName:v('sa-kpiitem')||'', // [YC-HM]
    status:'inprogress', progress:0,
    dueDate: due?new Date(due).getTime():null,
    note:v('sa-note').trim(),
    selfAssigned:true   // [YC5] đánh dấu việc tự giao — chỉ Quản lý được xóa/duyệt
  });
  saveDB(db); closeModal(); render();
  toast('Đã tự giao việc cho mình — Quản lý sẽ là người duyệt tiến độ & hoàn thành');
};
// [PATCH] Tách render bảng công việc của tôi để có thể re-render khi toggle done
function renderMyTasksTable(){
  const u=currentUser(); if(!u) return;
  const db=getDB();
  const host=document.getElementById('my-tasks-table-wrap'); if(!host) return;
  const tasks=db.tasks.filter(t=>t.assigneeId===u.id).sort((a,b)=>(a.dueDate||0)-(b.dueDate||0));
  const activeTasks=tasks.filter(t=>t.status!=='done');
  const doneTasks=tasks.filter(t=>t.status==='done');
  const showDone = window._tasksShowDone===true;
  const rowHtml = (t, isDoneRow)=>{
    const stat = deadlineStatus(t);
    const behind = taskIsBehind(t);
    let dueStyle='', dueExtra='';
    if(stat==='overdue'){ dueStyle='color:#dc2626;font-weight:700;'; dueExtra='<span class="badge kpi-kem" style="margin-left:6px;font-size:10px">QUÁ HẠN</span>'; }
    else if(stat==='due'){ dueStyle='color:#dc2626;font-weight:700;'; dueExtra='<span class="badge kpi-kem" style="margin-left:6px;font-size:10px">HẾT HẠN (còn 0 ngày)</span>'; }
    else if(stat==='soon'){ dueStyle='color:#b45309;font-weight:600;'; dueExtra='<span class="badge kpi-dat" style="margin-left:6px;font-size:10px">SẮP HẾT HẠN</span>'; }
    if(behind) dueExtra += '<span class="badge kpi-kem" style="margin-left:6px;font-size:10px">⚠ CHẬM</span>';
    const prog = Math.max(0, Math.min(100, Number(t.progress)||0));
    // [REQ1] Hiển thị rõ DỰ ÁN chứa công việc (tên dự án đầy đủ + số HĐ)
    const proj = t.projectId ? db.contracts.find(c=>c.id===t.projectId) : null;
    const areaLabel = proj
      ? `<div><span class="badge co">🏗 Dự án</span> <b>${escapeHtml(proj.name||proj.code||'')}</b>${proj.code?`<div class="hint muted">Số HĐ: ${escapeHtml(proj.code)}</div>`:''}</div>`
      : (t.area?`<span class="badge area-${t.area}">${getArea(t.area).name}</span>`:'<span class="muted">Việc chung</span>');
    // [REQ2] Trạng thái xin gia hạn deadline
    if(t.extReq && t.extReq.status==='pending'){
      dueExtra += `<span class="badge kpi-dat" style="margin-left:6px;font-size:10px" title="Lý do: ${escapeHtml(t.extReq.reason||'')}">⏳ ĐANG XIN GIA HẠN → ${fmtDate(t.extReq.newDue)}</span>`;
    } else if(t.extReq && t.extReq.status==='rejected'){
      dueExtra += `<span class="badge kpi-kem" style="margin-left:6px;font-size:10px" title="${escapeHtml(t.extReq.decisionNote||'')}">✗ GIA HẠN BỊ TỪ CHỐI</span>`;
    } else if(t.extReq && t.extReq.status==='approved'){
      dueExtra += `<span class="badge kpi-xs" style="margin-left:6px;font-size:10px;background:#dcfce7;color:#166534">✓ ĐÃ GIA HẠN</span>`;
    }
    const giver=db.users.find(x=>x.id===t.createdBy);
    const rowBg = behind && !isDoneRow ? 'background:#fff5f5;' : '';
    const rowStyle = isDoneRow ? 'text-decoration:line-through;color:#94a3b8;' : '';
    const pend = t.pendingComplete && !isDoneRow;
    const cb = `<input type="checkbox" ${isDoneRow||pend?'checked':''} title="${isDoneRow?'Bỏ tích để chuyển về Đang thực hiện':(pend?'Đang chờ duyệt — bỏ tích để hủy đề xuất':'Tích để ĐỀ XUẤT hoàn thành (gửi quản lý duyệt)')}" onchange="toggleTaskDone('${t.id}', this.checked)">${pend?'<div style="font-size:9px;color:#92400e;font-weight:700">⏳ chờ duyệt</div>':''}`;
    return `<tr style="${rowBg}${rowStyle}">
      <td style="text-align:center">${cb}</td>
      <td><b>${escapeHtml(t.title)}</b></td>
      <td><b>${escapeHtml(giver?.name||'—')}</b></td>
      <td>${areaLabel}</td>
      <td>${fmtDate(t.createdAt)}</td>
      <td style="${dueStyle}">${fmtDate(t.dueDate)}${dueExtra}</td>
      <td>${taskStatusBadge(t.status)}</td>
      <td>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="range" min="0" max="100" value="${prog}" id="mt-prog-${t.id}" oninput="document.getElementById('mt-prog-val-${t.id}').textContent=this.value+'%'" style="flex:1;min-width:80px">
          <span id="mt-prog-val-${t.id}" style="font-weight:600;width:42px;text-align:right;font-size:12px">${prog}%</span>
          <button class="btn sm success" style="padding:3px 8px" onclick="saveMyTaskProgress('${t.id}')" title="Lưu tiến độ">💾</button>
        </div>
        <div style="background:#f1f5f9;height:6px;border-radius:99px;margin-top:4px;overflow:hidden">
          <div style="width:${prog}%;height:6px;background:#1e3a8a"></div>
        </div>
      </td>
      <td class="muted">${escapeHtml(t.note||'')}${(!isDoneRow && t.dueDate)?(function(){
        // [YC5] Chỉ cho xin gia hạn khi còn ≥ 12 TIẾNG trước hạn — sau đó nút bị khóa
        const msLeft = t.dueDate - Date.now();
        if(msLeft < EXT_MIN_LEAD_MS){
          return `<div style="margin-top:5px"><button class="btn sm outline" style="padding:2px 7px;font-size:11px;opacity:.45;cursor:not-allowed" disabled title="Đã quá thời điểm cho phép — chỉ được xin gia hạn khi còn ít nhất 12 tiếng trước hạn">⏰ Xin gia hạn (đã khóa)</button><div style="font-size:10px;color:#dc2626">⛔ Còn &lt; 12h — không thể xin gia hạn</div></div>`;
        }
        return `<div style="margin-top:5px"><button class="btn sm outline" style="padding:2px 7px;font-size:11px" onclick="openExtensionRequest('${t.id}')" title="Đề nghị gia hạn thời gian hoàn thành (phải trước hạn ít nhất 12 tiếng)">⏰ Xin gia hạn</button></div>`;
      })():''}</td>
    </tr>`;
  };
  host.innerHTML = `
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th style="width:36px"></th>
        <th>Nhiệm vụ</th>
        <th>Người giao việc</th>
        <th>Mảng / Dự án</th>
        <th>Ngày giao</th>
        <th>Hạn hoàn thành</th>
        <th>Trạng thái</th>
        <th style="min-width:220px">Tiến độ %</th>
        <th>Ghi chú</th>
      </tr></thead>
      <tbody>${activeTasks.map(t=>rowHtml(t,false)).join('') || '<tr><td colspan="9" class="empty">Không có nhiệm vụ đang thực hiện</td></tr>'}</tbody>
    </table></div>
    <!-- [PATCH] Card công việc đã hoàn thành — thu gọn -->
    <div class="card" style="margin-top:14px;border:1px solid #cbd5e1">
      <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleDoneCard()">
        <h3 style="margin:0">✅ Công việc đã hoàn thành <span class="badge" style="background:#dcfce7;color:#166534">${doneTasks.length}</span></h3>
        <button class="btn sm outline" type="button">${showDone?'▲ Thu gọn':'▼ Mở rộng'}</button>
      </div>
      <div id="done-tasks-body" style="margin-top:10px;display:${showDone?'block':'none'}">
        ${showDone ? `<div class="tbl-wrap"><table><thead><tr>
          <th style="width:36px"></th>
          <th>Nhiệm vụ</th><th>Người giao việc</th><th>Mảng / Dự án</th>
          <th>Ngày giao</th><th>Hạn hoàn thành</th><th>Trạng thái</th>
          <th style="min-width:220px">Tiến độ %</th><th>Ghi chú</th>
        </tr></thead><tbody>${doneTasks.map(t=>rowHtml(t,true)).join('') || '<tr><td colspan="9" class="empty">Chưa có công việc hoàn thành</td></tr>'}</tbody></table></div>`
        : `<ul style="margin:0;padding-left:18px;color:#64748b;text-decoration:line-through">${doneTasks.map(t=>`<li>${escapeHtml(t.title)}</li>`).join('') || '<li class="muted" style="text-decoration:none">Chưa có công việc hoàn thành</li>'}</ul>`
        }
      </div>
    </div>
  `;
}
