          actionConfirm:`confirmPcccDelete('${cid}','rec','${it.id}')`,
          actionReject:`rejectPcccDelete('${cid}','rec','${it.id}')`});
      }
    });

    const allPending = [...pendingProgressList, ...pendingSlips, ...pendingDocs];
    const overCount = allPending.filter(x=>x.overTime).length;
    if(allPending.length){
      pendingApprovalHtml = `<div class="card" style="border-left:5px solid ${overCount?'#dc2626':'#f59e0b'};background:${overCount?'#fee2e2':'#fffbeb'}">
        <h3 style="margin:0 0 8px 0;color:${overCount?'#991b1b':'#92400e'}">📥 Hồ sơ chờ duyệt (${allPending.length})${overCount?` — 🚨 <b>${overCount}</b> quá 4 giờ chưa duyệt!`:''}</h3>
        <div class="tbl-wrap"><table style="font-size:12px">
          <thead><tr><th>Loại</th><th>Nội dung</th><th>Người gửi</th><th>Đã chờ</th><th></th></tr></thead>
          <tbody>${allPending.map(p=>{
            const hrs = (p.elapsed/3600000);
            const elapsedStr = hrs<1 ? `${Math.round(hrs*60)} phút` : `${hrs.toFixed(1)} giờ`;
            const typeBadge = {
              progress:'<span class="badge" style="background:#dbeafe;color:#1e40af">Tiến độ</span>',
              done:'<span class="badge" style="background:#dcfce7;color:#166534">Hoàn thành</span>',
              slip:'<span class="badge" style="background:#fed7aa;color:#9a3412">Phiếu nhập</span>',
              doc:'<span class="badge" style="background:#e0e7ff;color:#3730a3">Hồ sơ KT</span>',
              rec:'<span class="badge" style="background:#fce7f3;color:#9d174d">Biên bản</span>'
            }[p.type] || '';
            return `<tr ${p.overTime?'style="background:#fee2e2"':''}>
              <td>${typeBadge}</td>
              <td><b>${escapeHtml(p.title)}</b></td>
              <td class="muted">${escapeHtml(p.sub||'')}</td>
              <td style="${p.overTime?'color:#dc2626;font-weight:700':''}">${elapsedStr}${p.overTime?' 🚨':''}</td>
              <td>
                ${p.actionConfirm?`<button class="btn sm success" onclick="${p.actionConfirm}">✓ Duyệt</button>`:''}
                ${p.actionReject?`<button class="btn sm danger" onclick="${p.actionReject}">✗ Từ chối</button>`:''}
                ${p.actionView?`<button class="btn sm outline" onclick="${p.actionView}">👁 Xem</button>`:''}
              </td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
        ${overCount?`<div style="margin-top:8px;color:#991b1b;font-weight:600">🚨 Vui lòng duyệt ngay các hồ sơ đã quá 4 giờ để tránh ảnh hưởng tiến độ dự án!</div>`:''}
      </div>`;
    }
  }
  // ----- GANTT (full title wrap + progress bar trắng→xanh + cảnh báo chậm) -----
  // [REQ3] Mốc Gantt lấy theo NGÀY BẮT ĐẦU / KẾT THÚC của DỰ ÁN (thông tin hợp đồng)
  const dated=tasks.filter(t=>t.startDate||t.dueDate);
  let ganttHtml='<div class="muted" style="padding:10px">Chưa có công việc nào có mốc thời gian. Hãy thêm Ngày bắt đầu / Hạn hoàn thành khi giao việc.</div>';
  // Có thể vẽ Gantt nếu dự án có ngày bắt đầu/kết thúc HOẶC có công việc có mốc thời gian
  if(dated.length || c.signDate || c.completeDate){
    let min=Infinity,max=-Infinity;
    dated.forEach(t=>{ const s=t.startDate||t.dueDate, e=t.dueDate||t.startDate; if(s<min)min=s; if(e>max)max=e; });
    // Ưu tiên khung thời gian theo dự án (ngày ký HĐ → ngày kết thúc dự kiến)
    if(c.signDate){ min = Math.min(min, c.signDate); }
    if(c.completeDate){ max = Math.max(max, c.completeDate); }
    if(!isFinite(min)) min = c.signDate || Date.now();
    if(!isFinite(max)) max = c.completeDate || (min+30*86400000);
    if(max<=min) max=min+86400000;
    const span=max-min;
    const nowPct = Math.max(0, Math.min(100, (Date.now()-min)/span*100));
    const projStartPct = c.signDate ? Math.max(0, Math.min(100, (c.signDate-min)/span*100)) : null;
    const projEndPct   = c.completeDate ? Math.max(0, Math.min(100, (c.completeDate-min)/span*100)) : null;
    ganttHtml=`<div style="font-size:11px;color:#64748b;margin-bottom:4px;display:flex;justify-content:space-between"><span>📅 Bắt đầu dự án: <b>${fmtDate(min)}</b></span><span>🏁 Kết thúc dự án: <b>${fmtDate(max)}</b></span></div>`
      + `<div style="position:relative;margin-bottom:6px"><div style="position:absolute;left:calc(320px + ${nowPct}% * (100% - 320px) / 100);top:-4px;width:2px;height:calc(100% + 8px);background:#dc2626;z-index:2" title="Hôm nay"></div></div>`
      + dated.map(t=>{
        const s=t.startDate||t.dueDate, e=t.dueDate||t.startDate;
        const left=(s-min)/span*100, w=Math.max(3,(e-s)/span*100);
        const prog = Math.max(0, Math.min(100, Number(t.progress)||0));
        const hasPending = t.pendingProgress!=null;
        const pendingProg = hasPending ? Math.max(0, Math.min(100, Number(t.pendingProgress)||0)) : null;
        const behind = taskIsBehind(t);
        const done = t.status==='done' || prog>=100;
        const emp=db.users.find(x=>x.id===t.assigneeId);
        const exp = taskExpectedProgress(t);
        // Màu khung bar
        let barBorder = '#cbd5e1';
        let titleBg = '#fff';
        if(hasPending){ barBorder='#f59e0b'; titleBg='#fef3c7'; }   // VÀNG: chờ xác nhận
        else if(done){ barBorder='#16a34a'; titleBg='#dcfce7'; }
        else if(behind){ barBorder='#dc2626'; titleBg='#fee2e2'; }
        const canAppr = (function(){ const _me=currentUser(); return _me && (_me.role==='admin' || t.createdBy===_me.id); })(); // [REQ13] chỉ người giao việc + admin
        return `<div style="display:flex;gap:8px;margin-bottom:8px;align-items:stretch">
          <div style="width:320px;flex-shrink:0;background:${titleBg};border-radius:6px;padding:6px 8px;border:1px solid ${barBorder}">

            ${hasPending?`<div style="font-size:10.5px;color:#b45309;font-weight:600;margin-top:2px">⏳ NV gửi cập nhật <b>${pendingProg.toFixed(0)}%</b> — chờ xác nhận${canAppr?` <button class="btn sm success" style="padding:1px 6px;margin-left:4px" onclick="confirmTaskProgress('${t.id}')">✓</button><button class="btn sm danger" style="padding:1px 6px" onclick="rejectTaskProgress('${t.id}')">✗</button>`:''}</div>`:''}
            ${(!hasPending && behind)?`<div style="font-size:10.5px;color:#dc2626;font-weight:600;margin-top:2px">⚠ CHẬM ${(exp-prog).toFixed(0)}% so với kế hoạch</div>`:''}
          </div>
          <div style="flex:1;position:relative;background:#f8fafc;border-radius:6px;min-height:40px">
            <div style="position:absolute;left:${left}%;width:${w}%;top:6px;height:28px;background:#fff;border:2px solid ${barBorder};border-radius:5px;overflow:hidden">
              <div style="height:100%;width:${prog}%;background:#1e3a8a;transition:width .3s"></div>
              ${hasPending?`<div style="position:absolute;top:0;height:100%;width:${pendingProg}%;background:repeating-linear-gradient(45deg,#f59e0b,#f59e0b 4px,#fbbf24 4px,#fbbf24 8px);opacity:.55"></div>`:''}
              <div style="position:absolute;top:0;left:0;right:0;height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:${prog>50?'#fff':'#1e3a8a'};text-shadow:0 0 2px ${prog>50?'#1e3a8a':'#fff'}">
                ${prog.toFixed(0)}%${hasPending?' ⏳→'+pendingProg.toFixed(0)+'%':''}${behind&&!hasPending?' ⚠':''}${done?' ✓':''}
              </div>
            </div>
          </div></div>`;
      }).join('');
  }
  // ----- KANBAN -----
  const kanbanHtml=`<div class="grid-3" style="gap:10px;align-items:start">${cols.map(col=>{
    const list=tasks.filter(t=>(t.status||'new')===col.k);
    return `<div style="background:${col.css};border-radius:8px;padding:8px;min-height:80px">
      <div style="font-weight:700;font-size:13px;margin-bottom:6px">${col.title} (${list.length})</div>
      ${list.map(t=>{
        const emp=db.users.find(x=>x.id===t.assigneeId);
        const st=deadlineStatus(t);
        const behind = taskIsBehind(t);
        const hasPending = t.pendingProgress!=null;
        const warn = hasPending?'<span class="badge" style="font-size:9px;background:#fef3c7;color:#92400e">⏳ CHỜ XN</span>'
                  : behind?'<span class="badge kpi-kem" style="font-size:9px">⚠ CHẬM TIẾN ĐỘ</span>'
                  : (st==='overdue'?'<span class="badge kpi-kem" style="font-size:9px">QUÁ HẠN</span>'
                  : (st==='soon'?'<span class="badge kpi-dat" style="font-size:9px">SẮP HẾT HẠN</span>':''));
        const prog = Math.max(0, Math.min(100, Number(t.progress)||0));
        const pendBg = hasPending ? 'background:#fef9c3;border-color:#f59e0b' : '';
        const canAppr = (function(){ const _me=currentUser(); return _me && (_me.role==='admin' || t.createdBy===_me.id); })(); // [REQ13] chỉ người giao việc + admin
        return `<div style="background:#fff;border:1px solid #cbd5e1;${pendBg};border-radius:6px;padding:7px;margin-bottom:6px;font-size:12px">
          <b>${escapeHtml(t.title)}</b> ${warn}
          <div class="muted" style="font-size:11px;margin:3px 0">👤 ${escapeHtml(emp?.name||'—')}${t.dueDate?' · ⏰ '+fmtDate(t.dueDate):''}</div>
          <div style="background:#f1f5f9;border-radius:99px;height:8px;overflow:hidden;margin:4px 0"><div style="width:${prog}%;height:8px;background:#1e3a8a"></div></div>
          <div style="font-size:10px;color:#64748b;margin-bottom:4px">${prog.toFixed(0)}% hoàn thành${hasPending?` <span style="color:#b45309;font-weight:600">→ NV đề nghị ${Number(t.pendingProgress).toFixed(0)}%</span>`:''}</div>
          ${hasPending&&canAppr?`<div style="display:flex;gap:4px;margin-bottom:4px"><button class="btn sm success" style="padding:1px 8px" onclick="confirmTaskProgress('${t.id}')">✓ Xác nhận</button><button class="btn sm danger" style="padding:1px 8px" onclick="rejectTaskProgress('${t.id}')">✗ Từ chối</button></div>`:''}
          ${isEmp ? (
            (t.assigneeId===myId && !hasPending) ? `<div style="display:flex;gap:4px;align-items:center;margin-top:4px">
                <input type="range" min="0" max="100" value="${prog}" id="kb-prog-${t.id}" oninput="document.getElementById('kb-prog-val-${t.id}').textContent=this.value+'%'" style="flex:1;min-width:60px">
                <span id="kb-prog-val-${t.id}" style="font-size:10px;font-weight:600;width:34px;text-align:right">${prog.toFixed(0)}%</span>
                <button class="btn sm success" style="padding:1px 6px" title="Trình tiến độ lên quản lý phê duyệt" onclick="submitProjectTaskProgress('${t.id}')">📤 Trình</button>
              </div>` : ''
          ) : `<div style="display:flex;gap:4px;flex-wrap:wrap">
            ${col.k!=='new'?`<button class="btn sm outline" style="padding:1px 6px" onclick="moveProjectTask('${t.id}','${col.k==='done'?'inprogress':'new'}')">←</button>`:''}
            ${col.k!=='done'?`<button class="btn sm outline" style="padding:1px 6px" onclick="moveProjectTask('${t.id}','${col.k==='new'?'inprogress':'done'}')">→</button>`:''}
            <button class="btn sm outline" style="padding:1px 6px" onclick="openProjectTaskForm('${cid}','${t.id}')">✏</button>
            <button class="btn sm danger" style="padding:1px 6px" onclick="delProjectTask('${cid}','${t.id}')">🗑</button>
          </div>`}</div>`;
      }).join('')||'<div class="muted" style="font-size:11px">—</div>'}
    </div>`;
  }).join('')}</div>`;
  host.innerHTML=`
    <div class="help-text">💡 ${isEmp
      ? 'Bạn theo dõi toàn bộ Gantt &amp; bảng Kanban của dự án. Với công việc <b>được giao cho bạn</b>, hãy kéo thanh tiến độ rồi bấm <b>📤 Trình</b> để gửi % tiến độ lên quản lý phê duyệt.'
      : 'Lập kế hoạch thi công cho từng hạng mục (Lắp đặt đường ống, kéo cáp tín hiệu, lắp đặt tủ trung tâm…). Mỗi công việc giao cho 1 nhân viên sẽ <b>tự hiển thị trong "Theo dõi công việc"</b> của nhân viên đó — nhân viên tự cập nhật % tiến độ.'}</div>
    ${pendingApprovalHtml}
    ${alertHtml}
    ${isEmp?'':`<div style="margin-bottom:10px"><button class="btn success" onclick="openProjectTaskForm('${cid}')">+ Giao việc thi công</button></div>`}
    <h3>📊 Tiến độ tổng thể (Gantt)</h3>
    <div class="card" style="background:#eff6ff;border-left:4px solid #2563eb;padding:8px 12px;margin-bottom:8px;font-size:13px">
      📅 <b>Thời gian dự án:</b> ${c.signDate?fmtDate(c.signDate):'(chưa nhập ngày bắt đầu)'} → ${c.completeDate?fmtDate(c.completeDate):'(chưa nhập ngày kết thúc)'}
      <span class="muted" style="font-size:11px">(lấy theo Ngày bắt đầu / Ngày kết thúc trong Thông tin dự án)</span>
    </div>
    <div class="card">${ganttHtml}</div>
    <h3>🗂 Bảng công việc (Kanban)</h3>
    ${kanbanHtml}
  `;
}
window.moveProjectTask=function(id,st){ const db=getDB(); const t=db.tasks.find(x=>x.id===id); if(t){ t.status=st; saveDB(db); renderPopupBody(); } };
/* NV trình % tiến độ công việc của mình lên quản lý phê duyệt (ghi pendingProgress) */
window.submitProjectTaskProgress=function(taskId){
  const db=getDB(); const t=db.tasks.find(x=>x.id===taskId); if(!t) return;
  const me=currentUser();
  if(t.assigneeId!==me?.id){ toast('Bạn chỉ trình được tiến độ công việc được giao cho mình','error'); return; }
  const inp=document.getElementById('kb-prog-'+taskId); if(!inp) return;
  const val=Math.max(0, Math.min(100, Number(inp.value)||0));
  t.pendingProgress=val;
  t.pendingAt=Date.now();
  t.pendingBy=me?.id;
  saveDB(db); renderPopupBody();
  toast(`Đã trình tiến độ ${val}% — chờ quản lý phê duyệt`,'info');
};
window.delProjectTask=function(cid,id){ if(!confirm('Xóa công việc này?'))return; const db=getDB(); db.tasks=db.tasks.filter(t=>t.id!==id); saveDB(db); renderPopupBody(); toast('Đã xóa công việc'); };

window.saveProjectTask=function(cid,taskId){
  const db=getDB(); const v=q=>document.getElementById(q).value;
  const title=v('pt-title').trim(); if(!title){ toast('Nhập tên công việc/hạng mục','error'); return; }
  let t;
  if(taskId){ t=db.tasks.find(x=>x.id===taskId); }
  else { t={id:uid('t'), createdAt:Date.now(), createdBy:(currentUser()||{}).id}; db.tasks.push(t); }
  t.title=title; t.projectId=cid; t.assigneeId=v('pt-assignee'); t.area=v('pt-area');
  const sd=v('pt-start'), dd=v('pt-due');
  t.startDate=sd?new Date(sd).getTime():null;
  t.dueDate=dd?new Date(dd).getTime():null;
  t.status=v('pt-status'); t.note=v('pt-note').trim();
  const pv=v('pt-progress');
  t.progress = pv===''?(t.progress||0):Math.max(0, Math.min(100, Number(pv)||0));
  if(t.progress>=100) t.status='done';
  saveDB(db); closeModal(); renderPopupBody(); toast('Đã lưu công việc — nhân viên sẽ thấy trong mục Theo dõi công việc');
};

/* ============================================================
   MODULE DỰ ÁN — TAB 2.3: Hồ sơ kỹ thuật & pháp lý PCCC
   Mỗi dự án có 2 danh sách động: pcccDocList[] và pcccRecList[]
   ============================================================ */
function _ensurePcccLists(c){
  // Khởi tạo lần đầu từ default
  if(!Array.isArray(c.pcccDocList)){
    c.pcccDocList = [];
    // Lấy từ object cũ nếu có (migration), nếu không dùng default
    if(c.pcccDocs && typeof c.pcccDocs==='object' && !Array.isArray(c.pcccDocs)){
      PCCC_DOC_STAGES.forEach(s=>{
        const d=c.pcccDocs[s.key]||{};
        c.pcccDocList.push({id:uid('pd'), name:s.label, link:d.link||'', status:d.status||'none', assigneeId:d.assigneeId||''});
      });
    } else {
      PCCC_DOC_STAGES.forEach(s=>c.pcccDocList.push({id:uid('pd'), name:s.label, link:'', status:'none', assigneeId:''}));
    }
  }
  if(!Array.isArray(c.pcccRecList)){
    c.pcccRecList = [];
    if(c.pcccRecords && typeof c.pcccRecords==='object' && !Array.isArray(c.pcccRecords)){
      PCCC_RECORDS.forEach(s=>{
        const d=c.pcccRecords[s.key]||{};
        c.pcccRecList.push({id:uid('pr'), name:s.label, link:d.link||'', status:d.status||'none', assigneeId:d.assigneeId||''});
      });
    } else {
      PCCC_RECORDS.forEach(s=>c.pcccRecList.push({id:uid('pr'), name:s.label, link:'', status:'none', assigneeId:''}));
    }
  }
}

function renderPopupPCCC(host, cid){
  const db=getDB(); const c=db.contracts.find(x=>x.id===cid); if(!c) return;
  _ensurePcccLists(c); saveDB(db);
  const emps=getProjectEmployees(c);
  const me=currentUser();
  const isEmp = me?.role==='employee';
  const canAppr=canApprove();
  const empOpts=(sel)=>`<option value="">— Chọn NV —</option>`+emps.map(e=>`<option value="${e.id}" ${sel===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('');

  const renderRows = (list, scope)=> list.map(it=>{
    const locked = !!it.confirmedCompleted; // NV không sửa được khi đã được trưởng phòng xác nhận

      <td class="center">
        ${locked
          ? `<span class="badge kpi-xs" title="Đã được trưởng nhóm xác nhận">✓ HOÀN THIỆN</span>`
          : pendingDone
            ? `<span class="badge" style="background:#fef3c7;color:#92400e">⏳ Chờ XN</span>`
            : `<input type="checkbox" ${it.pendingCompleted?'checked':''} onchange="togglePcccPending('${cid}','${scope}','${it.id}',this.checked)"> <span style="font-size:11px">đã hoàn thiện HS</span>`}
        ${canAppr && !locked && pendingDone ? `<br><button class="btn sm success" style="padding:1px 6px;margin-top:4px" onclick="confirmPcccCompleted('${cid}','${scope}','${it.id}')">✓ Xác nhận</button>` : ''}
        ${canAppr && !locked && !pendingDone ? `<br><button class="btn sm" style="padding:1px 6px;margin-top:4px;font-size:10px" onclick="confirmPcccCompleted('${cid}','${scope}','${it.id}')">Đánh dấu hoàn thiện</button>` : ''}
        ${canAppr && locked ? `<br><button class="btn sm warn" style="padding:1px 6px;margin-top:4px;font-size:10px" onclick="unconfirmPcccCompleted('${cid}','${scope}','${it.id}')">↩ Hủy XN</button>` : ''}
      </td>
      <td>
        ${pendingDel ? `<span class="badge" style="background:#fee2e2;color:#991b1b">🗑 Chờ duyệt xóa</span>
          ${canAppr ? `<br><button class="btn sm danger" style="padding:1px 6px;margin-top:4px" onclick="confirmPcccDelete('${cid}','${scope}','${it.id}')">✓ Duyệt xóa</button>
          <button class="btn sm outline" style="padding:1px 6px;margin-top:4px" onclick="rejectPcccDelete('${cid}','${scope}','${it.id}')">✗ Hủy</button>` : ''}`

window.togglePcccPending = function(cid, scope, itemId, checked){
  const db=getDB(); const c=db.contracts.find(x=>x.id===cid); if(!c) return;
  const list = scope==='doc' ? c.pcccDocList : c.pcccRecList;
  const it = (list||[]).find(x=>x.id===itemId); if(!it) return;
  if(it.confirmedCompleted){ toast('Đã được trưởng nhóm xác nhận — không sửa được','warn'); return; }
  if(checked){
    // Hiển thị modal chọn người Quản lý duyệt
    submitPcccToPM(cid, scope, itemId);
    return;
  }
  it.pendingCompleted = false;
  it.submittedToPMId = null;
  saveDB(db); renderPopupBody();
  toast('Đã bỏ đánh dấu','warn');
};
window.submitPcccToPM = function(cid, scope, itemId){
  const db=getDB(); const c=db.contracts.find(x=>x.id===cid); if(!c) return;
  const list = scope==='doc' ? c.pcccDocList : c.pcccRecList;
  const it = (list||[]).find(x=>x.id===itemId); if(!it) return;
  const approvers = getProjectApprovers(c);
  if(!approvers.length){
    // Không có người duyệt → đánh dấu pending không cụ thể
    it.pendingCompleted = true;
    it.pendingBy = currentUser()?.id;
    it.pendingAt = Date.now();
    saveDB(db); renderPopupBody();
    toast('Đã đánh dấu hoàn thiện — chờ duyệt','info');
    return;
  }
  openModal({
    title:`📤 Trình hồ sơ "${escapeHtml(it.name||'')}" lên Quản lý`, size:'sm',
    html:`
      <div class="help-text">Chọn người Quản lý / Trưởng nhóm để gửi hồ sơ xác nhận hoàn thiện. Họ sẽ nhận thông báo trong "Hồ sơ chờ duyệt".</div>
      <div class="field"><label>👨‍💼 Trình lên *</label>
        <select id="pccc-submit-to" autofocus>
          ${approvers.map(a=>`<option value="${a.id}">${escapeHtml(a.name)} — ${roleLabel(a.role)}${(c.projectManagers||[]).includes(a.id)?' (QL DA)':''}</option>`).join('')}
        </select>
      </div>
    `,
    footer:`<button class="btn outline" onclick="cancelPcccSubmit('${cid}','${scope}','${itemId}')">Hủy</button>
            <button class="btn success" onclick="confirmPcccSubmit('${cid}','${scope}','${itemId}')">📤 Trình duyệt</button>`
  });
};

window.confirmPcccCompleted = function(cid, scope, itemId){
  if(!canApprove()){ toast('Chỉ trưởng nhóm/admin có quyền xác nhận','error'); return; }
  const db=getDB(); const c=db.contracts.find(x=>x.id===cid); if(!c) return;
  const list = scope==='doc' ? c.pcccDocList : c.pcccRecList;
  const it = (list||[]).find(x=>x.id===itemId); if(!it) return;
  it.confirmedCompleted = true;
  it.pendingCompleted = false;
  it.status = 'done';
  it.confirmedAt = Date.now();
  it.confirmedBy = currentUser()?.id;
  saveDB(db); renderPopupBody();
  toast('Đã xác nhận hoàn thiện — NV không sửa được nữa','success');
};
window.unconfirmPcccCompleted = function(cid, scope, itemId){
  if(!canApprove()){ toast('Chỉ trưởng nhóm/admin có quyền','error'); return; }
  if(!confirm('Hủy xác nhận hoàn thiện? NV sẽ được phép sửa lại biên bản này.')) return;
  const db=getDB(); const c=db.contracts.find(x=>x.id===cid); if(!c) return;
  const list = scope==='doc' ? c.pcccDocList : c.pcccRecList;
  const it = (list||[]).find(x=>x.id===itemId); if(!it) return;
  it.confirmedCompleted = false;
  it.confirmedAt = null;
  it.confirmedBy = null;
  saveDB(db); renderPopupBody();
  toast('Đã hủy xác nhận','warn');
};

window.removePcccItem = function(cid, scope, itemId){
  const db=getDB(); const c=db.contracts.find(x=>x.id===cid); if(!c) return;
  const list = scope==='doc' ? c.pcccDocList : c.pcccRecList;
  const it = (list||[]).find(x=>x.id===itemId);
  if(it && it.confirmedCompleted && !canApprove()){
    toast('Biên bản đã được xác nhận hoàn thiện — không được xóa','error'); return;
  }
  // NV không có quyền duyệt → gửi YÊU CẦU xóa, chờ Trưởng phòng/Quản lý phê duyệt
  if(!canApprove()){
    if(it && it.pendingDelete){ toast('Hồ sơ này đã được gửi yêu cầu xóa, đang chờ phê duyệt','warn'); return; }
    if(!confirm('Gửi YÊU CẦU XÓA hồ sơ này lên Trưởng phòng / Quản lý phê duyệt?\n(Hồ sơ chỉ bị xóa sau khi được phê duyệt.)')) return;
    if(it){
      it.pendingDelete = true;
      it.pendingDeleteBy = currentUser()?.id;
      it.pendingDeleteAt = Date.now();
    }
    saveDB(db); renderPopupBody();
    toast('Đã gửi yêu cầu xóa — chờ Trưởng phòng/Quản lý phê duyệt','info');
    return;
  }
  if(!confirm('Xóa mục này?')) return;
  if(scope==='doc') c.pcccDocList = (c.pcccDocList||[]).filter(x=>x.id!==itemId);
  else c.pcccRecList = (c.pcccRecList||[]).filter(x=>x.id!==itemId);
  saveDB(db); renderPopupBody(); toast('Đã xóa');
};

/* ============================================================
   [PATCH 6.1] MODULE DỰ ÁN — TAB 5: Quản lý Bảo lãnh Ngân hàng
   3 loại: thực hiện hợp đồng / tạm ứng / bảo hành
   Mỗi BL theo dõi: ngân hàng, số BL, giá trị, tỷ lệ ký quỹ, tiền ký quỹ,
   tiền phong tỏa, lịch sử giải tỏa, tổng đã giải tỏa, ngày phát hành/hết hạn,
   trạng thái. Cảnh báo BL sắp hết hạn.
   ============================================================ */
const GUARANTEE_TYPES = [
  {v:'performance', label:'Bảo lãnh thực hiện hợp đồng'},
  {v:'advance',     label:'Bảo lãnh tạm ứng'},
  {v:'warranty',    label:'Bảo lãnh bảo hành'}
];
const GUARANTEE_STATUS = [
  {v:'active',   label:'Đang hiệu lực', color:'#16a34a'},
  {v:'partial',  label:'Đã giải tỏa 1 phần', color:'#f59e0b'},
  {v:'released', label:'Đã giải tỏa hết',  color:'#64748b'},
  {v:'expired',  label:'Hết hạn',          color:'#dc2626'},
  {v:'cancelled',label:'Đã hủy',           color:'#94a3b8'}
];
function _ensureGuaranteeList(c){
  if(!Array.isArray(c.guarantees)) c.guarantees=[];
  c.guarantees.forEach(g=>{
    if(!Array.isArray(g.releases)) g.releases=[];
  });
}
function _guaranteeCalc(g){
  const releases = g.releases||[];
  const totalReleased = releases.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const value = Number(g.value)||0;
  const depositRate = Number(g.depositRate)||0;
  const depositAmount = Math.round(value*depositRate/100);
  const blockedNow = Math.max(0, depositAmount - totalReleased);
  return { totalReleased, depositAmount, blockedNow };
}
function _guaranteeStatusAuto(g){
  if(g.status==='cancelled') return 'cancelled';
  const today = Date.now();
  if(g.expiryDate && g.expiryDate<today) return 'expired';
  const calc = _guaranteeCalc(g);
  if(calc.blockedNow<=0 && calc.totalReleased>0) return 'released';
  if(calc.totalReleased>0) return 'partial';
  return 'active';
}
function renderPopupGuarantee(host, cid){
  const db=getDB(); const c=db.contracts.find(x=>x.id===cid); if(!c) return;
  _ensureGuaranteeList(c); saveDB(db);
  const me=currentUser(); const canEdit = me && me.role!=='employee';
  const today = Date.now();
  const list = (c.guarantees||[]).slice().sort((a,b)=>(a.expiryDate||0)-(b.expiryDate||0));
  const warnList = list.filter(g=>{
    const s=_guaranteeStatusAuto(g);
    if(s==='expired') return false;
    if(!g.expiryDate) return false;
    const days=Math.ceil((g.expiryDate-today)/86400000);
    return days<=30 && days>=0;
  });
  const expiredList = list.filter(g=>_guaranteeStatusAuto(g)==='expired');
  let sumValue=0, sumDeposit=0, sumReleased=0, sumBlocked=0;
  list.forEach(g=>{
    const cc=_guaranteeCalc(g);
    sumValue+=Number(g.value)||0; sumDeposit+=cc.depositAmount; sumReleased+=cc.totalReleased; sumBlocked+=cc.blockedNow;
  });

  const rows = list.map((g,idx)=>{
    const cc=_guaranteeCalc(g);
    const stAuto=_guaranteeStatusAuto(g);
    const st = GUARANTEE_STATUS.find(s=>s.v===stAuto)||GUARANTEE_STATUS[0];
    const typeLabel = (GUARANTEE_TYPES.find(t=>t.v===g.type)||{}).label||'—';
    let daysLeft='';
    if(g.expiryDate){
      const dd = Math.ceil((g.expiryDate-today)/86400000);
      if(dd<0) daysLeft = `<span style="color:#dc2626">Đã hết hạn ${-dd} ngày</span>`;
      else if(dd<=30) daysLeft = `<span style="color:#b45309">Còn ${dd} ngày</span>`;
      else daysLeft = `<span class="muted">Còn ${dd} ngày</span>`;
    }
    return `<tr>
      <td>${idx+1}</td>
      <td><b>${escapeHtml(typeLabel)}</b><div class="hint muted">${escapeHtml(g.note||'')}</div></td>
      <td>${escapeHtml(g.bank||'—')}<div class="hint muted">Số BL: ${escapeHtml(g.code||'')}</div></td>
      <td class="right">${fmtVND(g.value)}</td>
      <td class="right">${(Number(g.depositRate)||0).toFixed(1)}%</td>
      <td class="right">${fmtVND(cc.depositAmount)}</td>
      <td class="right" style="color:#1e40af;font-weight:600">${fmtVND(cc.blockedNow)}</td>
      <td class="right" style="color:#16a34a;font-weight:600">${fmtVND(cc.totalReleased)}</td>
      <td>${fmtDate(g.issueDate)}</td>
      <td>${fmtDate(g.expiryDate)}<div class="hint">${daysLeft}</div></td>
      <td><span class="badge" style="background:${st.color};color:#fff">${st.label}</span></td>
      <td>
        <button class="btn sm outline" onclick="openGuaranteeForm('${cid}','${g.id}')">✏</button>
        <button class="btn sm" style="background:#0ea5e9;color:#fff" onclick="openGuaranteeReleaseForm('${cid}','${g.id}')">💰 Giải tỏa</button>
        <button class="btn sm outline" onclick="openGuaranteeHistory('${cid}','${g.id}')">📜 Lịch sử</button>
        ${canEdit?`<button class="btn sm danger" onclick="deleteGuarantee('${cid}','${g.id}')">🗑</button>`:''}
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="12" class="empty">Chưa có bảo lãnh ngân hàng nào. Bấm "+ Thêm bảo lãnh".</td></tr>';

  let warnHtml='';
  if(expiredList.length){

window.updatePayDoc = function(cid, did, field, value){

  d[field] = value;

  saveDB(db);
  if(field==='received' || field==='receivedAt') renderPopupBody();
};
window.addPayDoc = function(cid){

  c.payDocs.push({id:uid('pd'), kind:'custom', _default:false, customLabel:'Loại hồ sơ mới', received:false, receivedAt:null, receivedBy:'', note:''});

window.deletePayDoc = function(cid, did){
  if(!confirm('Xóa loại hồ sơ này?')) return;

  c.payDocs = (c.payDocs||[]).filter(d=>d.id!==did);
  saveDB(db); renderPopupBody(); toast('Đã xóa');
};

/* ============================================================

   ✓ Đa nhiệm: nhiều mảng cùng lúc, lương = base + allowance + Σ KPI bonus

/* ===== CHAT MODULE (injected) ===== */
/* ============================================================
   💬 MODULE CHAT NỘI BỘ — Realtime trên Firebase (v2: nhiều cửa sổ + kéo thả)
   - Nhắn 1-1 & nhóm | Gửi ảnh/file | Thu hồi/xóa
   - Trạng thái online & đang gõ | Đã đọc/chưa đọc
   - Mở NHIỀU cửa sổ chat cùng lúc, mỗi cửa sổ KÉO DI CHUYỂN được
   - Dữ liệu nằm ở path "chat/" RIÊNG, không đụng vào DB "hrm"
   ============================================================ */
(function(){
  'use strict';

  const ROOT = 'chat';
  const MAX_FILE = 900 * 1024; // ~900KB giới hạn file/ảnh (base64 lưu Firebase)
  const WIN_W = 330, WIN_GAP = 12;

  // ---- state ----
  let _bootedUid = null;
  let _convs     = {};   // convId -> meta
  let _msgs      = {};   // convId -> {msgId: msg}
  let _reads     = {};   // convId -> {uid: ts}
  let _typing    = {};   // convId -> {uid: ts}
  let _presence  = {};   // uid -> {online,last}
  let _convRefs  = {};   // convId -> [ref,...] để off
  let _rootRefs  = [];
  let _wins      = {};   // convId -> {collapsed:bool} các cửa sổ đang mở
  let _listOpen  = false;
  let _panelTab  = 'convs';   // 'convs' | 'contacts'
  let _zTop      = 9100;
  let _drag      = null;
  let _typingTO  = {};   // convId -> timeout
  let _lastTypingSent = {};
  let _chReady = false;   // [REQ5] true sau khi nạp xong dữ liệu ban đầu — chỉ báo tin nhắn đến SAU đó

  function _ref(p){ return firebase.database().ref(ROOT + (p ? '/' + p : '')); }
  function now(){ return Date.now(); }
  function me(){ return (typeof currentUser==='function') ? currentUser() : null; }
  function esc(s){ return (typeof escapeHtml==='function') ? escapeHtml(s==null?'':String(s)) : String(s==null?'':s); }
  function userById(id){ const db=getDB(); return (db.users||[]).find(u=>u.id===id) || null; }
  function uname(id){ const u=userById(id); return u ? (u.name||u.username||'?') : 'Người dùng'; }

  function contacts(){
    const m = me(); if(!m) return [];
    const db = getDB();
    let list = (db.users||[]).filter(u=>u.id !== m.id);
    /* LIÊN CÔNG TY: mọi người ở mọi công ty đều thấy & nhắn được với nhau (bỏ lọc theo companyId) */
    return list.sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'vi'));
  }
  function dmId(a,b){ return 'dm_' + [a,b].sort().join('__'); }

  function initials(name){
    const p = (name||'?').trim().split(/\s+/);
    let s = p.length>=2 ? (p[p.length-2][0]+p[p.length-1][0]) : (p[0]||'?').slice(0,2);
    return s.toUpperCase();
  }
  function avatarColor(id){
    const colors = ['#2563eb','#16a34a','#db2777','#d97706','#7c3aed','#0891b2','#dc2626','#4f46e5','#059669','#ca8a04'];
    let h=0; for(let i=0;i<(id||'').length;i++) h=(h*31 + id.charCodeAt(i))>>>0;
    return colors[h % colors.length];
  }
  function avatar(id, sz){
    sz = sz||38; const nm = uname(id);
    const dot = isOnline(id) ? `<span class="ch-dot" style="width:${Math.round(sz/3.6)}px;height:${Math.round(sz/3.6)}px"></span>` : '';
    return `<span class="ch-av" style="width:${sz}px;height:${sz}px;background:${avatarColor(id)};font-size:${Math.round(sz/2.6)}px">${esc(initials(nm))}${dot}</span>`;
  }
  function groupAvatar(sz){ sz=sz||38; return `<span class="ch-av" style="width:${sz}px;height:${sz}px;background:#64748b;font-size:${Math.round(sz/2.2)}px">👥</span>`; }

  function isOnline(id){ const p=_presence[id]; if(!p||!p.online) return false; return (now()-(p.last||0))<90000; }
  function isTyping(convId){
    const t=_typing[convId]; if(!t) return null; const m=me();
    for(const uid in t){ if(uid===m.id) continue; if(now()-(t[uid]||0)<4500) return uid; }
    return null;
  }

  function fmtTime(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function fmtDayLabel(ts){
    const d=new Date(ts), t=new Date();
    const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
    const y=new Date(t); y.setDate(t.getDate()-1);
    if(same(d,t)) return 'Hôm nay'; if(same(d,y)) return 'Hôm qua';
    return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  }
  function relTime(ts){
    if(!ts) return ''; const s=Math.floor((now()-ts)/1000);
    if(s<60) return 'vừa xong'; if(s<3600) return Math.floor(s/60)+' phút';
    if(s<86400) return Math.floor(s/3600)+' giờ'; return fmtDayLabel(ts);
  }
  function fmtSize(b){ if(b<1024) return b+'B'; if(b<1048576) return (b/1024).toFixed(0)+'KB'; return (b/1048576).toFixed(1)+'MB'; }
  function linkify(t){ return esc(t).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>'); }

  /* ========================= BOOT / TEARDOWN ========================= */
  function boot(){
    const m = me(); if(!m){ teardown(); return; }
    if(_bootedUid === m.id){ ensureLauncher(); return; }
    teardown();
    _bootedUid = m.id;
    injectCSS(); initDragGlobal(); ensureLauncher();
    setupPresence(m.id); listenIndex(m.id);
    // [REQ5] Sau ~2.5s coi như đã nạp xong dữ liệu cũ; từ đó mới báo tin nhắn MỚI
    _chReady = false;
    setTimeout(()=>{ _chReady = true; }, 2500);
    // Xin quyền hiển thị thông báo hệ thống (không bắt buộc)
    try{ if('Notification' in window && Notification.permission==='default'){ setTimeout(()=>{ try{ Notification.requestPermission(); }catch(e){} }, 3500); } }catch(e){}
  }
  function teardown(){
    _rootRefs.forEach(r=>{ try{ r.ref.off(r.ev, r.cb); }catch(e){} }); _rootRefs=[];
    for(const c in _convRefs){ _convRefs[c].forEach(r=>{ try{ r.ref.off(r.ev, r.cb); }catch(e){} }); } _convRefs={};
    _convs={}; _msgs={}; _reads={}; _typing={}; _presence={}; _wins={}; _listOpen=false;
    _chReady=false;
    document.querySelectorAll('.ch-win').forEach(w=>w.remove());
    const w=document.getElementById('chatWidget'); if(w) w.remove();
    if(window._chHeartbeat){ clearInterval(window._chHeartbeat); window._chHeartbeat=null; }
    _bootedUid=null;
  }
  window.chatBoot=boot; window.chatTeardown=teardown;

  /* ========================= PRESENCE ========================= */
  function setupPresence(uid){
    try{
      const pr=_ref('presence/'+uid);
      pr.onDisconnect().set({online:false,last:firebase.database.ServerValue.TIMESTAMP});
      pr.set({online:true,last:now()});
      if(window._chHeartbeat) clearInterval(window._chHeartbeat);
      window._chHeartbeat=setInterval(()=>{ try{ pr.update({online:true,last:now()}); }catch(e){} },45000);
    }catch(e){ console.warn('presence err',e); }
    const all=_ref('presence');
    const cb=all.on('value', s=>{ _presence=s.val()||{}; scheduleRefresh(); });
    _rootRefs.push({ref:all,ev:'value',cb});
  }

  /* ========================= INDEX + LẮNG NGHE ========================= */
  function listenIndex(uid){
    const idx=_ref('userIndex/'+uid);
    const cb=idx.on('value', s=>{ const v=s.val()||{}; Object.keys(v).forEach(ensureConv); scheduleRefresh(); recomputeBadge(); });
    _rootRefs.push({ref:idx,ev:'value',cb});
  }
  function ensureConv(convId){
    if(_convRefs[convId]) return; _convRefs[convId]=[];
    const mref=_ref('conversations/'+convId+'/meta');
    const mcb=mref.on('value', s=>{ if(s.val()) _convs[convId]=s.val(); if(_wins[convId]) updateWinHeader(convId); scheduleRefresh(); });
    _convRefs[convId].push({ref:mref,ev:'value',cb:mcb});

    const gref=_ref('conversations/'+convId+'/messages');
    const gcb=gref.on('value', s=>{
      const fresh=s.val()||{};
      // [REQ5] Phát hiện tin nhắn MỚI đến từ người khác để cảnh báo nổi bật
      try{
        const m=me();
        const prev=_msgs[convId]||{};
        if(m && _chReady){
          for(const id in fresh){
            const msg=fresh[id];
            if(!prev[id] && msg && msg.from!==m.id && !msg.recalled && (Date.now()-(msg.ts||0))<60000){
              // chỉ báo nếu cửa sổ hội thoại này KHÔNG đang mở & hiện (đang xem thì không cần báo)
              const winOpen=_wins[convId] && !_wins[convId].collapsed && document.getElementById('chWin_'+convId);
              if(!winOpen) notifyNewMessage(convId, msg);
            }
          }
        }
      }catch(e){}
      _msgs[convId]=fresh;
      if(_wins[convId]){ updateMessages(convId); markRead(convId); }
      scheduleRefresh(); recomputeBadge();
    });
    _convRefs[convId].push({ref:gref,ev:'value',cb:gcb});

    const rref=_ref('conversations/'+convId+'/reads');
    const rcb=rref.on('value', s=>{ _reads[convId]=s.val()||{}; if(_wins[convId]) updateMessages(convId); });
    _convRefs[convId].push({ref:rref,ev:'value',cb:rcb});

    const tref=_ref('conversations/'+convId+'/typing');
    const tcb=tref.on('value', s=>{ _typing[convId]=s.val()||{}; if(_wins[convId]) updateTyping(convId); });
    _convRefs[convId].push({ref:tref,ev:'value',cb:tcb});
  }

  /* ========================= CHƯA ĐỌC ========================= */
  function unreadCount(convId){
    const m=me(); if(!m) return 0;
    const msgs=_msgs[convId]||{}; const myRead=(_reads[convId]||{})[m.id]||0; let n=0;
    for(const id in msgs){ const x=msgs[id]; if(x && x.from!==m.id && (x.ts||0)>myRead && !x.recalled) n++; }
    return n;
  }
  function totalUnread(){ let t=0; for(const c in _convs) t+=unreadCount(c); return t; }
  function recomputeBadge(){
    const t=totalUnread();
    const nav=document.getElementById('navChatBadge');
    if(nav){ nav.style.display=t>0?'inline-flex':'none'; nav.textContent=t>99?'99+':t; }
    const lb=document.getElementById('chLaunchBadge');
    if(lb){ lb.style.display=t>0?'flex':'none'; lb.textContent=t>99?'99+':t; }
    // [REQ5] Khi còn tin chưa đọc → nút chat nhấp nháy thu hút; hết thì thôi
    const launcher=document.getElementById('chLauncher');
    if(launcher) launcher.classList.toggle('ch-attn', t>0);
  }

  /* [REQ5] Cảnh báo tin nhắn MỚI rõ ràng, gây chú ý:
     - Banner trượt từ trên xuống (kèm tên người gửi + trích nội dung), bấm để mở hội thoại
     - Phát âm thanh "ting" ngắn
     - Nút chat nhấp nháy (xử lý ở recomputeBadge) */
  let _lastBeep=0;
  function playBeep(){
    try{
      const now2=Date.now(); if(now2-_lastBeep<1200) return; _lastBeep=now2;
      const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
      if(!window._chAudioCtx) window._chAudioCtx=new Ctx();
      const ctx=window._chAudioCtx;
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.35);
      o.start(); o.stop(ctx.currentTime+0.36);
    }catch(e){}
  }
  function msgPreview(msg){
    if(!msg) return '';
    if(msg.type==='image') return '🖼️ Hình ảnh';
    if(msg.type==='file') return '📎 '+(msg.fileName||'Tệp đính kèm');
    return (msg.text||'').slice(0,80);
  }
  function notifyNewMessage(convId, msg){
    playBeep();
    // Trình duyệt hỗ trợ Notification & người dùng đã cấp quyền → bắn cả thông báo hệ thống
    try{
      if('Notification' in window && Notification.permission==='granted' && document.hidden){
        const c=_convs[convId]||{};
        const title = c.type==='group' ? (c.name||'Tin nhắn nhóm') : uname(msg.from);
        new Notification('💬 '+title, { body: msgPreview(msg), tag: convId });
      }
    }catch(e){}
    // Banner nổi trong ứng dụng
    const host=ensureNotifyHost();
    const c=_convs[convId]||{};
    const who = c.type==='group' ? (esc(c.name||'Nhóm')+' — '+esc(uname(msg.from))) : esc(uname(msg.from));
    const card=document.createElement('div');
    card.className='ch-notify';
    card.innerHTML=`
      <div class="ch-notify-ic">💬</div>
      <div class="ch-notify-main">
        <div class="ch-notify-title">${who}</div>
        <div class="ch-notify-text">${esc(msgPreview(msg))}</div>
      </div>
      <button class="ch-notify-x" title="Đóng">✕</button>`;
    card.querySelector('.ch-notify-x').onclick=(ev)=>{ ev.stopPropagation(); card.remove(); };
    card.onclick=()=>{ card.remove(); if(typeof openConv==='function'){ ensureLauncher(); openConv(convId); } };
    host.appendChild(card);
    // tự ẩn sau 7s
    setTimeout(()=>{ card.classList.add('ch-notify-out'); setTimeout(()=>card.remove(),350); }, 7000);
  }
  function ensureNotifyHost(){
    let h=document.getElementById('chNotifyHost');
    if(!h){ h=document.createElement('div'); h.id='chNotifyHost'; document.body.appendChild(h); }
    return h;
  }

  /* ========================= LAUNCHER + PANEL DANH SÁCH ========================= */
  function ensureLauncher(){
    if(document.getElementById('chatWidget')) return;
    const w=document.createElement('div'); w.id='chatWidget';
    w.innerHTML=`
      <button id="chLauncher" title="Tin nhắn nội bộ" onclick="chatToggleList()">
        <span style="font-size:24px">💬</span>
        <span id="chLaunchBadge" class="ch-badge" style="display:none">0</span>
      </button>
      <div id="chListPanel" class="ch-list-panel" style="display:none"></div>`;
    document.body.appendChild(w);
    recomputeBadge();
  }
  window.chatToggleList=function(){ _listOpen?closeList():openList(); };
  function openList(){ ensureLauncher(); _listOpen=true; const p=document.getElementById('chListPanel'); p.style.display='flex'; renderList(); recomputeBadge(); }
  function closeList(){ _listOpen=false; const p=document.getElementById('chListPanel'); if(p) p.style.display='none'; }
  window.openChat=openList;   // mục menu "Tin nhắn"
  window.chatCloseList=closeList;

  /* ---- Cửa sổ Tin nhắn: kéo di chuyển / phóng to / thu nhỏ ---- */
  window.chatPanelDragStart=function(ev){
    if(ev.target.closest('button')) return;
    const p=document.getElementById('chListPanel'); if(!p) return;
    if(p.classList.contains('ch-maximized')) return; // đang full màn hình thì không kéo
    const r=p.getBoundingClientRect();
    _drag={el:p,sx:ev.clientX,sy:ev.clientY,ox:r.left,oy:r.top};
    document.body.style.userSelect='none'; ev.preventDefault();
  };
  window.chatPanelMax=function(){
    const p=document.getElementById('chListPanel'); if(!p) return;
    p.classList.remove('ch-minimized');
    const on=p.classList.toggle('ch-maximized');
    if(on){ p.style.left=''; p.style.top=''; p.style.right=''; p.style.bottom=''; }
    else { p.style.right='22px'; p.style.bottom='90px'; p.style.left='auto'; p.style.top='auto'; }
  };
  window.chatPanelMin=function(){
    const p=document.getElementById('chListPanel'); if(!p) return;
    p.classList.remove('ch-maximized');
    p.classList.toggle('ch-minimized');
  };

  /* ---- Xóa toàn bộ cuộc trò chuyện ---- */
  window.chatDeleteConv=function(convId){
    const m=me(); if(!m) return; const c=_convs[convId]; if(!c) return;
    const nm=convTitle(convId);
    if(!confirm('Xóa TOÀN BỘ nội dung cuộc trò chuyện với "'+nm+'"?\n\nThao tác này xóa hẳn mọi tin nhắn trong cuộc trò chuyện cho tất cả thành viên và không thể hoàn tác.')) return;
    try{
      // Xóa toàn bộ tin nhắn + đánh dấu đã đọc/đang gõ
      _ref('conversations/'+convId+'/messages').remove();
      _ref('conversations/'+convId+'/reads').remove();
      _ref('conversations/'+convId+'/typing').remove();
      if(c.type==='dm'){
        // DM: gỡ khỏi danh sách của cả hai phía + xóa meta
        Object.keys(c.members||{}).forEach(uid=> _ref('userIndex/'+uid+'/'+convId).remove());
        _ref('conversations/'+convId+'/meta').remove();
      } else {
        // Nhóm: chỉ gỡ khỏi danh sách của mình
        _ref('userIndex/'+m.id+'/'+convId).remove();
      }
    }catch(e){ console.warn('deleteConv err',e); }
    // Dọn cục bộ
    if(_convRefs[convId]){ _convRefs[convId].forEach(r=>{try{r.ref.off(r.ev,r.cb);}catch(e){}}); delete _convRefs[convId]; }
    delete _convs[convId]; delete _msgs[convId]; delete _reads[convId]; delete _typing[convId];
    if(_wins[convId]) chatCloseWin(convId);
    fillConvList(''); recomputeBadge();
    if(typeof toast==='function') toast('Đã xóa cuộc trò chuyện');
  };

  function convLastTs(convId){ const msgs=_msgs[convId]||{}; let t=(_convs[convId]||{}).createdAt||0; for(const id in msgs){ if((msgs[id].ts||0)>t) t=msgs[id].ts; } return t; }
  function convTitle(convId){ const c=_convs[convId]; if(!c) return 'Hội thoại'; if(c.type==='group') return c.name||'Nhóm'; const m=me(); return uname(Object.keys(c.members||{}).find(x=>x!==m.id)); }
  function convLastText(convId){
    const msgs=_msgs[convId]||{}; let last=null;
    for(const id in msgs){ if(!last||(msgs[id].ts||0)>(last.ts||0)) last=msgs[id]; }
    if(!last) return '<i style="color:#94a3b8">Chưa có tin nhắn</i>';
    const m=me(); const who=last.from===m.id?'Bạn: ':((_convs[convId]||{}).type==='group'?(uname(last.from).split(' ').pop()+': '):'');
    if(last.recalled) return esc(who)+'<i style="color:#94a3b8">đã thu hồi tin nhắn</i>';
    if(last.type==='image') return esc(who)+'🖼️ Hình ảnh';
    if(last.type==='file') return esc(who)+'📎 '+esc(last.fileName||'Tệp');
    return esc(who)+esc((last.text||'').slice(0,40));
  }
  function renderList(){
    const p=document.getElementById('chListPanel'); if(!p) return;
    const isConv = _panelTab!=='contacts';
    p.innerHTML=`
      <div class="ch-head ch-list-head" id="chListHead" onmousedown="chatPanelDragStart(event)" ondblclick="chatPanelMax()">
        <b>💬 Tin nhắn</b>
        <div style="display:flex;gap:6px;margin-left:auto">
          <button class="ch-ic" title="Mở toàn màn hình" onclick="chatPanelMax()">⛶</button>
          <button class="ch-ic" title="Thu nhỏ" onclick="chatPanelMin()">—</button>
          <button class="ch-ic" title="Tắt cửa sổ tin nhắn" onclick="chatCloseList()">✕</button>
        </div>
      </div>
      <div class="ch-tabs">
        <button class="ch-tab ${isConv?'active':''}" data-ptab="convs" onclick="chatPanelTab('convs')">💬 Tin nhắn</button>
        <button class="ch-tab ${!isConv?'active':''}" data-ptab="contacts" onclick="chatPanelTab('contacts')">👤 Danh bạ</button>
        <button class="ch-tab ch-tab-act" title="Tạo nhóm trò chuyện" onclick="chatNewGroup()">👥 Tạo nhóm</button>
      </div>
      <div class="ch-search"><input id="chSearch" placeholder="${isConv?'Tìm cuộc trò chuyện…':'Tìm người để nhắn…'}" oninput="chatFilter(this.value)"></div>
      <div class="ch-body">
        <div id="chConvWrap" style="display:${isConv?'block':'none'}">
          <div id="chConvList"></div>
        </div>
        <div id="chContactWrap" style="display:${isConv?'none':'block'}">
          <div class="ch-sub">Danh bạ — chọn người để bắt đầu trò chuyện</div>
          <div id="chContactList"></div>
        </div>
      </div>`;
    fillConvList(''); fillContactList('');
  }
  window.chatPanelTab=function(t){
    _panelTab = (t==='contacts')?'contacts':'convs';
    const isConv = _panelTab!=='contacts';
    const cw=document.getElementById('chConvWrap'); const tw=document.getElementById('chContactWrap');
    if(cw) cw.style.display=isConv?'block':'none';
    if(tw) tw.style.display=isConv?'none':'block';
    document.querySelectorAll('#chListPanel .ch-tab[data-ptab]').forEach(b=>b.classList.toggle('active', b.dataset.ptab===_panelTab));
    const s=document.getElementById('chSearch'); if(s){ s.value=''; s.placeholder=isConv?'Tìm cuộc trò chuyện…':'Tìm người để nhắn…'; }
    fillConvList(''); fillContactList('');
  };
  window.chatFilter=function(q){ fillConvList(q); fillContactList(q); };
  function fillConvList(q){
    const host=document.getElementById('chConvList'); if(!host) return; q=(q||'').toLowerCase();
    // [REQ7] Hội thoại có người ĐANG ONLINE ưu tiên lên trên; sau đó theo thời gian tin nhắn mới nhất
    const convOnline=(id)=>{
      const c=_convs[id]; if(!c) return false; const m=me(); if(!m) return false;
      return Object.keys(c.members||{}).some(uid=>uid!==m.id && isOnline(uid));
    };
    const ids=Object.keys(_convs)
      .filter(id=>convTitle(id).toLowerCase().includes(q))
      .sort((a,b)=>{
        const oa=convOnline(a)?0:1, ob=convOnline(b)?0:1;
        if(oa!==ob) return oa-ob;
        return convLastTs(b)-convLastTs(a);
      });
    if(!ids.length){ host.innerHTML=''; return; }
    host.innerHTML=ids.map(id=>{
      const c=_convs[id]; const un=unreadCount(id);
      const av=c.type==='group'?groupAvatar(42):avatar(Object.keys(c.members||{}).find(x=>x!==me().id),42);
      const on=convOnline(id);
      return `<div class="ch-row ${un?'unread':''}" onclick="chatOpenConv('${id}')">${av}
        <div class="ch-row-main">
          <div class="ch-row-top"><span class="ch-name">${esc(convTitle(id))}${on?' <span style="font-size:9px;color:#16a34a;font-weight:700">●</span>':''}</span><span class="ch-time">${relTime(convLastTs(id))}</span></div>
          <div class="ch-row-sub"><span class="ch-prev">${convLastText(id)}</span>${un?`<span class="ch-pill">${un>99?'99+':un}</span>`:''}</div>
        </div>
        <button class="ch-rowdel" title="Xóa toàn bộ cuộc trò chuyện này" onclick="event.stopPropagation();chatDeleteConv('${id}')">🗑</button></div>`;
    }).join('');
  }
  function fillContactList(q){
    const host=document.getElementById('chContactList'); if(!host) return; q=(q||'').toLowerCase();
    let list=contacts().filter(u=>(u.name||'').toLowerCase().includes(q)||(u.username||'').toLowerCase().includes(q));
    if(!list.length){ host.innerHTML='<div class="ch-empty">Không có liên hệ.</div>'; return; }
    // [REQ7] Ưu tiên người ĐANG ONLINE lên đầu danh sách
    list.sort((a,b)=>{
      const oa=isOnline(a.id)?0:1, ob=isOnline(b.id)?0:1;
      if(oa!==ob) return oa-ob;
      return (a.name||'').localeCompare(b.name||'', 'vi');
    });
    const onlineCount=list.filter(u=>isOnline(u.id)).length;
    const rowHtml=(u)=>{
      const co=(typeof getCompany==='function')?getCompany(u.companyId):null;
      const sub=(co?co.code+' · ':'')+(typeof roleLabel==='function'?roleLabel(u.role):u.role);
      const on=isOnline(u.id);
      return `<div class="ch-row" onclick="chatStartDM('${u.id}');chatPanelTab('convs')">${avatar(u.id,42)}
        <div class="ch-row-main">
          <div class="ch-row-top"><span class="ch-name">${esc(u.name||u.username)}</span>${on?'<span style="font-size:10px;color:#16a34a;font-weight:700">● ONLINE</span>':''}</div>
          <div class="ch-row-sub"><span class="ch-prev">${esc(sub)}${on?' · <span style=\"color:#16a34a\">Đang hoạt động</span>':''}</span></div>
        </div></div>`;
    };
    let html='';
    if(onlineCount && !q){
      html+=`<div class="ch-sub" style="color:#16a34a">🟢 Đang hoạt động (${onlineCount})</div>`;
      html+=list.filter(u=>isOnline(u.id)).map(rowHtml).join('');

  }

  /* ========================= MỞ HỘI THOẠI (NHIỀU CỬA SỔ) ========================= */
  window.chatOpenConv=openConv;
  function openConv(convId){
    if(_wins[convId]){ // đã mở -> bung ra & đưa lên trên
      _wins[convId].collapsed=false;
      const el=document.getElementById('chWin_'+convId);
      if(el){ el.classList.remove('collapsed'); bringToFront(convId); const ta=el.querySelector('textarea'); if(ta) ta.focus(); }
      markRead(convId); return;
    }
    _wins[convId]={collapsed:false};
    createWindow(convId);
    markRead(convId); recomputeBadge();
  }
  window.chatStartDM=function(otherId){
    const m=me(); if(!m) return; const id=dmId(m.id,otherId);
    if(!_convs[id]){
      const meta={type:'dm',members:{[m.id]:true,[otherId]:true},createdBy:m.id,createdAt:now()};
      _convs[id]=meta; _ref('conversations/'+id+'/meta').set(meta);
      _ref('userIndex/'+m.id+'/'+id).set(now()); _ref('userIndex/'+otherId+'/'+id).set(now());
      ensureConv(id);
    }

  function openWinCount(){ return Object.keys(_wins).length; }
  function createWindow(convId){
    const c=_convs[convId]||{type:'dm',members:{}};
    const win=document.createElement('div'); win.className='ch-win'; win.id='chWin_'+convId;

    const i=openWinCount()-1;
    const right=92 + i*(WIN_W+WIN_GAP);

          <input type="file" id="chFile_${convId}" style="display:none" onchange="chatPickFile(this,'${convId}')">
          <textarea id="chText_${convId}" rows="1" placeholder="Nhập tin nhắn…" oninput="chatOnType('${convId}')" onkeydown="chatKey(event,'${convId}')"></textarea>

  }
  window.chatToggleWin=function(convId){
    const el=document.getElementById('chWin_'+convId); if(!el||!_wins[convId]) return;
    _wins[convId].collapsed=!_wins[convId].collapsed;
    el.classList.toggle('collapsed', _wins[convId].collapsed);
    if(!_wins[convId].collapsed){ updateMessages(convId); markRead(convId); }
  };
  window.chatCloseWin=function(convId){
    const el=document.getElementById('chWin_'+convId); if(el) el.remove();
    delete _wins[convId];
  };
  window.chatWinMax=function(convId){
    const el=document.getElementById('chWin_'+convId); if(!el) return;
    el.classList.remove('collapsed'); if(_wins[convId]) _wins[convId].collapsed=false;
    const on=el.classList.toggle('ch-maximized');
    if(on){ el.style.left=''; el.style.top=''; el.style.right=''; el.style.bottom=''; el.style.width=''; el.style.height=''; }

  function bringToFront(convId){ const el=document.getElementById('chWin_'+convId); if(el) el.style.zIndex=(++_zTop); }

  function updateWinHeader(convId){
    const el=document.getElementById('chWin_'+convId); if(!el) return;

  function updateCStatus(convId){
    const el=document.getElementById('chCStatus_'+convId); if(!el) return;
    const c=_convs[convId]||{};
    const who=isTyping(convId);
    if(who){ el.innerHTML='<span style="color:#fff">đang nhập…</span>'; return; }
    if(c.type==='group'){ el.textContent=Object.keys(c.members||{}).length+' thành viên'; return; }
    const other=Object.keys(c.members||{}).find(x=>x!==me().id);
    if(isOnline(other)) el.innerHTML='<span style="color:#bbf7d0">● Đang hoạt động</span>';
    else { const p=_presence[other]; el.textContent=p&&p.last?('Hoạt động '+relTime(p.last)+' trước'):'Ngoại tuyến'; }

  function updateMessages(convId){
    const host=document.getElementById('chMsgs_'+convId); if(!host) return;
    const m=me(); const c=_convs[convId]||{}; const msgs=_msgs[convId]||{};
    const arr=Object.keys(msgs).map(id=>Object.assign({_id:id},msgs[id])).sort((a,b)=>(a.ts||0)-(b.ts||0));
    const nearBottom=host.scrollHeight-host.scrollTop-host.clientHeight<80;
    let html=''; let lastDay='';
    arr.forEach(msg=>{
      const day=fmtDayLabel(msg.ts);
      if(day!==lastDay){ html+=`<div class="ch-day"><span>${day}</span></div>`; lastDay=day; }
      const mine=msg.from===m.id;
      const senderName=(c.type==='group'&&!mine)?`<div class="ch-sender">${esc(uname(msg.from))}</div>`:'';
      let body='';
      if(msg.recalled){ body=`<div class="ch-bubble recalled"><i>Tin nhắn đã được thu hồi</i></div>`; }
      else if(msg.type==='image'){ body=`<div class="ch-bubble ${mine?'mine':''} media"><img src="${msg.data}" onclick="chatViewImg('${convId}','${msg._id}')" alt="ảnh">${msg.text?`<div class="ch-cap">${esc(msg.text)}</div>`:''}</div>`; }
      else if(msg.type==='file'){ body=`<div class="ch-bubble ${mine?'mine':''}"><a class="ch-file" href="${msg.data}" download="${esc(msg.fileName||'tep')}">📎 ${esc(msg.fileName||'Tệp đính kèm')}<span class="ch-fsize">${msg.fsize?fmtSize(msg.fsize):''}</span></a></div>`; }
      else { body=`<div class="ch-bubble ${mine?'mine':''}">${linkify(msg.text||'')}</div>`; }
      const actions=(mine&&!msg.recalled)?`<button class="ch-msgact" onclick="chatMsgMenu(event,'${convId}','${msg._id}')">⋯</button>`:'';
      html+=`<div class="ch-line ${mine?'r':'l'}">${(!mine&&c.type==='group')?avatar(msg.from,28):''}
        <div class="ch-line-main">${senderName}${body}<div class="ch-meta"><span class="ch-mtime">${fmtTime(msg.ts)}</span>${actions}</div></div></div>`;
    });
    if(c.type==='dm'){
      const other=Object.keys(c.members||{}).find(x=>x!==m.id);
      const oRead=(_reads[convId]||{})[other]||0;
      const myLast=arr.filter(x=>x.from===m.id&&!x.recalled).pop();
      if(myLast&&oRead>=myLast.ts) html+=`<div class="ch-seen">Đã xem ${fmtTime(oRead)}</div>`;
    }
    host.innerHTML=html||'<div class="ch-empty" style="margin-top:30px">Hãy gửi lời chào 👋</div>';
    if(nearBottom) host.scrollTop=host.scrollHeight;

  function updateTyping(convId){

  /* ---------- GỬI TIN ---------- */
  window.chatKey=function(e,convId){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); chatSend(convId); } };
  window.chatSend=function(convId){
    const ta=document.getElementById('chText_'+convId); if(!ta) return;

  function pushMsg(convId,extra){
    const m=me(); if(!m) return; const c=_convs[convId]; if(!c) return;
    _ref('conversations/'+convId+'/messages').push(Object.assign({from:m.id,ts:now()},extra));

  window.chatPickFile=function(input,convId){
    const f=input.files&&input.files[0]; if(!f) return;
    if(f.size>MAX_FILE){ toast('Tệp quá lớn (tối đa '+fmtSize(MAX_FILE)+').','error'); input.value=''; return; }
    const rd=new FileReader();
    rd.onload=()=>{ const isImg=/^image\//.test(f.type);
      pushMsg(convId, isImg?{type:'image',data:rd.result,fileName:f.name}:{type:'file',data:rd.result,fileName:f.name,fsize:f.size}); input.value=''; };
    rd.onerror=()=>{ toast('Không đọc được tệp','error'); input.value=''; };
    rd.readAsDataURL(f);
  };
  window.chatViewImg=function(convId,msgId){

  /* ---------- THU HỒI / XÓA ---------- */

    menu.innerHTML=`<div onclick="chatRecall('${convId}','${msgId}')">↩ Thu hồi (mọi người)</div>

  window.chatDelete=function(convId,msgId){ if(!confirm('Xóa hẳn tin nhắn này của bạn? Thao tác không thể hoàn tác.')) return; _ref('conversations/'+convId+'/messages/'+msgId).remove(); if(typeof toast==='function') toast('Đã xóa tin nhắn'); };

  /* ---------- ĐANG GÕ ---------- */
  window.chatOnType=function(convId){

    if(ta){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,90)+'px'; }
    const m=me(); if(!m) return; const t=now();

    if(_typingTO[convId]) clearTimeout(_typingTO[convId]);
    _typingTO[convId]=setTimeout(()=>clearTyping(convId),3000);

  function clearTyping(convId){ const m=me(); if(m) _ref('conversations/'+convId+'/typing/'+m.id).set(0); _lastTypingSent[convId]=0; }

  /* ---------- ĐÃ ĐỌC ---------- */
  function markRead(convId){ const m=me(); if(!m) return; _ref('conversations/'+convId+'/reads/'+m.id).set(now()); recomputeBadge(); }

  /* ---------- KÉO THẢ CỬA SỔ ---------- */
  function initDragGlobal(){
    if(window._chDragInit) return; window._chDragInit=true;
    document.addEventListener('mousemove',e=>{
      if(!_drag) return;
      let nx=_drag.ox+(e.clientX-_drag.sx), ny=_drag.oy+(e.clientY-_drag.sy);
      nx=Math.max(0,Math.min(nx,window.innerWidth-90)); ny=Math.max(0,Math.min(ny,window.innerHeight-40));
      _drag.el.style.left=nx+'px'; _drag.el.style.top=ny+'px'; _drag.el.style.right='auto'; _drag.el.style.bottom='auto';
    });
    document.addEventListener('mouseup',()=>{ if(_drag){ document.body.style.userSelect=''; _drag=null; } });

  window.chatDragStart=function(ev,convId){
    if(ev.target.closest('button')) return; // bấm nút trên header thì không kéo
    const win=document.getElementById('chWin_'+convId); if(!win) return;
    bringToFront(convId);
    const r=win.getBoundingClientRect();
    _drag={el:win,sx:ev.clientX,sy:ev.clientY,ox:r.left,oy:r.top};
    document.body.style.userSelect='none'; ev.preventDefault();

  /* ---------- NHÓM ---------- */
  function ckMeta(u){
    const co=(typeof getCompany==='function'?getCompany(u.companyId).code:'');

    return [co,rl].filter(Boolean).join(' · ');

    return `<label class="ch-ckrow"><input type="checkbox" value="${u.id}"><span class="ch-ckname">${esc(u.name||u.username)}</span><span class="ch-ckmeta">${esc(ckMeta(u))}</span></label>`;

  window.chatNewGroup=function(){
    const list=contacts();

      html:`<div style="margin-bottom:10px"><input id="grpName" placeholder="Tên nhóm…" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px"></div>
            <div style="font-size:12px;color:#64748b;margin-bottom:6px">Chọn thành viên:</div>

      footer:`<button class="btn outline" onclick="closeModal()">Hủy</button> <button class="btn" onclick="chatCreateGroup()">Tạo nhóm</button>` });

  window.chatCreateGroup=function(){
    const m=me(); if(!m) return;
    const name=(document.getElementById('grpName').value||'').trim();
    const checks=[...document.querySelectorAll('#modal-body input[type=checkbox]:checked')].map(c=>c.value);
    if(!name){ toast('Nhập tên nhóm','error'); return; }
    if(checks.length<1){ toast('Chọn ít nhất 1 thành viên','error'); return; }
    const members={[m.id]:true}; checks.forEach(id=>members[id]=true);
    const id='grp_'+m.id.replace(/[^a-z0-9]/gi,'')+'_'+now().toString(36);
    const meta={type:'group',name,members,createdBy:m.id,createdAt:now()};
    _convs[id]=meta; _ref('conversations/'+id+'/meta').set(meta);
    Object.keys(members).forEach(uid=> _ref('userIndex/'+uid+'/'+id).set(now()));
    ensureConv(id);
    _ref('conversations/'+id+'/messages').push({from:m.id,ts:now(),type:'text',text:'Đã tạo nhóm "'+name+'"'});
    closeModal(); openConv(id);
  };
  window.chatGroupInfo=function(convId){
    const c=_convs[convId]; if(!c) return;
    const m=me(); const isCreator = m && c.createdBy===m.id;
    const memHtml=Object.keys(c.members||{}).map(uid=>{
      const tag = uid===c.createdBy ? ' <span class="muted" style="font-size:11px">(người tạo)</span>' : (uid===(m&&m.id) ? ' <span class="muted" style="font-size:11px">(bạn)</span>' : '');
      const kick = (isCreator && uid!==c.createdBy) ? `<button class="ch-ic" style="margin-left:auto;background:#fee2e2;color:#dc2626;width:24px;height:24px;font-size:13px" title="Mời ${esc(uname(uid))} ra khỏi nhóm" onclick="chatKickMember('${convId}','${uid}')">✕</button>` : '';
      return `<div class="ch-mem-row">${avatar(uid,30)} <span class="ch-ckname">${esc(uname(uid))}</span>${tag}${kick}</div>`;
    }).join('');
    const addable=contacts().filter(u=>!c.members[u.id]);
    const addHtml=addable.length?`<div class="ch-sub" style="margin-top:10px">Thêm thành viên</div><div style="display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto">`+addable.map(ckRow).join('')+`</div>`:'';
    openModal({ title:'👥 '+(c.name||'Nhóm'),
      html:`<div style="font-size:12px;color:#64748b;margin-bottom:4px">Thành viên (${Object.keys(c.members||{}).length})</div>${memHtml}${addHtml}`,
      footer:`<button class="btn outline" onclick="chatLeaveGroup('${convId}')">🚪 Rời nhóm</button> ${addable.length?`<button class="btn" onclick="chatAddMembers('${convId}')">+ Thêm</button>`:''} <button class="btn outline" onclick="closeModal()">Đóng</button>` });
  };
  window.chatKickMember=function(convId, uid){
    const m=me(); const c=_convs[convId]; if(!c||!m) return;
    if(c.createdBy!==m.id){ toast('Chỉ người tạo nhóm mới được mời thành viên ra khỏi nhóm','error'); return; }
    if(uid===c.createdBy){ toast('Không thể mời người tạo nhóm ra khỏi nhóm','error'); return; }
    if(!confirm('Mời '+uname(uid)+' ra khỏi nhóm?')) return;
    _ref('conversations/'+convId+'/members/'+uid).remove();
    _ref('userIndex/'+uid+'/'+convId).remove();
    if(c.members) delete c.members[uid];
    _ref('conversations/'+convId+'/messages').push({from:m.id,ts:now(),type:'text',text:uname(uid)+' đã bị mời ra khỏi nhóm bởi '+uname(m.id)});
    if(typeof toast==='function') toast('Đã mời '+uname(uid)+' ra khỏi nhóm');
    chatGroupInfo(convId); // làm mới danh sách
  };
  window.chatAddMembers=function(convId){
    const c=_convs[convId]; if(!c) return;
    const checks=[...document.querySelectorAll('#modal-body input[type=checkbox]:checked')].map(x=>x.value);
    if(!checks.length){ closeModal(); return; }
    const upd={}; checks.forEach(id=>{ upd['members/'+id]=true; });
    _ref('conversations/'+convId).update(upd);
    checks.forEach(id=>{ _ref('userIndex/'+id+'/'+convId).set(now()); c.members[id]=true; });
    _ref('conversations/'+convId+'/messages').push({from:me().id,ts:now(),type:'text',text:'Đã thêm '+checks.map(uname).join(', ')+' vào nhóm'});
    closeModal();
  };
  window.chatLeaveGroup=function(convId){

    _ref('userIndex/'+m.id+'/'+convId).remove();
    _ref('conversations/'+convId+'/messages').push({from:m.id,ts:now(),type:'text',text:uname(m.id)+' đã rời nhóm'});
    delete _convs[convId];
    if(_convRefs[convId]){ _convRefs[convId].forEach(r=>{try{r.ref.off(r.ev,r.cb);}catch(e){}}); delete _convRefs[convId]; }
    if(_wins[convId]) chatCloseWin(convId);

  /* ========================= REFRESH ========================= */
  let _refreshTO=null;
  function scheduleRefresh(){
    if(_refreshTO) return;
    _refreshTO=setTimeout(()=>{
      _refreshTO=null; recomputeBadge();
      if(_listOpen){ const s=document.getElementById('chSearch'); fillConvList(s?s.value:''); fillContactList(s?s.value:''); }
      // [REQ6] Cập nhật LẠI nội dung tin nhắn cho mọi cửa sổ đang mở (tránh treo, không cần F5)
      for(const convId in _wins){
        if(_wins[convId] && !_wins[convId].collapsed) updateMessages(convId);
        updateCStatus(convId);
      }
    },120);
  }
  // Nhịp làm tươi nhẹ mỗi 30s khi đang mở danh sách/cửa sổ
  setInterval(()=>{ if(_listOpen||Object.keys(_wins).length) scheduleRefresh(); },30000);

  /* [REQ6] WATCHDOG chống treo tin nhắn:
     - Mỗi 4 giây, nếu có cửa sổ chat đang mở, đọc lại messages trực tiếp từ Firebase
       (phòng trường hợp listener 'value' bị rớt/đọng khiến tin mới không hiện ra).
     - So sánh số lượng/nội dung; nếu khác cache thì cập nhật cache + render lại.
     - Cũng tự gắn lại listener nếu phát hiện listener của hội thoại đã mất. */
  setInterval(()=>{
    if(!_bootedUid) return;
    const openIds=Object.keys(_wins);
    if(!openIds.length) return;
    openIds.forEach(convId=>{
      // đảm bảo listener còn sống
      if(!_convRefs[convId]) ensureConv(convId);
      try{
        _ref('conversations/'+convId+'/messages').get().then(snap=>{
          const fresh=snap.val()||{};
          const cache=_msgs[convId]||{};
          const freshKeys=Object.keys(fresh);
          const cacheKeys=Object.keys(cache);
          let changed = freshKeys.length!==cacheKeys.length;
          if(!changed){
            // so sánh cờ recalled / nội dung text nhanh
            for(const k of freshKeys){
              const a=fresh[k]||{}, b=cache[k]||{};
              if(a.text!==b.text || a.recalled!==b.recalled || a.type!==b.type){ changed=true; break; }
            }
          }
          if(changed){
            _msgs[convId]=fresh;
            if(_wins[convId] && !_wins[convId].collapsed){ updateMessages(convId); markRead(convId); }
            recomputeBadge();
          }
        }).catch(()=>{});
      }catch(e){}
    });

(async function init(){
  const urlParams = new URLSearchParams(location.search);
  const popupContractId = urlParams.get('openContract');

  // Hiện màn hình loading — tránh hiển thị dữ liệu cũ từ cache rồi "nhảy" khi Firebase trả về
  document.getElementById('root').innerHTML = `
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
                background:linear-gradient(135deg,#1e3a8a 0%,#0f172a 100%);gap:18px">
      <div style="color:#fff;font-size:22px;font-weight:700;letter-spacing:.3px">EMC · AA · TẢN VIÊN</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div style="width:10px;height:10px;border-radius:50%;background:#3b82f6;animation:fb-dot 1.2s ease-in-out infinite"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:#3b82f6;animation:fb-dot 1.2s ease-in-out infinite .2s"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:#3b82f6;animation:fb-dot 1.2s ease-in-out infinite .4s"></div>
      </div>
      <div style="color:#94a3b8;font-size:13px" id="fb-loading-msg">Đang kết nối Firebase…</div>
      <style>@keyframes fb-dot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}</style>
    </div>`;

  // Pull Firebase — đây là nguồn dữ liệu chính, bắt buộc phải chờ
  try{
    const fbData = await Promise.race([
      _waitFirebase().then(() => fbPullOnce()),
      new Promise((_,rej) => setTimeout(()=>rej(new Error('timeout')), 8000))
    ]);
    if(fbData) _fbConnected = true;
  }catch(e){
    // Timeout hoặc lỗi mạng → _db rỗng, vẫn tiếp tục
    const msgEl = document.getElementById('fb-loading-msg');
    if(msgEl) msgEl.textContent = 'Không kết nối được Firebase — vui lòng kiểm tra mạng…';
    await new Promise(r => setTimeout(r, 1200));
    if(!_db) _db = _buildEmptyDB();
    _fbConnected = true; // cho phép ghi khi có kết nối lại
  }

  // Bật realtime listener — bỏ qua fire đầu tiên (đã pull xong ở trên rồi)
  fbStartRealtime();

  if(popupContractId){
    const found = _db && _db.contracts && _db.contracts.find(x=>x.id===popupContractId);
    if(!found && window._firebaseReady){
      try{ await fbPullOnce(); }catch(e){}
    }
    renderContractPopupWindow(popupContractId);
  } else {
    render();
    setTimeout(checkDeadlineWarning, 800);
  }
})();
</script>
