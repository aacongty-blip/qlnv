window.ctSugHL = function(i){
  _ctSugIdx=i;
  document.querySelectorAll('.ct-sug-item').forEach(el=>{
    if(Number(el.dataset.idx)===i){ el.style.background='#1e3a8a'; el.style.color='#fff'; el.scrollIntoView({block:'nearest'}); }
    else { el.style.background=''; el.style.color=''; }
  });
};
window.ctSearchKey = function(e){
  const list=_ctSugList; let idx=_ctSugIdx;
  if(e.key==='ArrowDown'){ e.preventDefault(); idx=Math.min(list.length-1,idx+1); ctSugHL(idx); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); idx=Math.max(0,idx-1); ctSugHL(idx); }
  else if(e.key==='Enter'){ e.preventDefault(); if(idx>=0 && list[idx]) ctSearchPick(list[idx].id); }
  else if(e.key==='Escape'){ document.getElementById('ct-suggest').style.display='none'; }
};
window.ctSearchPick = function(id){

  _contractFilter = id;

  document.getElementById('ct-suggest').style.display='none';
  renderContractTabBody();
  setTimeout(()=>openContractWindow(id), 100); // mở cửa sổ riêng
};

  if(_popupTab==='materials') return renderPopupMaterials(host, cid);

  if(_popupTab==='extras')    return renderPopupExtras(host, cid);

}

  if(_matSubSection==='suppliers') return renderPopupSuppliers(host, cid);
}

/* --- TAB 2: Phụ lục vật tư — có chọn nhiều dòng để sửa/xóa --- */
let _matEditMode = false;       // true khi đang edit inline
let _matEditing = new Set();    // tập material id đang edit

function renderPopupMaterials(host, cid){
  const db=getDB(); const c=db.contracts.find(x=>x.id===cid); if(!c) return;
  const isEmp = currentUser()?.role==='employee';
  const materials = c.materials||[];
  const rows = materials.map((m,i)=>{
    const imported = getImportedQty(cid, m.id);
    const remaining = (Number(m.qtyContract)||0) - imported;
    let totQ=0,totV=0,lastSup='';
    db.importSlips.filter(s=>s.contractId===cid).forEach(s=>{
      (s.items||[]).forEach(it=>{
        if(it.materialId===m.id){
          const q=Number(it.qty)||0,p=Number(it.unitPrice)||0;
          totQ+=q; totV+=q*p;
          if(s.supplierName) lastSup=s.supplierName;
        }
      });
    });
    const avgP = totQ>0?totV/totQ:0;
    const priceHigh = avgP>0 && avgP > (Number(m.unitPriceContract)||0);
    const qtyExceed = imported > (Number(m.qtyContract)||0);
    const unitPriceRounded = Math.round(Number(m.unitPriceContract)||0);
    const lineTotal = Math.round((Number(m.qtyContract)||0) * (Number(m.unitPriceContract)||0));
    const isEditing = _matEditMode && _matEditing.has(m.id);
    if(isEditing){
      return `<tr style="background:#fef9c3">
        <td><input type="checkbox" class="mat-chk" data-mid="${m.id}" checked></td>
        <td>${i+1}</td>
        <td><input class="mat-edit" data-mid="${m.id}" data-field="name" value="${escapeHtml(m.name)}"></td>
        <td><input class="mat-edit" data-mid="${m.id}" data-field="unit" value="${escapeHtml(m.unit||'')}" style="width:70px"></td>
        <td><input class="mat-edit" data-mid="${m.id}" data-field="qtyContract" type="number" value="${m.qtyContract||0}" style="width:90px"></td>
        <td class="right muted">${imported}</td>
        <td class="right muted">${remaining}</td>
        <td><input class="mat-edit" data-mid="${m.id}" data-field="unitPriceContract" type="number" value="${m.unitPriceContract||0}" style="width:130px"></td>
        <td class="right" style="font-weight:600;color:#1e3a8a">${fmtVND(lineTotal)}</td>
        <td class="right muted">${avgP?fmtVND(Math.round(avgP)):'—'}</td>
        <td><input class="mat-edit" data-mid="${m.id}" data-field="note" value="${escapeHtml(m.note||'')}" placeholder="Ghi chú"></td>
      </tr>`;
    }
    return `<tr>
      <td>${isEmp?'':`<input type="checkbox" class="mat-chk" data-mid="${m.id}">`}</td>
      <td>${i+1}</td>
      <td>${escapeHtml(m.name)}</td>
      <td>${escapeHtml(m.unit||'')}</td>
      <td class="right">${m.qtyContract}</td>
      <td class="right" ${qtyExceed?'style="background:#fee2e2;color:#991b1b;font-weight:700"':''}>${imported}${qtyExceed?' ⚠':''}</td>
      <td class="right">${remaining}</td>
      <td class="right">${fmtVND(unitPriceRounded)}</td>
      <td class="right" style="font-weight:600;color:#1e3a8a">${fmtVND(lineTotal)}</td>
      <td class="right" ${priceHigh?'style="background:#fee2e2;color:#991b1b;font-weight:700"':''}>${avgP?fmtVND(Math.round(avgP)):'—'}${priceHigh?' ⚠':''}</td>
      <td class="muted">${escapeHtml(m.note||lastSup||'')}</td>
    </tr>`;
  }).join('');
  // Tính tổng giá trị phụ lục (làm tròn đến đơn vị)
  const totalContractValue = Math.round(materials.reduce((s,m)=>s + (Number(m.qtyContract)||0) * (Number(m.unitPriceContract)||0), 0));
  const totalImportedValue = materials.reduce((s,m)=>{
    let totQ=0,totV=0;
    db.importSlips.filter(sl=>sl.contractId===cid && sl.confirmed).forEach(sl=>{
      (sl.items||[]).forEach(it=>{
        if(it.materialId===m.id){
          const q=Number(it.qty)||0, p=Number(it.unitPrice)||0;
          totQ+=q; totV+=q*p;
        }
      });
    });
    return s + totV;
  }, 0);

  host.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
      <h3 style="margin:0">📦 Phụ lục vật tư (${materials.length} mục)${isEmp?' <span class="muted" style="font-size:12px;font-weight:400">— chỉ xem</span>':''}</h3>
      ${isEmp?'':`<div>
        <button class="btn sm" onclick="smartImportMaterials('${cid}')">🤖 Import thông minh từ Excel/PDF/Ảnh</button>
        <button class="btn sm success" onclick="openContractForm('${cid}')">✏ Mở form đầy đủ</button>
      </div>`}
    </div>
    <!-- TỔNG GIÁ TRỊ phụ lục — trên cùng -->
    <div class="card" style="background:linear-gradient(135deg,#1e3a8a,#3b82f6);color:#fff;margin-bottom:10px">
      <div class="grid-3" style="gap:14px">
        <div><div style="font-size:11px;opacity:.85">TỔNG GIÁ TRỊ PHỤ LỤC HĐ</div><div style="font-size:22px;font-weight:700">${fmtVND(totalContractValue)}</div></div>
        <div><div style="font-size:11px;opacity:.85">ĐÃ NHẬP (giá trị)</div><div style="font-size:22px;font-weight:700">${fmtVND(Math.round(totalImportedValue))}</div></div>
        <div><div style="font-size:11px;opacity:.85">CÒN LẠI PHẢI NHẬP</div><div style="font-size:22px;font-weight:700">${fmtVND(Math.round(totalContractValue - totalImportedValue))}</div></div>
      </div>
    </div>
    ${isEmp?'':`<div class="card" style="padding:10px;margin-bottom:10px;background:#f1f5f9">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div>
          <label style="display:inline;margin-right:10px"><input type="checkbox" id="mat-chk-all" onclick="toggleAllMatChk()"> Chọn tất cả</label>
          <span class="muted" id="mat-sel-count">0 dòng được chọn</span>
        </div>
        <div>
          ${_matEditMode
            ? `<button class="btn sm success" onclick="saveMatEdits('${cid}')">💾 Lưu / Cập nhật</button>
               <button class="btn sm outline" onclick="cancelMatEdits('${cid}')">↩ Hủy chỉnh sửa</button>`
            : `<button class="btn sm warn" onclick="startMatEdit('${cid}')">✏ Sửa các dòng đã chọn</button>
               <button class="btn sm danger" onclick="deleteSelectedMats('${cid}')">🗑 Xóa các dòng đã chọn</button>`}
        </div>
      </div>
    </div>`}
    <div class="warn-text">⚠ Cảnh báo trực tiếp: (1) SL đã nhập vượt SL HĐ; (2) Đơn giá nhập TB cao hơn đơn giá HĐ — ô tô đỏ.${isEmp?' 👁 Bạn chỉ được xem phụ lục vật tư, không được sửa/xóa.':' 💡 Tích checkbox đầu dòng để chọn các vật tư cần sửa/xóa.'}</div>
    <div class="tbl-wrap"><table style="font-size:12px" id="mat-tbl">
      <thead><tr>
        <th style="width:30px"></th>
        <th>STT</th><th>Tên hàng hóa</th><th>ĐVT</th><th>SL HĐ</th>
        <th>SL đã nhập</th><th>SL còn lại</th>
        <th>Đơn giá HĐ</th><th>Thành tiền HĐ</th><th>Đơn giá nhập TB</th><th>Ghi chú / NCC</th>
      </tr></thead>
      <tbody>${rows||'<tr><td colspan="11" class="muted center">Phụ lục trống. Bấm "🤖 Import thông minh" để nạp tự động từ file Excel/PDF/Ảnh.</td></tr>'}
        <tr style="background:#1e3a8a;color:#fff;font-weight:700"><td colspan="8" class="right">TỔNG CỘNG (Σ Thành tiền HĐ):</td><td class="right">${fmtVND(totalContractValue)}</td><td colspan="2"></td></tr>
      </tbody>
    </table></div>
  `;
  // Gắn event đếm số dòng chọn
  document.querySelectorAll('.mat-chk').forEach(c=>c.addEventListener('change', updateMatSelCount));
  updateMatSelCount();
}
window.toggleAllMatChk = function(){
  const all = document.getElementById('mat-chk-all').checked;
  document.querySelectorAll('.mat-chk').forEach(c=>c.checked=all);
  updateMatSelCount();
};
function updateMatSelCount(){
  const cnt = document.querySelectorAll('.mat-chk:checked').length;
  const el = document.getElementById('mat-sel-count');
  if(el) el.textContent = cnt+' dòng được chọn';
}
function getSelectedMatIds(){
  return Array.from(document.querySelectorAll('.mat-chk:checked')).map(c=>c.dataset.mid);
}
window.startMatEdit = function(cid){
  const ids = getSelectedMatIds();
  if(!ids.length){ toast('Hãy tích chọn ít nhất 1 dòng vật tư để sửa','warn'); return; }
  _matEditMode = true;
  _matEditing = new Set(ids);
  renderPopupBody();
};
window.cancelMatEdits = function(cid){
  _matEditMode = false; _matEditing.clear();
  renderPopupBody();
};
window.saveMatEdits = function(cid){
  const db=getDB(); const c=db.contracts.find(x=>x.id===cid); if(!c) return;
  // Đọc các input.mat-edit theo data-mid và data-field
  document.querySelectorAll('.mat-edit').forEach(inp=>{
    const mid = inp.dataset.mid, field = inp.dataset.field;
    const m = (c.materials||[]).find(x=>x.id===mid);
    if(!m) return;
    let v = inp.value;
    if(field==='qtyContract'||field==='unitPriceContract') v = Number(v)||0;
    m[field] = v;
  });
  saveDB(db);
  _matEditMode = false; _matEditing.clear();
  renderPopupBody();
  toast(`Đã lưu ${getSelectedMatIds().length || 'các'} dòng vật tư`);
};
window.deleteSelectedMats = function(cid){
  const ids = getSelectedMatIds();
  if(!ids.length){ toast('Hãy tích chọn ít nhất 1 dòng để xóa','warn'); return; }
  if(!confirm(`Xóa ${ids.length} dòng vật tư đã chọn khỏi phụ lục HĐ?\n⚠ Phiếu nhập tham chiếu các vật tư này sẽ chuyển thành "vật tư phát sinh".`)) return;
  const db=getDB(); const c=db.contracts.find(x=>x.id===cid); if(!c) return;
  // Xóa khỏi phụ lục
  c.materials = (c.materials||[]).filter(m=>!ids.includes(m.id));
  // Trong phiếu nhập: các item có materialId nằm trong ids → đánh dấu thành extras
  db.importSlips.filter(s=>s.contractId===cid).forEach(s=>{
    (s.items||[]).forEach(it=>{
      if(ids.includes(it.materialId)){ it.materialId=''; it.isExtra=true; }
    });
  });
  saveDB(db);
  renderPopupBody();
  toast(`Đã xóa ${ids.length} dòng vật tư`);
};

window.confirmImportSlip = function(slipId, cid){
  const db=getDB();
  const s = db.importSlips.find(x=>x.id===slipId); if(!s) return;
  if(!confirm(`Xác nhận phiếu nhập "${s.slipNo}"?\n\nSau khi xác nhận:\n• Phiếu có thể xuất ra Excel/Word/PDF\n• SL nhập sẽ cộng dồn vào phụ lục vật tư`)) return;

window.unconfirmImportSlip = function(slipId, cid){

window.promoteExtraToMaterial = function(cid, slipId, extraIdx){
  const db=getDB();
  const c=db.contracts.find(x=>x.id===cid);
  const s=db.importSlips.find(x=>x.id===slipId);
  if(!c||!s) return;
  const extras = (s.items||[]).filter(it=>it.isExtra);
  const x = extras[extraIdx]; if(!x) return;
  const newId = uid('m');
  c.materials = c.materials||[];
  c.materials.push({id:newId, name:x.materialName, unit:x.unit||'', qtyContract:Number(x.qty)||0, unitPriceContract:Number(x.unitPrice)||0, note:'(từ phát sinh)'});
  // Link lại trong tất cả slip items
  db.importSlips.filter(sl=>sl.contractId===cid).forEach(sl=>{
    (sl.items||[]).forEach(it=>{
      if(it.isExtra && it.materialName===x.materialName){
        it.materialId=newId; it.isExtra=false;
      }
    });
  });
  saveDB(db); renderPopupBody(); toast('Đã chuyển vật tư phát sinh vào phụ lục HĐ');
};

window.exportContractExcel = function(cid){
  const db=getDB();
  const c = db.contracts.find(x=>x.id===cid); if(!c) return;
  const cc = contractCalc(c);
  const wb = XLSX.utils.book_new();
  const info = [
    ['CHI TIẾT HỢP ĐỒNG'],
    ['Tên HĐ', c.name||''],
    ['Số HĐ', c.code||''],
    ['Công ty thực hiện', getCompany(c.companyId).name],
    ['Ngày ký', fmtDate(c.signDate)],
    ['Ngày hoàn thành', fmtDate(c.completeDate)],
    ['Trạng thái Hoàn thành', (COMPLETION_STATUS.find(s=>s.v===c.completionStatus)||{}).label||''],
    ['Trạng thái Quyết toán', (SETTLEMENT_STATUS.find(s=>s.v===c.settlementStatus)||{}).label||''],
    [], ['TÀI CHÍNH'],
    ['Giá trị HĐ', cc.value],
    ['Đã thanh toán', cc.paid],
    ['Giá trị còn lại', cc.remainingPay],
    ['Giá trị sau quyết toán', cc.settlement],
    ['Số tiền còn phải thu (sau QT)', cc.settledRemaining||0],
    [], ['HỒ SƠ PHÁP LÝ (link GDrive)']
  ];
  CONTRACT_DOC_TYPES.forEach(t=>info.push([t.label, (c.driveLinks||{})[t.key]||'']));
  info.push([], ['GHI CHÚ', c.note||'']);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(info), 'Thông tin HĐ');

  const matRows = [['STT','Tên vật tư','ĐVT','SL HĐ','SL đã nhập','SL còn lại','Đơn giá HĐ']];
  (c.materials||[]).forEach((m,i)=>{
    const imported = getImportedQty(c.id, m.id);
    matRows.push([i+1, m.name, m.unit||'', m.qtyContract||0, imported, (m.qtyContract||0)-imported, m.unitPriceContract||0]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(matRows), 'Phụ lục vật tư');
  XLSX.writeFile(wb, `HopDong_${(c.code||c.id).replace(/[^a-z0-9_-]/gi,'_')}.xlsx`);
  toast('Đã xuất Excel');
};

window.deleteContract = function(cid){

/* ---------- Quản lý các Phụ lục hợp đồng (addendums) ---------- */
window.addAddendumRow = function(){
  if(!window._addendumRows) window._addendumRows=[];
  window._addendumRows.push({signDate:Date.now(), extensionDays:0, valueChange:0, note:''});
  renderAddendumRows();
};
window.removeAddendumRow = function(i){ window._addendumRows.splice(i,1); renderAddendumRows(); };
window.updateAddendumRow = function(i, field, value){
  if(!window._addendumRows[i]) return;
  if(field==='extensionDays'||field==='valueChange') value = Number(value)||0;
  if(field==='signDate') value = value?new Date(value).getTime():Date.now();
  window._addendumRows[i][field] = value;
  // Cập nhật tổng GT
  recomputeContractTotals();
};
function renderAddendumRows(){
  const host = document.getElementById('cf-addendum-list'); if(!host) return;
  const rows = window._addendumRows||[];
  if(!rows.length){
    host.innerHTML = '<div class="muted" style="padding:8px 0">Chưa có phụ lục HĐ. Bấm "+ Thêm phụ lục" nếu HĐ có gia hạn/đổi giá trị.</div>';
  } else {
    host.innerHTML = `<div class="tbl-wrap"><table style="font-size:12px">
      <thead><tr><th>Phụ lục #</th><th>Ngày ký</th><th>Gia hạn (ngày)</th><th>GT thay đổi (đ)</th><th>Ghi chú</th><th></th></tr></thead>
      <tbody>${rows.map((a,i)=>`<tr>
        <td><b>PL ${i+1}</b></td>
        <td><input type="date" value="${a.signDate?new Date(a.signDate).toISOString().slice(0,10):''}" onchange="updateAddendumRow(${i},'signDate',this.value)"></td>
        <td><input type="number" value="${a.extensionDays||''}" oninput="updateAddendumRow(${i},'extensionDays',this.value)" placeholder="VD: 30" style="width:90px"></td>
        <td><input type="number" value="${a.valueChange||''}" oninput="updateAddendumRow(${i},'valueChange',this.value)" placeholder="+ hoặc -" style="width:140px"></td>
        <td><input value="${escapeHtml(a.note||'')}" oninput="updateAddendumRow(${i},'note',this.value)" placeholder="Nội dung phụ lục"></td>
        <td><button class="btn sm danger" type="button" onclick="removeAddendumRow(${i})">🗑</button></td>
      </tr>`).join('')}</tbody></table></div>`;
  }
  recomputeContractTotals();
}
/* Cập nhật tổng GT HĐ + đã thanh toán + còn phải thu (real-time) */
function recomputeContractTotals(){
  const baseEl = document.getElementById('cf-val'); if(!baseEl) return;

  const addens = window._addendumRows||[];
  const addSum = addens.reduce((s,a)=>s+(Number(a.valueChange)||0), 0);
  const totalVal = base + addSum;
  const paid = (window._paymentRows||[]).reduce((s,p)=>s+(Number(p.amount)||0), 0);
  const taxTotal = (window._paymentRows||[]).reduce((s,p)=>s+(Number(p.taxVanglai)||0), 0);
  const remaining = totalVal - paid;
  const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=fmtVND(v); };
  set('cf-paid-total', paid);
  set('cf-tax-total', taxTotal);
  set('cf-total-val', totalVal);
  set('cf-remaining', remaining);
  const paidHid = document.getElementById('cf-paid'); if(paidHid) paidHid.value=paid;
}

/* ============================================================
   SMART IMPORT VẬT TƯ — Excel/CSV (auto-detect cột) + PDF text + PDF scan/Ảnh (OCR)
   ============================================================ */
const MAT_FIELD_KEYWORDS = {
  name:  [
    'tên', 'ten',
    'mat hang', 'mặt hàng',
    'vật tư', 'vat tu',
    'hàng hóa', 'hang hoa',
    'description', 'item',
    'nội dung công việc', 'noi dung cong viec',
    'diễn giải', 'dien giai',
    'công việc', 'cong viec',
    'tên vật liệu', 'ten vat lieu',
    'vật liệu', 'vat lieu',
    'tên hàng', 'ten hang',
    'sản phẩm', 'san pham',
    'tên sản phẩm', 'ten san pham',
    'tên hàng hóa', 'ten hang hoa'
  ],
  unit:  ['đvt', 'dvt', 'đơn vị', 'don vi', 'unit', 'uom', 'đơn vị tính', 'don vi tinh'],
  qty:   ['số lượng', 'so luong', 'sl', 'qty', 'quantity', 'klg', 'khối lượng', 'khoi luong'],
  price: ['đơn giá', 'don gia', 'giá', 'gia', 'unit price', 'price', 'rate', 'giá hợp đồng', 'gia hop dong'],
  note:  ['ghi chú', 'ghi chu', 'note', 'remark']
};
function _normVN(s){ return String(s||'').toLowerCase().replace(/[^a-zà-ỹ0-9 ]/gi,' ').replace(/\s+/g,' ').trim(); }
function detectColMap(headerRow){
  // Trả về object {nameIdx, unitIdx, qtyIdx, priceIdx, noteIdx} dựa trên tên cột
  const map = {nameIdx:0, unitIdx:1, qtyIdx:2, priceIdx:3, noteIdx:4};
  const norm = headerRow.map(_normVN);
  function findIdx(keywords){
    for(let i=0;i<norm.length;i++){
      for(const kw of keywords){
        if(norm[i].includes(_normVN(kw))) return i;
      }
    }
    return -1;
  }
  const n = findIdx(MAT_FIELD_KEYWORDS.name);  if(n>=0) map.nameIdx=n;
  const u = findIdx(MAT_FIELD_KEYWORDS.unit);  if(u>=0) map.unitIdx=u;
  const q = findIdx(MAT_FIELD_KEYWORDS.qty);   if(q>=0) map.qtyIdx=q;
  const p = findIdx(MAT_FIELD_KEYWORDS.price); if(p>=0) map.priceIdx=p;
  const nt = findIdx(MAT_FIELD_KEYWORDS.note); if(nt>=0) map.noteIdx=nt;
  return map;
}
function isHeaderRow(row){
  const txt = row.map(_normVN).join(' ');
  const kw = [...MAT_FIELD_KEYWORDS.name, ...MAT_FIELD_KEYWORDS.qty];
  return kw.some(k=>txt.includes(_normVN(k)));
}
/* ---------- Phát hiện vùng bảng dữ liệu trong sheet ---------- */
function _scoreHeaderRow(row){
  // Trả về số keyword khớp được trong dòng
  let s=0;
  const headers = [...MAT_FIELD_KEYWORDS.name, ...MAT_FIELD_KEYWORDS.unit, ...MAT_FIELD_KEYWORDS.qty, ...MAT_FIELD_KEYWORDS.price, ...MAT_FIELD_KEYWORDS.note];
  const seen = new Set();
  (row||[]).forEach(cell=>{
    const n = _normVN(cell);
    if(!n) return;
    for(const kw of headers){
      const k = _normVN(kw);
      if(n.includes(k) && !seen.has(k)){ s++; seen.add(k); return; }
    }
  });
  return s;
}
function findDataRegion(rows){
  // Quét tối đa 30 dòng đầu để tìm header có điểm cao nhất
  let bestIdx=-1, bestScore=0;
  const scanLimit = Math.min(30, rows.length);
  for(let i=0; i<scanLimit; i++){
    const s = _scoreHeaderRow(rows[i]||[]);
    if(s>bestScore){ bestScore=s; bestIdx=i; }
  }
  if(bestIdx<0 || bestScore<2) return {headerIdx:-1, start:0, end:rows.length, score:bestScore, colMap:{nameIdx:0,unitIdx:1,qtyIdx:2,priceIdx:3,noteIdx:4}};
  const colMap = detectColMap(rows[bestIdx]);
  // Xác định end: dừng tại dòng trống hoặc dòng "Tổng cộng"
  let end = rows.length;
  let emptyStreak = 0;
  for(let i=bestIdx+1; i<rows.length; i++){
    const r = rows[i]||[];
    const allEmpty = r.every(c=>String(c).trim()==='');
    if(allEmpty){
      emptyStreak++;
      if(emptyStreak>=2){ end = i-1; break; } // 2 dòng trống liên tiếp → kết thúc
      continue;
    } else emptyStreak=0;
    const firstCells = r.slice(0,3).map(c=>String(c||'').toLowerCase()).join(' ');
    if(/tổng cộng|cộng:?$|tổng:?$|total|sum total|grand total/i.test(firstCells)){ end=i; break; }
  }
  return {headerIdx:bestIdx, start:bestIdx+1, end, score:bestScore, colMap};
}
function parseRowsToMaterials(rows){
  if(!rows||!rows.length) return [];
  const region = findDataRegion(rows);
  const {start, end, colMap} = region;
  const list=[];
  for(let i=start;i<end;i++){
    const r = rows[i]||[];
    const name = String(r[colMap.nameIdx]||'').trim();
    if(!name) continue;
    // Bỏ qua dòng có vẻ là tiêu đề con
    if(/^(stt|số\s*tt|no\.?|#)$/i.test(name)) continue;
    // Bỏ qua dòng tổng cộng
    if(/tổng|cộng|total|sum/i.test(name) && !r[colMap.qtyIdx]) continue;
    const parseNum = (s)=>{
      const str = String(s||'').replace(/\s/g,'');
      if(!str) return 0;
      // Loại bỏ ký tự "đ", "VND" và phân cách
      const clean = str.replace(/đ|vnd|₫/gi,'').replace(/[,.](?=\d{3}\b)/g,''); // bỏ dấu phân cách hàng nghìn
      return Number(clean.replace(',','.'))||0;
    };
    list.push({
      id: uid('m'),
      name,
      unit: String(r[colMap.unitIdx]||'').trim(),
      qtyContract: parseNum(r[colMap.qtyIdx]),
      unitPriceContract: parseNum(r[colMap.priceIdx]),
      note: String(r[colMap.noteIdx]||'').trim()
    });
  }
  return list;
}

/* ---------- Quét cả workbook, chọn sheet có vùng dữ liệu tốt nhất ---------- */
function pickBestSheet(workbook){
  let best = {rows:[], score:-1, sheetName:''};
  for(const sn of workbook.SheetNames){
    const ws = workbook.Sheets[sn];
    if(!ws) continue;
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    const region = findDataRegion(rows);
    // Cộng điểm thêm cho lượng dòng data thực
    const dataRows = Math.max(0, region.end - region.start);
    const totalScore = region.score*10 + Math.min(dataRows, 200);
    if(totalScore > best.score){
      best = {rows, score: totalScore, sheetName: sn, region};
    }
  }
  return best;
}

/* ---------- Helpers so sánh tên vật tư ---------- */
function normalizeMatName(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')   // bỏ dấu tiếng Việt
    .replace(/đ/g,'d')
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function levDist(a, b){
  if(a===b) return 0;
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const dp = new Array(n+1).fill(0).map((_,j)=>j);
  for(let i=1;i<=m;i++){
    let prev=dp[0]; dp[0]=i;
    for(let j=1;j<=n;j++){
      const tmp=dp[j];
      if(a[i-1]===b[j-1]) dp[j]=prev;
      else dp[j] = 1 + Math.min(prev, dp[j], dp[j-1]);
      prev=tmp;
    }
  }
  return dp[n];
}
function nameSimilarity(a, b){
  const aN=normalizeMatName(a), bN=normalizeMatName(b);
  if(!aN||!bN) return 0;
  if(aN===bN) return 1;
  const dist=levDist(aN,bN);
  const maxLen=Math.max(aN.length, bN.length);
  return 1 - dist/maxLen;
}
/* So khớp tên 1 vật tư với phụ lục HĐ → trả về {status, match, candidates} */
function matchMaterialInCatalog(name, catalogMaterials){
  if(!name) return {status:'empty', match:null, candidates:[]};
  const normTarget = normalizeMatName(name);
  // Exact match (case + dấu insensitive)
  const exact = catalogMaterials.find(m=>normalizeMatName(m.name)===normTarget);
  if(exact) return {status:'exact', match:exact, candidates:[]};
  // Tìm các ứng viên ≥60% và sắp xếp giảm dần
  const candidates = catalogMaterials
    .map(m=>({mat:m, sim:nameSimilarity(name, m.name)}))
    .filter(c=>c.sim>=0.6)
    .sort((a,b)=>b.sim-a.sim);
  if(candidates.length) return {status:'similar', match:null, candidates};
  return {status:'new', match:null, candidates:[]};
}

/* Phân tích văn bản (đa dòng) ra bảng vật tư — heuristic dùng cho PDF text & OCR */
function textToMaterialRows(text){
  // Mỗi dòng cố gắng nhận diện: <tên> <ĐVT?> <SL> <Đơn giá?>
  // Bằng cách tách bằng nhiều khoảng trắng / tab.
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows = lines.map(l=>{
    // Tách bằng tab nếu có; nếu không, dùng 2+ space
    let parts;
    if(l.includes('\t')) parts = l.split(/\t+/);
    else parts = l.split(/\s{2,}/);
    if(parts.length<2) parts = l.split(/[|,;]/).map(s=>s.trim());
    return parts;
  });
  return rows;
}

/* Chọn file → phân loại → trích xuất rows → modal mapping cho user xác nhận → callback */
function pickFileAndExtractMaterials(callback){
  const inp=document.createElement('input');
  inp.type='file';
  inp.accept='.xlsx,.xls,.csv,.pdf,.png,.jpg,.jpeg,.bmp,.webp';
  inp.onchange = async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const ext = (f.name.split('.').pop()||'').toLowerCase();
    try{
      let rows = [], sourceLabel = '';
      if(['xlsx','xls','csv'].includes(ext)){
        const buf = await f.arrayBuffer();
        const wb = XLSX.read(new Uint8Array(buf), {type:'array'});
        const best = pickBestSheet(wb);
        if(best.score<0){ toast('Không tìm thấy bảng dữ liệu hợp lệ trong file','warn'); return; }
        rows = best.rows;
        sourceLabel = `Excel — Sheet "${best.sheetName}"`;
      } else if(ext==='pdf'){
        rows = await extractRowsFromPDF(f);
        sourceLabel = `PDF — ${f.name}`;
      } else if(['png','jpg','jpeg','bmp','webp'].includes(ext)){
        rows = await extractRowsFromImage(f);
        sourceLabel = `Ảnh OCR — ${f.name}`;
      } else {
        toast('Định dạng file không hỗ trợ','error'); return;
      }
      if(!rows.length){ toast('Không trích xuất được dữ liệu từ file','warn'); return; }
      // Mở modal cho người dùng ánh xạ cột
      showMaterialMappingPreview(rows, sourceLabel, (finalMats, summary)=>{
        callback(finalMats, summary);
      });
    } catch(err){
      console.error(err);
      toast('Lỗi xử lý file: '+err.message,'error');
    }
  };
  inp.click();
}

/* PDF → rows (2D array). Có pha OCR cho trang scan */
async function extractRowsFromPDF(file){
  toast('Đang tải PDF.js...','info');
  const pdfjs = await window._loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjs.getDocument({data:buf}).promise;
  let allText = ''; const scannedPages = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const txt = await page.getTextContent();
    const lineMap = {};
    txt.items.forEach(it=>{
      const y = Math.round(it.transform[5]);
      if(!lineMap[y]) lineMap[y]=[];
      lineMap[y].push({x:it.transform[4], s:it.str});
    });
    const ys = Object.keys(lineMap).map(Number).sort((a,b)=>b-a);
    const pageText = ys.map(y=>{
      return lineMap[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join('\t');
    }).join('\n');
    if(pageText.replace(/\s/g,'').length < 20) scannedPages.push(p);
    else allText += pageText + '\n';
  }
  if(scannedPages.length){
    toast(`Phát hiện ${scannedPages.length} trang scan — chạy OCR (30-60s/trang)...`,'info');
    const tess = await window._loadTesseract();
    for(const p of scannedPages){
      const page = await pdf.getPage(p);
      const viewport = page.getViewport({scale:2});
      const canvas = document.createElement('canvas');
      canvas.width=viewport.width; canvas.height=viewport.height;
      await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
      const dataUrl = canvas.toDataURL('image/png');
      const {data:{text}} = await tess.recognize(dataUrl,'vie+eng');
      allText += text + '\n';
    }
  }
  return textToMaterialRows(allText);
}
async function extractRowsFromImage(file){
  toast('Đang tải Tesseract.js OCR (lần đầu ~10MB)...','info');
  const tess = await window._loadTesseract();
  const dataUrl = await new Promise((res,rej)=>{
    const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file);
  });
  toast('OCR đang chạy...','info');
  const {data:{text}} = await tess.recognize(dataUrl,'vie+eng');
  return textToMaterialRows(text);
}

let _impRows = null, _impHeaderIdx = -1, _impStart = 0, _impEnd = 0, _impMapping = null, _impOnConfirm = null;

function showMaterialMappingPreview(rows, sourceLabel, onConfirm){
  _impRows = rows;
  const region = findDataRegion(rows);
  _impHeaderIdx = region.headerIdx;
  _impStart = region.start;
  _impEnd = region.end;
  // Tính số cột max
  let maxCols = 0;
  rows.forEach(r=>{ if(r) maxCols = Math.max(maxCols, r.length); });
  // Khởi tạo mapping mặc định: -1 cho cột không gán
  _impMapping = new Array(maxCols).fill(null); // null = bỏ qua
  const cm = region.colMap;
  if(maxCols>0){
    if(cm.nameIdx>=0 && cm.nameIdx<maxCols) _impMapping[cm.nameIdx]='name';
    if(cm.unitIdx>=0 && cm.unitIdx<maxCols) _impMapping[cm.unitIdx]='unit';
    if(cm.qtyIdx>=0 && cm.qtyIdx<maxCols) _impMapping[cm.qtyIdx]='qty';
    if(cm.priceIdx>=0 && cm.priceIdx<maxCols) _impMapping[cm.priceIdx]='price';
    if(cm.noteIdx>=0 && cm.noteIdx<maxCols) _impMapping[cm.noteIdx]='note';
  }
  _impOnConfirm = onConfirm;

  openModal({
    title:`🤖 Xem trước & ánh xạ cột — ${sourceLabel}`, size:'lg',
    html:`
      <div class="help-text">
        <b>Bước 1:</b> Kiểm tra phần mềm đã chọn đúng vùng bảng (chỉnh số dòng nếu cần).
        <b>Bước 2:</b> Trên mỗi cột của bảng bên dưới, chọn cột đó tương ứng với trường nào của <b>phụ lục vật tư</b>:
        <b>Tên hàng hóa</b> · <b>ĐVT</b> · <b>SL HĐ</b> · <b>Đơn giá HĐ</b> · <b>Ghi chú</b> · hoặc <b>Bỏ qua</b>.
        <b>Bước 3:</b> Bấm <b>Xác nhận import</b>.
      </div>
      <div class="grid-3" style="align-items:end;margin-bottom:8px">
        <div class="field"><label>Dòng tiêu đề (header)</label><input id="imp-header" type="number" min="0" value="${_impHeaderIdx+1}" onchange="updateImpRange()"><div class="hint">0 = không có header, bắt đầu data từ dòng 1.</div></div>
        <div class="field"><label>Dòng bắt đầu data</label><input id="imp-start" type="number" min="1" value="${_impStart+1}" onchange="updateImpRange()"></div>
        <div class="field"><label>Dòng kết thúc data</label><input id="imp-end" type="number" min="1" value="${_impEnd}" onchange="updateImpRange()"></div>
      </div>
      <div id="imp-preview-wrap" style="max-height:420px;overflow:auto;border:1px solid #e2e8f0;border-radius:8px"></div>

window.updateImpRange = function(){
  _impHeaderIdx = (Number(document.getElementById('imp-header').value)||0) - 1;
  _impStart = (Number(document.getElementById('imp-start').value)||1) - 1;
  _impEnd   = Number(document.getElementById('imp-end').value)||_impRows.length;
  renderImpPreview();
};
window.updateImpMapping = function(colIdx, role){
  _impMapping[colIdx] = role || null;
  // Đảm bảo mỗi role chỉ có 1 cột (trừ "ignore" có thể nhiều)
  if(role){
    for(let i=0;i<_impMapping.length;i++){
      if(i!==colIdx && _impMapping[i]===role) _impMapping[i]=null;
    }
  }
  renderImpPreview();
};

function renderImpPreview(){
  const host = document.getElementById('imp-preview-wrap'); if(!host) return;
  const rows = _impRows||[];
  const maxCols = _impMapping.length;
  // Lấy header row + sample 20 dòng data đầu
  const headerRow = (_impHeaderIdx>=0 && _impHeaderIdx<rows.length) ? rows[_impHeaderIdx] : null;
  const dataRows = rows.slice(_impStart, Math.min(_impEnd, _impStart+50));

  const roleOptions = [
    {v:'',     label:'— Bỏ qua —'},
    {v:'stt',  label:'#️⃣ STT'},
    {v:'name', label:'📝 Tên hàng hóa'},
    {v:'unit', label:'📏 ĐVT'},
    {v:'qty',  label:'🔢 SL HĐ'},
    {v:'price',label:'💰 Đơn giá HĐ'},
    {v:'total',label:'💵 Thành tiền'},
    {v:'note', label:'💬 Ghi chú'}
  ];
  const roleColor = {stt:'#f1f5f9', name:'#dcfce7', unit:'#dbeafe', qty:'#fef3c7', price:'#fed7aa', total:'#fbcfe8', note:'#e0e7ff'};

  let html = '<table style="font-size:11px;border-collapse:collapse;width:100%;min-width:max-content">';
  // Hàng 1: dropdown role per column
  html += '<thead><tr style="position:sticky;top:0;background:#fff;z-index:10">';
  for(let c=0;c<maxCols;c++){
    const cur = _impMapping[c]||'';
    const bg = roleColor[cur]||'#f8fafc';
    html += `<th style="padding:4px;background:${bg};border:1px solid #cbd5e1;min-width:140px">
      <select style="width:100%;font-size:11px" onchange="updateImpMapping(${c},this.value)">
        ${roleOptions.map(o=>`<option value="${o.v}" ${o.v===cur?'selected':''}>${o.label}</option>`).join('')}
      </select>
      <div style="font-size:10px;color:#64748b;margin-top:2px">Cột ${c+1}</div>
    </th>`;
  }
  html += '</tr>';
  // Hàng 2: header gốc từ file (nếu có)
  if(headerRow){
    html += '<tr style="background:#1e293b;color:#fff">';
    for(let c=0;c<maxCols;c++){
      html += `<th style="padding:4px 6px;border:1px solid #475569;font-size:10px;font-weight:600">${escapeHtml(String(headerRow[c]||''))}</th>`;
    }
    html += '</tr>';
  }
  html += '</thead><tbody>';
  dataRows.forEach((r, idx)=>{
    html += '<tr>';
    for(let c=0;c<maxCols;c++){
      const cur = _impMapping[c]||'';
      const bg = cur ? (roleColor[cur]||'#fff') : '#fff';
      const val = (r && r[c]!==undefined) ? String(r[c]) : '';
      html += `<td style="padding:3px 6px;border:1px solid #e2e8f0;background:${bg};font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(val)}">${escapeHtml(val)}</td>`;
    }
    html += '</tr>';
  });
  html += '</tbody></table>';
  host.innerHTML = html;

  // Info + tính tổng số tiền dự kiến
  const nameCol = _impMapping.indexOf('name');
  const qtyCol = _impMapping.indexOf('qty');
  const priceCol = _impMapping.indexOf('price');
  const totalCol = _impMapping.indexOf('total');
  const ok = nameCol>=0;
  // Tổng giá trị
  const parseNum = (s)=>{
    const str = String(s||'').replace(/\s/g,'');
    if(!str) return 0;
    const clean = str.replace(/đ|vnd|₫/gi,'').replace(/[,.](?=\d{3}\b)/g,'');
    return Number(clean.replace(',','.'))||0;
  };
  let grandTotal = 0, lineCount = 0;
  for(let i=_impStart; i<_impEnd && i<rows.length; i++){
    const r = rows[i]||[];
    const name = nameCol>=0 ? String(r[nameCol]||'').trim() : '';
    if(!name || /^(stt|số\s*tt|no\.?|#)$/i.test(name)) continue;
    if(/tổng|cộng|total|sum/i.test(name) && (qtyCol<0 || !r[qtyCol])) continue;
    let line = 0;
    if(totalCol>=0 && r[totalCol]){
      line = parseNum(r[totalCol]);
    } else if(qtyCol>=0 && priceCol>=0){
      line = parseNum(r[qtyCol]) * parseNum(r[priceCol]);
    }
    grandTotal += line;
    lineCount++;
  }
  const info = document.getElementById('imp-info');
  if(info){
    const msg = ok
      ? `<span style="color:#16a34a">✓ Sẽ import <b>${lineCount}</b> dòng (xem ${dataRows.length} dòng đầu) — Cột Tên: <b>Cột ${nameCol+1}</b>${qtyCol>=0?', SL: Cột '+(qtyCol+1):''}${priceCol>=0?', Đơn giá: Cột '+(priceCol+1):''}${totalCol>=0?', Thành tiền: Cột '+(totalCol+1):''}</span>`
      : `<span style="color:#dc2626">⚠ Chưa chọn cột "Tên hàng hóa". Hãy chỉ định cột tên ở dropdown phía trên bảng.</span>`;
    info.innerHTML = `${msg}<div style="margin-top:6px;padding:8px 12px;background:#1e3a8a;color:#fff;border-radius:6px;font-size:13px"><b>💵 Tổng số tiền dự kiến của phụ lục HĐ:</b> ${fmtVND(grandTotal)}</div>`;
  }
}

window.confirmMaterialMapping = function(){
  const nameCol = _impMapping.indexOf('name');
  if(nameCol<0){ toast('Vui lòng chọn 1 cột làm "Tên hàng hóa"','error'); return; }
  const unitCol  = _impMapping.indexOf('unit');
  const qtyCol   = _impMapping.indexOf('qty');
  const priceCol = _impMapping.indexOf('price');
  const totalCol = _impMapping.indexOf('total');
  const noteCol  = _impMapping.indexOf('note');
  const parseNum = (s)=>{
    const str = String(s||'').replace(/\s/g,'');
    if(!str) return 0;
    const clean = str.replace(/đ|vnd|₫/gi,'').replace(/[,.](?=\d{3}\b)/g,'');
    return Number(clean.replace(',','.'))||0;
  };
  const mats = [];
  let totalSum = 0;
  for(let i=_impStart; i<_impEnd && i<_impRows.length; i++){
    const r = _impRows[i]||[];
    const name = String(r[nameCol]||'').trim();
    if(!name) continue;
    if(/^(stt|số\s*tt|no\.?|#)$/i.test(name)) continue;
    if(/tổng|cộng|total|sum/i.test(name) && (qtyCol<0 || !r[qtyCol])) continue;
    const qty = qtyCol>=0 ? parseNum(r[qtyCol]) : 0;
    let price = priceCol>=0 ? parseNum(r[priceCol]) : 0;
    const total = totalCol>=0 ? parseNum(r[totalCol]) : 0;
    // Nếu chỉ có "Thành tiền" mà thiếu "Đơn giá" → suy ra Đơn giá = Thành tiền / SL
    if(!price && total && qty) price = total/qty;
    totalSum += (total || (qty*price));
    mats.push({
      id: uid('m'),
      name,
      unit: unitCol>=0 ? String(r[unitCol]||'').trim() : '',
      qtyContract: qty,
      unitPriceContract: price,
      note: noteCol>=0 ? String(r[noteCol]||'').trim() : ''
    });
  }
  closeModal();
  if(typeof _impOnConfirm==='function'){
    _impOnConfirm(mats, `${mats.length} vật tư · Tổng phụ lục: ${fmtVND(Math.round(totalSum))}`);
  }
  _impRows=null; _impMapping=null; _impOnConfirm=null;
};

window.saveContractForm = function(id){

  c.name=name; c.code=code;
  c.companyId=v('cf-company');
  c.completionStatus=v('cf-comp');

  c.addendums = (window._addendumRows||[]).filter(a=>a.signDate||a.extensionDays||a.valueChange||a.note).map(a=>({
    signDate: a.signDate||Date.now(),
    extensionDays: Number(a.extensionDays)||0,

  c.ownerPhone = v('cf-ownertel');
  c.ownerEmail = v('cf-owneremail');
  c.siteAddress = v('cf-siteaddr');

  c.supervisorCompany = v('cf-svname');
  c.supervisorHead    = v('cf-svhead');
  c.supervisorPhone   = v('cf-svtel');
  c.supervisorEmail   = v('cf-svemail');
  c.supervisorAddress = v('cf-svaddr');
  // Tư vấn thiết kế
  c.designerCompany = v('cf-dsname');
  c.designerHead    = v('cf-dshead');
  c.designerPhone   = v('cf-dstel');
  c.designerEmail   = v('cf-dsemail');
  c.designerAddress = v('cf-dsaddr');
  // Quản lý dự án (per-project, multi-select)
  c.projectManagers = Array.from(document.querySelectorAll('#pm-list-wrap input[type=checkbox]:checked'))
    .map(chk=>chk.id.replace('cf-pm-',''));
  c.note=v('cf-note');
  c.driveLinks={};
  CONTRACT_DOC_TYPES.forEach(t=>{ c.driveLinks[t.key]=v('cf-doc-'+t.key); });
  c.materials = (window._matRows||[]).filter(m=>m.name).map(m=>({
    id:m.id||uid('m'), name:m.name, unit:m.unit||'',
    qtyContract:Number(m.qtyContract)||0,
    unitPriceContract:Number(m.unitPriceContract)||0,
    note:m.note||''
  }));
  c.updatedAt=Date.now();
  saveDB(db); closeModal();
  renderContractTabBody();
  toast(id?'Đã cập nhật HĐ':'Đã lưu HĐ mới');
};

window.openContractMaterialsModal = function(cid){
  const db=getDB();
  const c = db.contracts.find(x=>x.id===cid); if(!c) return;
  const materials = c.materials||[];
  const slips = db.importSlips.filter(s=>s.contractId===cid).sort((a,b)=>(b.date||0)-(a.date||0));

  // Bảng vật tư với cảnh báo
  const matRows = materials.map((m,i)=>{
    const imported = getImportedQty(cid, m.id);
    const remaining = (Number(m.qtyContract)||0) - imported;
    // Đơn giá nhập trung bình (weighted)
    let totalQty=0, totalVal=0, lastSupplier='';
    db.importSlips.filter(s=>s.contractId===cid).forEach(s=>{
      (s.items||[]).forEach(it=>{
        if(it.materialId===m.id){
          const q=Number(it.qty)||0, p=Number(it.unitPrice)||0;
          totalQty+=q; totalVal+=q*p;
          if(s.supplierName) lastSupplier=s.supplierName;
        }
      });
    });
    const avgImportPrice = totalQty>0 ? totalVal/totalQty : 0;
    const priceHigh = avgImportPrice > 0 && avgImportPrice > (Number(m.unitPriceContract)||0);
    const qtyExceed = imported > (Number(m.qtyContract)||0);
    return `<tr>
      <td>${i+1}</td>
      <td>${escapeHtml(m.name)}</td>
      <td>${escapeHtml(m.unit||'')}</td>
      <td class="right">${m.qtyContract}</td>
      <td class="right" ${qtyExceed?'style="background:#fee2e2;color:#991b1b;font-weight:700"':''}>${imported}${qtyExceed?' ⚠':''}</td>
      <td class="right">${remaining}</td>
      <td class="right">${fmtVND(m.unitPriceContract||0)}</td>
      <td class="right" ${priceHigh?'style="background:#fee2e2;color:#991b1b;font-weight:700"':''}>${avgImportPrice?fmtVND(Math.round(avgImportPrice)):'—'}${priceHigh?' ⚠':''}</td>
      <td>${escapeHtml(lastSupplier||'—')}</td>
    </tr>`;
  }).join('');

  // Bảng phiếu nhập
  const slipRows = slips.map(s=>`<tr>
    <td>${escapeHtml(s.slipNo||'')}</td>
    <td>${fmtDate(s.date)}</td>
    <td>${escapeHtml(s.supplierName||'')}</td>
    <td class="center">${(s.items||[]).length}</td>
    <td class="right">${fmtVND(s.totalValue||0)}</td>
    <td>
      <button class="btn sm outline" onclick="exportImportSlipExcel('${s.id}')">📊 Excel</button>
      <button class="btn sm outline" onclick="exportImportSlipWord('${s.id}')">📝 Word</button>
      <button class="btn sm danger" onclick="deleteImportSlip('${s.id}','${cid}')">🗑</button>
    </td>
  </tr>`).join('') || '<tr><td colspan="6" class="muted center">Chưa có phiếu nhập</td></tr>';

  openModal({
    title:`📦 Quản lý vật tư — ${c.name||c.code}`, size:'lg',
    html:`
      <h3>📋 Bảng vật tư hợp đồng (${materials.length} mục)</h3>
      <div class="warn-text">⚠ Phần mềm cảnh báo: (1) Số lượng đã nhập vượt SL HĐ; (2) Đơn giá nhập TB cao hơn đơn giá HĐ.</div>
      <div class="tbl-wrap"><table style="font-size:12px">
        <thead><tr><th>STT</th><th>Tên hàng hóa</th><th>ĐVT</th><th>SL HĐ</th><th>SL đã nhập</th><th>SL còn lại</th><th>Đơn giá HĐ</th><th>Đơn giá nhập TB</th><th>Nhà cung cấp</th></tr></thead>
        <tbody>${matRows || '<tr><td colspan="9" class="muted center">Phụ lục vật tư trống. Vào "Nhập đầu vào" để thêm.</td></tr>'}</tbody>
      </table></div>

      <h3 style="margin-top:14px">📥 Phiếu nhập vật tư <button class="btn sm success" type="button" onclick="openImportSlipForm('${cid}')" style="float:right">+ Tạo phiếu nhập</button> <button class="btn sm outline" type="button" onclick="importSlipFromFile('${cid}')" style="float:right;margin-right:6px">📊 Import từ Excel</button></h3>
      <div class="tbl-wrap"><table style="font-size:12px">
        <thead><tr><th>Số phiếu</th><th>Ngày</th><th>NCC</th><th>Số dòng</th><th>Giá trị</th><th></th></tr></thead>
        <tbody>${slipRows}</tbody>
      </table></div>
    `,
    footer:`<button class="btn outline" onclick="closeModal()">Đóng</button>`
  });
};

window.saveImportSlip = function(cid, slipId){
  const db=getDB();
  const v=q=>document.getElementById(q).value.trim();
  const items = (window._slipItems||[]).filter(it=>it.materialId || it.materialName);
  if(!items.length){ toast('Phiếu nhập trống — thêm ít nhất 1 dòng','error'); return; }
  let s; let isNew = false;
  if(slipId){ s=db.importSlips.find(x=>x.id===slipId); }
  else { s={id:uid('s'), createdAt:Date.now(), createdBy:currentUser().id, confirmed:false}; db.importSlips.push(s); isNew=true; }
  // Phân quyền: admin/manager/pm hoặc PM của DA → tự xác nhận; NV → chờ xác nhận
  const me=currentUser();
  if(isNew){
    s.confirmed = canApproveProject(cid);
    if(s.confirmed){ s.confirmedAt=Date.now(); s.confirmedBy=me.id; }
    else s.submittedAt = Date.now();
  } else {
    if(me.role==='employee' && s.confirmed){
      s.confirmed = false; s.confirmedAt = null; s.confirmedBy = null;
      s.submittedAt = Date.now();
    }
  }
  s.contractId=cid;
  s.slipNo=v('sl-no');
  const d=v('sl-date'); s.date = d?new Date(d).getTime():Date.now();
  s.requesterName = v('sl-requester');
  // Người được trình duyệt (lựa chọn của NV) — chỉ ghi nhận, ai có quyền cũng duyệt được
  const submitTo = v('sl-submitto');
  if(submitTo) s.submittedToPMId = submitTo;
  s.supplierName=v('sl-sup');
  s.supplierPhone=v('sl-supphone');
  s.supplierAddr=v('sl-supaddr');
  s.supplierTax=v('sl-suptax');
  s.note=v('sl-note');
  s.items = items.map(it=>({
    materialId: it.materialId||'',
    materialName: it.materialName || (db.contracts.find(c=>c.id===cid)?.materials?.find(m=>m.id===it.materialId)?.name)||'',
    unit: it.unit||'',
    qty: Number(it.qty)||0,
    unitPrice: Number(it.unitPrice)||0,
    isExtra: !it.materialId
  }));
  s.totalValue = s.items.reduce((sum,it)=>sum+(it.qty*it.unitPrice),0);

  // Tự thêm NCC mới vào danh mục
  if(s.supplierName){
    const existed = db.suppliers.find(x=>x.name.toLowerCase()===s.supplierName.toLowerCase());
    if(!existed){
      db.suppliers.push({id:uid('sup'), name:s.supplierName, phone:s.supplierPhone, address:s.supplierAddr, taxCode:s.supplierTax});
    }
  }
  saveDB(db);
  closeModal();
  renderContractTabBody();
  // Re-open materials modal để thấy update
  setTimeout(()=>openContractMaterialsModal(cid), 100);
  toast(`Đã lưu phiếu nhập (${items.length} dòng, ${fmtVND(s.totalValue)})`);
};

window.importSlipFromFile = function(cid){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.xlsx,.xls,.csv';
  inp.onchange=(ev)=>{
    const f=ev.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=(e)=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        const best = pickBestSheet(wb);
        if(best.score<0){ toast('Không tìm thấy bảng dữ liệu trong file','error'); return; }
        const region = best.region;
        const colMap = region.colMap;
        const db=getDB();
        const c = db.contracts.find(x=>x.id===cid); if(!c) return;
        const catalog = c.materials||[];
        // Đọc các dòng dữ liệu, phân loại theo khớp tên
        const parseNum = (s)=>{
          const str = String(s||'').replace(/\s/g,'');
          if(!str) return 0;
          const clean = str.replace(/đ|vnd|₫/gi,'').replace(/[,.](?=\d{3}\b)/g,'');
          return Number(clean.replace(',','.'))||0;
        };
        const previewItems = [];
        for(let i=region.start; i<region.end; i++){
          const row = best.rows[i]||[];
          const name = String(row[colMap.nameIdx]||'').trim();
          if(!name) continue;
          if(/^(stt|số\s*tt|no\.?|#)$/i.test(name)) continue;
          if(/tổng|cộng|total|sum/i.test(name) && !row[colMap.qtyIdx]) continue;
          const matchRes = matchMaterialInCatalog(name, catalog);
          previewItems.push({
            originalName: name,
            unit: String(row[colMap.unitIdx]||'').trim(),
            qty: parseNum(row[colMap.qtyIdx]),
            unitPrice: parseNum(row[colMap.priceIdx]),
            note: String(row[colMap.noteIdx]||'').trim(),
            // Match info:
            status: matchRes.status, // 'exact' | 'similar' | 'new' | 'empty'
            matchedId: matchRes.match?.id || '',
            matchedName: matchRes.match?.name || '',
            candidates: matchRes.candidates, // [{mat, sim}]
            chosenId: matchRes.match?.id || '' // người dùng có thể đổi
          });
        }
        if(!previewItems.length){ toast('Không có vật tư nào trong file','warn'); return; }
        showSlipImportPreview(cid, previewItems, best.sheetName, region);
      }catch(err){
        console.error(err);
        toast('Lỗi đọc file: '+err.message,'error');
      }
    };
    r.readAsArrayBuffer(f);
  };
  inp.click();
};

function renderPreviewRow(it, i, catalog){
  const stColor = {exact:'#dcfce7', similar:'#fef3c7', new:'#fee2e2'}[it.status]||'#fff';
  const stLabel = {
    exact:`<span class="badge kpi-xs">✓ KHỚP</span>`,
    similar:`<span class="badge kpi-k">⚠ 60-99%</span>`,
    new:`<span class="badge kpi-kem">➕ MỚI</span>`
  }[it.status]||'';
  // Selector cho người dùng
  let selector = '';
  if(it.status==='exact'){
    selector = `<div><span class="muted">→</span> <b>${escapeHtml(it.matchedName)}</b> (tự khớp)</div>`;
  } else if(it.status==='similar'){
    selector = `<select onchange="updatePreviewChoice(${i},this.value)" style="width:100%">
      ${it.candidates.map(c=>`<option value="${c.mat.id}" ${c.mat.id===it.chosenId?'selected':''}>Khớp với "${escapeHtml(c.mat.name)}" (${(c.sim*100).toFixed(0)}%)</option>`).join('')}
      <option value="" ${!it.chosenId?'selected':''}>➕ Là vật tư mới (phát sinh)</option>
    </select>`;
  } else {
    // status === 'new': cho phép user override bằng dropdown danh mục
    selector = `<select onchange="updatePreviewChoice(${i},this.value)" style="width:100%">
      <option value="" selected>➕ Mới (phát sinh)</option>
      ${catalog.map(m=>`<option value="${m.id}" ${m.id===it.chosenId?'selected':''}>Khớp với "${escapeHtml(m.name)}"</option>`).join('')}
    </select>`;
  }
  return `<tr style="background:${stColor}">
    <td>${i+1}</td>
    <td>${stLabel}</td>
    <td><div style="font-weight:600;margin-bottom:4px">"${escapeHtml(it.originalName)}"</div>${selector}</td>
    <td>${escapeHtml(it.unit||'')}</td>
    <td class="right">${it.qty}</td>
    <td class="right">${fmtVND(it.unitPrice)}</td>
    <td class="right"><b>${fmtVND(it.qty*it.unitPrice)}</b></td>
  </tr>`;
}

    {wch:18},  // Thành tiền
    {wch:16}   // Ghi chú
  ];
  // Merge cells: tiêu đề công ty, PHIẾU NHẬP, mục thông tin
  ws['!merges'] = [
    {s:{r:0,c:0},e:{r:0,c:6}},  // tên công ty
    {s:{r:1,c:0},e:{r:1,c:6}},  // địa chỉ
    {s:{r:2,c:0},e:{r:2,c:6}},  // MST
    {s:{r:4,c:0},e:{r:4,c:6}},  // PHIẾU NHẬP
    {s:{r:5,c:0},e:{r:5,c:2}},  // Số phiếu
    {s:{r:5,c:3},e:{r:5,c:6}},  // Ngày
    {s:{r:7,c:1},e:{r:7,c:6}},
    {s:{r:8,c:1},e:{r:8,c:6}},
    {s:{r:9,c:1},e:{r:9,c:6}},
    {s:{r:10,c:1},e:{r:10,c:2}},
    {s:{r:10,c:4},e:{r:10,c:6}},
    {s:{r:11,c:1},e:{r:11,c:6}}
  ];
  // Áp style: kẻ ô cho header + data + total, in đậm, format số
  const border = {style:'thin', color:{rgb:'000000'}};
  const allBorders = {top:border, bottom:border, left:border, right:border};
  const headerStyle = {font:{bold:true,sz:11,color:{rgb:'FFFFFF'}}, fill:{patternType:'solid', fgColor:{rgb:'1E3A8A'}}, alignment:{horizontal:'center', vertical:'center', wrapText:true}, border:allBorders};
  const titleStyle  = {font:{bold:true,sz:16}, alignment:{horizontal:'center'}};
  const subtitleStyle = {font:{italic:true,sz:9}, alignment:{horizontal:'center'}};
  const dataCellStyle = {alignment:{vertical:'center', wrapText:true}, border:allBorders, font:{sz:10}};
  const numCellStyle  = {alignment:{horizontal:'right', vertical:'center'}, border:allBorders, font:{sz:10}, numFmt:'#,##0'};
  const totalStyle = {font:{bold:true,sz:11}, alignment:{horizontal:'center', vertical:'center'}, border:allBorders, fill:{patternType:'solid', fgColor:{rgb:'FEF3C7'}}};
  const totalNumStyle = {font:{bold:true,sz:12}, alignment:{horizontal:'right', vertical:'center'}, border:allBorders, fill:{patternType:'solid', fgColor:{rgb:'FEF3C7'}}, numFmt:'#,##0'};

  // Apply title
  if(ws['A1']) ws['A1'].s = {font:{bold:true,sz:11},alignment:{horizontal:'center'}};
  if(ws['A2']) ws['A2'].s = subtitleStyle;
  if(ws['A3']) ws['A3'].s = subtitleStyle;
  if(ws['A5']) ws['A5'].s = titleStyle;

  // Apply header row styles
  const headerColLetters = ['A','B','C','D','E','F','G'];
  headerColLetters.forEach(L=>{ const cell = L + (headerRow+1); if(ws[cell]) ws[cell].s = headerStyle; });
  // Apply data rows
  s.items.forEach((it,i)=>{
    const r = headerRow + 1 + i + 1; // 1-based row in sheet
    ['A','B','C','D','E','F','G'].forEach(L=>{
      const cell = L+r; if(!ws[cell]) return;
      if(L==='A'||L==='C'||L==='D'||L==='E'||L==='F'){
        ws[cell].s = (L==='A'||L==='C') ? {...dataCellStyle, alignment:{horizontal:'center', vertical:'center'}} : numCellStyle;
      } else {
        ws[cell].s = dataCellStyle;
      }
    });
  });
  // Total row
  ['A','B','C','D','E'].forEach(L=>{ const cell = L+(totalRow+1); if(ws[cell]) ws[cell].s = totalStyle; });
  ['F','G'].forEach(L=>{ const cell = L+(totalRow+1); if(ws[cell]) ws[cell].s = L==='F'?totalNumStyle:totalStyle; });

  // Signature header cells (in đậm + giữa)
  ['B','D','F'].forEach(L=>{ const cell = L+(sigRow+1); if(ws[cell]) ws[cell].s = {font:{bold:true,sz:11}, alignment:{horizontal:'center'}}; });
  ['B','D','F'].forEach(L=>{ const cell = L+(sigRow+2); if(ws[cell]) ws[cell].s = {font:{italic:true,sz:9}, alignment:{horizontal:'center'}}; });
  ['B','D','F'].forEach(L=>{ const cell = L+(sigRow+6); if(ws[cell]) ws[cell].s = {font:{bold:true,sz:10}, alignment:{horizontal:'center'}}; });

  // Print setup: A4, portrait, 1 trang vừa khít
  ws['!pageSetup'] = { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 1 };
  ws['!margins'] = { left: 0.5, right: 0.5, top: 0.5, bottom: 0.5, header: 0.3, footer: 0.3 };
  ws['!printOptions'] = { horizontalCentered: true };

  XLSX.utils.book_append_sheet(wb, ws, 'Phiếu nhập');
  XLSX.writeFile(wb, `PhieuNhap_${(s.slipNo||s.id).replace(/[^a-z0-9_-]/gi,'_')}.xlsx`);
  toast('Đã xuất Excel phiếu nhập (định dạng A4, kẻ ô đầy đủ)');
};

   MODULE DỰ ÁN — TAB 2.2: Tiến độ & Công việc thi công (Gantt + Kanban)
   Công việc thi công = task trong db.tasks có projectId → tự hiển thị
   trong "Theo dõi công việc" của nhân viên được giao.

function getProjectEmployees(c){
  // Cho phép giao việc cho NV ở BẤT KỲ công ty nào — sắp xếp NV cùng công ty với DA lên trước
  const db=getDB();
  const all=db.users.filter(x=>x.role!=='admin');
  return all.slice().sort((a,b)=>{
    const aSame = a.companyId===c.companyId ? 0 : 1;
    const bSame = b.companyId===c.companyId ? 0 : 1;
    if(aSame!==bSame) return aSame-bSame;
    return (a.name||'').localeCompare(b.name||'');
  });
}
/* ---------- Tiến độ dự kiến (theo mốc thời gian) + phát hiện chậm tiến độ ---------- */
function taskExpectedProgress(t){
  if(!t.startDate || !t.dueDate || t.dueDate<=t.startDate) return null;
  const now = Date.now();
  if(now <= t.startDate) return 0;
  if(now >= t.dueDate) return 100;
  return ((now - t.startDate) / (t.dueDate - t.startDate)) * 100;
}
function taskIsBehind(t){
  if(t.status==='done' || (Number(t.progress)||0)>=100) return false;
  const exp = taskExpectedProgress(t);
  if(exp===null) return false;
  const actual = Number(t.progress)||0;
  return actual < exp - 15; // dưới mức dự kiến 15% → chậm
}

function renderPopupProgress(host, cid){
  const db=getDB(); const c=db.contracts.find(x=>x.id===cid); if(!c) return;
  const isEmp = currentUser()?.role==='employee';
  const myId = currentUser()?.id;
  const tasks=db.tasks.filter(t=>t.projectId===cid);
  const cols=[
    {k:'new',        title:'📋 Chưa làm',   css:'#e2e8f0'},
    {k:'inprogress', title:'🔧 Đang làm',   css:'#fef3c7'},
    {k:'done',       title:'✅ Hoàn thành', css:'#dcfce7'}
  ];
  // Đếm số task chậm tiến độ trên toàn dự án để cảnh báo
  const behindTasks = tasks.filter(taskIsBehind);
  let alertHtml = '';
  if(behindTasks.length){
    alertHtml = `<div class="card" style="background:#fee2e2;border-left:5px solid #dc2626">
      <b style="color:#991b1b">🚨 ${behindTasks.length} công việc CHẬM TIẾN ĐỘ trong dự án này</b>
      <div class="hint" style="margin-top:4px">${behindTasks.slice(0,5).map(t=>{
        const emp=db.users.find(x=>x.id===t.assigneeId);
        return `<span>• <b>${escapeHtml(t.title)}</b> — ${escapeHtml(emp?.name||'')} (${(t.progress||0).toFixed(0)}% / dự kiến ${taskExpectedProgress(t).toFixed(0)}%)</span>`;
      }).join('<br>')}${behindTasks.length>5?`<br><i>… và ${behindTasks.length-5} công việc khác</i>`:''}</div>
    </div>`;
  }

  // ====== 📥 Hồ sơ chờ duyệt — cho người có quyền duyệt DA này ======
  let pendingApprovalHtml = '';
  if(canApproveProject(cid)){
    const FOUR_HRS = 4*3600*1000;
    const now = Date.now();
    // 1) Tiến độ chờ duyệt
    const pendingProgressList = tasks.filter(t=>t.pendingProgress!=null).map(t=>{
      const emp=db.users.find(x=>x.id===t.assigneeId);
      const since = t.pendingAt || t.updatedAt || now;
      const elapsed = now - since;
      return {
        type:'progress',
        title:`${t.title}: ${(t.progress||0).toFixed(0)}% → ${Number(t.pendingProgress).toFixed(0)}%`,
        sub:`👤 ${emp?.name||''}`,
        since, elapsed, overTime: elapsed > FOUR_HRS,
        actionConfirm:`confirmTaskProgress('${t.id}')`, actionReject:`rejectTaskProgress('${t.id}')`
      };
    });
    // 2) Phiếu nhập chờ duyệt
    const pendingSlips = db.importSlips.filter(s=>s.contractId===cid && !s.confirmed).map(s=>{
      const since = s.submittedAt || s.createdAt || now;
      const elapsed = now - since;
      const submittedTo = s.submittedToPMId ? db.users.find(x=>x.id===s.submittedToPMId) : null;
      return {
        type:'slip',
        title:`Phiếu nhập ${s.slipNo||''} · ${(s.items||[]).length} dòng · ${fmtVND(s.totalValue||0)}`,
        sub:`👤 ${s.requesterName||''} · NCC: ${s.supplierName||''}${submittedTo?` · 📤 Trình: <b>${escapeHtml(submittedTo.name)}</b>`:''}`,
        since, elapsed, overTime: elapsed > FOUR_HRS,
        actionConfirm:`confirmImportSlip('${s.id}','${cid}')`,
        actionView:`viewSlipDetail('${s.id}')`
      };
    });
    // 3) Hồ sơ/biên bản chờ duyệt
    const pendingDocs = [];
    (c.pcccDocList||[]).forEach(it=>{
      if(it.pendingCompleted && !it.confirmedCompleted){
        const since = it.pendingAt || now;
        const elapsed = now - since;
        const emp = db.users.find(x=>x.id===it.pendingBy);
        const recv = it.submittedToPMId ? db.users.find(x=>x.id===it.submittedToPMId) : null;
        pendingDocs.push({type:'doc', title:`📐 ${it.name}`,
          sub:`👤 ${emp?.name||''} đề nghị duyệt${recv?` · 📤 Trình: <b>${escapeHtml(recv.name)}</b>`:''}`,
          since, elapsed, overTime: elapsed > FOUR_HRS,

          sub:`👤 ${emp?.name||''} đề nghị xóa hồ sơ`,

          actionConfirm:`confirmPcccDelete('${cid}','doc','${it.id}')`,

    (c.pcccRecList||[]).forEach(it=>{

          since, elapsed, overTime: elapsed > FOUR_HRS,
          actionConfirm:`confirmPcccCompleted('${cid}','rec','${it.id}')`});
      }
      if(it.pendingDelete){
        const since = it.pendingDeleteAt || now; const elapsed = now - since;
        const emp = db.users.find(x=>x.id===it.pendingDeleteBy);

          sub:`👤 ${emp?.name||''} đề nghị xóa biên bản`,
          since, elapsed, overTime: elapsed > FOUR_HRS,
          actionConfirm:`confirmPcccDelete('${cid}','rec','${it.id}')`,
          actionReject:`rejectPcccDelete('${cid}','rec','${it.id}')`});
      }

      pendingApprovalHtml = `<div class="card" style="border-left:5px solid ${overCount?'#dc2626':'#f59e0b'};background:${overCount?'#fee2e2':'#fffbeb'}">

        <div class="tbl-wrap"><table style="font-size:12px">
          <thead><tr><th>Loại</th><th>Nội dung</th><th>Người gửi</th><th>Đã chờ</th><th></th></tr></thead>

                ${p.actionConfirm?`<button class="btn sm success" onclick="${p.actionConfirm}">✓ Duyệt</button>`:''}
                ${p.actionReject?`<button class="btn sm danger" onclick="${p.actionReject}">✗ Từ chối</button>`:''}
                ${p.actionView?`<button class="btn sm outline" onclick="${p.actionView}">👁 Xem</button>`:''}
              </td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
        ${overCount?`<div style="margin-top:8px;color:#991b1b;font-weight:600">🚨 Vui lòng duyệt ngay các hồ sơ đã quá 4 giờ để tránh ảnh hưởng tiến độ dự án!</div>`:''}
      </div>`;
    }
  }
  // ----- GANTT (full title wrap + progress bar trắng→xanh + cảnh báo chậm) -----
  const dated=tasks.filter(t=>t.startDate||t.dueDate);
  let ganttHtml='<div class="muted" style="padding:10px">Chưa có công việc nào có mốc thời gian. Hãy thêm Ngày bắt đầu / Hạn hoàn thành khi giao việc.</div>';
  if(dated.length){
    let min=Infinity,max=-Infinity;
    dated.forEach(t=>{ const s=t.startDate||t.dueDate, e=t.dueDate||t.startDate; if(s<min)min=s; if(e>max)max=e; });
    if(max<=min) max=min+86400000;
    const span=max-min;
    const nowPct = Math.max(0, Math.min(100, (Date.now()-min)/span*100));
    ganttHtml=`<div style="font-size:11px;color:#64748b;margin-bottom:4px;display:flex;justify-content:space-between"><span>${fmtDate(min)} (bắt đầu)</span><span>${fmtDate(max)} (kết thúc)</span></div>`
      + `<div style="position:relative;margin-bottom:6px"><div style="position:absolute;left:calc(320px + ${nowPct}% * (100% - 320px) / 100);top:-4px;width:2px;height:calc(100% + 8px);background:#dc2626;z-index:2" title="Hôm nay"></div></div>`
      + dated.map(t=>{
        const s=t.startDate||t.dueDate, e=t.dueDate||t.startDate;
        const left=(s-min)/span*100, w=Math.max(3,(e-s)/span*100);
        const prog = Math.max(0, Math.min(100, Number(t.progress)||0));
        const hasPending = t.pendingProgress!=null;
        const pendingProg = hasPending ? Math.max(0, Math.min(100, Number(t.pendingProgress)||0)) : null;
        const behind = taskIsBehind(t);
        const done = t.status==='done' || prog>=100;
        const emp=db.users.find(x=>x.id===t.assigneeId);
        const exp = taskExpectedProgress(t);
        // Màu khung bar
        let barBorder = '#cbd5e1';
        let titleBg = '#fff';
        if(hasPending){ barBorder='#f59e0b'; titleBg='#fef3c7'; }   // VÀNG: chờ xác nhận
        else if(done){ barBorder='#16a34a'; titleBg='#dcfce7'; }
        else if(behind){ barBorder='#dc2626'; titleBg='#fee2e2'; }
        const canAppr = canApprove();
        return `<div style="display:flex;gap:8px;margin-bottom:8px;align-items:stretch">
          <div style="width:320px;flex-shrink:0;background:${titleBg};border-radius:6px;padding:6px 8px;border:1px solid ${barBorder}">
            <div style="font-size:12px;font-weight:600;line-height:1.3;word-break:break-word;white-space:normal">${escapeHtml(t.title)}</div>
            <div class="muted" style="font-size:10.5px;margin-top:2px">👤 ${escapeHtml(emp?.name||'(chưa giao)')}${t.dueDate?' · ⏰ '+fmtDate(t.dueDate):''}</div>
            ${hasPending?`<div style="font-size:10.5px;color:#b45309;font-weight:600;margin-top:2px">⏳ NV gửi cập nhật <b>${pendingProg.toFixed(0)}%</b> — chờ xác nhận${canAppr?` <button class="btn sm success" style="padding:1px 6px;margin-left:4px" onclick="confirmTaskProgress('${t.id}')">✓</button><button class="btn sm danger" style="padding:1px 6px" onclick="rejectTaskProgress('${t.id}')">✗</button>`:''}</div>`:''}
            ${(!hasPending && behind)?`<div style="font-size:10.5px;color:#dc2626;font-weight:600;margin-top:2px">⚠ CHẬM ${(exp-prog).toFixed(0)}% so với kế hoạch</div>`:''}
          </div>
          <div style="flex:1;position:relative;background:#f8fafc;border-radius:6px;min-height:40px">
            <div style="position:absolute;left:${left}%;width:${w}%;top:6px;height:28px;background:#fff;border:2px solid ${barBorder};border-radius:5px;overflow:hidden">
              <div style="height:100%;width:${prog}%;background:#1e3a8a;transition:width .3s"></div>
              ${hasPending?`<div style="position:absolute;top:0;height:100%;width:${pendingProg}%;background:repeating-linear-gradient(45deg,#f59e0b,#f59e0b 4px,#fbbf24 4px,#fbbf24 8px);opacity:.55"></div>`:''}
              <div style="position:absolute;top:0;left:0;right:0;height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:${prog>50?'#fff':'#1e3a8a'};text-shadow:0 0 2px ${prog>50?'#1e3a8a':'#fff'}">
                ${prog.toFixed(0)}%${hasPending?' ⏳→'+pendingProg.toFixed(0)+'%':''}${behind&&!hasPending?' ⚠':''}${done?' ✓':''}
              </div>
            </div>
          </div></div>`;
      }).join('');
  }
  // ----- KANBAN -----
  const kanbanHtml=`<div class="grid-3" style="gap:10px;align-items:start">${cols.map(col=>{
    const list=tasks.filter(t=>(t.status||'new')===col.k);
    return `<div style="background:${col.css};border-radius:8px;padding:8px;min-height:80px">
      <div style="font-weight:700;font-size:13px;margin-bottom:6px">${col.title} (${list.length})</div>
      ${list.map(t=>{
        const emp=db.users.find(x=>x.id===t.assigneeId);
        const st=deadlineStatus(t);
        const behind = taskIsBehind(t);
        const hasPending = t.pendingProgress!=null;
        const warn = hasPending?'<span class="badge" style="font-size:9px;background:#fef3c7;color:#92400e">⏳ CHỜ XN</span>'
                  : behind?'<span class="badge kpi-kem" style="font-size:9px">⚠ CHẬM TIẾN ĐỘ</span>'
                  : (st==='overdue'?'<span class="badge kpi-kem" style="font-size:9px">QUÁ HẠN</span>'
                  : (st==='soon'?'<span class="badge kpi-dat" style="font-size:9px">SẮP HẾT HẠN</span>':''));
        const prog = Math.max(0, Math.min(100, Number(t.progress)||0));
        const pendBg = hasPending ? 'background:#fef9c3;border-color:#f59e0b' : '';
        const canAppr = canApprove();
        return `<div style="background:#fff;border:1px solid #cbd5e1;${pendBg};border-radius:6px;padding:7px;margin-bottom:6px;font-size:12px">
          <b>${escapeHtml(t.title)}</b> ${warn}
          <div class="muted" style="font-size:11px;margin:3px 0">👤 ${escapeHtml(emp?.name||'—')}${t.dueDate?' · ⏰ '+fmtDate(t.dueDate):''}</div>
          <div style="background:#f1f5f9;border-radius:99px;height:8px;overflow:hidden;margin:4px 0"><div style="width:${prog}%;height:8px;background:#1e3a8a"></div></div>
          <div style="font-size:10px;color:#64748b;margin-bottom:4px">${prog.toFixed(0)}% hoàn thành${hasPending?` <span style="color:#b45309;font-weight:600">→ NV đề nghị ${Number(t.pendingProgress).toFixed(0)}%</span>`:''}</div>
          ${hasPending&&canAppr?`<div style="display:flex;gap:4px;margin-bottom:4px"><button class="btn sm success" style="padding:1px 8px" onclick="confirmTaskProgress('${t.id}')">✓ Xác nhận</button><button class="btn sm danger" style="padding:1px 8px" onclick="rejectTaskProgress('${t.id}')">✗ Từ chối</button></div>`:''}
          ${isEmp ? (
            (t.assigneeId===myId && !hasPending) ? `<div style="display:flex;gap:4px;align-items:center;margin-top:4px">
                <input type="range" min="0" max="100" value="${prog}" id="kb-prog-${t.id}" oninput="document.getElementById('kb-prog-val-${t.id}').textContent=this.value+'%'" style="flex:1;min-width:60px">
                <span id="kb-prog-val-${t.id}" style="font-size:10px;font-weight:600;width:34px;text-align:right">${prog.toFixed(0)}%</span>
                <button class="btn sm success" style="padding:1px 6px" title="Trình tiến độ lên quản lý phê duyệt" onclick="submitProjectTaskProgress('${t.id}')">📤 Trình</button>
              </div>` : ''
          ) : `<div style="display:flex;gap:4px;flex-wrap:wrap">
            ${col.k!=='new'?`<button class="btn sm outline" style="padding:1px 6px" onclick="moveProjectTask('${t.id}','${col.k==='done'?'inprogress':'new'}')">←</button>`:''}
            ${col.k!=='done'?`<button class="btn sm outline" style="padding:1px 6px" onclick="moveProjectTask('${t.id}','${col.k==='new'?'inprogress':'done'}')">→</button>`:''}
            <button class="btn sm outline" style="padding:1px 6px" onclick="openProjectTaskForm('${cid}','${t.id}')">✏</button>
            <button class="btn sm danger" style="padding:1px 6px" onclick="delProjectTask('${cid}','${t.id}')">🗑</button>
          </div>`}</div>`;
      }).join('')||'<div class="muted" style="font-size:11px">—</div>'}
    </div>`;
  }).join('')}</div>`;
  host.innerHTML=`
    <div class="help-text">💡 ${isEmp
      ? 'Bạn theo dõi toàn bộ Gantt &amp; bảng Kanban của dự án. Với công việc <b>được giao cho bạn</b>, hãy kéo thanh tiến độ rồi bấm <b>📤 Trình</b> để gửi % tiến độ lên quản lý phê duyệt.'
      : 'Lập kế hoạch thi công cho từng hạng mục (Lắp đặt đường ống, kéo cáp tín hiệu, lắp đặt tủ trung tâm…). Mỗi công việc giao cho 1 nhân viên sẽ <b>tự hiển thị trong "Theo dõi công việc"</b> của nhân viên đó — nhân viên tự cập nhật % tiến độ.'}</div>
    ${pendingApprovalHtml}
    ${alertHtml}
    ${isEmp?'':`<div style="margin-bottom:10px"><button class="btn success" onclick="openProjectTaskForm('${cid}')">+ Giao việc thi công</button></div>`}
    <h3>📊 Tiến độ tổng thể (Gantt)</h3>
    <div class="card">${ganttHtml}</div>
    <h3>🗂 Bảng công việc (Kanban)</h3>
    ${kanbanHtml}
  `;
}
window.moveProjectTask=function(id,st){ const db=getDB(); const t=db.tasks.find(x=>x.id===id); if(t){ t.status=st; saveDB(db); renderPopupBody(); } };
/* NV trình % tiến độ công việc của mình lên quản lý phê duyệt (ghi pendingProgress) */
window.submitProjectTaskProgress=function(taskId){
  const db=getDB(); const t=db.tasks.find(x=>x.id===taskId); if(!t) return;
  const me=currentUser();
  if(t.assigneeId!==me?.id){ toast('Bạn chỉ trình được tiến độ công việc được giao cho mình','error'); return; }
  const inp=document.getElementById('kb-prog-'+taskId); if(!inp) return;
  const val=Math.max(0, Math.min(100, Number(inp.value)||0));
  t.pendingProgress=val;
  t.pendingAt=Date.now();
  t.pendingBy=me?.id;
  saveDB(db); renderPopupBody();
  toast(`Đã trình tiến độ ${val}% — chờ quản lý phê duyệt`,'info');
};
window.delProjectTask=function(cid,id){ if(!confirm('Xóa công việc này?'))return; const db=getDB(); db.tasks=db.tasks.filter(t=>t.id!==id); saveDB(db); renderPopupBody(); toast('Đã xóa công việc'); };
window.openProjectTaskForm=function(cid,taskId){
  if(currentUser()?.role==='employee'){ toast('Nhân viên không có quyền giao việc','error'); return; }
  const db=getDB(); const c=db.contracts.find(x=>x.id===cid); if(!c)return;
  const t=taskId?db.tasks.find(x=>x.id===taskId):null;
  const emps=getProjectEmployees(c);
  openModal({
    title: taskId?'Sửa công việc thi công':'+ Giao việc thi công — '+(c.name||c.code),
    html:`
      <div class="field"><label>Hạng mục / Tên công việc *</label>
        <input id="pt-title" list="pt-sug" value="${escapeHtml(t?.title||'')}" placeholder="VD: Lắp đặt đường ống">
        <datalist id="pt-sug">${WORK_ITEM_SUGGESTIONS.map(s=>`<option value="${escapeHtml(s)}"></option>`).join('')}</datalist>
      </div>
      <div class="grid-2">
        <div class="field"><label>Người thực hiện * <span class="muted" style="font-size:11px">(có thể chọn NV từ bất kỳ công ty nào)</span></label>
          <select id="pt-assignee">${emps.map(e=>`<option value="${e.id}" ${t?.assigneeId===e.id?'selected':''}>${escapeHtml(e.name)} (${escapeHtml(e.code||e.username)}) — ${escapeHtml(getCompany(e.companyId).code)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Mảng công việc</label>
          <select id="pt-area">${WORK_AREAS.map(a=>`<option value="${a.id}" ${(t?.area||'project')===a.id?'selected':''}>${escapeHtml(a.name)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Ngày bắt đầu</label><input id="pt-start" type="date" value="${t?.startDate?new Date(t.startDate).toISOString().slice(0,10):''}"></div>
        <div class="field"><label>Hạn hoàn thành</label><input id="pt-due" type="date" value="${t?.dueDate?new Date(t.dueDate).toISOString().slice(0,10):''}"></div>
        <div class="field"><label>Trạng thái</label>
          <select id="pt-status">
            <option value="new" ${(t?.status||'new')==='new'?'selected':''}>Chưa làm</option>
            <option value="inprogress" ${t?.status==='inprogress'?'selected':''}>Đang làm</option>
            <option value="done" ${t?.status==='done'?'selected':''}>Hoàn thành</option>
          </select>
        </div>
        <div class="field"><label>% Tiến độ hoàn thành (0–100)</label><input id="pt-progress" type="number" min="0" max="100" value="${t?.progress!=null?t.progress:''}" placeholder="VD: 30"><div class="hint">Nhân viên có thể cập nhật trực tiếp trong mục "Theo dõi công việc của tôi".</div></div>
      </div>
      <div class="field"><label>Ghi chú</label><textarea id="pt-note" rows="2">${escapeHtml(t?.note||'')}</textarea></div>
    `,
    footer:`<button class="btn outline" onclick="closeModal()">Hủy</button>
            <button class="btn success" onclick="saveProjectTask('${cid}','${taskId||''}')">Lưu</button>`
  });
};
window.saveProjectTask=function(cid,taskId){
  const db=getDB(); const v=q=>document.getElementById(q).value;
  const title=v('pt-title').trim(); if(!title){ toast('Nhập tên công việc/hạng mục','error'); return; }
  let t;
  if(taskId){ t=db.tasks.find(x=>x.id===taskId); }
  else { t={id:uid('t'), createdAt:Date.now(), createdBy:(currentUser()||{}).id}; db.tasks.push(t); }
  t.title=title; t.projectId=cid; t.assigneeId=v('pt-assignee'); t.area=v('pt-area');
  const sd=v('pt-start'), dd=v('pt-due');
  t.startDate=sd?new Date(sd).getTime():null;
  t.dueDate=dd?new Date(dd).getTime():null;
  t.status=v('pt-status'); t.note=v('pt-note').trim();
  const pv=v('pt-progress');
  t.progress = pv===''?(t.progress||0):Math.max(0, Math.min(100, Number(pv)||0));
  if(t.progress>=100) t.status='done';
  saveDB(db); closeModal(); renderPopupBody(); toast('Đã lưu công việc — nhân viên sẽ thấy trong mục Theo dõi công việc');
};

/* ============================================================
   MODULE DỰ ÁN — TAB 2.3: Hồ sơ kỹ thuật & pháp lý PCCC
   Mỗi dự án có 2 danh sách động: pcccDocList[] và pcccRecList[]
   ============================================================ */
function _ensurePcccLists(c){
  // Khởi tạo lần đầu từ default
  if(!Array.isArray(c.pcccDocList)){
    c.pcccDocList = [];
    // Lấy từ object cũ nếu có (migration), nếu không dùng default
    if(c.pcccDocs && typeof c.pcccDocs==='object' && !Array.isArray(c.pcccDocs)){
      PCCC_DOC_STAGES.forEach(s=>{
        const d=c.pcccDocs[s.key]||{};
        c.pcccDocList.push({id:uid('pd'), name:s.label, link:d.link||'', status:d.status||'none', assigneeId:d.assigneeId||''});
      });
    } else {
      PCCC_DOC_STAGES.forEach(s=>c.pcccDocList.push({id:uid('pd'), name:s.label, link:'', status:'none', assigneeId:''}));
    }
  }
  if(!Array.isArray(c.pcccRecList)){
    c.pcccRecList = [];
    if(c.pcccRecords && typeof c.pcccRecords==='object' && !Array.isArray(c.pcccRecords)){
      PCCC_RECORDS.forEach(s=>{
        const d=c.pcccRecords[s.key]||{};
        c.pcccRecList.push({id:uid('pr'), name:s.label, link:d.link||'', status:d.status||'none', assigneeId:d.assigneeId||''});
      });
    } else {
      PCCC_RECORDS.forEach(s=>c.pcccRecList.push({id:uid('pr'), name:s.label, link:'', status:'none', assigneeId:''}));
    }
  }
}

function renderPopupPCCC(host, cid){
  const db=getDB(); const c=db.contracts.find(x=>x.id===cid); if(!c) return;
  _ensurePcccLists(c); saveDB(db);
  const emps=getProjectEmployees(c);
  const me=currentUser();
  const isEmp = me?.role==='employee';
  const canAppr=canApprove();
  const empOpts=(sel)=>`<option value="">— Chọn NV —</option>`+emps.map(e=>`<option value="${e.id}" ${sel===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('');

  const renderRows = (list, scope)=> list.map(it=>{
    const locked = !!it.confirmedCompleted; // NV không sửa được khi đã được trưởng phòng xác nhận
    const disabledAttr = (!canAppr && locked) ? 'disabled style="background:#f1f5f9"' : '';
    const pendingDone = it.pendingCompleted && !it.confirmedCompleted;
    const pendingDel = !!it.pendingDelete;
    return `<tr ${pendingDel?'style="background:#fee2e2"':(locked?'style="background:#dcfce7"':(pendingDone?'style="background:#fef3c7"':''))}>
      <td><input value="${escapeHtml(it.name||'')}" oninput="updatePcccItem('${cid}','${scope}','${it.id}','name',this.value)" placeholder="${scope==='doc'?'VD: Bản vẽ thiết kế':'VD: Biên bản thử áp lực ống'}" style="min-width:220px;font-weight:600" ${disabledAttr}></td>
      <td><input type="url" value="${escapeHtml(it.link||'')}" placeholder="https://drive.google.com/..." oninput="updatePcccItem('${cid}','${scope}','${it.id}','link',this.value)" style="min-width:200px" ${disabledAttr}>
        ${it.link?`<a href="${escapeHtml(it.link)}" target="_blank" style="font-size:11px">↗ mở</a>`:''}</td>
      <td><select onchange="updatePcccItem('${cid}','${scope}','${it.id}','status',this.value)" ${disabledAttr}>${PCCC_DOC_STATUS.map(s=>`<option value="${s.v}" ${(it.status||'none')===s.v?'selected':''}>${s.label}</option>`).join('')}</select></td>
      <td><select onchange="updatePcccItem('${cid}','${scope}','${it.id}','assigneeId',this.value)" ${disabledAttr}>${empOpts(it.assigneeId)}</select></td>
      <td class="center">
        ${locked
          ? `<span class="badge kpi-xs" title="Đã được trưởng nhóm xác nhận">✓ HOÀN THIỆN</span>`
          : pendingDone
            ? `<span class="badge" style="background:#fef3c7;color:#92400e">⏳ Chờ XN</span>`
            : `<input type="checkbox" ${it.pendingCompleted?'checked':''} onchange="togglePcccPending('${cid}','${scope}','${it.id}',this.checked)"> <span style="font-size:11px">đã hoàn thiện HS</span>`}
        ${canAppr && !locked && pendingDone ? `<br><button class="btn sm success" style="padding:1px 6px;margin-top:4px" onclick="confirmPcccCompleted('${cid}','${scope}','${it.id}')">✓ Xác nhận</button>` : ''}
        ${canAppr && !locked && !pendingDone ? `<br><button class="btn sm" style="padding:1px 6px;margin-top:4px;font-size:10px" onclick="confirmPcccCompleted('${cid}','${scope}','${it.id}')">Đánh dấu hoàn thiện</button>` : ''}
        ${canAppr && locked ? `<br><button class="btn sm warn" style="padding:1px 6px;margin-top:4px;font-size:10px" onclick="unconfirmPcccCompleted('${cid}','${scope}','${it.id}')">↩ Hủy XN</button>` : ''}
      </td>
      <td>
        ${pendingDel ? `<span class="badge" style="background:#fee2e2;color:#991b1b">🗑 Chờ duyệt xóa</span>
          ${canAppr ? `<br><button class="btn sm danger" style="padding:1px 6px;margin-top:4px" onclick="confirmPcccDelete('${cid}','${scope}','${it.id}')">✓ Duyệt xóa</button>
          <button class="btn sm outline" style="padding:1px 6px;margin-top:4px" onclick="rejectPcccDelete('${cid}','${scope}','${it.id}')">✗ Hủy</button>` : ''}`
        : `${isEmp?'':`<button class="btn sm outline" onclick="assignPcccTaskDyn('${cid}','${scope}','${it.id}')" title="Tạo nhiệm vụ theo dõi cho NV phụ trách" ${locked&&!canAppr?'disabled':''}>📌 Giao NV</button>`}
        <button class="btn sm danger" onclick="removePcccItem('${cid}','${scope}','${it.id}')" title="${isEmp?'Gửi yêu cầu xóa (chờ phê duyệt)':'Xóa'}" ${locked&&!canAppr?'disabled':''}>🗑${isEmp?' Y/c xóa':''}</button>`}
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="6" class="muted center">Chưa có ${scope==='doc'?'loại hồ sơ':'biên bản'} nào. Bấm "+ Thêm" để thêm.</td></tr>`;

  host.innerHTML=`

    <h3>📐 Vòng đời hồ sơ kỹ thuật & pháp lý <button class="btn sm success" style="float:right" onclick="addPcccItem('${cid}','doc')">+ Thêm loại hồ sơ</button></h3>
    <div class="tbl-wrap"><table style="font-size:13px">

    <div class="tbl-wrap"><table style="font-size:13px">
      <thead><tr><th>Tên biên bản</th><th>Link kho lưu trữ</th><th>Trạng thái</th><th>Người phụ trách</th><th>Hoàn thiện HS</th><th></th></tr></thead>
      <tbody>${renderRows(c.pcccRecList, 'rec')}</tbody>
    </table></div>
