  // ---- Helpers ----
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function el(id){ return document.getElementById(id); }

  // Bỏ dấu để so khớp tìm kiếm
  function noAccent(s){
    return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
  }

  // Tra tỉnh theo code
  function findProv(code){
    for (var i=0;i<DATA.length;i++){ if(DATA[i][0]===code) return DATA[i]; }
    return null;
  }

  // ---- Sinh HTML khối địa chỉ ----
  // base = tiền tố id, vd 'cf-site'. label = nhãn hiển thị phía trên.
  function html(base, opts){
    opts = opts || {};
    var label = opts.label || 'Địa chỉ';
    var provOpts = '<option value="">— Chọn Tỉnh/Thành —</option>';
    for (var i=0;i<DATA.length;i++){
      provOpts += '<option value="'+esc(DATA[i][0])+'">'+esc(DATA[i][1])+'</option>';
    }
    // grid-column:1/-1 để chiếm trọn hàng trong .grid-2 của app
    return ''
      + '<div class="field" style="grid-column:1/-1">'
      +   '<label>'+esc(label)+'</label>'
      +   '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'
      +     '<select id="'+base+'-prov" class="vnaddr-sel"></select>'
      +     '<select id="'+base+'-ward" class="vnaddr-sel" disabled><option value="">— Chọn Phường/Xã —</option></select>'
      +   '</div>'
      +   '<input id="'+base+'-detail" placeholder="Số nhà, tên đường, tổ/thôn… (VD: Số 12 đường Lê Lợi)">'
      +   '<input type="hidden" id="'+base+'">'
      + '</div>';
  }

  // ---- Đổ danh sách phường theo tỉnh ----
  function fillWards(base, provCode, selectWardCode){
    var ward = el(base+'-ward');
    if(!ward) return;
    ward.innerHTML = '<option value="">— Chọn Phường/Xã —</option>';
    var p = findProv(provCode);
    if(!p){ ward.disabled = true; return; }
    var ws = p[2];
    for (var i=0;i<ws.length;i++){
      var o = document.createElement('option');
      o.value = ws[i][0];
      o.textContent = ws[i][1];
      if(selectWardCode && ws[i][0]===selectWardCode) o.selected = true;
      ward.appendChild(o);
    }
    ward.disabled = false;
  }

  // ---- Tổng hợp chuỗi địa chỉ đầy đủ vào input ẩn ----
  function sync(base){
    var d = (el(base+'-detail') ? el(base+'-detail').value : '').trim();
    var provSel = el(base+'-prov'), wardSel = el(base+'-ward');
    var provName = provSel && provSel.value ? findProv(provSel.value)[1] : '';
    var wardName = wardSel && wardSel.value ? (wardSel.options[wardSel.selectedIndex] || {}).text || '' : '';
    var parts = [];
    if(d) parts.push(d);
    if(wardName) parts.push(wardName);
    if(provName) parts.push(provName);
    var full = parts.join(', ');
    var hid = el(base);
    if(hid) hid.value = full;
    return full;
  }

  // ---- Khởi tạo: gắn sự kiện + điền lại địa chỉ cũ (nếu có) ----
  // oldAddr: chuỗi địa chỉ cũ kiểu "Số 12 Lê Lợi, Phường Tân Bình, Tỉnh ABC"
  function init(base, oldAddr){
    var provSel = el(base+'-prov');
    var wardSel = el(base+'-ward');
    var detail  = el(base+'-detail');
    if(!provSel){ console.warn('[VNAddr] Không tìm thấy #'+base+'-prov — gọi init sau khi render form.'); return; }

    // Nạp danh sách tỉnh nếu chưa có (trường hợp html() chưa chèn option)
    if(provSel.options.length <= 1){
      var frag = '<option value="">— Chọn Tỉnh/Thành —</option>';
      for (var i=0;i<DATA.length;i++) frag += '<option value="'+esc(DATA[i][0])+'">'+esc(DATA[i][1])+'</option>';
      provSel.innerHTML = frag;
    }

    provSel.addEventListener('change', function(){
      fillWards(base, provSel.value);
      sync(base);
    });
    if(wardSel) wardSel.addEventListener('change', function(){ sync(base); });
    if(detail)  detail.addEventListener('input',  function(){ sync(base); });

    // ---- Tự điền lại từ địa chỉ cũ ----
    if(oldAddr && typeof oldAddr === 'string'){
      var matchedProv = null, matchedWard = null, rest = oldAddr;
      // Tìm tỉnh: so khớp tên tỉnh (không dấu) xuất hiện trong chuỗi
      var oa = noAccent(oldAddr);
      for (var i=0;i<DATA.length;i++){
        if(oa.indexOf(noAccent(DATA[i][1])) !== -1){ matchedProv = DATA[i]; break; }
      }
      if(matchedProv){
        provSel.value = matchedProv[0];
        fillWards(base, matchedProv[0]);
        // Tìm phường trong tỉnh đó
        var ws = matchedProv[2];
        for (var j=0;j<ws.length;j++){
          if(oa.indexOf(noAccent(ws[j][1])) !== -1){ matchedWard = ws[j]; break; }
        }
        if(matchedWard && wardSel){ wardSel.value = matchedWard[0]; }
        // Phần còn lại = bỏ tên tỉnh + tên phường khỏi chuỗi -> coi là số nhà/đường
        var stripped = oldAddr;
        if(matchedWard) stripped = stripped.replace(matchedWard[1], '');
        stripped = stripped.replace(matchedProv[1], '');
        stripped = stripped.replace(/[,\s]+$/,'').replace(/^[,\s]+/,'').replace(/,\s*,/g,',').trim();
        if(detail) detail.value = stripped;
      } else {
        // Không khớp tỉnh nào -> đổ nguyên vào ô chi tiết để không mất dữ liệu
        if(detail) detail.value = oldAddr;
      }
    }
    sync(base);
  }

  // ---- API lấy dữ liệu ----
  function value(base){ return sync(base); }   // chuỗi đầy đủ
  function get(base){
    var provSel = el(base+'-prov'), wardSel = el(base+'-ward'), detail = el(base+'-detail');
    var provCode = provSel ? provSel.value : '';
    var wardCode = wardSel ? wardSel.value : '';
    return {
      detail:   detail ? detail.value.trim() : '',
      provCode: provCode,
      provName: provCode ? findProv(provCode)[1] : '',
      wardCode: wardCode,
      wardName: (wardSel && wardCode) ? (wardSel.options[wardSel.selectedIndex]||{}).text||'' : '',
      full:     sync(base)
    };
  }

  // ---- Tra cứu thuần dữ liệu (không cần DOM) ----
  function provinces(){ return DATA.map(function(p){ return {code:p[0], name:p[1]}; }); }
  function wardsOf(provCode){
    var p = findProv(provCode);
    return p ? p[2].map(function(w){ return {code:w[0], name:w[1]}; }) : [];
  }

  global.VNAddr = {
    html: html,
    init: init,
    value: value,
    get: get,
    fillWards: fillWards,
    provinces: provinces,
    wardsOf: wardsOf,
    _data: DATA
  };

  // CSS tối thiểu cho select (khớp input của app)
  try {
    var st = document.createElement('style');
    st.textContent = '.vnaddr-sel{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;background:#fff;font-family:inherit}.vnaddr-sel:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.15)}.vnaddr-sel:disabled{background:#f1f5f9;color:#94a3b8}';
    (document.head||document.documentElement).appendChild(st);
  } catch(e){}

})(window);

</script>

<script>
  // Khởi tạo Firebase ngay sau khi SDK load xong
  // Dùng defer-pattern: nếu SDK chưa có (hiếm) thì đánh dấu chờ
  function _initFirebase(){
    try{
      const _app = firebase.initializeApp({
        databaseURL: "https://qlnv-app-default-rtdb.asia-southeast1.firebasedatabase.app/"
      });
      const _db = firebase.database();
      window._fbSet = (path, val) => _db.ref(path).set(val);
      window._fbGet = (path) => _db.ref(path).get().then(s => s.val());
      window._fbOn  = (path, cb) => { const r = _db.ref(path); r.on('value', s => cb(s.val())); return r; };
      window._fbOff = (r) => r.off();
      window._firebaseReady = true;
    }catch(e){
      console.error('Firebase init error:', e);
      window._firebaseReady = false;
    }
  }
  if(typeof firebase !== 'undefined'){
    _initFirebase();
  } else {
    // SDK chưa load xong — chờ
    window.addEventListener('load', _initFirebase);
  }
</script>
<!-- PDF.js & Tesseract.js — tải lazy khi import vật tư từ PDF/ảnh -->
<script>
  // Tải lazy để không làm chậm khởi động phần mềm
  window._loadPdfJs = function(){
    if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
      s.onload=()=>{ if(window.pdfjsLib){ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; resolve(window.pdfjsLib);} else reject(new Error('pdf.js load fail')); };
      s.onerror=reject; document.head.appendChild(s);
    });
  };
  window._loadTesseract = function(){
    if(window.Tesseract) return Promise.resolve(window.Tesseract);
    return new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js';
      s.onload=()=>resolve(window.Tesseract);
      s.onerror=reject; document.head.appendChild(s);
    });
  };
</script>
<!-- [PATCH] flatpickr — lịch tiếng Việt dd/mm/yyyy -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
<script>
  // [PATCH v2] Auto-apply Vietnamese flatpickr — dùng altInput để không phá luồng chọn ngày.
  // Real input giữ format Y-m-d (tương thích logic xử lý cũ); altInput hiển thị d/m/Y tiếng Việt.
  // [PATCH v3] Đồng thời gắn flatpickr time-picker cho <input type="time"> để gõ/chọn được trên mọi trình duyệt.
  window._applyViDatepicker = function(root){
    if(typeof flatpickr === 'undefined') return;
    try{
      // 1) Ngày
      (root||document).querySelectorAll('input[type="date"]:not([data-fp])').forEach(inp=>{
        inp.setAttribute('data-fp','1');
        inp.type = 'text';
        flatpickr(inp, {
          locale: (flatpickr.l10ns && flatpickr.l10ns.vn) || 'vn',
          dateFormat: 'Y-m-d',
          altInput: true,
          altFormat: 'l, d/m/Y',
          allowInput: true,
          disableMobile: true
        });
      });
      // 2) Giờ (HH:MM 24h) — bắt cả input[type="time"] và input[data-time="1"] (text fallback)
      (root||document).querySelectorAll('input[type="time"]:not([data-fp]), input[data-time="1"]:not([data-fp])').forEach(inp=>{
        inp.setAttribute('data-fp','1');
        inp.type = 'text';
        if(!inp.placeholder) inp.placeholder = 'HH:MM';
        flatpickr(inp, {
          enableTime: true,
          noCalendar: true,
          dateFormat: 'H:i',
          time_24hr: true,
          allowInput: true,
          disableMobile: true,
          minuteIncrement: 5
        });
      });
    }catch(e){ console.warn('flatpickr apply error', e); }
  };
  // Quan sát DOM, áp dụng tự động cho input mới thêm vào (modal, form...)
  document.addEventListener('DOMContentLoaded', ()=>{
    window._applyViDatepicker(document);
    const mo = new MutationObserver(muts=>{
      for(const m of muts){
        m.addedNodes && m.addedNodes.forEach(n=>{
          if(n.nodeType===1) window._applyViDatepicker(n);
        });
      }
    });
    mo.observe(document.body,{childList:true,subtree:true});
  });

   ✓ saveDB() ghi _db + đẩy Firebase ngay lập tức

const SESSION_KEY='HRM_EMC_SESSION_v1';
const FB_PATH = 'hrm';

let _db           = null;
let _fbSyncHandle = null;
let _fbConnected  = false;

/* Chờ Firebase SDK khởi tạo xong */
function _waitFirebase(){
  return new Promise((resolve, reject) => {
    if(window._firebaseReady){ resolve(); return; }
    const start = Date.now();
    const check = setInterval(()=>{
      if(window._firebaseReady){ clearInterval(check); resolve(); }
      else if(Date.now() - start > 10000){ clearInterval(check); reject(new Error('Firebase SDK timeout')); }
    }, 50);
  });
}

/* Đọc DB từ RAM */
function getDB(){
  if(!_db) _db = _buildEmptyDB();
  return _db;
}

/* Ghi DB: cập nhật RAM + đẩy Firebase với version tăng dần */
let _writeVersion = 0;
let _justWrote = false; // flag: chính tab này vừa ghi, bỏ qua echo tiếp theo
function saveDB(db){
  _writeVersion++;
  db._v = _writeVersion;
  _db = db;
  if(window._firebaseReady && _fbConnected){
    _justWrote = true; // đánh dấu trước khi ghi
    window._fbSet(FB_PATH, db)
      .then(()=> console.log('[saveDB] OK — v:', _writeVersion, 'users:', db.users?.length))
      .catch(e=>{ _justWrote = false; console.error('[saveDB] FAIL', e); });
  } else {
    console.warn('[saveDB] BLOCKED — firebaseReady:', window._firebaseReady, '_fbConnected:', _fbConnected);
  }
}

/* Di trú / đảm bảo đủ collection */
function migrateDB(db){
  if(!db) return _buildEmptyDB();
  if(!Array.isArray(db.users))          db.users=[];
  if(!Array.isArray(db.tasks))          db.tasks=[];
  if(!Array.isArray(db.kpiEvals))       db.kpiEvals=[];
  if(!Array.isArray(db.contracts))      db.contracts=[];
  if(!Array.isArray(db.importSlips))    db.importSlips=[];
  if(!Array.isArray(db.suppliers))      db.suppliers=[];
  if(!db.salaryRanks)       db.salaryRanks=JSON.parse(JSON.stringify(DEFAULT_SALARY_RANKS));
  if(!db.kpiTemplates)      db.kpiTemplates=JSON.parse(JSON.stringify(DEFAULT_KPI_TEMPLATES));
  if(!db.disciplineTemplate)db.disciplineTemplate=JSON.parse(JSON.stringify(DEFAULT_DISCIPLINE_TEMPLATE));
  if(!db.ratingTiers)       db.ratingTiers=JSON.parse(JSON.stringify(DEFAULT_RATING_TIERS));
  if(!db.settings)          db.settings={ kpiWeightPro:0.7, kpiWeightDisc:0.3, backupIntervalDays:7,
                              lastBackup:null, adminEmail:'nguyentuananh.emc@gmail.com',
                              emailjs:{serviceId:'',templateId:'',publicKey:''} };
  if(!db.settings.emailjs)  db.settings.emailjs={serviceId:'',templateId:'',publicKey:''};
  // [PATCH] Cấu hình giờ làm việc cho chức năng tự chấm công
  if(!db.settings.workStartTime)   db.settings.workStartTime   = '08:00';
  if(!db.settings.workEndTime)     db.settings.workEndTime     = '17:00';
  if(db.settings.lateGraceMins==null) db.settings.lateGraceMins = 0; // số phút cho phép trễ không bị tính là muộn
  // [PATCH] Cấu hình riêng cho từng công ty — null = dùng cấu hình chung
  if(!db.settings.companyWorkHours) db.settings.companyWorkHours = {};
  // [CC4] Danh sách người được Admin chỉ định quyền duyệt chấm công
  if(!Array.isArray(db.settings.attendanceApprovers)) db.settings.attendanceApprovers = [];
  db.users.forEach(u=>{
    if(u.role==='admin') return;
    if(!Array.isArray(u.assignments)){
      u.assignments=[];
      if(u.area) u.assignments.push({ area:u.area, salaryRankCode:u.salaryRankCode||'',
        kpiPct:Number(u.kpiPct)||0, kpiBase:Number(u.baseSalary)||0 });
    }
    if(u.baseSalary===undefined) u.baseSalary=0;
    if(u.allowance===undefined)  u.allowance=0;
  });
  return db;
}

/* Pull Firebase → nạp vào _db */
async function fbPullOnce(){
  try{
    const data = await window._fbGet(FB_PATH);
    _db = migrateDB(data || null);
    // Khởi tạo _writeVersion từ dữ liệu Firebase để không bị reset về 0
    if(_db._v) _writeVersion = _db._v;
    _fbConnected = true;
    return _db;
  }catch(e){
    console.warn('Firebase pull err:', e);
    if(!_db) _db = _buildEmptyDB();
    _fbConnected = true;
    return null;
  }
}

/* Realtime listener — nhận thay đổi từ máy KHÁC, dùng version để tránh nhận bản cũ */
function fbStartRealtime(){
  if(_fbSyncHandle || !window._firebaseReady) return;
  _fbSyncHandle = window._fbOn(FB_PATH, (data)=>{
    if(!data || !data.users) return;
    const incomingV = data._v || 0;

    // Bản cũ hơn version hiện tại → bỏ qua hoàn toàn
    if(incomingV < _writeVersion){
      console.log('[listener] IGNORED stale v:', incomingV, '< local v:', _writeVersion);
      return;
    }

    // Chính tab này vừa ghi → bỏ qua echo một lần, reset flag
    if(_justWrote){
      _justWrote = false;
      console.log('[listener] IGNORED own echo v:', incomingV);
      return;
    }

    // Máy khác ghi → nhận và cập nhật
    console.log('[listener] ACCEPTED v:', incomingV, 'users:', data.users?.length);
    _writeVersion = incomingV;
    _db = migrateDB(data);
    _fbConnected = true;
    if(typeof _popupCid !== 'undefined' && _popupCid){
      renderFileStatusBar(); renderPopupBody();
    } else if(currentUser()){
      renderFileStatusBar(); routeTo(currentView);
    }
  });
}

function fbStopRealtime(){
  if(_fbSyncHandle){ window._fbOff(_fbSyncHandle); _fbSyncHandle=null; }
  _fbConnected = false;
}

/* ---------- Hash mật khẩu (SHA-256) ---------- */
async function hashPassword(plain){
  const buf=new TextEncoder().encode(plain);
  const h=await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ============================================================
   KPI COMPUTATION
   ============================================================ */
function pctAchieve(target, actual, lowerIsBetter=false){
  if(target===''||target===null||target===undefined) return 0;
  const t=Number(target), a=Number(actual);
  if(isNaN(t)||isNaN(a)) return 0;
  if(lowerIsBetter){
    // Càng thấp càng tốt: nếu actual<=target → 100%; nếu actual>target → giảm theo tỉ lệ
    if(t===0){ return a===0 ? 1 : Math.max(0, 1 - a*0.2); }
    if(a<=t) return 1;
    return Math.max(0, 1 - (a-t)/(t*2));
  }else{
    if(t===0) return a>0 ? 1 : 0;
    const r=a/t;
    return Math.max(0, Math.min(1.2, r));
  }
}
/* ============================================================
   [YC-CT] CÁCH TÍNH % ĐẠT DO NGƯỜI DÙNG ĐỊNH NGHĨA CHO TỪNG CHỈ TIÊU
   - Mỗi chỉ tiêu có calcType (cách tính) + steps (bảng bậc thang nếu chọn).
   - Nếu không cấu hình → 'auto': theo ĐVT như trước (lần/vụ = càng thấp càng tốt,
     còn lại = Thực tế/Mục tiêu, trần 120%).
   ============================================================ */
const KPI_CALC_TYPES = {
  auto:        {label:'Tự động theo ĐVT (mặc định cũ)',            desc:'ĐVT "lần/vụ" → càng thấp càng tốt; còn lại: %Đạt = Thực tế ÷ Mục tiêu (trần 120%)'},
  ratio:       {label:'Tỷ lệ: Thực tế ÷ Mục tiêu (trần 120%)',     desc:'Vượt mục tiêu được cộng tối đa 120%'},
  ratio100:    {label:'Tỷ lệ: Thực tế ÷ Mục tiêu (trần 100%)',      desc:'Đạt/vượt mục tiêu = đúng 100%, không thưởng vượt'},
  inverse:     {label:'Càng thấp càng tốt (≤ Mục tiêu = 100%)',     desc:'Thực tế ≤ Mục tiêu → 100%; vượt → giảm dần về 0'},
  threshold:   {label:'Ngưỡng ĐẠT/KHÔNG ĐẠT (≥ Mục tiêu = 100%)',   desc:'Thực tế ≥ Mục tiêu → 100%, ngược lại 0%'},
  threshold_low:{label:'Ngưỡng ĐẠT/KHÔNG ĐẠT (≤ Mục tiêu = 100%)',  desc:'Thực tế ≤ Mục tiêu → 100%, ngược lại 0% (dùng cho lỗi/vi phạm)'},
  steps_down:  {label:'Bậc thang GIẢM (≤ ngưỡng → điểm%)',          desc:'VD "0:100, 2:80, 5:50, else:0" nghĩa là: ≤0 lần=100%, ≤2 lần=80%, ≤5 lần=50%, nhiều hơn=0%'},
  steps_up:    {label:'Bậc thang TĂNG (≥ ngưỡng → điểm%)',          desc:'VD "10:100, 7:80, 5:50, else:0" nghĩa là: ≥10=100%, ≥7=80%, ≥5=50%, ít hơn=0%'}
};
/* Phân tích chuỗi bậc thang "a:b, c:d, else:x" → {steps:[{lim,pct}], elsePct} */
function parseKpiSteps(s){
  const steps=[]; let elsePct=0;
  String(s||'').split(/[,\n;]+/).forEach(part=>{
    const m=part.trim().match(/^(else|còn lại|khac|khác)\s*:\s*(-?[\d.]+)/i);
    if(m){ elsePct=Number(m[2])||0; return; }
    const m2=part.trim().match(/^(-?[\d.,]+)\s*:\s*(-?[\d.]+)/);
    if(m2){ steps.push({lim:Number(m2[1].replace(',','.')), pct:Number(m2[2])||0}); }
  });
  return {steps, elsePct};
}
/* %Đạt của 1 chỉ tiêu theo cách tính người dùng định nghĩa (trả 0–1.2) */
function pctAchieveItem(it, target, actual){
  const t=Number(target), a=Number(actual);
  if(actual===''||actual===null||actual===undefined||isNaN(a)) return 0;
  const ct=(it&&it.calcType)||'auto';
  switch(ct){
    case 'ratio':    return (isNaN(t)||t===0) ? (a>0?1:0) : Math.max(0, Math.min(1.2, a/t));
    case 'ratio100': return (isNaN(t)||t===0) ? (a>0?1:0) : Math.max(0, Math.min(1,   a/t));
    case 'inverse':  return pctAchieve(target, actual, true);
    case 'threshold':     return a>=t ? 1 : 0;
    case 'threshold_low': return a<=t ? 1 : 0;
    case 'steps_down': {
      const p=parseKpiSteps(it.steps);
      const sorted=p.steps.slice().sort((x,y)=>x.lim-y.lim);
      for(const s of sorted){ if(a<=s.lim) return Math.max(0, s.pct/100); }
      return Math.max(0, p.elsePct/100);
    }
    case 'steps_up': {
      const p=parseKpiSteps(it.steps);
      const sorted=p.steps.slice().sort((x,y)=>y.lim-x.lim);
      for(const s of sorted){ if(a>=s.lim) return Math.max(0, s.pct/100); }
      return Math.max(0, p.elsePct/100);
    }
    default: {
      // [FIX] so sánh ĐVT không phân biệt hoa/thường ("Lần" = "lần")
      const u=String((it&&it.unit)||'').toLowerCase();
      const lower = u==='lần'||u==='vụ';
      return pctAchieve(target, actual, lower);
    }
  }
}
/* Mô tả ngắn cách tính để hiển thị cho người chấm */
function kpiCalcLabel(it){
  const ct=(it&&it.calcType)||'auto';
  const base=(KPI_CALC_TYPES[ct]||KPI_CALC_TYPES.auto).label;
  return ct.startsWith('steps') && it.steps ? base+' — '+it.steps : base;
}
function computeKPISection(items, values){
  // items: template; values: {idx:{target,actual}}
  let total=0;
  const detail=[];
  items.forEach((it,i)=>{
    const v=values[i]||{};
    const target = (v.target!==undefined && v.target!=='') ? v.target : it.target;
    const actual = (v.actual!==undefined && v.actual!=='') ? v.actual : '';
    const pct = pctAchieveItem(it, target, actual); // [YC-CT] tính theo cách người dùng định nghĩa
    const pts = it.weight * pct * 100;
    total += pts;
    detail.push({name:it.name, unit:it.unit, weight:it.weight, target, actual, pct, points:pts});
  });
  return {total, detail};
}
function computeFullKPI(evalRow){
  const db=getDB();
  const wPro=db.settings.kpiWeightPro, wDisc=db.settings.kpiWeightDisc;
  const proItems = (db.kpiTemplates[evalRow.area]||[]);
  const discItems = (db.disciplineTemplate||[]);
  const pro = computeKPISection(proItems, evalRow.pro||{});
  const disc = computeKPISection(discItems, evalRow.disc||{});
  const total = pro.total*wPro + disc.total*wDisc;
  const rt = ratingOf(total);
  return {pro, disc, total, rating:rt, wPro, wDisc};
}
function computeSalary(user, evalRow){
  // Phiên bản đơn mảng (giữ lại để tương thích ngược, ưu tiên dùng computeSalaryMulti)
  const rank = user.salaryRankCode ? getRank(user.area, user.salaryRankCode) : null;
  if(!rank) return {base:0, allowance:0, kpiMax:0, kpiActual:0, total:0, rating:null};
  const kpi = computeFullKPI(evalRow);
  const base = Number(user.baseSalary||rank.applied||0);
  const allowance = Number(user.allowance!==undefined ? user.allowance : (rank.allowance||0));
  const kpiPct = Number(user.kpiPct!==undefined ? user.kpiPct : (rank.kpiPct||0));
  const kpiMax = base*kpiPct;
  const kpiActual = kpiMax * kpi.rating.coef * (kpi.total/100);
  const total = base + allowance + kpiActual;
  return {base, allowance, kpiMax, kpiActual, total, rating:kpi.rating, kpiScore:kpi.total};
}

/* ---------- Tính lương đa nhiệm: base + allowance + Σ KPI bonus theo từng mảng ---------- */
function computeSalaryMulti(user, period){
  const db = getDB();
  const assignments = getUserAssignments(user);
  const base = Number(user.baseSalary||0);
  const allowance = Number(user.allowance||0);
  const bonuses = [];
  let totalKpiActual = 0;
  let totalKpiMax = 0;
  let avgScore = 0, scoreCnt=0;

  assignments.forEach(asg=>{
    const ev = db.kpiEvals.find(e=>e.userId===user.id && e.period===period && e.area===asg.area);
    let kpiScore=0, rating=null, proTotal=0, discTotal=0;
    if(ev){
      const f = computeFullKPI(ev);
      kpiScore = f.total;
      rating = f.rating;
      proTotal = f.pro.total;
      discTotal = f.disc.total;
      avgScore += kpiScore; scoreCnt++;
    }
    const rank = asg.salaryRankCode ? getRank(asg.area, asg.salaryRankCode) : null;
    const kpiBase = Number(asg.kpiBase || (rank?rank.applied:0) || base || 0);
    const kpiPct = Number(asg.kpiPct || (rank?rank.kpiPct:0) || 0);
    const kpiMax = kpiBase * kpiPct;
    const kpiActual = (rating && kpiScore>0) ? kpiMax * rating.coef * (kpiScore/100) : 0;
    totalKpiMax += kpiMax;
    totalKpiActual += kpiActual;
    bonuses.push({
      area: asg.area,
      areaName: (getArea(asg.area)||{}).name || asg.area,
      rankCode: asg.salaryRankCode||'',
      kpiBase, kpiPct, kpiMax, kpiActual,
      kpiScore, rating,
      hasEval: !!ev,
      proTotal, discTotal
    });
  });

  const total = base + allowance + totalKpiActual;
  const avg = scoreCnt ? avgScore/scoreCnt : 0;
  return {
    base, allowance, totalKpiMax, totalKpiActual,
    total, bonuses,
    assignmentsCount: assignments.length,
    avgKpiScore: avg,
    avgRating: scoreCnt ? ratingOf(avg) : null
  };
}

/* ============================================================
   PCCC — TỰ ĐỘNG TÍNH KPI NHÂN VIÊN TỪ TIẾN ĐỘ CÔNG VIỆC
   - Tổng hợp toàn bộ nhiệm vụ thuộc dự án (db.tasks có projectId) theo từng NV.
   - Điểm KPI = 50%×Tỉ lệ hoàn thành + 30%×Tiến độ TB + 20%×Tỉ lệ đúng hạn,
     trừ điểm phạt cho việc quá hạn. Tự cập nhật khi tiến độ thay đổi.
   ============================================================ */
function computePCCCKpi(){
  const db=getDB();
  const now=Date.now();
  const projectIds = new Set((db.contracts||[]).filter(c=>c.pcccDesign===true).map(c=>c.id));
  const tasks=(db.tasks||[]).filter(t=>t.projectId && projectIds.has(t.projectId) && t.assigneeId);
  const byEmp={};
  tasks.forEach(t=>{
    const id=t.assigneeId; if(!byEmp[id]) byEmp[id]={total:0,done:0,onTime:0,overdue:0,progSum:0};
    const e=byEmp[id]; e.total++;
    const prog = (t.status==='done') ? 100 : (Number(t.progress)||0);
    e.progSum += prog;
    const isOverdue = t.status!=='done' && t.dueDate && t.dueDate<now;
    if(t.status==='done'){ e.done++; if(!t.dueDate || (t.completedAt? t.completedAt<=t.dueDate : true)) e.onTime++; }
    if(isOverdue) e.overdue++;
  });
  const rows=Object.keys(byEmp).map(id=>{
    const e=byEmp[id];
    const compRate = e.total? e.done/e.total : 0;
    const onTimeRate = e.total? e.onTime/e.total : 0;
    const avgProg = e.total? e.progSum/e.total : 0;
    let score = 50*compRate + 0.3*avgProg + 20*onTimeRate;
    score -= Math.min(15, e.overdue*3);
    score = Math.max(0, Math.min(100, Math.round(score)));
    return {empId:id, total:e.total, done:e.done, onTime:e.onTime, overdue:e.overdue, compRate, onTimeRate, avgProg:Math.round(avgProg), score};
  });
  rows.sort((a,b)=> b.score-a.score);
  return rows;
}

/* --- Hàm chung: nhập danh sách dự án PCCC (đánh dấu pcccDesign=true) --- */
function _pcccImportProjects(oldProjects){
  const db = getDB();
  db.tasks = db.tasks||[]; db.contracts = db.contracts||[];
  const toTs = d => d ? (isNaN(new Date(d).getTime())?null:new Date(d).getTime()) : null;
  let added=0, skipped=0, taskCount=0;
  oldProjects.forEach(p=>{
    const code = (p.code || ('PCCC-'+(p.id||uid('p')))).trim();
    if(db.contracts.some(c=>(c.code||'').trim()===code)){ skipped++; return; }
    const c = {
      id: uid('c'), createdAt: Date.now(), createdBy: (currentUser()||{}).id,
      code, name: p.name||code,
      companyId: 'tanvien',
      completionStatus: (p.status==='Hoàn thành')?'completed':(p.status==='Hủy'?'cancelled':'inprogress'),
      settlementStatus: '',
      signDate: toTs(p.contractDate) || toTs(p.designStart),
      completeDate: toTs(p.designDeadline),
      value: Number(p.contractValue)||0,
      paidValue: Number(p.paidAmount)||0,
      payments: [], addendums: [],
      ownerName: p.investor||'',
      ownerContact: p.investorContactName||'',
      ownerPhone: p.investorContactPhone||'',
      siteAddress: p.location||'',
      designerCompany: p.architectCompany||'',
      designerHead: p.architectManagerName||'',
      designerPhone: p.architectManagerPhone||'',
      note: [p.contractNo?('Số HĐ: '+p.contractNo):'', p.pccc105FileCode?('Mã thẩm duyệt 105: '+p.pccc105FileCode):'', p.pc07OfficerName?('CB PC07: '+p.pc07OfficerName+(p.pc07OfficerPhone?(' - '+p.pc07OfficerPhone):'')):'', p.notes||''].filter(Boolean).join(' · '),
      driveLinks: {}, materials: [],
      pcccDesign: true, _fromPCCC: true
    };
    db.contracts.push(c);
    (p.tasks||[]).forEach(t=>{
      db.tasks.push({
        id: uid('t'), createdAt: Date.now(), createdBy: (currentUser()||{}).id,
        projectId: c.id,
        title: t.name || t.title || 'Công việc thiết kế',
        assigneeId: t.assigneeId || '',
        status: (t.status==='Hoàn thành')?'done':((t.status==='Tạm dừng'||t.status==='Mới tạo')?'new':'inprogress'),
        progress: Number(t.progress)||0,
        dueDate: toTs(t.deadline),
        note: t.note || t.description || '',
        _fromPCCC: true
      });
      taskCount++;
    });
    added++;
  });
  saveDB(db);
  return {added, skipped, taskCount};
}

window.migratePCCCData = function(){
  let raw=null;
  try{ raw = localStorage.getItem('ql_thietke_pccc_v1'); }catch(e){}
  if(!raw){ toast('Không tìm thấy dữ liệu PCCC cũ trong trình duyệt này. Dữ liệu cũ chỉ đọc được trên đúng máy/trình duyệt đã từng dùng mô-đun PCCC. Bạn có thể dùng "📥 Nhập từ file JSON".','error'); return; }

  const oldProjects = (parsed && parsed.projects) || [];
  if(!oldProjects.length){ toast('Dữ liệu PCCC cũ không có dự án nào để nhập.','warn'); return; }

  toast('Đã nhập '+r.added+' dự án PCCC'+(r.taskCount?(' + '+r.taskCount+' công việc'):'')+(r.skipped?(' (bỏ qua '+r.skipped+' dự án trùng mã)'):'')+'.','success');
  _pcccSubTab='input'; render();
};

window.importPCCCJson = function(input){
  const file = input && input.files && input.files[0];
  if(!file){ return; }
  const reader = new FileReader();
  reader.onload = function(e){
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ toast('File JSON không hợp lệ / sai định dạng.','error'); input.value=''; return; }
    // Hỗ trợ: {projects:[...]} hoặc mảng [...] hoặc {data:{projects:[...]}}
    let oldProjects = [];
    if(Array.isArray(parsed)) oldProjects = parsed;
    else if(parsed && Array.isArray(parsed.projects)) oldProjects = parsed.projects;
    else if(parsed && parsed.data && Array.isArray(parsed.data.projects)) oldProjects = parsed.data.projects;
    if(!oldProjects.length){ toast('Không tìm thấy danh sách dự án trong file JSON (cần khóa "projects").','warn'); input.value=''; return; }
    if(!confirm('Tìm thấy '+oldProjects.length+' dự án trong file JSON. Nhập các dự án thiết kế PCCC (bỏ qua dự án trùng mã)?')){ input.value=''; return; }
    const r=_pcccImportProjects(oldProjects);
    toast('Đã nhập '+r.added+' dự án PCCC'+(r.taskCount?(' + '+r.taskCount+' công việc'):'')+(r.skipped?(' (bỏ qua '+r.skipped+' dự án trùng mã)'):'')+'.','success');
    input.value='';
    _pcccSubTab='input'; render();
  };
  reader.onerror = function(){ toast('Không đọc được file JSON.','error'); input.value=''; };
  reader.readAsText(file, 'utf-8');
};

      try{ localStorage.setItem('HRM_LAST_LOGIN', JSON.stringify({role, username:u})); }catch(e){}

  document.getElementById('login-btn').addEventListener('click', (e)=>{ e.preventDefault(); doLogin(); });
  document.getElementById('login-pass').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); doLogin(); }});

  // 👁 Toggle show password
  document.getElementById('pw-toggle').addEventListener('click', ()=>{
    const inp=document.getElementById('login-pass');
    inp.type = inp.type==='password' ? 'text' : 'password';
    document.getElementById('pw-toggle').textContent = inp.type==='password' ? '👁' : '🙈';
  });

  // 🔎 Autocomplete tên NV
  const userInput = document.getElementById('login-user');
  const sugBox = document.getElementById('login-suggest');
  let _loginSugList=[], _loginSugIdx=-1;
  function renderLoginSuggest(q){
    if(role==='admin'){ sugBox.style.display='none'; return; }
    const qLow = (q||'').toLowerCase().trim();
    let list = db.users.filter(u=>u.role===role);
    if(qLow) list = list.filter(u=>
      (u.username||'').toLowerCase().includes(qLow) ||
      (u.name||'').toLowerCase().includes(qLow) ||
      (u.code||'').toLowerCase().includes(qLow)
    );
    list = list.slice(0,15);
    _loginSugList = list; _loginSugIdx = list.length?0:-1;
    if(!list.length){ sugBox.style.display='none'; return; }
    sugBox.innerHTML = list.map((u,i)=>{
      const co = getCompany(u.companyId);
      return `<div class="login-sug-item" data-idx="${i}" data-username="${escapeHtml(u.username)}"
        style="padding:8px 10px;cursor:pointer;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center"
        onmouseenter="window._loginSugHL(${i})"
        ondblclick="window._loginSugPick(${i})"
        onclick="window._loginSugPick(${i})">
        <span><b>${escapeHtml(u.name)}</b> <span class="muted" style="font-size:11px">(${escapeHtml(u.username)})</span></span>
        <span class="badge co" style="font-size:10px">${escapeHtml(co.code)}</span>
      </div>`;
    }).join('');
    sugBox.style.display='block';
    window._loginSugHL(0);
  }
  window._loginSugHL = function(i){
    _loginSugIdx = i;
    sugBox.querySelectorAll('.login-sug-item').forEach(el=>{
      if(Number(el.dataset.idx)===i){ el.style.background='#1e3a8a'; el.style.color='#fff'; el.scrollIntoView({block:'nearest'}); }
      else { el.style.background=''; el.style.color=''; }
    });
  };
  window._loginSugPick = function(i){
    const u = _loginSugList[i]; if(!u) return;
    userInput.value = u.username;
    sugBox.style.display='none';
    document.getElementById('login-pass').focus();
  };
  userInput.addEventListener('focus', ()=>renderLoginSuggest(userInput.value));
  userInput.addEventListener('input', ()=>renderLoginSuggest(userInput.value));
  userInput.addEventListener('keydown', (e)=>{
    if(sugBox.style.display==='none'){ if(e.key==='Enter'){ e.preventDefault(); doLogin(); } return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); _loginSugIdx=Math.min(_loginSugList.length-1, _loginSugIdx+1); window._loginSugHL(_loginSugIdx); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); _loginSugIdx=Math.max(0, _loginSugIdx-1); window._loginSugHL(_loginSugIdx); }
    else if(e.key==='Enter'){
      e.preventDefault();
      if(_loginSugIdx>=0 && _loginSugList[_loginSugIdx]){ window._loginSugPick(_loginSugIdx); }
      else doLogin();
    }
    else if(e.key==='Escape'){ sugBox.style.display='none'; }
  });
  document.addEventListener('click', (ev)=>{ if(!userInput.contains(ev.target) && !sugBox.contains(ev.target)) sugBox.style.display='none'; });
}

function viewDashboard(main, u){
  const db=getDB();
  const period=_attPeriod||thisPeriod(); // [CC1] cho phép xem lại tháng cũ
  // [YC3] Bảng chấm công hiển thị TOÀN BỘ nhân sự tổng hợp từ CẢ 3 CÔNG TY
  //       (admin/pm/manager xem tất cả; employee chỉ xem dòng của mình)
  let users = db.users.filter(x=>x.role!=='admin');
  // [CC4] NV được chỉ định quyền duyệt chấm công sẽ thấy TOÀN BỘ bảng công 3 công ty
  if(u.role==='employee' && !canApproveAttendance()) users = users.filter(x=>x.id===u.id);
  // Sắp xếp theo công ty rồi theo tên cho dễ theo dõi
  users.sort((a,b)=>{
    const ca=getCompany(a.companyId).code||'', cb=getCompany(b.companyId).code||'';
    if(ca!==cb) return ca.localeCompare(cb);
    return (a.name||'').localeCompare(b.name||'','vi');
  });

  const rowsHtml = users.map(emp=>{
    const sal = computeSalaryMulti(emp, period);
    const asgs = getUserAssignments(emp);
    const c=getCompany(emp.companyId);
    const areasHtml = asgs.length ? asgs.map(a=>{
      const ar=getArea(a.area); return ar?`<span class="badge area-${ar.id}">${escapeHtml(ar.short)}</span>`:'';
    }).join(' ') : '<span class="muted">—</span>';
    const scoresHtml = sal.bonuses.length ? sal.bonuses.map(b=>{
      const ar=getArea(b.area);
      if(!b.hasEval) return `<span class="muted" style="font-size:11px" title="${ar.name}: chưa chấm">${ar.short}:—</span>`;
      return `<span class="badge ${b.rating.css}" style="font-size:11px" title="${ar.name}: ${b.kpiScore.toFixed(1)} - ${b.rating.label}">${ar.short}:${b.kpiScore.toFixed(0)}</span>`;
    }).join(' ') : '<span class="muted">Chưa chấm</span>';
    const avgHtml = sal.avgRating ? `<span class="badge ${sal.avgRating.css}">${sal.avgRating.label} (TB ${sal.avgKpiScore.toFixed(1)})</span>` : '<span class="muted">—</span>';
    return `<tr class="clickable" ondblclick="showEmployeeDetail('${emp.id}')">
      <td>${escapeHtml(emp.code||emp.username)}</td>
      <td><b>${escapeHtml(emp.name)}</b>${asgs.length>1?`<div class="hint muted">Đa nhiệm ${asgs.length} mảng</div>`:''}</td>
      <td>${roleBadge(emp.role)}</td>
      <td><span class="badge co">${escapeHtml(c.code)}</span></td>
      <td>${areasHtml}</td>
      <td>${escapeHtml(emp.position||'')}</td>
      <td>${scoresHtml}</td>
      <td>${avgHtml}</td>
      <td class="muted">${escapeHtml(emp.email||'')}</td>
    </tr>`;
  }).join('');

  // Thống kê
  const totalEmps = users.length;
  const evaluatedThisMonth = db.kpiEvals.filter(e=>e.period===period && users.some(u=>u.id===e.userId)).length;
  const activeTasks = db.tasks.filter(t=>t.status!=='done' && users.some(u=>u.id===t.assigneeId)).length;
  const overdueTasks = db.tasks.filter(t=>t.status!=='done' && t.dueDate && t.dueDate < Date.now() && users.some(u=>u.id===t.assigneeId)).length;

  // ====== CHẤM CÔNG ======
  // db.attendance = {userId: {period: {day: 'P'|'V'|'O'|'H' ...}}}
  // P = đi làm đủ ngày, V = vắng, O = nghỉ phép, H = nửa ngày
  const db2 = db;
  if(!db2.attendance) { db2.attendance = {}; saveDB(db2); }
  const [yy, mm] = period.split('-').map(Number);
  const daysInMonth = new Date(yy, mm, 0).getDate();
  const workingDays = countWorkingDays(yy, mm); // ngày thường (T2–T7)

  // Tính lương từ chấm công + KPI (đã hỗ trợ tăng ca)
  function attCountFor(empId){
    const rec = (db2.attendance[empId]||{})[period] || {};
    let full=0, half=0, leave=0, otHours=0;
    Object.values(rec).forEach(v=>{
      // Cấu trúc mới: {code, ot, pendingCheckIn}; cấu trúc cũ: chỉ là string code
      let code, ot, pending=false;
      if(typeof v==='object' && v!==null){
        code = v.code; ot = Number(v.ot)||0; pending = !!v.pendingCheckIn;
        // [CC2] Muộn quá 60 phút mà KHÔNG có lý do được duyệt → chỉ tính NỬA công
        if(code==='P' && v.late && Number(v.lateMins)>60 && !v.lateExcused) code='H';
      }
      else { code = v; ot = 0; }
      // [PATCH] Chấm công NV chờ duyệt không tính vào tổng công
      if(pending) return;
      if(code==='P') full++; else if(code==='H') half++; else if(code==='O') leave++;
      // [CC3] 'K' = nghỉ KHÔNG phép → 0 công, không cộng bucket nào
      otHours += ot;
    });
    return {full, half, leave, otHours, totalDays: full + 0.5*half + 0*leave};
  }
  function computeSalaryWithAttendance(emp){
    const sal = computeSalaryMulti(emp, period);
    const att = attCountFor(emp.id);
    const ratio = workingDays>0 ? att.totalDays/workingDays : 1;
    // Lương theo công = (Lương cứng + Hỗ trợ) × tỷ lệ công đi làm
    const cdRatio = Math.min(1, ratio);
    const baseAdjusted = Math.round((sal.base + sal.allowance) * cdRatio);
    const finalTotal = baseAdjusted + sal.totalKpiActual;
    return {...sal, attendance: att, workingDays, attendanceRatio: cdRatio, baseAdjusted, finalTotal};

        <td class="right">${fmtVND(Math.round(sal.totalKpiActual))}</td>
        <td class="right"><b style="color:#1e3a8a">${fmtVND(Math.round(sal.finalTotal))}</b></td>` : ''}
      <td>${(!canApproveAttendance())
          ? `<button class="btn sm outline" onclick="event.stopPropagation();openAttendanceGrid('${emp.id}','${period}')">👁 Xem</button>`
          : `<button class="btn sm" onclick="event.stopPropagation();openAttendanceGrid('${emp.id}','${period}')">📅 Chấm</button>`}</td>
    </tr>`;
  }).join('');

  // [PATCH] Card tự chấm công cho NV + danh sách chờ duyệt cho cấp quản lý
  const selfCheckInHtml = (u.role==='employee') ? renderSelfCheckInCard(u, db) : '';
  const pendingApprovalHtml = canApproveAttendance() ? renderAttendancePendingList(u, db) : ''; // [PQ2] chỉ người được phân quyền (và admin) thấy thẻ duyệt

  main.innerHTML=`
    ${renderHomeAlerts(u, db)}
    <div class="page-head">
      <h1>🕐 Chấm công · ${fmtPeriod(period)}</h1>
      <div class="actions">
        <input type="month" id="att-period" value="${period}" onchange="setAttPeriod(this.value)" style="width:auto" title="Chọn tháng muốn xem lại — toàn bộ bảng công, lương và danh sách chờ duyệt sẽ hiển thị theo tháng này">
        <button class="btn" onclick="exportAttendanceExcel()">📊 Xuất Excel lương + chấm công</button>
        <button class="btn outline" onclick="navTo('reports')">📑 Báo cáo lương</button>
      </div>
    </div>
    ${u.role!=='employee'?`<div class="help-text" style="background:#eef2ff;border-color:#c7d2fe">🟢🔴 <b>Quy trình chấm công của nhân viên:</b> NV đăng nhập sẽ thấy thẻ "Tự chấm công" với các nút <b>Chấm giờ vào</b>, <b>🔴 Chấm giờ VỀ</b> (giờ làm = giờ về − giờ vào − 1,5h nghỉ trưa), <b>🌴 Xin nghỉ</b> (duyệt → O có phép; từ chối → K không phép, tính KPI), <b>Đăng ký tăng ca</b> (kèm lý do) và <b>Trình bày lý do đến muộn</b> (muộn &lt;1h: xác nhận đi muộn; muộn &gt;1h: chỉ tính ½ công nếu không được duyệt lý do). Người được phân quyền duyệt sẽ thấy các thẻ chờ duyệt tương ứng bên dưới; NV quên chấm giờ về hiện ở thẻ 🚨 và bị trừ 1 điểm thái độ/ngày. Rê chuột vào ô trong lưới chấm công để xem <b>tên người phê duyệt từng mục</b>.</div>`:''}
    <div class="help-text">📅 <b>Chấm công tháng:</b> bấm "📅 Chấm" để mở lưới chấm công cho từng NV. Quy ước: <b>P</b> = công đủ ngày · <b>H</b> = nửa ngày · <b>O</b> = nghỉ CÓ phép · <b style="color:#dc2626">K</b> = nghỉ KHÔNG phép (tính vào KPI Ý thức) · <b>(trống)</b> = vắng/CN/ngày nghỉ. Muộn quá 1 tiếng không có lý do được duyệt → ngày đó chỉ tính <b>½ công</b>. <b>Lương cuối tháng</b> = (Lương cứng + Hỗ trợ) × Tỷ lệ công + Σ Thưởng KPI từng mảng.</div>
    ${selfCheckInHtml}

function countWorkingDays(year, month){
  // Đếm T2-T7 trong tháng (CN nghỉ). Không tính ngày lễ.
  const dim = new Date(year, month, 0).getDate();
  let cnt=0;
  for(let d=1;d<=dim;d++){
    const dow = new Date(year, month-1, d).getDay(); // 0=CN, 6=T7
    if(dow!==0) cnt++;
  }
  return cnt;
}

/* [AUDIT] Chuỗi lưu vết người phê duyệt từng mục chấm công của 1 ngày.
   CHỈ hiển thị cho người được phân quyền duyệt chấm công + Admin (tooltip trên lưới). */
function _attAuditText(cellRec, db){
  if(!cellRec || typeof cellRec!=='object') return '';
  const nameOf=id=>{ const x=(db.users||[]).find(u=>u.id===id); return x?x.name:'(không rõ)'; };
  const parts=[];
  if(cellRec.checkIn) parts.push('GIỜ VÀO '+fmtDateTime(cellRec.checkIn)+(cellRec.pendingCheckIn?' [⏳ chờ duyệt]':(cellRec.confirmedBy?' [✓ duyệt: '+nameOf(cellRec.confirmedBy)+']':'')));
  if(cellRec.checkOut) parts.push('GIỜ VỀ '+fmtDateTime(cellRec.checkOut)+' → '+(cellRec.workedHours||0)+'h làm việc'+(cellRec.pendingCheckOut?' [⏳ chờ duyệt]':(cellRec.checkOutConfirmedBy?' [✓ duyệt: '+nameOf(cellRec.checkOutConfirmedBy)+']':'')));
  if(cellRec.otReq){
    const st=cellRec.otReq.status;
    parts.push('TĂNG CA '+(cellRec.otReq.hours||cellRec.ot||0)+'h — '+escapeHtml(cellRec.otReq.note||'')+(st==='pending'?' [⏳ chờ duyệt]':(st==='approved'?' [✓ duyệt: '+nameOf(cellRec.otReq.decidedBy)+']':' [✗ từ chối: '+nameOf(cellRec.otReq.decidedBy)+']')));
  } else if(cellRec.ot){
    parts.push('TĂNG CA '+cellRec.ot+'h'+(cellRec.otBy?' [nhập bởi: '+nameOf(cellRec.otBy)+']':' [người chấm công nhập trực tiếp]'));
  }
  if(cellRec.lateReason){
    const st=cellRec.lateReason.status;
    parts.push('LÝ DO MUỘN: "'+escapeHtml(cellRec.lateReason.text||'')+'"'+(st==='pending'?' [⏳ chờ duyệt]':(st==='approved'?' [✓ chấp thuận: '+nameOf(cellRec.lateReason.decidedBy)+']':' [✗ từ chối: '+nameOf(cellRec.lateReason.decidedBy)+']')));
  }
  if(cellRec.leaveReq){
    const st=cellRec.leaveReq.status;
    parts.push('ĐƠN NGHỈ: "'+escapeHtml(cellRec.leaveReq.reason||'')+'"'+(st==='pending'?' [⏳ chờ duyệt]':(st==='approved'?' [✓ CÓ PHÉP — duyệt: '+nameOf(cellRec.leaveReq.decidedBy)+']':' [✗ KHÔNG PHÉP — quyết định: '+nameOf(cellRec.leaveReq.decidedBy)+']')));
  }
  return parts.join('  •  ');
}
function renderAttGrid(empId, period, isReadOnly){
  const db = getDB();
  const [yy,mm] = period.split('-').map(Number);
  const dim = new Date(yy, mm, 0).getDate();
  const firstDow = new Date(yy, mm-1, 1).getDay(); // 0=CN
  const rec = (db.attendance[empId] && db.attendance[empId][period]) || {};
  const wrap = document.getElementById('att-grid'); if(!wrap) return;
  if(isReadOnly===undefined) isReadOnly = !canApproveAttendance();
  let cells = '';
  function _getCellInfo(v){
    if(typeof v==='object' && v!==null){
      let code=v.code||'';
      // [CC2] Muộn >60' không có lý do được duyệt → hiển thị & tính như H (nửa công)
      const halfLate = code==='P' && v.late && Number(v.lateMins)>60 && !v.lateExcused;
      if(halfLate) code='H';
      return {code, ot:Number(v.ot)||0, halfLate};
    }
    return {code:v||'', ot:0, halfLate:false};
  }
  // Pad start
  for(let i=0;i<firstDow;i++) cells += '<div></div>';
  for(let d=1;d<=dim;d++){
    const dow = new Date(yy, mm-1, d).getDay();
    const isSun = dow===0;
    const info = _getCellInfo(rec[d]);
    const v = info.code, ot = info.ot;
    // [PATCH] Hiển thị riêng cho ô chờ duyệt (pendingCheckIn) và ô đi muộn
    const cellRec = rec[d] && typeof rec[d]==='object' ? rec[d] : null;
    const isPending = cellRec && cellRec.pendingCheckIn;
    const isLate = cellRec && cellRec.late;
    const colors = {'P':'#16a34a', 'H':'#f59e0b', 'O':'#3b82f6', 'K':'#dc2626', '':'#f1f5f9'};
    let bg = colors[v] || '#f1f5f9';
    let border = '1px solid #cbd5e1';
    let badge = '';
    if(isPending){
      bg = '#fef3c7';        // vàng chờ duyệt
      border = '2px dashed #f59e0b';
      badge = '<div style="font-size:9px;margin-top:1px;color:#92400e;font-weight:700">⏳ chờ duyệt</div>';
    } else if(isLate){
      const excused = cellRec.lateExcused;
      badge = excused
        ? '<div style="font-size:9px;margin-top:1px;color:#166534;background:rgba(220,252,231,.9);border-radius:3px;padding:0 3px">✓ muộn có lý do</div>'
        : '<div style="font-size:9px;margin-top:1px;color:#fff;background:rgba(220,38,38,.7);border-radius:3px;padding:0 3px">⚠ muộn '+(cellRec.lateMins||0)+'\''+(info.halfLate?' → ½ công':'')+'</div>';
    }
    const clickHandler = isReadOnly ? '' : `onclick="cycleAttDay('${empId}','${period}',${d})"`;
    const cursor = isReadOnly ? 'default' : 'pointer';
    const textColor = isPending ? '#92400e' : (v ? '#fff' : '#0f172a');
    const auditTitle = (!isReadOnly && cellRec) ? _attAuditText(cellRec, db) : '';
    cells += `<div ${auditTitle?`title="${escapeHtml(auditTitle)}"`:''} style="padding:6px 4px;border:${border};border-radius:6px;background:${bg};color:${textColor};font-weight:${v?700:400};${isSun?'opacity:.5':''}${isReadOnly?';opacity:.85':''};text-align:center">
      <button ${clickHandler} ${isReadOnly?'disabled':''} style="background:none;border:none;color:inherit;cursor:${cursor};width:100%;font-weight:inherit">
        <div style="font-size:14px">${d}</div>
        <div style="font-size:11px">${v||'—'}</div>
      </button>
      ${badge}
      ${isReadOnly?`<div style="font-size:10px;margin-top:2px;background:rgba(255,255,255,.3);border-radius:4px;padding:1px 2px">OT: <b>${ot||0}h</b></div>`:`<input type="number" min="0" max="12" step="0.5" value="${ot||''}" onchange="updateAttOT('${empId}','${period}',${d},this.value)" placeholder="OT" title="Giờ tăng ca" style="width:100%;font-size:10px;padding:1px 2px;margin-top:2px;border:1px solid rgba(255,255,255,.4);border-radius:4px;background:rgba(255,255,255,.3);color:inherit;text-align:center" onclick="event.stopPropagation()">`}
    </div>`;
  }
  wrap.innerHTML = cells;
  // Summary
  let p=0,h=0,o=0,k=0,totalOT=0;
  Object.values(rec).forEach(v=>{
    const info = _getCellInfo(v);
    if(info.code==='P')p++; else if(info.code==='H')h++; else if(info.code==='O')o++; else if(info.code==='K')k++;
    totalOT += info.ot;
  });
  const total = p + 0.5*h;
  const wd = countWorkingDays(yy, mm);
  const ratio = wd>0 ? (total/wd*100) : 0;
  document.getElementById('att-summary').innerHTML = `
    <b>Tổng công:</b> P=${p} ngày · H=${h} nửa ngày · O=${o} phép · <b style="color:#dc2626">K=${k} nghỉ không phép</b> ·
    <b style="color:#f59e0b">Tăng ca: ${totalOT}h</b> ·
    <b>Quy đổi: ${total} công</b> / ${wd} ngày làm việc → <b>${ratio.toFixed(1)}%</b>
    <div class="hint" style="margin-top:4px">💡 Ngày có nhãn "⚠ muộn → ½ công": nhân viên đến muộn quá 1 tiếng không có lý do được duyệt nên chỉ tính nửa công. Duyệt lý do đi muộn ở trang Chấm công sẽ tự trả lại công đủ.</div>
  `;
}
window.updateAttOT = function(empId, period, d, value){
  if(!canApproveAttendance()){ toast('Bạn không có quyền nhập tăng ca','error'); return; }
  const db=getDB();
  if(!db.attendance[empId]) db.attendance[empId]={};
  if(!db.attendance[empId][period]) db.attendance[empId][period]={};
  const cur = db.attendance[empId][period][d];
  // [FIX] GIỮ NGUYÊN các trường khác (giờ vào, muộn, lý do, đăng ký OT…) khi sửa giờ OT
  let base = (typeof cur==='object' && cur!==null) ? {...cur} : (cur ? {code:cur} : {code:''});
  base.ot = Math.max(0, Number(value)||0);
  base.otBy = currentUser()?.id; // [AUDIT] lưu người nhập OT trực tiếp
  const hasOther = base.code || base.checkIn || base.otReq || base.lateReason || base.pendingCheckIn;
  if(base.ot || hasOther){
    db.attendance[empId][period][d] = base;
  } else {
    delete db.attendance[empId][period][d];
  }
  saveDB(db);
  renderAttGrid(empId, period);
};
window.cycleAttDay = function(empId, period, d){
  if(!canApproveAttendance()){ toast('Bạn không có quyền chấm công','error'); return; }
  const db=getDB();
  if(!db.attendance[empId]) db.attendance[empId]={};
  if(!db.attendance[empId][period]) db.attendance[empId][period]={};
  const cur = db.attendance[empId][period][d];
  // [FIX] GIỮ NGUYÊN các trường khác (giờ vào, muộn, OT, đăng ký OT, lý do…) khi đổi mã công
  let base = (typeof cur==='object' && cur!==null) ? {...cur} : (cur ? {code:cur, ot:0} : {code:'', ot:0});
  const curCode = base.code||'';
  // [CC3] Chu trình: trống → P → H → O (phép) → K (nghỉ KHÔNG phép) → trống
  const next = {'':'P','P':'H','H':'O','O':'K','K':''}[curCode] ?? 'P';
  base.code = next||'';
  const hasOther = (Number(base.ot)||0)>0 || base.checkIn || base.otReq || base.lateReason;
  if(base.code || hasOther){
    db.attendance[empId][period][d] = base;
  } else {
    delete db.attendance[empId][period][d];
  }
  saveDB(db);
  renderAttGrid(empId, period);
};
window.markAllWeekdays = function(empId, period, code){
  if(!canApproveAttendance()){ toast('Bạn không có quyền chấm công','error'); return; }
  const db=getDB();
  const [yy,mm] = period.split('-').map(Number);
  const dim = new Date(yy, mm, 0).getDate();
  if(!db.attendance[empId]) db.attendance[empId]={};
  db.attendance[empId][period] = {};
  for(let d=1;d<=dim;d++){
    if(new Date(yy, mm-1, d).getDay()!==0) db.attendance[empId][period][d] = code;
  }
  saveDB(db); renderAttGrid(empId, period);
  toast(`Đã đánh dấu "${code}" cho tất cả ngày làm việc`);
};
window.clearAttendance = function(empId, period){

/* ============================================================
   [PATCH] TỰ CHẤM CÔNG (NV) + WORKFLOW XÁC NHẬN BỞI QUẢN LÝ
   ============================================================ */
// Lấy bản ghi chấm công của 1 ngày (luôn trả object dạng mới)
function _getAttRec(db, empId, period, day){
  const v = ((db.attendance[empId]||{})[period]||{})[day];
  if(v==null) return null;
  if(typeof v==='object') return v;
  // Format cũ chỉ là string code
  return { code: v||'', ot: 0 };
}
function _setAttRec(db, empId, period, day, rec){
  if(!db.attendance) db.attendance={};
  if(!db.attendance[empId]) db.attendance[empId]={};
  if(!db.attendance[empId][period]) db.attendance[empId][period]={};
  if(!rec || (!rec.code && !rec.ot && !rec.pendingCheckIn && !rec.otReq && !rec.leaveReq && !rec.checkIn)){
    delete db.attendance[empId][period][day];
  } else {
    db.attendance[empId][period][day] = rec;
  }
}
// [PATCH] Lấy cấu hình giờ làm việc hiệu lực của 1 công ty (fallback về setting chung)
function _getWorkHoursFor(db, companyId){
  const co = (db.settings.companyWorkHours||{})[companyId] || {};
  return {
    workStartTime: co.workStartTime || db.settings.workStartTime || '08:00',
    workEndTime:   co.workEndTime   || db.settings.workEndTime   || '17:00',
    lateGraceMins: co.lateGraceMins!=null ? Number(co.lateGraceMins) : (Number(db.settings.lateGraceMins)||0),
    isCustom: !!(co.workStartTime||co.workEndTime||co.lateGraceMins!=null)
  };
}
// Tính số phút muộn so với giờ chuẩn (theo công ty của NV)
function _calcLateMins(checkInTs, db, companyId){
  const wh = _getWorkHoursFor(db, companyId);
  const d = new Date(checkInTs);
  const [sh, sm] = wh.workStartTime.split(':').map(Number);
  const start = new Date(d);
  start.setHours(sh, sm, 0, 0);
  const diffMin = Math.round((checkInTs - start.getTime())/60000);
  return Math.max(0, diffMin - wh.lateGraceMins);
}

  } else if(rec.checkIn && !rec.late){

    lateHtml = `<div style="margin-top:8px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px 10px;font-size:13px">

  }

    } else if(lr && lr.status==='pending'){
      lateHtml = `<div style="margin-top:8px;background:#fef3c7;border:1px solid #fde047;border-radius:8px;padding:8px 10px;font-size:13px">
        ⏳ <b>Lý do đến muộn đang chờ Quản lý duyệt:</b> "${escapeHtml(lr.text||'')}"</div>`;
    } else {
      lateHtml = `<div style="margin-top:8px;background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:8px 10px;font-size:13px">
        ${lr&&lr.status==='rejected'?`<div style="color:#991b1b">✗ Lý do trước đã bị từ chối${lr.decisionNote?': '+escapeHtml(lr.decisionNote):''}.</div>`:''}
        ⚠ Bạn đi muộn <b>${rec.lateMins||0} phút</b>.${over60?' <b style="color:#991b1b">Muộn quá 1 tiếng — nếu không có lý do được duyệt, hôm nay chỉ tính ½ ngày công.</b>':''}
        <div style="margin-top:6px"><button class="btn sm warn" onclick="openLateReasonForm()">📝 Trình bày lý do đến muộn</button></div>
      </div>`;
    }
  }
  // [CO] CHẤM GIỜ VỀ — NV chấm khi ra về; phần mềm tính số giờ làm, cảnh báo nếu < 8 tiếng
  let coHtml='';
  if(!rec || (!rec.checkIn && !rec.code)){
    // Chưa chấm giờ vào → hiện sẵn nút giờ về ở trạng thái KHÓA để NV biết có chức năng này
    coHtml = `<div style="margin-top:8px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;padding:8px 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div>🔴 <b>Chấm giờ về:</b> sẽ mở sau khi bạn <b>chấm giờ vào</b> đầu ngày. Giờ làm việc = <b>Giờ về − Giờ vào − 1,5h nghỉ trưa</b> (chuẩn ≥ 8 tiếng) — dùng để chấm KPI.
      <div class="hint" style="color:#991b1b">⚠ Ra về không chấm giờ về: sau 0h00 hôm sau bị TRỪ 1 điểm thái độ.</div></div>
      <button class="btn" disabled style="padding:12px 22px;font-size:15px;opacity:.45;cursor:not-allowed">🔴 Chấm giờ VỀ</button>
    </div>`;
  } else if(rec && !rec.checkIn && rec.code){
    // Công do Quản lý chấm trực tiếp (không có giờ vào) → không cần chấm giờ về
    coHtml = `<div style="margin-top:8px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px">
      🔴 <b>Chấm giờ về:</b> hôm nay công của bạn do Quản lý chấm trực tiếp (không ghi giờ vào) nên không cần chấm giờ về.</div>`;
  }
  if(rec && rec.checkIn){
    if(!rec.checkOut){
      coHtml = `<div style="margin-top:8px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;padding:8px 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div>🔴 <b>Khi ra về, hãy chấm giờ về.</b> Giờ làm việc = <b>Giờ về − Giờ vào − 1,5h nghỉ trưa</b> (chuẩn ≥ 8 tiếng) — dùng để chấm KPI.
        <div class="hint" style="color:#991b1b">⚠ Quên chấm giờ về: sau 0h00 hôm sau sẽ bị TRỪ 1 điểm thái độ (mục "Phối hợp đồng nghiệp, thái độ làm việc").</div></div>
        <button class="btn danger" style="padding:12px 22px;font-size:15px" onclick="selfCheckOut()">🔴 Chấm giờ VỀ</button>
      </div>`;
    } else {
      const hrs=Number(rec.workedHours)||0;
      const enough = hrs>=8;
      coHtml = `<div style="margin-top:8px;background:${enough?'#dcfce7':'#fef3c7'};border:1px solid ${enough?'#86efac':'#fde047'};border-radius:8px;padding:8px 10px;font-size:13px">
        🔴 Đã chấm giờ về lúc <b>${fmtDateTime(rec.checkOut)}</b> — làm việc <b>${hrs}h</b>
        ${enough?'<span class="badge" style="background:#dcfce7;color:#166534">✓ Đủ 8 tiếng</span>':'<span class="badge" style="background:#fee2e2;color:#991b1b">⚠ CHƯA đủ 8 tiếng</span>'}
        ${rec.pendingCheckOut?'<span class="badge" style="background:#fef3c7;color:#92400e">⏳ Giờ về chờ Quản lý duyệt</span>':'<span class="badge" style="background:#dcfce7;color:#166534">✓ Giờ về đã duyệt</span>'}
      </div>`;
    }
  }
  // [CO] Cảnh báo NV: các ngày TRƯỚC trong tháng đã chấm giờ vào nhưng QUÊN chấm giờ về
  const monthRecCO = ((db.attendance||{})[u.id]||{})[period] || {};
  const nowTs=Date.now();
  const [yyCO,mmCO]=period.split('-').map(Number);
  const forgotDays = Object.keys(monthRecCO).filter(d=>{
    const r=monthRecCO[d];
    if(!r || typeof r!=='object' || !r.checkIn || r.checkOut) return false;
    return new Date(yyCO, mmCO-1, Number(d)+1).getTime() <= nowTs; // đã qua 0h00 hôm sau
  }).map(Number).sort((a,b)=>a-b);
  if(forgotDays.length){
    coHtml += `<div style="margin-top:8px;background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:8px 10px;font-size:13px">
      🚨 <b>Bạn QUÊN chấm giờ về ${forgotDays.length} ngày:</b> ${forgotDays.map(d=>String(d).padStart(2,'0')+'/'+String(mmCO).padStart(2,'0')).join(', ')}.
      Mỗi ngày bị <b>trừ 1 điểm thái độ</b> vào KPI Ý thức (mục "Phối hợp đồng nghiệp, thái độ làm việc").</div>`;
  }
  // [NGHI] XIN NGHỈ — NV trình lý do nghỉ; được duyệt → O (có phép); từ chối/không lý do → K (không phép, tính KPI)
  let leaveHtml='';
  {
    const mRec = ((db.attendance||{})[u.id]||{})[period] || {};
    const leaveRows = Object.keys(mRec).map(d=>{
      const r=mRec[d]; if(!r||typeof r!=='object'||!r.leaveReq) return '';
      const dStr=String(d).padStart(2,'0')+'/'+period.split('-')[1];
      const lr=r.leaveReq;
      if(lr.status==='pending') return `<tr><td>${dStr}</td><td>${escapeHtml(lr.reason||'')}</td><td><span class="badge" style="background:#fef3c7;color:#92400e">⏳ Chờ duyệt</span></td><td><button class="btn sm outline" onclick="cancelLeaveRequest(${Number(d)})">↩ Hủy</button></td></tr>`;
      if(lr.status==='approved') return `<tr><td>${dStr}</td><td>${escapeHtml(lr.reason||'')}</td><td><span class="badge" style="background:#dcfce7;color:#166534">✓ Nghỉ CÓ PHÉP (O)</span></td><td></td></tr>`;
      return `<tr><td>${dStr}</td><td>${escapeHtml(lr.reason||'')}</td><td><span class="badge" style="background:#fee2e2;color:#991b1b" title="${escapeHtml(lr.decisionNote||'')}">✗ Nghỉ KHÔNG PHÉP (K) — tính vào KPI</span></td><td></td></tr>`;
    }).filter(Boolean).join('');
    leaveHtml = `<div style="margin-top:8px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:8px 10px;font-size:13px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div>🌴 <b>Xin nghỉ:</b> trình lý do để người chấm công duyệt. Được duyệt = nghỉ <b>CÓ PHÉP (O)</b>; bị từ chối hoặc nghỉ không lý do = <b>KHÔNG PHÉP (K)</b> — tự động tính vào KPI Ý thức.</div>
        <button class="btn" style="background:#0284c7" onclick="openLeaveRequestForm()">🌴 Xin nghỉ</button>
      </div>
      ${leaveRows?`<div class="tbl-wrap" style="margin-top:8px"><table style="font-size:12px"><thead><tr><th>Ngày</th><th>Lý do</th><th>Kết quả</th><th></th></tr></thead><tbody>${leaveRows}</tbody></table></div>`:''}
    </div>`;
  }
  // [YC1] ĐĂNG KÝ TĂNG CA — NV tự điền số GIỜ tăng ca thực tế, chờ Quản lý duyệt.
  //       KHÔNG tính tự động theo giờ về; chỉ tính giờ do NV khai và QL đã duyệt.
  const otHtml = renderSelfOTCard(u, db, period);
  return `<div class="card" style="border-left:5px solid #16a34a">
    <h3 style="border:none;padding:0;margin-bottom:8px">🟢 Tự chấm công</h3>
    ${bodyHtml}
    ${lateHtml}
    ${coHtml}
    ${leaveHtml}
  </div>
  ${otHtml}`;
}
/* [CO] NV chấm GIỜ VỀ — tính số giờ làm việc, cảnh báo nếu chưa đủ 8 tiếng, gửi QL duyệt */
window.selfCheckOut = async function(){
  const u=currentUser(); if(!u) return;
  const now=new Date();
  const period=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const day=now.getDate();
  const db=getDB();
  const rec=_getAttRec(db, u.id, period, day);
  if(!rec || !rec.checkIn){ toast('Bạn chưa chấm giờ VÀO hôm nay','error'); return; }
  if(rec.checkOut){ toast('Bạn đã chấm giờ về hôm nay rồi ('+fmtDateTime(rec.checkOut)+')','warn'); return; }
  const ts=now.getTime();
  // [CT-GIO] Giờ làm việc = Giờ về − Giờ vào − 1,5h nghỉ trưa (không âm), làm tròn 0,1h
  const LUNCH_HOURS = 1.5;
  const rawHrs = (ts-rec.checkIn)/3600000;
  const hrs = Math.max(0, Math.round((rawHrs - LUNCH_HOURS)*10)/10);
  rec.checkOut=ts;
  rec.workedHours=hrs;
  rec.pendingCheckOut=true;
  _setAttRec(db, u.id, period, day, rec);
  await saveDB(db);
  toast(hrs>=8
    ? `Đã chấm giờ về ${fmtDateTime(ts)} — giờ làm = giờ về − giờ vào − 1,5h nghỉ trưa = ${hrs}h (đủ 8 tiếng). Chờ người chấm công duyệt.`
    : `Đã chấm giờ về ${fmtDateTime(ts)} — ⚠ giờ làm (đã trừ 1,5h nghỉ trưa) = ${hrs}h, CHƯA đủ 8 tiếng! Chờ người chấm công duyệt.`,
    hrs>=8?'success':'warn');
  render();
};

window.submitLeaveRequest = async function(){

  if(!reason){ toast('Nhập lý do xin nghỉ — nghỉ không lý do sẽ bị tính KHÔNG PHÉP','error'); return; }
  const d=new Date(dateStr);
  const period=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const day=d.getDate();
  const db=getDB();
  const rec=_getAttRec(db, u.id, period, day)||{};

  if(rec.code==='O'){ toast('Ngày này đã được chấm nghỉ CÓ PHÉP','warn'); return; }
  rec.leaveReq={reason, status:'pending', requestedBy:u.id, requestedAt:Date.now()};
  _setAttRec(db, u.id, period, day, rec);
  await saveDB(db);

};
window.cancelLeaveRequest = async function(day){

};

};
// [YC1] Card đăng ký tăng ca của NV (theo ngày, trong tháng hiện tại)
function renderSelfOTCard(u, db, period){
  const now = new Date();
  const todayIso = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  const monthRec = ((db.attendance||{})[u.id]||{})[period] || {};
  // Liệt kê các đăng ký OT trong tháng (chờ duyệt + đã duyệt)
  const otRows = Object.keys(monthRec).map(d=>{
    const r = monthRec[d];
    if(!r || typeof r!=='object') return '';
    const dStr = String(d).padStart(2,'0')+'/'+period.split('-')[1];
    if(r.otReq && r.otReq.status==='pending'){
      return `<tr><td>${dStr}</td><td class="center"><b>${r.otReq.hours}h</b></td>
        <td>${escapeHtml(r.otReq.note||'')}</td>
        <td><span class="badge" style="background:#fef3c7;color:#92400e">⏳ Chờ duyệt</span></td>
        <td><button class="btn sm outline" onclick="cancelOTRequest(${Number(d)})">↩ Hủy</button></td></tr>`;
    }
    if(Number(r.ot)>0){
      return `<tr><td>${dStr}</td><td class="center"><b>${r.ot}h</b></td>
        <td>${escapeHtml((r.otReq&&r.otReq.note)||'')}</td>
        <td><span class="badge" style="background:#dcfce7;color:#166534">✓ Đã duyệt</span></td><td></td></tr>`;
    }
    if(r.otReq && r.otReq.status==='rejected'){
      return `<tr><td>${dStr}</td><td class="center" style="text-decoration:line-through">${r.otReq.hours}h</td>
        <td>${escapeHtml(r.otReq.decisionNote||'')}</td>
        <td><span class="badge" style="background:#fee2e2;color:#991b1b">✗ Từ chối</span></td><td></td></tr>`;
    }
    return '';
  }).filter(Boolean).join('');
  return `<div class="card" style="border-left:5px solid #f59e0b">
    <h3 style="border:none;padding:0;margin-bottom:8px">🕐 Đăng ký tăng ca (OT)</h3>
    <div class="hint" style="margin-bottom:8px">💡 Nhập <b>số giờ tăng ca thực tế</b> bạn đã làm (không tính tự động theo giờ về). Đăng ký sẽ được gửi Quản lý duyệt — chỉ giờ <b>đã duyệt</b> mới tính vào bảng công &amp; KPI.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="field" style="margin:0"><label>Ngày tăng ca</label>
        <input type="date" id="ot-date" value="${todayIso}" max="${todayIso}" style="width:auto"></div>
      <div class="field" style="margin:0"><label>Số giờ (h)</label>
        <input type="number" id="ot-hours" min="0.5" max="12" step="0.5" placeholder="VD: 2" style="width:90px"></div>
      <div class="field" style="margin:0;flex:1;min-width:160px"><label>Lý do tăng ca *</label>
        <input type="text" id="ot-note" placeholder="Lý do/Nội dung tăng ca — VD: Hoàn thiện hồ sơ thẩm duyệt dự án A"></div>
      <button class="btn warn" onclick="submitOTRequest()">📤 Gửi đăng ký OT</button>
    </div>
    ${otRows?`<div class="tbl-wrap" style="margin-top:10px"><table style="font-size:12px">
      <thead><tr><th>Ngày</th><th>Giờ OT</th><th>Nội dung</th><th>Trạng thái</th><th></th></tr></thead>
      <tbody>${otRows}</tbody></table></div>`:''}
  </div>`;
}
// [YC1] NV gửi đăng ký tăng ca
window.submitOTRequest = async function(){
  const u = currentUser(); if(!u) return;
  const dateStr = document.getElementById('ot-date')?.value;
  const hours = Number(document.getElementById('ot-hours')?.value);
  const note = (document.getElementById('ot-note')?.value||'').trim();
  if(!dateStr){ toast('Chọn ngày tăng ca','error'); return; }
  if(!hours || hours<=0){ toast('Nhập số giờ tăng ca (0,5 – 12h)','error'); return; }
  if(!note){ toast('Nhập LÝ DO tăng ca — người chấm công cần lý do để phê duyệt','error'); return; } // [OT-LD]
  if(hours>12){ toast('Số giờ tăng ca tối đa 12h/ngày','error'); return; }
  const d = new Date(dateStr);
  if(d.getTime() > Date.now()){ toast('Không đăng ký tăng ca cho ngày tương lai','error'); return; }
  const period = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const day = d.getDate();
  const db = getDB();
  const rec = _getAttRec(db, u.id, period, day) || {};
  if(rec.otReq && rec.otReq.status==='pending'){ toast('Ngày này đã có đăng ký OT đang chờ duyệt','warn'); return; }
  if(Number(rec.ot)>0){ toast('Ngày này đã có giờ OT được duyệt ('+rec.ot+'h). Liên hệ Quản lý nếu cần sửa.','warn'); return; }
  rec.otReq = { status:'pending', hours, note, requestedBy:u.id, requestedAt:Date.now() };
  _setAttRec(db, u.id, period, day, rec);
  await saveDB(db);
  toast('Đã gửi đăng ký tăng ca '+hours+'h — chờ Quản lý duyệt');
  render();
};
// [YC1] NV hủy đăng ký OT còn chờ duyệt (của tháng hiện tại)
window.cancelOTRequest = async function(day){
  const u = currentUser(); if(!u) return;
  const now = new Date();
  const period = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const db = getDB();
  const rec = _getAttRec(db, u.id, period, day);
  if(!rec || !rec.otReq || rec.otReq.status!=='pending'){ toast('Không có đăng ký OT chờ duyệt','warn'); return; }
  delete rec.otReq;
  _setAttRec(db, u.id, period, day, rec);
  await saveDB(db);
  toast('Đã hủy đăng ký tăng ca','info');
  render();
};
// [YC1] Quản lý duyệt / từ chối đăng ký OT
window.confirmOTRequest = async function(empId, period, day){
  if(!canApproveAttendance()){ toast('Bạn không có quyền duyệt','error'); return; }
  const db = getDB();
  const rec = _getAttRec(db, empId, period, day);
  if(!rec || !rec.otReq || rec.otReq.status!=='pending'){ toast('Không có đăng ký OT chờ duyệt','warn'); return; }
  rec.ot = Number(rec.otReq.hours)||0;
  rec.otReq.status='approved';
  rec.otReq.decidedBy=currentUser().id; rec.otReq.decidedAt=Date.now();
  _setAttRec(db, empId, period, day, rec);
  await saveDB(db);
  toast('Đã duyệt tăng ca '+rec.ot+'h');
  render();
};
window.rejectOTRequest = async function(empId, period, day){
  if(!canApproveAttendance()){ toast('Bạn không có quyền duyệt','error'); return; }
  const note = prompt('Lý do từ chối tăng ca (sẽ hiển thị cho NV):','')||'';
  const db = getDB();
  const rec = _getAttRec(db, empId, period, day);
  if(!rec || !rec.otReq || rec.otReq.status!=='pending'){ toast('Không có đăng ký OT chờ duyệt','warn'); return; }
  rec.otReq.status='rejected';
  rec.otReq.decisionNote=note;
  rec.otReq.decidedBy=currentUser().id; rec.otReq.decidedAt=Date.now();
  _setAttRec(db, empId, period, day, rec);
  await saveDB(db);
  toast('Đã từ chối đăng ký tăng ca','warn');
  render();
};
// Danh sách chấm công chờ duyệt (cho admin/PM/manager)
function renderAttendancePendingList(u, db){
  // [YC3] Hiển thị yêu cầu chờ duyệt của NHÂN VIÊN CẢ 3 CÔNG TY (bỏ lọc theo công ty)
  let users = db.users.filter(x=>x.role!=='admin');
  const pending = [];
  const pendingOT = []; // [YC1] đăng ký tăng ca chờ duyệt
  const pendingLate = []; // [CC2] lý do đến muộn chờ duyệt
  const pendingCO = [];   // [CO] giờ về chờ duyệt
  const pendingLeave = []; // [NGHI] đơn xin nghỉ chờ duyệt
  const forgotCO = [];    // [CO] quên chấm giờ về (đã qua 0h00 hôm sau)
  users.forEach(emp=>{
    const empRec = db.attendance[emp.id]||{};
    Object.keys(empRec).forEach(period=>{
      const monthRec = empRec[period]||{};
      Object.keys(monthRec).forEach(day=>{
        const r = monthRec[day];
        if(r && typeof r==='object' && r.pendingCheckIn){
          pending.push({emp, period, day:Number(day), rec:r});
        }
        if(r && typeof r==='object' && r.otReq && r.otReq.status==='pending'){
          pendingOT.push({emp, period, day:Number(day), rec:r});
        }
        if(r && typeof r==='object' && r.lateReason && r.lateReason.status==='pending'){
          pendingLate.push({emp, period, day:Number(day), rec:r});
        }
        if(r && typeof r==='object' && r.pendingCheckOut){
          pendingCO.push({emp, period, day:Number(day), rec:r});
        }
        if(r && typeof r==='object' && r.leaveReq && r.leaveReq.status==='pending'){
          pendingLeave.push({emp, period, day:Number(day), rec:r});
        }
        if(r && typeof r==='object' && r.checkIn && !r.checkOut){
          const [fy,fm]=period.split('-').map(Number);
          if(new Date(fy, fm-1, Number(day)+1).getTime() <= Date.now()){
            forgotCO.push({emp, period, day:Number(day), rec:r});
          }
        }
      });
    });
  });
  // [CO] Card duyệt GIỜ VỀ
  let coCard='';
  if(pendingCO.length){
    pendingCO.sort((a,b)=>(b.rec.checkOut||0)-(a.rec.checkOut||0));
    const coRows=pendingCO.map(p=>{
      const dStr=`${String(p.day).padStart(2,'0')}/${p.period.split('-')[1]}/${p.period.split('-')[0]}`;

        <td>${escapeHtml(dStr)}</td>

        <td>${p.rec.checkOut?fmtDateTime(p.rec.checkOut):'—'}</td>
        <td class="center">${hrs>=8?`<b style="color:#16a34a">${hrs}h ✓</b>`:`<b style="color:#dc2626">${hrs}h ⚠ &lt;8h</b>`}</td>
        <td>
          <button class="btn sm success" onclick="confirmCheckOut('${p.emp.id}','${p.period}',${p.day})">✓ Duyệt</button>
          <button class="btn sm danger" onclick="rejectCheckOut('${p.emp.id}','${p.period}',${p.day})">✗ Từ chối</button>
        </td>
      </tr>`;
    }).join('');
    coCard=`<div class="card" style="border-left:5px solid #6366f1">
      <h3 style="border:none;padding:0;margin-bottom:8px">🔴 Chấm GIỜ VỀ chờ duyệt <span class="badge" style="background:#e0e7ff;color:#3730a3">${pendingCO.length}</span></h3>
      <div class="hint" style="margin-bottom:8px">💡 Duyệt giờ về để chốt <b>số giờ làm việc trong ngày</b> (chuẩn ≥ 8 tiếng) — tổng giờ làm tháng được dùng để chấm KPI tự động.</div>
      <div class="tbl-wrap"><table style="font-size:13px">
        <thead><tr><th>Nhân viên</th><th>Công ty</th><th>Ngày</th><th>Giờ vào</th><th>Giờ về</th><th>Giờ làm</th><th></th></tr></thead>
        <tbody>${coRows}</tbody>
      </table></div>
    </div>`;
  }
  // [CO] Card cảnh báo QUÊN CHẤM GIỜ VỀ (đã qua 0h00 hôm sau)
  let forgotCard='';
  if(forgotCO.length){
    forgotCO.sort((a,b)=>(b.rec.checkIn||0)-(a.rec.checkIn||0));
    const fRows=forgotCO.slice(0,15).map(p=>{
      const dStr=`${String(p.day).padStart(2,'0')}/${p.period.split('-')[1]}/${p.period.split('-')[0]}`;

      </tr>`;
    }).join('');
    forgotCard=`<div class="card" style="border-left:5px solid #dc2626;background:#fef2f2">
      <h3 style="border:none;padding:0;margin-bottom:8px;color:#991b1b">🚨 NV ra về KHÔNG chấm giờ về <span class="badge" style="background:#fee2e2;color:#991b1b">${forgotCO.length}</span></h3>
      <div class="hint" style="margin-bottom:8px">Các ngày đã qua 0h00 hôm sau mà NV chưa chấm giờ về — phần mềm <b>tự động trừ 1 điểm/ngày</b> vào chỉ tiêu KPI Ý thức "Phối hợp đồng nghiệp, thái độ làm việc" khi áp dụng KPI tự động.${forgotCO.length>15?' (hiển thị 15 dòng gần nhất)':''}</div>

  // [NGHI] Card duyệt ĐƠN XIN NGHỈ

      <tbody>${rows}</tbody>

  </div>` + forgotCard + lateCard + coCard + leaveCard + otCard;
}
// NV tự chấm công hôm nay
window.selfCheckIn = async function(){
  const u = currentUser(); if(!u) return;
  if(u.role!=='employee'){ toast('Chỉ nhân viên mới dùng chức năng tự chấm công','error'); return; }
  const db = getDB();
  const now = new Date();
  const period = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const day = now.getDate();
  const existing = _getAttRec(db, u.id, period, day);
  if(existing && existing.checkIn){
    toast('Bạn đã chấm công hôm nay rồi','warn');
    return;
  }
  const ts = now.getTime();
  // [PATCH] tính muộn theo giờ chuẩn của công ty NV
  const lateMins = _calcLateMins(ts, db, u.companyId);
  const isLate = lateMins>0;
  const newRec = {
    code: 'P',
    ot: (existing && existing.ot) || 0,
    otReq: (existing && existing.otReq) || undefined, // [YC1] giữ đăng ký OT nếu có
    checkIn: ts,
    late: isLate,
    lateMins,
    pendingCheckIn: true,
    submittedBy: u.id,
    submittedAt: ts
  };
  _setAttRec(db, u.id, period, day, newRec);
  await saveDB(db);
  // [MUON] Nhắc nhở phân 2 mức: <1 tiếng = xác nhận đi muộn; >1 tiếng = đi muộn + chỉ tính 1/2 ngày công
  toast(!isLate
    ? `Đã chấm công lúc ${fmtDateTime(ts)} — đúng giờ. Đã gửi người chấm công duyệt.`
    : (lateMins>60
      ? `⚠ Đã chấm công lúc ${fmtDateTime(ts)} — ĐI MUỘN ${lateMins} phút (QUÁ 1 TIẾNG): nếu không có lý do được duyệt, hôm nay chỉ tính 1/2 NGÀY CÔNG. Hãy bấm "Trình bày lý do đến muộn" ngay!`
      : `⚠ Đã chấm công lúc ${fmtDateTime(ts)} — ĐI MUỘN ${lateMins} phút (dưới 1 tiếng): sẽ bị xác nhận là đi muộn và tính vào KPI. Bạn có thể trình bày lý do để người duyệt xem xét.`),
    isLate?'warn':'success');
  render();
};
// NV hủy chấm công của hôm nay khi chưa được duyệt
window.cancelSelfCheckIn = async function(){
  const u = currentUser(); if(!u) return;
  if(u.role!=='employee'){ return; }
  if(!confirm('Hủy bỏ chấm công hôm nay và chấm lại?')) return;
  const db = getDB();
  const now = new Date();
  const period = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const day = now.getDate();
  const rec = _getAttRec(db, u.id, period, day);
  if(!rec || !rec.pendingCheckIn){ toast('Đã được xác nhận, không hủy được','error'); return; }
  // [YC1] Giữ lại đăng ký tăng ca (nếu có) khi hủy chấm công
  const keepOT = rec.otReq ? {otReq: rec.otReq, ot: Number(rec.ot)||0} : null;
  _setAttRec(db, u.id, period, day, keepOT);
  await saveDB(db);
  toast('Đã hủy bỏ chấm công','info');
  render();
};
// Quản lý xác nhận chấm công
window.confirmCheckIn = async function(empId, period, day){
  if(!canApproveAttendance()){ toast('Bạn không có quyền duyệt','error'); return; }
  const db = getDB();
  const rec = _getAttRec(db, empId, period, day);
  if(!rec || !rec.pendingCheckIn){ toast('Không có yêu cầu chờ duyệt','warn'); return; }
  rec.pendingCheckIn = false;
  rec.confirmedBy = currentUser().id;
  rec.confirmedAt = Date.now();
  _setAttRec(db, empId, period, day, rec);
  await saveDB(db);
  toast('Đã duyệt chấm công');
  render();
};
// Quản lý từ chối — xóa pending, NV chấm lại
window.rejectCheckIn = async function(empId, period, day){
  if(!canApproveAttendance()){ toast('Bạn không có quyền duyệt','error'); return; }
  const reason = prompt('Lý do từ chối (sẽ hiển thị cho NV):','Yêu cầu chấm công lại');
  if(reason===null) return;
  const db = getDB();
  const rec = _getAttRec(db, empId, period, day);
  if(!rec || !rec.pendingCheckIn){ toast('Không có yêu cầu chờ duyệt','warn'); return; }
  // Xóa bản ghi — NV sẽ chấm lại. [YC1] Giữ lại đăng ký tăng ca nếu có
  const keepOT2 = rec.otReq ? {otReq: rec.otReq, ot: Number(rec.ot)||0} : null;
  _setAttRec(db, empId, period, day, keepOT2);
  // Lưu lý do vào lịch sử nếu cần (đơn giản: bỏ qua, chỉ toast)
  await saveDB(db);
  toast('Đã từ chối — yêu cầu NV chấm công lại','warn');
  render();
};

window.exportAttendanceExcel = function(){
  const db=getDB();
  const period = document.getElementById('att-period')?.value || thisPeriod();
  const [yy,mm] = period.split('-').map(Number);
  const wd = countWorkingDays(yy, mm);
  const u = currentUser();
  let users = db.users.filter(x=>x.role!=='admin'); // [YC3] đủ NV 3 công ty
  const rows = [
    ['BẢNG TỔNG HỢP CHẤM CÔNG & LƯƠNG · '+fmtPeriod(period)],
    ['Số ngày làm việc trong tháng:', wd],
    [],
    ['STT','Mã NV','Họ và tên','Công ty','P (công đủ)','H (nửa ngày)','O (có phép)','K (không phép)','Tổng công','Tỷ lệ %','Lương cứng + Hỗ trợ','Lương theo công','Σ Thưởng KPI','TỔNG LƯƠNG']
  ];
  users.forEach((emp,i)=>{
    const sal = computeSalaryMulti(emp, period);
    const rec = (db.attendance[emp.id]||{})[period]||{};
    let p=0,h=0,o=0,k=0;
    // [FIX] Đếm đúng cả bản ghi dạng object (tự chấm công) + quy tắc muộn >1h = nửa công
    Object.values(rec).forEach(v=>{
      let code, pending=false;
      if(typeof v==='object' && v!==null){
        if(v.pendingCheckIn) return;
        code=v.code||'';
        if(code==='P' && v.late && Number(v.lateMins)>60 && !v.lateExcused) code='H';
      } else code=v||'';
      if(code==='P')p++; else if(code==='H')h++; else if(code==='O')o++; else if(code==='K')k++;
    });
    const totalDays = p + 0.5*h;
    const ratio = wd>0 ? totalDays/wd : 1;
    const baseAdj = Math.round((sal.base + sal.allowance) * Math.min(1, ratio));
    const total = baseAdj + sal.totalKpiActual;
    rows.push([i+1, emp.code||emp.username, emp.name, getCompany(emp.companyId).code, p, h, o, k, totalDays, (ratio*100).toFixed(1)+'%', sal.base+sal.allowance, baseAdj, Math.round(sal.totalKpiActual), Math.round(total)]);
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Chấm công + Lương');
  XLSX.writeFile(wb, `ChamCong_${period}.xlsx`);
  toast('Đã xuất Excel chấm công + lương');
};

function taskStatusBadge(s){
  if(s==='done') return '<span class="badge kpi-xs">Hoàn thành</span>';
  if(s==='inprogress') return '<span class="badge kpi-t">Đang làm</span>';
  if(s==='overdue') return '<span class="badge kpi-kem">Trễ hạn</span>';
  return '<span class="badge co">Mới giao</span>';
}
